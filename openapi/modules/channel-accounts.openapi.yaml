# Source fragment for the "channel_accounts" module (Issue #1140, ADR-0148).
#
# Owns every path whose operations carry this module's OpenAPI tag, plus every
# components.schemas entry referenced ONLY by this module's operations. Schemas
# shared by 2+ modules (or referenced by none) live in the root fragment
# (openapi/awcms-public-api.src.yaml) instead.
#
# NOT independently valid OpenAPI: $ref targets pointing at shared components
# (securitySchemes/parameters/responses) only resolve after
# `bun run openapi:bundle` merges this file with the root fragment and every
# sibling module fragment into openapi/awcms-public-api.openapi.yaml. Edit this
# file (or the root fragment for shared components), never the generated bundle.
#
# ## What is deliberately NOT here
#
# Nothing on this surface RETURNS a credential, an OAuth token, an authorisation
# code, a PKCE verifier, an OAuth `state`, or the reference to any of them. There
# is no "show token" operation and no GET on `/credential`: the credential is
# WRITE-ONLY. There is also no "send" or "publish" operation and no provider
# call: this module is the control plane (identity, grant, capability, secret
# reference, health); channel dispatch belongs to later issues (#1141-#1154).
#
# Every operation answers `503 CHANNEL_ACCOUNTS_DISABLED` (after authorization)
# unless the deployment sets CHANNEL_ACCOUNTS_ENABLED=true, refuses a machine
# credential with `403 INTERACTIVE_SESSION_REQUIRED`, and answers one uniform
# `404 RESOURCE_NOT_FOUND` for an unknown account, another tenant's account, and
# an account the caller is not assigned to.
paths:
  /api/v1/channel-accounts/providers:
    get:
      operationId: listChannelProviders
      tags:
        - Channel Accounts
      summary: The provider capability matrix v1, as the code enforces it.
      description: >-
        Registrable providers with their account kinds and authentication modes,
        and the verdict of each capability cell (`candidate`, `restricted`,
        `not_offered`, `unverified`, `not_applicable`, `barred`). A `candidate`
        cell is NOT a promise: an account still needs a granted capability with
        evidence. Requires `channel_accounts.accounts.read`.
      responses:
        "200":
          description: The matrix.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    enum:
                      - true
                  data:
                    $ref: "#/components/schemas/ChannelProviderMatrix"
                  meta:
                    type: object
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "503":
          description: "`CHANNEL_ACCOUNTS_DISABLED`: CHANNEL_ACCOUNTS_ENABLED is not true for this deployment."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /api/v1/channel-accounts/accounts:
    get:
      operationId: listChannelAccounts
      tags:
        - Channel Accounts
      summary: The tenant's connected accounts, newest first (keyset).
      description: >-
        An `assigned` account (the default) is listed only to its assignees and to
        holders of `channel_accounts.assignments.assign`; a `tenant_wide` account
        to every holder of the read permission. Never contains a credential or its
        reference, only `hasCredential`. Requires `channel_accounts.accounts.read`.
      parameters:
        - name: provider
          in: query
          required: false
          schema:
            type: string
        - name: status
          in: query
          required: false
          schema:
            $ref: "#/components/schemas/ChannelAccountStatus"
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 50
        - name: cursor
          in: query
          required: false
          schema:
            type: string
      responses:
        "200":
          description: A page of accounts.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    enum:
                      - true
                  data:
                    type: object
                    properties:
                      items:
                        type: array
                        items:
                          $ref: "#/components/schemas/ChannelAccount"
                      nextCursor:
                        type: string
                        nullable: true
                  meta:
                    type: object
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "503":
          description: "`CHANNEL_ACCOUNTS_DISABLED`: CHANNEL_ACCOUNTS_ENABLED is not true for this deployment."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
    post:
      operationId: createChannelAccount
      tags:
        - Channel Accounts
      summary: Register an external account.
      description: >-
        `(provider, accountKind, authMode)` must be a combination the provider
        matrix admits. A live external account belongs to ONE tenant: a duplicate
        is `409 ACCOUNT_ALREADY_REGISTERED` whether this tenant or another holds
        it (one answer, so the conflict is not an oracle). The account starts
        `pending` and becomes `connected` only when a connector verifies it. No
        credential is accepted here. A `businessScope` is a request, not a fact:
        the caller must hold that scope (`403 ACCESS_DENIED` otherwise), and a
        caller confined to business scopes may not omit it (an account without
        one is tenant-wide). Binding to a `connectionId` lends the account that
        connection's token, so it needs authority over the CONNECTION (its
        business scope; a tenant-wide connection: its creator or an unconfined
        caller) and `owner` authority over accounts already bound to it, which
        holding the connection's scope does NOT replace (only the tenant
        administrator, the holder of `assignments.assign`, skips that check);
        otherwise `422 CONNECTION_NOT_FOUND`. A connection with no account yet
        is bound only by its creator or by whoever holds break-glass over it
        (the same authority as revoking it). The account's `businessScope` must
        also be CONTAINED in the connection's scope, with no administrator
        exception: a tenant-wide connection admits any account scope, a scoped
        connection admits only an account of exactly that scope (a tenant-wide
        account never), else the same `422 CONNECTION_NOT_FOUND`. A connection of
        another provider answers the same `CONNECTION_NOT_FOUND` as an unknown
        one, and a connection id sent for an auth mode that takes none is
        refused by shape BEFORE the connection is looked up, so no answer
        depends on whether the id exists. `Idempotency-Key` required. Requires
        `channel_accounts.accounts.create`.
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateChannelAccountRequest"
      responses:
        "201":
          description: The registered account.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    enum:
                      - true
                  data:
                    $ref: "#/components/schemas/ChannelAccount"
                  meta:
                    type: object
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          description: >-
            `ACCOUNT_ALREADY_REGISTERED` (this tenant or another holds the
            external account) or `IDEMPOTENCY_CONFLICT`.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "422":
          description: >-
            The combination is not admitted: `PROVIDER_UNKNOWN`,
            `PROVIDER_NOT_REGISTRABLE`, `ACCOUNT_KIND_INVALID`,
            `AUTH_MODE_INVALID`, `CONNECTION_REQUIRED`, `CONNECTION_NOT_FOUND`
            (also, for an `oauth2` account, for a connection of another
            provider, one outside the caller's authority or whose scope does
            not contain the account's scope), `CONNECTION_MISMATCH` (only for a
            connection id on an account that does not use one, answered before
            the connection is looked up),
            `CONNECTION_NOT_ACTIVE` (the connection's
            grant is not `active`), `PARENT_REQUIRED`, `PARENT_INVALID` or
            `SCOPE_UNRESOLVED` (the named business scope does not exist in this
            tenant).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "503":
          description: "`CHANNEL_ACCOUNTS_DISABLED`: CHANNEL_ACCOUNTS_ENABLED is not true for this deployment."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /api/v1/channel-accounts/accounts/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
    get:
      operationId: getChannelAccount
      tags:
        - Channel Accounts
      summary: One account.
      description: >-
        An unknown id, another tenant's id and an account the caller is not
        assigned to all answer the same 404. Requires
        `channel_accounts.accounts.read`.
      responses:
        "200":
          description: The account.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    enum:
                      - true
                  data:
                    $ref: "#/components/schemas/ChannelAccount"
                  meta:
                    type: object
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "503":
          description: "`CHANNEL_ACCOUNTS_DISABLED`: CHANNEL_ACCOUNTS_ENABLED is not true for this deployment."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
    patch:
      operationId: updateChannelAccount
      tags:
        - Channel Accounts
      summary: Rename an account, or disable / re-enable it.
      description: >-
        `status` may be `disabled` or `pending` only: a re-enabled account stays
        `pending` until a connector verifies it again. `connected` and `degraded`
        cannot be set by a person. Disabling is audited at `warning`.
        `Idempotency-Key` required. Requires `channel_accounts.accounts.create`.
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                displayName:
                  type: string
                  minLength: 1
                  maxLength: 200
                status:
                  type: string
                  enum:
                    - disabled
                    - pending
      responses:
        "200":
          description: The updated account.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    enum:
                      - true
                  data:
                    $ref: "#/components/schemas/ChannelAccount"
                  meta:
                    type: object
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: "`ACCOUNT_STATE_INVALID` or `IDEMPOTENCY_CONFLICT`."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "503":
          description: "`CHANNEL_ACCOUNTS_DISABLED`: CHANNEL_ACCOUNTS_ENABLED is not true for this deployment."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
    delete:
      operationId: deleteChannelAccount
      tags:
        - Channel Accounts
      summary: Soft-delete an account.
      description: >-
        Refused while the account is `connected` or `degraded` (disconnect it
        first) and while it has child accounts. Erases the account's stored
        credential and releases its external id for re-registration. Terminal:
        the database refuses to un-delete. High-risk, audited at `warning`.
        `Idempotency-Key` required. Requires `channel_accounts.accounts.revoke`.
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      responses:
        "200":
          description: Deleted.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    enum:
                      - true
                  data:
                    type: object
                    properties:
                      id:
                        type: string
                        format: uuid
                      deleted:
                        type: boolean
                  meta:
                    type: object
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: >-
            `ACCOUNT_STATE_INVALID`, `HAS_CHILD_ACCOUNTS` or
            `IDEMPOTENCY_CONFLICT`.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "503":
          description: "`CHANNEL_ACCOUNTS_DISABLED`: CHANNEL_ACCOUNTS_ENABLED is not true for this deployment."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /api/v1/channel-accounts/accounts/{id}/credential:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
    put:
      operationId: writeChannelAccountCredential
      tags:
        - Channel Accounts
      summary: Write or replace the account's credential (WRITE-ONLY).
      description: >-
        Stores an API token, device key or bot token as envelope-encrypted
        ciphertext (AES-256-GCM, the shared field-encryption helper, associated
        data binding purpose, tenant and secret). There is no GET and no "show
        token": the response is `{ replaced, cipherVersion }`, never the value
        and never the reference, and neither the audit row, the stored
        idempotency response nor any log carries the value. An OAuth account has
        no credential of its own (`409 CREDENTIAL_NOT_APPLICABLE`); a `revoked` or
        `disabled` account is not re-armed by writing one
        (`409 ACCOUNT_STATE_INVALID`). For an account of an UNOFFICIAL provider
        (StarSender) that is `connected` or `degraded`, writing a credential
        moves it back to `pending` with `statusReason` `CREDENTIAL_REPLACED` in
        the same transaction (the audit row says `accountDemoted: true`): its
        `connected` state was an operator's attestation about the previous key,
        and it must be attested again (`attest-device`).


        HIGH-RISK: the permission is separately grantable and declares
        `requiresMfaEnrolment` (a holder with no MFA factor is refused
        `403 MFA_ENROLMENT_REQUIRED`); a person WITH a factor must also present a
        fresh step-up (conditional, ADR-0141 section 4); `Idempotency-Key` is
        required; the audit row is `warning`. `503 SECRET_STORE_UNAVAILABLE` when
        CHANNEL_SECRETS_ENCRYPTION_KEYS is not a valid key ring (fail closed:
        there is no plaintext fallback). Requires
        `channel_accounts.credentials.manage`.
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - secret
              additionalProperties: false
              properties:
                secret:
                  type: string
                  minLength: 8
                  maxLength: 4096
                  writeOnly: true
                  description: >-
                    The credential. No whitespace. Never echoed, in a response
                    or in an error message.
      responses:
        "200":
          description: Stored.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    enum:
                      - true
                  data:
                    type: object
                    properties:
                      replaced:
                        type: boolean
                      cipherVersion:
                        type: integer
                  meta:
                    type: object
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: >-
            `CREDENTIAL_NOT_APPLICABLE`, `ACCOUNT_STATE_INVALID` or
            `IDEMPOTENCY_CONFLICT`.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "503":
          description: >-
            `CHANNEL_ACCOUNTS_DISABLED` or `SECRET_STORE_UNAVAILABLE`.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /api/v1/channel-accounts/accounts/{id}/webhook-subscription:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
    post:
      operationId: createChannelAccountWebhookSubscription
      tags:
        - Channel Accounts
      summary: Create or rotate the signed webhook subscription of a Meta number.
      description: >-
        For a live Meta WhatsApp number (`whatsapp_cloud` `waba_phone_number`)
        with a live `waba` container: stores the Meta app secret WRITE-ONLY
        (envelope-encrypted, purpose `webhook_signing_secret`; never returned,
        logged, audited or put in the idempotency record) and mints an OPAQUE
        callback token (`wcb1.<tenant>.<subscription>.<256 random bits>`), of
        which only the SHA-256 is stored. The response carries the token ONCE
        (`callbackToken`, `callbackPath`, `revealed: true`): it is the last
        segment of the callback URL to configure at Meta and also the
        `hub.verify_token`. A replay of the same `Idempotency-Key` answers the
        stored body WITHOUT it (`revealed: false`). An earlier subscription of
        the number is revoked and its app-secret ciphertext erased in the same
        transaction (rotation). A number that is not a live Meta number is
        `409 NOT_A_META_NUMBER`; one with no live WABA container is `409
        CONTAINER_BINDING_INVALID`. HIGH-RISK: the `owner` assignment on the
        account AND on its WABA container (an invisible container is the same
        `404`), a conditional step-up (a person with an MFA factor must
        present a fresh one), `Idempotency-Key`, audited at `warning` with no
        secret, token or external identifier. Disconnecting or deleting the
        account also revokes its subscriptions and erases their secrets. The
        app secret is NOT verified with Meta. Requires
        `channel_accounts.webhooks.configure` AND, because a subscription can
        feed WABA-level template approvals, restrictions and 24-hour windows,
        `whatsapp_delivery.meta_templates.configure` and
        `whatsapp_delivery.meta_signals.configure` (`403` without them).
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - appSecret
              additionalProperties: false
              properties:
                appSecret:
                  type: string
                  pattern: "^[A-Za-z0-9]{16,128}$"
                  writeOnly: true
                  description: The Meta app secret that signs this number's webhooks. Never echoed.
      responses:
        "201":
          description: Created; the token is shown once.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    enum:
                      - true
                  data:
                    type: object
                    properties:
                      subscriptionId:
                        type: string
                        format: uuid
                      accountId:
                        type: string
                        format: uuid
                      verificationMode:
                        type: string
                        enum:
                          - hmac_signature
                      rotatedSubscriptions:
                        type: integer
                      revealed:
                        type: boolean
                      callbackToken:
                        type: string
                        description: Present only when `revealed` is true.
                      callbackPath:
                        type: string
                        description: Present only when `revealed` is true.
                  meta:
                    type: object
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: >-
            `NOT_A_META_NUMBER`, `CONTAINER_BINDING_INVALID` or
            `IDEMPOTENCY_CONFLICT`.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "503":
          description: >-
            `CHANNEL_ACCOUNTS_DISABLED` or `SECRET_STORE_UNAVAILABLE`.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /api/v1/channel-accounts/accounts/{id}/disconnect:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
    post:
      operationId: disconnectChannelAccount
      tags:
        - Channel Accounts
      summary: Disconnect an account and erase its credential.
      description: >-
        The account becomes `revoked`, its OWN stored credential is hard-deleted
        and its webhook subscriptions are revoked. Effective on the next use:
        every capability check reads the status. Does not call the provider and
        does not touch a shared connection (revoke the connection for that).
        High-risk, audited at `warning`. `Idempotency-Key` required. Requires
        `channel_accounts.accounts.revoke`.
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      responses:
        "200":
          description: Disconnected.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    enum:
                      - true
                  data:
                    type: object
                    properties:
                      account:
                        $ref: "#/components/schemas/ChannelAccount"
                      credentialErased:
                        type: boolean
                  meta:
                    type: object
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: "`ACCOUNT_STATE_INVALID` (already disconnected) or `IDEMPOTENCY_CONFLICT`."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "503":
          description: "`CHANNEL_ACCOUNTS_DISABLED`: CHANNEL_ACCOUNTS_ENABLED is not true for this deployment."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /api/v1/channel-accounts/accounts/{id}/attest-device:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
    post:
      operationId: attestChannelDevice
      tags:
        - Channel Accounts
      summary: Attest that an unofficial-provider device is paired (operator-attested, not verified).
      description: >-
        The ONE place a person, not a connector, moves an account to
        `connected`, and only for a device of an UNOFFICIAL provider (StarSender),
        because StarSender documents no side-effect-free status call a connector
        could verify with. The health record says `OPERATOR_ATTESTED`; the
        response says `basis: operator_attested`; nothing may present it as a
        vendor confirmation. Needs the CALLER's own active acknowledgement of the
        current approved risk text, a stored credential, and a `pending` or
        `degraded` account (`422` with `RISK_ACKNOWLEDGEMENT_REQUIRED`,
        `CREDENTIAL_REQUIRED`, `ACCOUNT_STATE_INVALID` or
        `NOT_AN_UNOFFICIAL_DEVICE`). It grants no capability: every send
        re-checks the account, the acknowledgement and the capability evidence.
        `503 PROVIDER_ADAPTER_DISABLED` unless the deployment sets
        `WHATSAPP_STARSENDER_ENABLED=true` (off by default). High-risk, audited at
        `warning`. `Idempotency-Key` required. Requires
        `channel_accounts.accounts.create` and at least the `operator` assignment
        on the account. A person who has an MFA factor must also present a fresh
        step-up (`403 STEP_UP_REQUIRED` otherwise; conditional, ADR-0141 section
        4, so a person with no factor is not locked out). The device is bound to
        the acknowledgement it was attested under: revoking that acknowledgement
        degrades it.
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      responses:
        "200":
          description: "Attested, or already connected (`changed` is false)."
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    enum:
                      - true
                  data:
                    type: object
                    properties:
                      accountId:
                        type: string
                        format: uuid
                      status:
                        type: string
                        enum:
                          - connected
                      basis:
                        type: string
                        enum:
                          - operator_attested
                      changed:
                        type: boolean
                  meta:
                    type: object
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: "`IDEMPOTENCY_CONFLICT`."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "422":
          description: "`RISK_ACKNOWLEDGEMENT_REQUIRED`, `CREDENTIAL_REQUIRED`, `ACCOUNT_STATE_INVALID` or `NOT_AN_UNOFFICIAL_DEVICE`."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "503":
          description: "`CHANNEL_ACCOUNTS_DISABLED` or `PROVIDER_ADAPTER_DISABLED`."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /api/v1/channel-accounts/risk-acknowledgements:
    get:
      operationId: listChannelRiskAcknowledgements
      tags:
        - Channel Accounts
      summary: The current risk text of an unofficial provider and who has acknowledged it.
      description: >-
        English and Indonesian text, its version, and whether the business owner
        has approved it (`approved: false` and `approval: null` while it is a
        draft: nothing can be acknowledged and no device can be connected).
        `acknowledgements` lists up to 100 records, newest first, with the
        person's tenant-user id, the text version and timestamps: no credential
        and no message content. Requires
        `channel_accounts.risk_acknowledgements.read`.
      parameters:
        - name: provider
          in: query
          required: true
          schema:
            type: string
            enum:
              - starsender
      responses:
        "200":
          description: The text and the acknowledgements.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    enum:
                      - true
                  data:
                    $ref: "#/components/schemas/ChannelRiskAcknowledgementState"
                  meta:
                    type: object
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "503":
          description: "`CHANNEL_ACCOUNTS_DISABLED`."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
    post:
      operationId: acknowledgeChannelRisk
      tags:
        - Channel Accounts
      summary: Record your own acknowledgement of an unofficial provider's current risk text.
      description: >-
        The CALLER acknowledges for themselves: the body names the provider and
        the text version shown, and has no field to name another person
        (`400` for any other field). A stale version is `409
        RISK_TEXT_VERSION_STALE`; while the business owner has not approved the
        text it is `409 RISK_TEXT_NOT_APPROVED`. The record keeps the provider,
        the person, the time, the version and the SHA-256 of the exact words. A
        second acknowledgement of the same version by the same person answers
        the existing record with `200`. A signed-in person only (a machine
        credential is `403 INTERACTIVE_SESSION_REQUIRED`). A person who has an
        MFA factor must also present a fresh step-up (`403 STEP_UP_REQUIRED`
        otherwise; conditional, ADR-0141 section 4). Audited at `warning`.
        `Idempotency-Key` required. Requires
        `channel_accounts.risk_acknowledgements.create`.
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required:
                - provider
                - textVersion
              properties:
                provider:
                  type: string
                  enum:
                    - starsender
                textVersion:
                  type: string
                  maxLength: 80
      responses:
        "200":
          description: Already acknowledged by this person at this version.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    enum:
                      - true
                  data:
                    $ref: "#/components/schemas/ChannelRiskAcknowledgement"
                  meta:
                    type: object
        "201":
          description: Recorded.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    enum:
                      - true
                  data:
                    $ref: "#/components/schemas/ChannelRiskAcknowledgement"
                  meta:
                    type: object
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          description: "`RISK_TEXT_NOT_APPROVED`, `RISK_TEXT_VERSION_STALE` or `IDEMPOTENCY_CONFLICT`."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "503":
          description: "`CHANNEL_ACCOUNTS_DISABLED`."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /api/v1/channel-accounts/risk-acknowledgements/{id}/revoke:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
    post:
      operationId: revokeChannelRiskAcknowledgement
      tags:
        - Channel Accounts
      summary: Revoke a provider risk acknowledgement.
      description: >-
        A stamp, not a deletion: the record of who accepted what, and when it was
        withdrawn, stays. The tenant's `connected` accounts of that provider that
        were attested under THIS acknowledgement become `degraded` in the same
        transaction, and so does every `connected` account of the provider when
        it was the tenant's LAST active acknowledgement (`degradedAccounts`
        counts them). Revocations are serialised, so two concurrent ones cannot
        leave a connected device with no active acknowledgement. The next send
        decision denies them regardless. Revoking one that is
        already revoked answers `200` with `degradedAccounts: 0`. High-risk,
        audited at `warning`. `Idempotency-Key` required. Requires
        `channel_accounts.risk_acknowledgements.revoke`. An unknown id and
        another tenant's id are one `404`.
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      responses:
        "200":
          description: Revoked.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    enum:
                      - true
                  data:
                    type: object
                    properties:
                      acknowledgement:
                        $ref: "#/components/schemas/ChannelRiskAcknowledgement"
                      degradedAccounts:
                        type: integer
                  meta:
                    type: object
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: "`IDEMPOTENCY_CONFLICT`."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "503":
          description: "`CHANNEL_ACCOUNTS_DISABLED`."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /api/v1/channel-accounts/accounts/{id}/health:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
    get:
      operationId: getChannelAccountHealth
      tags:
        - Channel Accounts
      summary: The account's status and latest recorded health.
      description: >-
        Read-only on purpose: health is REPORTED by a provider connector's check
        or a dispatch failure, never asserted by a person, so a caller cannot
        mark a broken account healthy. `health` is `null` until a connector has
        reported once. Requires `channel_accounts.accounts.read`.
      responses:
        "200":
          description: Status and health.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    enum:
                      - true
                  data:
                    type: object
                    properties:
                      accountId:
                        type: string
                        format: uuid
                      status:
                        $ref: "#/components/schemas/ChannelAccountStatus"
                      statusReason:
                        type: string
                        nullable: true
                      health:
                        $ref: "#/components/schemas/ChannelAccountHealth"
                  meta:
                    type: object
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "503":
          description: "`CHANNEL_ACCOUNTS_DISABLED`: CHANNEL_ACCOUNTS_ENABLED is not true for this deployment."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /api/v1/channel-accounts/accounts/{id}/capabilities:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
    get:
      operationId: listChannelAccountCapabilities
      tags:
        - Channel Accounts
      summary: All nine capabilities with the matrix cell and the effective verdict.
      description: >-
        Each capability carries the provider matrix cell, the stored record
        (`absent` when none: absent means denied) and the EFFECTIVE verdict right
        now with its denial code. An unsupported or unevidenced action is
        reported as denied; nothing degrades one action into another. Requires
        `channel_accounts.accounts.read`.
      responses:
        "200":
          description: The capabilities.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    enum:
                      - true
                  data:
                    type: object
                    properties:
                      matrixVersion:
                        type: integer
                      capabilities:
                        type: array
                        items:
                          $ref: "#/components/schemas/ChannelAccountCapability"
                  meta:
                    type: object
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "503":
          description: "`CHANNEL_ACCOUNTS_DISABLED`: CHANNEL_ACCOUNTS_ENABLED is not true for this deployment."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /api/v1/channel-accounts/accounts/{id}/capabilities/{capability}:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: capability
        in: path
        required: true
        schema:
          $ref: "#/components/schemas/ChannelCapabilityName"
    put:
      operationId: setChannelAccountCapability
      tags:
        - Channel Accounts
      summary: Record or withdraw one capability with its evidence.
      description: >-
        Refused (`422`) at write time when the provider matrix can never allow
        the cell (`CAPABILITY_NOT_GRANTABLE`, `PROVIDER_UNVERIFIED`,
        `PROVIDER_BARRED`), and a `restricted` cell needs a `contract_reference`
        or `written_authorization` evidence kind (`PROVIDER_RESTRICTED`).
        Granting does NOT make the capability usable by itself: every use is
        re-evaluated against the matrix, the evidence, the account status and
        its connection's grant. High-risk, audited at `warning`.
        `Idempotency-Key` required. Requires
        `channel_accounts.capabilities.configure`.
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - state
              additionalProperties: false
              properties:
                state:
                  type: string
                  enum:
                    - granted
                    - pending_approval
                    - denied
                evidenceKind:
                  $ref: "#/components/schemas/ChannelEvidenceKind"
                evidenceRef:
                  type: string
                  minLength: 1
                  maxLength: 200
                  description: >-
                    An opaque reference to the approval, scope list or contract.
                    Required when `state` is `granted`. Never a secret.
      responses:
        "200":
          description: The recorded capability.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    enum:
                      - true
                  data:
                    $ref: "#/components/schemas/ChannelAccountCapability"
                  meta:
                    type: object
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: "`IDEMPOTENCY_CONFLICT`."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "422":
          description: >-
            `CAPABILITY_NOT_GRANTABLE`, `PROVIDER_BARRED`, `PROVIDER_UNVERIFIED`,
            `PROVIDER_RESTRICTED` or `ACCOUNT_STATE_INVALID`.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "503":
          description: "`CHANNEL_ACCOUNTS_DISABLED`: CHANNEL_ACCOUNTS_ENABLED is not true for this deployment."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /api/v1/channel-accounts/accounts/{id}/assignments:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
    get:
      operationId: listChannelAccountAssignments
      tags:
        - Channel Accounts
      summary: Who may operate this account.
      description: Requires `channel_accounts.accounts.read`.
      responses:
        "200":
          description: The assignments.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    enum:
                      - true
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/ChannelAccountAssignment"
                  meta:
                    type: object
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "503":
          description: "`CHANNEL_ACCOUNTS_DISABLED`: CHANNEL_ACCOUNTS_ENABLED is not true for this deployment."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
    post:
      operationId: setChannelAccountAssignment
      tags:
        - Channel Accounts
      summary: Make a person of this tenant an owner, operator or viewer of the account.
      description: >-
        An upsert per person. On an `assigned` account (the default) only its
        assignees and holders of `channel_accounts.assignments.assign` can see and
        operate it. Demoting the last owner of an `assigned` account is refused
        (`409 LAST_OWNER`). Additive to the permission checks, never a
        substitute. Audited at `warning`. `Idempotency-Key` required.
        Requires `channel_accounts.assignments.assign`.
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - tenantUserId
                - kind
              additionalProperties: false
              properties:
                tenantUserId:
                  type: string
                  format: uuid
                kind:
                  $ref: "#/components/schemas/ChannelAssignmentKind"
      responses:
        "200":
          description: The assignment.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    enum:
                      - true
                  data:
                    $ref: "#/components/schemas/ChannelAccountAssignment"
                  meta:
                    type: object
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: "`IDEMPOTENCY_CONFLICT`, or `LAST_OWNER` (the person is the only owner of an `assigned` account)."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "422":
          description: "`USER_NOT_FOUND` (the person is not in this tenant)."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "503":
          description: "`CHANNEL_ACCOUNTS_DISABLED`: CHANNEL_ACCOUNTS_ENABLED is not true for this deployment."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /api/v1/channel-accounts/accounts/{id}/assignments/{assignmentId}:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: assignmentId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    delete:
      operationId: removeChannelAccountAssignment
      tags:
        - Channel Accounts
      summary: Remove one assignee.
      description: >-
        Removing the LAST OWNER of an `assigned` account is refused
        (`409 LAST_OWNER`): an account is never left without somebody who answers
        for it and never falls open by losing its assignees. Audited at
        `warning`. `Idempotency-Key` required. Requires
        `channel_accounts.assignments.assign`.
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      responses:
        "200":
          description: Removed.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    enum:
                      - true
                  data:
                    type: object
                    properties:
                      assignmentId:
                        type: string
                        format: uuid
                      removed:
                        type: boolean
                  meta:
                    type: object
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: "`IDEMPOTENCY_CONFLICT`, or `LAST_OWNER` (the assignee is the only owner of an `assigned` account)."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "503":
          description: "`CHANNEL_ACCOUNTS_DISABLED`: CHANNEL_ACCOUNTS_ENABLED is not true for this deployment."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /api/v1/channel-accounts/accounts/{id}/access-mode:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
    put:
      operationId: setChannelAccountAccessMode
      tags:
        - Channel Accounts
      summary: Choose who may see and operate the account.
      description: >-
        `assigned` (the default, fail-closed) restricts the account to its
        assignees and the holders of `channel_accounts.assignments.assign`;
        `tenant_wide` lets the permission alone decide. Switching to `assigned`
        needs an owner to exist (`422 OWNER_REQUIRED`). Audited at `warning` when
        the mode changes; the same mode again changes nothing. `Idempotency-Key`
        required. Requires `channel_accounts.assignments.assign`.
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - mode
              additionalProperties: false
              properties:
                mode:
                  $ref: "#/components/schemas/ChannelAccountAccessMode"
      responses:
        "200":
          description: The mode now in force.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    enum:
                      - true
                  data:
                    type: object
                    properties:
                      accountId:
                        type: string
                        format: uuid
                      accessMode:
                        $ref: "#/components/schemas/ChannelAccountAccessMode"
                  meta:
                    type: object
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: "`IDEMPOTENCY_CONFLICT`."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "422":
          description: "`OWNER_REQUIRED` (switching to `assigned` needs an owner)."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "503":
          description: "`CHANNEL_ACCOUNTS_DISABLED`: CHANNEL_ACCOUNTS_ENABLED is not true for this deployment."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /api/v1/channel-accounts/connections:
    get:
      operationId: listChannelConnections
      tags:
        - Channel Accounts
      summary: The tenant's provider connections.
      description: >-
        State, granted scopes, expiry, whether a credential is stored and whether
        an authorisation code awaits its token exchange. Never a token, an
        authorisation code, a PKCE verifier or a secret reference. A connection
        is listed to the holder of its business scope (or, for a tenant-wide
        connection, the tenant administrator), to the person who started it, and
        to anyone who may see at least one account bound to it (assignment and
        business scope). Requires
        `channel_accounts.accounts.read`.
      parameters:
        - name: provider
          in: query
          required: false
          schema:
            type: string
      responses:
        "200":
          description: The connections.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    enum:
                      - true
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/ChannelConnection"
                  meta:
                    type: object
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "503":
          description: "`CHANNEL_ACCOUNTS_DISABLED`: CHANNEL_ACCOUNTS_ENABLED is not true for this deployment."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /api/v1/channel-accounts/connections/{id}/revoke:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
    post:
      operationId: revokeChannelConnection
      tags:
        - Channel Accounts
      summary: Revoke a provider connection.
      description: >-
        The grant becomes `revoked` (terminal; the database refuses to undo it),
        every credential it held (access, refresh, an unexchanged authorisation
        code, the PKCE verifier) is cleared and its ciphertext deleted, and every
        account bound to it becomes `revoked`. Does not call the provider's
        revoke endpoint (the connector's job): the local half must not depend on
        the provider being reachable. High-risk, audited at `warning`.
        Break-glass: whoever holds the connection's business scope, or the tenant
        administrator (the holder of `assignments.assign`, decided by the access
        chokepoint; holding a business scope of one's own does not take that
        away), can always revoke it, so no account can veto a revocation. Anyone else
        needs `owner` authority over EVERY account bound to it (a connection with
        no account belongs to whoever started it); otherwise the answer is the
        same `404` as an unknown connection. `Idempotency-Key` required. Requires
        `channel_accounts.accounts.revoke`.
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      responses:
        "200":
          description: Revoked.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    enum:
                      - true
                  data:
                    type: object
                    properties:
                      connectionId:
                        type: string
                        format: uuid
                      grantState:
                        type: string
                        enum:
                          - revoked
                      accountsRevoked:
                        type: integer
                  meta:
                    type: object
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: "`GRANT_STATE_INVALID` (already revoked) or `IDEMPOTENCY_CONFLICT`."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "503":
          description: "`CHANNEL_ACCOUNTS_DISABLED`: CHANNEL_ACCOUNTS_ENABLED is not true for this deployment."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /api/v1/channel-accounts/connections/oauth/start:
    post:
      operationId: startChannelOAuth
      tags:
        - Channel Accounts
      summary: Begin an OAuth 2.0 authorisation for a provider.
      description: >-
        Creates a single-use `state` (256 random bits, stored only as a SHA-256,
        bound to this tenant and this person, valid 10 minutes) and, where the
        provider offers PKCE, an S256 challenge whose verifier is held server-side
        as ciphertext. The redirect URI is this deployment's own fixed callback
        and is NOT an input. Returns the provider's authorisation URL.


        `422 PROVIDER_ADAPTER_UNAVAILABLE` for a provider whose connector is not
        installed: this module does not guess a provider's authorisation endpoint.
        The same code when the deployment has no declared `APP_URL` (the callback
        origin comes from it alone, never a built-in default; Issue #1215 L7).
        `429 TOO_MANY_PENDING` caps unconsumed states per person. Not
        idempotency-keyed: each call deliberately mints a fresh state. Requires
        `channel_accounts.accounts.create`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - provider
                - scopes
              additionalProperties: false
              properties:
                provider:
                  type: string
                scopes:
                  type: array
                  maxItems: 64
                  items:
                    type: string
                businessScope:
                  $ref: "#/components/schemas/ChannelBusinessScope"
      responses:
        "200":
          description: The authorisation URL to send the browser to.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    enum:
                      - true
                  data:
                    type: object
                    properties:
                      authorizationUrl:
                        type: string
                        format: uri
                      expiresAt:
                        type: string
                        format: date-time
                  meta:
                    type: object
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "422":
          description: >-
            `PROVIDER_UNKNOWN`, `PROVIDER_NOT_REGISTRABLE`, `AUTH_MODE_INVALID`,
            `PROVIDER_ADAPTER_UNAVAILABLE` or `SCOPE_UNRESOLVED`. A
            `businessScope` the caller does not hold (or an omitted one, for a
            scope-confined caller) is `403 ACCESS_DENIED`.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "429":
          description: "`TOO_MANY_PENDING`."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "503":
          description: >-
            `CHANNEL_ACCOUNTS_DISABLED` or `SECRET_STORE_UNAVAILABLE`.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /api/v1/channel-accounts/connections/oauth/callback:
    get:
      operationId: completeChannelOAuthCallback
      tags:
        - Channel Accounts
      summary: The provider's redirect target.
      description: >-
        A top-level browser navigation that carries the signed-in session; it is
        authorised like any call (`channel_accounts.accounts.create`) and is NOT
        a public endpoint. The `state` must exist, be unexpired and unconsumed,
        belong to THIS tenant and to THIS signed-in person, and have been issued
        against this deployment's own redirect URI. Every failure, replay and
        cross-tenant or cross-person attempt answers the same
        `400 STATE_INVALID`. The state is consumed by a compare-and-swap, so two
        racing callbacks have one winner.


        It does NOT exchange the code: that is provider I/O and must not run
        inside this transaction. It leaves a durable hand-off (a `pending`
        connection holding the authorisation code as ciphertext) for the
        connector's job. Neither the code nor the state is echoed in the
        response, the audit row or any log. A provider-side denial answers
        `403 AUTHORIZATION_DENIED`.
      parameters:
        - name: state
          in: query
          required: true
          schema:
            type: string
        - name: code
          in: query
          required: false
          schema:
            type: string
        - name: error
          in: query
          required: false
          schema:
            type: string
      responses:
        "200":
          description: The hand-off was recorded.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    enum:
                      - true
                  data:
                    type: object
                    properties:
                      connectionId:
                        type: string
                        format: uuid
                      grantState:
                        type: string
                        enum:
                          - pending
                      awaitingExchange:
                        type: boolean
                  meta:
                    type: object
        "400":
          description: "`STATE_INVALID`."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "503":
          description: >-
            `CHANNEL_ACCOUNTS_DISABLED` or `SECRET_STORE_UNAVAILABLE`.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
components:
  schemas:
    ChannelAccountStatus:
      type: string
      enum:
        - pending
        - connected
        - degraded
        - revoked
        - disabled
        - deleted
    ChannelAuthMode:
      type: string
      enum:
        - oauth2
        - api_token
        - bot_token
        - device_key
    ChannelCapabilityName:
      type: string
      enum:
        - publish
        - reply
        - dm
        - inbound
        - comments
        - analytics
        - leads
        - ads
        - broadcast
    ChannelEvidenceKind:
      type: string
      enum:
        - scope_list_hash
        - app_review_reference
        - contract_reference
        - written_authorization
    ChannelAssignmentKind:
      type: string
      enum:
        - owner
        - operator
        - viewer
    ChannelBusinessScope:
      type: object
      required:
        - type
        - id
      additionalProperties: false
      properties:
        type:
          type: string
          description: Lower snake case; the generic business-scope pair (no new ABAC attribute).
        id:
          type: string
          format: uuid
    ChannelRiskAcknowledgement:
      type: object
      properties:
        id:
          type: string
          format: uuid
        provider:
          type: string
          enum:
            - starsender
        tenantUserId:
          type: string
          format: uuid
        textVersion:
          type: string
        acknowledgedAt:
          type: string
          format: date-time
        revokedAt:
          type: string
          format: date-time
          nullable: true
        revokedBy:
          type: string
          format: uuid
          nullable: true
        current:
          type: boolean
          description: The text version it was recorded against is the one in force now.
    ChannelRiskAcknowledgementState:
      type: object
      properties:
        provider:
          type: string
          enum:
            - starsender
        textVersion:
          type: string
        text:
          type: object
          properties:
            en:
              type: string
            id:
              type: string
        approved:
          type: boolean
          description: False while the wording is a draft the business owner has not approved; nothing can then be acknowledged.
        approval:
          type: object
          nullable: true
          properties:
            approvedBy:
              type: string
            approvedOn:
              type: string
            reference:
              type: string
        acknowledgements:
          type: array
          items:
            $ref: "#/components/schemas/ChannelRiskAcknowledgement"
    ChannelAccount:
      type: object
      properties:
        id:
          type: string
          format: uuid
        businessScope:
          allOf:
            - $ref: "#/components/schemas/ChannelBusinessScope"
          nullable: true
        provider:
          type: string
        accountKind:
          type: string
        externalId:
          type: string
          description: The provider-stable identity. Immutable.
        displayName:
          type: string
        authMode:
          $ref: "#/components/schemas/ChannelAuthMode"
        connectionId:
          type: string
          format: uuid
          nullable: true
        parentAccountId:
          type: string
          format: uuid
          nullable: true
        status:
          $ref: "#/components/schemas/ChannelAccountStatus"
        statusReason:
          type: string
          nullable: true
        hasCredential:
          type: boolean
          description: Whether a credential is stored. The credential and its reference are never returned.
        connectedAt:
          type: string
          format: date-time
          nullable: true
        revokedAt:
          type: string
          format: date-time
          nullable: true
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        version:
          type: integer
        accessMode:
          $ref: "#/components/schemas/ChannelAccountAccessMode"
    ChannelAccountAccessMode:
      type: string
      enum:
        - assigned
        - tenant_wide
      description: >-
        Who may see and operate the account. `assigned` (the default) is closed:
        its assignees and the holders of `channel_accounts.assignments.assign`
        only, so an assigned account with no assignee is administrators-only.
        `tenant_wide` is an explicit, audited choice.
    CreateChannelAccountRequest:
      type: object
      required:
        - provider
        - accountKind
        - authMode
        - externalId
        - displayName
      additionalProperties: false
      properties:
        provider:
          type: string
        accountKind:
          type: string
        authMode:
          $ref: "#/components/schemas/ChannelAuthMode"
        externalId:
          type: string
          minLength: 1
          maxLength: 256
        displayName:
          type: string
          minLength: 1
          maxLength: 200
        businessScope:
          $ref: "#/components/schemas/ChannelBusinessScope"
        connectionId:
          type: string
          format: uuid
          description: Required for `oauth2` accounts, refused for the other modes.
        parentAccountId:
          type: string
          format: uuid
          description: Required for a child kind (a phone number's WABA, a sender's ESP account).
    ChannelConnection:
      type: object
      properties:
        id:
          type: string
          format: uuid
        provider:
          type: string
        authMode:
          $ref: "#/components/schemas/ChannelAuthMode"
        grantState:
          type: string
          enum:
            - pending
            - active
            - expired
            - revoked
            - failed
        label:
          type: string
          nullable: true
        grantedScopes:
          type: array
          items:
            type: string
        issuedAt:
          type: string
          format: date-time
          nullable: true
        expiresAt:
          type: string
          format: date-time
          nullable: true
        refreshExpiresAt:
          type: string
          format: date-time
          nullable: true
        revokedAt:
          type: string
          format: date-time
          nullable: true
        hasAccessCredential:
          type: boolean
        awaitingExchange:
          type: boolean
        connectedBy:
          type: string
          format: uuid
          nullable: true
        businessScope:
          description: >-
            The authority boundary of the grant, carried from the authorisation
            that started it; null is tenant-wide.
          nullable: true
          allOf:
            - $ref: "#/components/schemas/ChannelBusinessScope"
        createdAt:
          type: string
          format: date-time
    ChannelAccountCapability:
      type: object
      properties:
        capability:
          $ref: "#/components/schemas/ChannelCapabilityName"
        matrixCell:
          type: string
          enum:
            - candidate
            - restricted
            - not_offered
            - unverified
            - not_applicable
            - barred
        state:
          type: string
          enum:
            - granted
            - pending_approval
            - denied
            - not_offered
            - absent
        evidenceKind:
          allOf:
            - $ref: "#/components/schemas/ChannelEvidenceKind"
          nullable: true
        evidenceRef:
          type: string
          nullable: true
        matrixVersion:
          type: integer
          nullable: true
        verifiedAt:
          type: string
          format: date-time
          nullable: true
        effective:
          type: object
          description: The decision for a use right now.
          required:
            - allowed
          properties:
            allowed:
              type: boolean
            code:
              type: string
              description: Present when `allowed` is false.
    ChannelAccountHealth:
      type: object
      nullable: true
      properties:
        accountId:
          type: string
          format: uuid
        state:
          type: string
          enum:
            - ok
            - degraded
            - failing
            - unknown
        reasonCode:
          type: string
          nullable: true
          description: A fixed code, never provider text.
        checkedAt:
          type: string
          format: date-time
        tokenExpiresAt:
          type: string
          format: date-time
          nullable: true
        quotaRemaining:
          type: number
          nullable: true
        quotaLimit:
          type: number
          nullable: true
    ChannelAccountAssignment:
      type: object
      properties:
        id:
          type: string
          format: uuid
        accountId:
          type: string
          format: uuid
        tenantUserId:
          type: string
          format: uuid
        kind:
          $ref: "#/components/schemas/ChannelAssignmentKind"
        createdAt:
          type: string
          format: date-time
    ChannelProviderMatrix:
      type: object
      properties:
        matrixVersion:
          type: integer
        capabilities:
          type: array
          items:
            $ref: "#/components/schemas/ChannelCapabilityName"
        providers:
          type: array
          items:
            type: object
            properties:
              provider:
                type: string
              label:
                type: string
              registrable:
                type: boolean
              phase:
                type: string
                nullable: true
                enum:
                  - P3
                  - P4
                  - null
                description: >-
                  Set for a phase-gated provider (Issue #1152): its cells record
                  what the official documentation was read to say on a dated
                  pass, the provider is not registrable, and every capability is
                  refused (`PROVIDER_UNVERIFIED`) until its own admission ADR.
                  `null` for an admitted provider or a policy row.
              authModes:
                type: array
                items:
                  $ref: "#/components/schemas/ChannelAuthMode"
              accountKinds:
                type: array
                items:
                  type: object
                  properties:
                    kind:
                      type: string
                    container:
                      type: boolean
                    parentKind:
                      type: string
                      nullable: true
              capabilityCells:
                type: object
                additionalProperties:
                  type: string
