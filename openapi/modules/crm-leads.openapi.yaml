        High-risk, audited at warning. Requires `crm_leads.merges.manage`. A signed-in person
        only (`403 INTERACTIVE_SESSION_REQUIRED` for a machine credential); a replay of the
        same `Idempotency-Key` answers the stored response, a different body with it `409
