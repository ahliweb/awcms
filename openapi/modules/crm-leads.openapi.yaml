              schema:
                $ref: "#/components/schemas/ApiError"
components:
  schemas:
    CrmStageCategory:
      type: string
      enum:
        - new
        - working
        - qualified
        - converted
        - lost
        - disqualified
      description: The CLOSED platform category of a stage. Reports use it, never stage names.
    CrmTransitionGuard:
      type: string
      enum:
        - owner_assigned
        - contact_point_present
        - reason_required
    CrmLeadsSettings:
      type: object
      properties:
        enabled:
          type: boolean
        mergeUndoHours:
          type: integer
        updatedAt:
          type: string
          format: date-time
          nullable: true
    CrmLeadsSettingsPatch:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        enabled:
          type: boolean
        mergeUndoHours:
          type: integer
          minimum: 1
          maximum: 720
    CrmStage:
      type: object
      additionalProperties: false
      required:
        - key
        - name
        - category
      properties:
        key:
          type: string
          pattern: ^[a-z][a-z0-9_]{0,39}$
        name:
          type: string
          maxLength: 80
        category:
          $ref: "#/components/schemas/CrmStageCategory"
        position:
          type: integer
          description: "Response only: the array order."
    CrmTransition:
      type: object
      additionalProperties: false
      required:
        - from
        - to
      properties:
        from:
          type: string
          pattern: ^[a-z][a-z0-9_]{0,39}$
        to:
          type: string
          pattern: ^[a-z][a-z0-9_]{0,39}$
        guards:
          type: array
          maxItems: 3
          items:
            $ref: "#/components/schemas/CrmTransitionGuard"
    CrmPipelineDefinition:
      type: object
      additionalProperties: false
      required:
        - initialStageKey
        - stages
        - transitions
      properties:
        initialStageKey:
          type: string
          pattern: ^[a-z][a-z0-9_]{0,39}$
        stages:
          type: array
          minItems: 1
          maxItems: 50
          items:
            $ref: "#/components/schemas/CrmStage"
        transitions:
          type: array
          maxItems: 400
          items:
            $ref: "#/components/schemas/CrmTransition"
    CrmPipeline:
      type: object
      properties:
        id:
          type: string
          format: uuid
        code:
          type: string
        name:
          type: string
        scope:
          type: object
          nullable: true
          properties:
            type:
              type: string
            id:
              type: string
              format: uuid
        timeZone:
          type: string
        status:
          type: string
          enum:
            - active
            - archived
        version:
          type: integer
        currentRevisionNumber:
          type: integer
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    CrmPipelineWithRevision:
      allOf:
        - $ref: "#/components/schemas/CrmPipeline"
        - type: object
          properties:
            currentRevision:
              type: object
              properties:
                id:
                  type: string
                  format: uuid
                revisionNumber:
                  type: integer
                initialStageKey:
                  type: string
                definitionHash:
                  type: string
                publishedAt:
                  type: string
                  format: date-time
                publishedBy:
                  type: string
                  format: uuid
                stages:
                  type: array
                  items:
                    $ref: "#/components/schemas/CrmStage"
                transitions:
                  type: array
                  items:
                    $ref: "#/components/schemas/CrmTransition"
            migratedLeadCount:
              type: integer
    CrmCreatePipelineRequest:
      type: object
      additionalProperties: false
      required:
        - code
        - name
        - definition
      properties:
        code:
          type: string
          pattern: ^[a-z][a-z0-9_-]{1,39}$
        name:
          type: string
          maxLength: 120
        timeZone:
          type: string
          description: IANA zone used for report buckets. Default UTC.
        scope:
          type: object
          additionalProperties: false
          required:
            - type
            - id
          properties:
            type:
              type: string
              pattern: ^[a-z][a-z0-9_]{0,39}$
            id:
              type: string
              format: uuid
        definition:
          $ref: "#/components/schemas/CrmPipelineDefinition"
    CrmPublishRevisionRequest:
      type: object
      additionalProperties: false
      required:
        - expectedVersion
        - definition
      properties:
        expectedVersion:
          type: integer
          minimum: 1
        definition:
          $ref: "#/components/schemas/CrmPipelineDefinition"
        stageMigrations:
          type: object
          additionalProperties:
            type: string
            pattern: ^[a-z][a-z0-9_]{0,39}$
          description:
            Removed stage key -> stage key of the new revision. Never into a converted
            stage.
        reason:
          type: string
          maxLength: 500
    CrmContactPointInput:
      type: object
      additionalProperties: false
      required:
        - kind
        - value
      properties:
        kind:
          type: string
          enum:
            - email
            - phone
            - platform_id
        platform:
          type: string
          pattern: ^[a-z][a-z0-9_]{1,31}$
          description: Required for `platform_id` only.
        value:
          type: string
          maxLength: 254
          description: Normalised, encrypted and hashed; never returned.
    CrmContactPoint:
      type: object
      properties:
        id:
          type: string
          format: uuid
        kind:
          type: string
          enum:
            - email
            - phone
            - platform_id
        platform:
          type: string
          nullable: true
        masked:
          type: string
          nullable: true
        createdAt:
          type: string
          format: date-time
        revokedAt:
          type: string
          format: date-time
          nullable: true
        erased:
          type: boolean
    CrmSourceInput:
      type: object
      additionalProperties: false
      required:
        - kind
      properties:
        kind:
          type: string
          enum:
            - manual
            - import
            - api
        externalEventId:
          type: string
          pattern: ^[A-Za-z0-9._:-]{1,128}$
          description: "Required for import and api: the intake replay key."
        channelAccountId:
          type: string
          format: uuid
        campaignRef:
          type: string
          pattern: ^[A-Za-z0-9._:-]{1,64}$
        utmSource:
          type: string
          pattern: ^[A-Za-z0-9._~+-]{1,100}$
        utmMedium:
          type: string
          pattern: ^[A-Za-z0-9._~+-]{1,100}$
        utmCampaign:
          type: string
          pattern: ^[A-Za-z0-9._~+-]{1,100}$
        landingPath:
          type: string
          maxLength: 200
        referrerHost:
          type: string
          maxLength: 253
        legalBasis:
          type: string
          enum:
            - consent
            - contract_steps
            - legitimate_interest
            - not_stated
          description: Recorded, never decided, never a consent grant.
        occurredAt:
          type: string
          format: date-time
    CrmCreateLeadRequest:
      type: object
      additionalProperties: false
      required:
        - pipelineId
        - source
      properties:
        pipelineId:
          type: string
          format: uuid
        displayName:
          type: string
          maxLength: 120
        ownerTenantUserId:
          type: string
          format: uuid
        contactPoints:
          type: array
          maxItems: 10
          items:
            $ref: "#/components/schemas/CrmContactPointInput"
        source:
          $ref: "#/components/schemas/CrmSourceInput"
    CrmUpdateLeadRequest:
      type: object
      additionalProperties: false
      required:
        - expectedVersion
      properties:
        expectedVersion:
          type: integer
          minimum: 1
        displayName:
          type: string
          maxLength: 120
          nullable: true
        addContactPoints:
          type: array
          maxItems: 10
          items:
            $ref: "#/components/schemas/CrmContactPointInput"
        revokeContactPointIds:
          type: array
          maxItems: 10
          items:
            type: string
            format: uuid
    CrmExpectedVersion:
      type: object
      additionalProperties: false
      required:
        - expectedVersion
      properties:
        expectedVersion:
          type: integer
          minimum: 1
    CrmMoveRequest:
      type: object
      additionalProperties: false
      required:
        - expectedVersion
        - toStageKey
      properties:
        expectedVersion:
          type: integer
          minimum: 1
        toStageKey:
          type: string
          pattern: ^[a-z][a-z0-9_]{0,39}$
        reason:
          type: string
          maxLength: 500
        occurredAt:
          type: string
          format: date-time
    CrmAssignRequest:
      type: object
      additionalProperties: false
      required:
        - expectedVersion
        - ownerTenantUserId
      properties:
        expectedVersion:
          type: integer
          minimum: 1
        ownerTenantUserId:
          type: string
          format: uuid
          nullable: true
    CrmMergeRequest:
      type: object
      additionalProperties: false
      required:
        - survivorLeadId
        - absorbedLeadId
        - survivorVersion
        - absorbedVersion
        - note
      properties:
        survivorLeadId:
          type: string
          format: uuid
        absorbedLeadId:
          type: string
          format: uuid
        survivorVersion:
          type: integer
          minimum: 1
        absorbedVersion:
          type: integer
          minimum: 1
        note:
          type: string
          maxLength: 1000
    CrmMerge:
      type: object
      properties:
        mergeId:
          type: string
          format: uuid
        survivorLeadId:
          type: string
          format: uuid
        absorbedLeadId:
          type: string
          format: uuid
        undoUntil:
          type: string
          format: date-time
    CrmConversionRequest:
      type: object
      additionalProperties: false
      required:
        - mode
        - expectedVersion
        - evidenceRef
      properties:
        mode:
          type: string
          enum:
            - authority_confirmed
            - authority_unconfirmed
        expectedVersion:
          type: integer
          minimum: 1
        externalCustomerRef:
          type: string
          pattern: ^[A-Za-z0-9._:-]{1,128}$
          description: Required for authority_confirmed. Opaque; never a customer record.
        evidenceRef:
          type: string
          pattern: ^[A-Za-z0-9._:-]{1,128}$
          description: The replay key.
        note:
          type: string
          maxLength: 1000
          description: Required for authority_unconfirmed.
        toStageKey:
          type: string
          pattern: ^[a-z][a-z0-9_]{0,39}$
        occurredAt:
          type: string
          format: date-time
    CrmReverseConversionRequest:
      type: object
      additionalProperties: false
      required:
        - evidenceRef
      properties:
        evidenceRef:
          type: string
          pattern: ^[A-Za-z0-9._:-]{1,128}$
        reason:
          type: string
          maxLength: 500
        occurredAt:
          type: string
          format: date-time
    CrmTouchResult:
      type: object
      properties:
        leadId:
          type: string
          format: uuid
        touchId:
          type: string
          format: uuid
        touchNumber:
          type: integer
        duplicate:
          type: boolean
    CrmCandidate:
      type: object
      properties:
        leadId:
          type: string
          format: uuid
        status:
          type: string
          enum:
            - open
            - merged
            - anonymized
        stageCategory:
          $ref: "#/components/schemas/CrmStageCategory"
        matchedKinds:
          type: array
          items:
            type: string
            enum:
              - email
              - phone
              - platform_id
    CrmLeadWrite:
