# Source fragment for the "crm_leads" module (Issue #1166, ADR-0153).
#
# Owns every path whose operations carry this module's OpenAPI tag, plus every
# components.schemas entry referenced ONLY by this module's operations. NOT
# independently valid OpenAPI: shared $refs resolve after `bun run
# openapi:bundle`. Edit this file, never the generated bundle.
#
# ## What is deliberately NOT here
#
# No operation returns a decrypted contact value (lists and details carry the
# masked form only; a lookup is an exact keyed-hash match), and no mutation
# response carries the display name. No operation creates a customer, a profile
# or a consent (ADR-0153 N1-N3). The website_form and inbound_message intake
# paths, CSV import/export, milestones, typed extensions, consent references,
# notes and the reporting projection are recorded follow-ups.
#
# Every operation answers `503 CRM_LEADS_DISABLED` (after authorization) unless
# the deployment enables the module; every mutation refuses a machine credential
# (`403 INTERACTIVE_SESSION_REQUIRED`) and every lead write answers
# `409 CRM_LEADS_TENANT_DISABLED` while the tenant switch is off.
paths:
  /api/v1/crm-leads/settings:
    get:
      operationId: getCrmLeadsSettings
      tags:
        - CRM Leads
      summary: The tenant switch and merge-undo window
      description:
        "A tenant that never set them is OFF (`enabled: false`, `mergeUndoHours:
        168`). Requires `crm_leads.leads.read`."
      parameters:
        - $ref: "#/components/parameters/CorrelationId"
      responses:
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "503":
          description:
            "`CRM_LEADS_DISABLED` (deployment switch off, answered after authorization)
            or `KEY_RING_UNAVAILABLE`."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "200":
          description: The settings.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    enum:
                      - true
                  data:
                    $ref: "#/components/schemas/CrmLeadsSettings"
                  meta:
                    type: object
    patch:
      operationId: updateCrmLeadsSettings
      tags:
        - CRM Leads
      summary: Switch the module on or off for this tenant
      description:
        High-risk (`configure`), audited at warning with the previous and new values.
        Requires `crm_leads.pipelines.configure`. A signed-in person only (`403 INTERACTIVE_SESSION_REQUIRED`
        for a machine credential); a replay of the same `Idempotency-Key` answers the stored
        response, a different body with it `409 IDEMPOTENCY_CONFLICT`. Mutation responses
        never carry `displayName` (the stored replay body must not outlive an erasure).
      parameters:
        - $ref: "#/components/parameters/CorrelationId"
        - $ref: "#/components/parameters/IdempotencyKey"
      responses:
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "503":
          description:
            "`CRM_LEADS_DISABLED` (deployment switch off, answered after authorization)
            or `KEY_RING_UNAVAILABLE`."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "200":
          description: The settings.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    enum:
                      - true
                  data:
                    $ref: "#/components/schemas/CrmLeadsSettings"
                  meta:
                    type: object
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CrmLeadsSettingsPatch"
  /api/v1/crm-leads/pipelines:
    get:
      operationId: listCrmPipelines
      tags:
        - CRM Leads
      summary: The tenant's pipelines
      description: At most 200, ordered by code. Requires `crm_leads.leads.read`.
      parameters:
        - $ref: "#/components/parameters/CorrelationId"
      responses:
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "503":
          description:
            "`CRM_LEADS_DISABLED` (deployment switch off, answered after authorization)
            or `KEY_RING_UNAVAILABLE`."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "200":
          description: The pipelines.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    enum:
                      - true
                  data:
                    type: object
                    properties:
                      items:
                        type: array
                        items:
                          $ref: "#/components/schemas/CrmPipeline"
                  meta:
                    type: object
    post:
      operationId: createCrmPipeline
      tags:
        - CRM Leads
      summary: Create a pipeline with its first immutable revision
      description:
        Stages carry a tenant-chosen key and name and a CLOSED category; edges
        carry guards from a closed set (no expression language). No product vocabulary is
        seeded or assumed (ADR-0153 L2). Requires `crm_leads.pipelines.configure`. A signed-in
        person only (`403 INTERACTIVE_SESSION_REQUIRED` for a machine credential); a replay
        of the same `Idempotency-Key` answers the stored response, a different body with it
        `409 IDEMPOTENCY_CONFLICT`. Mutation responses never carry `displayName` (the stored
        replay body must not outlive an erasure).
      parameters:
        - $ref: "#/components/parameters/CorrelationId"
        - $ref: "#/components/parameters/IdempotencyKey"
      responses:
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "503":
          description:
            "`CRM_LEADS_DISABLED` (deployment switch off, answered after authorization)
            or `KEY_RING_UNAVAILABLE`."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "201":
          description: The pipeline with its current revision.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    enum:
                      - true
                  data:
                    $ref: "#/components/schemas/CrmPipelineWithRevision"
                  meta:
                    type: object
        "409":
          description: "Conflict: `PIPELINE_CODE_TAKEN`."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CrmCreatePipelineRequest"
  /api/v1/crm-leads/pipelines/{id}:
    get:
      operationId: getCrmPipeline
      tags:
        - CRM Leads
      summary: One pipeline with its current revision
      description: An id of another tenant answers like a missing one. Requires `crm_leads.leads.read`.
      parameters:
        - $ref: "#/components/parameters/CorrelationId"
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "503":
          description:
            "`CRM_LEADS_DISABLED` (deployment switch off, answered after authorization)
            or `KEY_RING_UNAVAILABLE`."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "200":
          description: The pipeline.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    enum:
                      - true
                  data:
                    $ref: "#/components/schemas/CrmPipelineWithRevision"
                  meta:
                    type: object
  /api/v1/crm-leads/pipelines/{id}/revisions:
    post:
      operationId: publishCrmPipelineRevision
      tags:
        - CRM Leads
      summary: Publish a new immutable revision
      description:
        Needs the pipeline's `expectedVersion`. A revision that removes a stage
        some lead is in is refused (`409 STAGES_IN_USE`, naming the stage keys) unless `stageMigrations`
        maps each such stage to a stage of the new revision; those leads then get a `stage_migrated`
        transition. An identical definition is `409 REVISION_UNCHANGED`. High-risk, audited
        at warning. Requires `crm_leads.pipelines.configure`. A signed-in person only (`403
        INTERACTIVE_SESSION_REQUIRED` for a machine credential); a replay of the same `Idempotency-Key`
        answers the stored response, a different body with it `409 IDEMPOTENCY_CONFLICT`.
        Mutation responses never carry `displayName` (the stored replay body must not outlive
        an erasure).
      parameters:
        - $ref: "#/components/parameters/CorrelationId"
        - $ref: "#/components/parameters/IdempotencyKey"
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "503":
          description:
            "`CRM_LEADS_DISABLED` (deployment switch off, answered after authorization)
            or `KEY_RING_UNAVAILABLE`."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "201":
          description: The pipeline with its new current revision.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    enum:
                      - true
                  data:
                    $ref: "#/components/schemas/CrmPipelineWithRevision"
                  meta:
                    type: object
        "409":
          description: "Conflict: `VERSION_CONFLICT`, `STAGES_IN_USE`, `REVISION_UNCHANGED`."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "422":
          description: "`UNKNOWN_MIGRATION_SOURCE`."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CrmPublishRevisionRequest"
  /api/v1/crm-leads/leads:
    get:
      operationId: listCrmLeads
      tags:
        - CRM Leads
      summary: The tenant's leads, newest first
      description:
        Keyset-paginated (`cursor` from `nextCursor`, `limit` 1-100, default 25;
        out-of-range values are rejected, not clamped). Contact points are MASKED; no read
        path decrypts. Requires `crm_leads.leads.read`.
      parameters:
        - $ref: "#/components/parameters/CorrelationId"
        - name: pipelineId
          in: query
          required: false
          schema:
            type: string
            format: uuid
        - name: stageCategory
          in: query
          required: false
          schema:
            $ref: "#/components/schemas/CrmStageCategory"
        - name: ownerTenantUserId
          in: query
          required: false
          schema:
            type: string
            format: uuid
        - name: includeDeleted
          in: query
          required: false
          schema:
            type: boolean
        - name: cursor
          in: query
          required: false
          schema:
            type: string
            maxLength: 200
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
      responses:
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "503":
          description:
            "`CRM_LEADS_DISABLED` (deployment switch off, answered after authorization)
            or `KEY_RING_UNAVAILABLE`."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "200":
          description: A page of leads.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    enum:
                      - true
                  data:
                    type: object
                    properties:
                      items:
                        type: array
                        items:
                          $ref: "#/components/schemas/CrmLead"
                      nextCursor:
                        type: string
                        nullable: true
                  meta:
                    type: object
    post:
      operationId: createCrmLead
      tags:
        - CRM Leads
      summary: Lead intake (manual, import, api)
      description:
        "Idempotent on the `Idempotency-Key` AND on the source key (kind, channel
        account, `externalEventId`): a replayed webhook or a re-uploaded row answers the SAME
        lead with `200` and `duplicate: true` and writes nothing. `import` and `api` sources
        must carry `externalEventId`. `website_form` and `inbound_message` are not accepted
        over HTTP (their consumers are follow-ups). Creates no profile, no consent and no
        customer. `409 CRM_LEADS_TENANT_DISABLED` while the tenant switch is off. Requires
        `crm_leads.leads.create`. A signed-in person only (`403 INTERACTIVE_SESSION_REQUIRED`
        for a machine credential); a replay of the same `Idempotency-Key` answers the stored
        response, a different body with it `409 IDEMPOTENCY_CONFLICT`. Mutation responses
        never carry `displayName` (the stored replay body must not outlive an erasure)."
      parameters:
        - $ref: "#/components/parameters/CorrelationId"
        - $ref: "#/components/parameters/IdempotencyKey"
      responses:
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "503":
          description:
            "`CRM_LEADS_DISABLED` (deployment switch off, answered after authorization)
            or `KEY_RING_UNAVAILABLE`."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "200":
          description: The existing lead for a replayed source key.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    enum:
                      - true
                  data:
                    $ref: "#/components/schemas/CrmLeadWrite"
                  meta:
                    type: object
        "201":
          description: The new lead.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    enum:
                      - true
                  data:
                    $ref: "#/components/schemas/CrmLeadWrite"
                  meta:
                    type: object
        "409":
          description: "Conflict: `CRM_LEADS_TENANT_DISABLED`, `PIPELINE_ARCHIVED`."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "422":
          description: "`PIPELINE_NOT_FOUND` or `OWNER_NOT_FOUND`."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CrmCreateLeadRequest"
  /api/v1/crm-leads/leads/lookup:
    post:
      operationId: lookupCrmLeads
      tags:
        - CRM Leads
      summary: Find leads by an exact contact value
      description:
        An EXACT keyed-hash match inside this tenant. A POST so the value never
        sits in a URL. Returns ids only; audited without the value. Requires `crm_leads.leads.read`.
      parameters:
        - $ref: "#/components/parameters/CorrelationId"
      responses:
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "503":
          description:
            "`CRM_LEADS_DISABLED` (deployment switch off, answered after authorization)
            or `KEY_RING_UNAVAILABLE`."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "200":
          description: Matches.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    enum:
                      - true
                  data:
                    type: object
                    properties:
                      items:
                        type: array
                        items:
                          type: object
                          properties:
                            leadId:
                              type: string
                              format: uuid
                            contactPointId:
                              type: string
                              format: uuid
                  meta:
                    type: object
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CrmContactPointInput"
  /api/v1/crm-leads/leads/merge:
    post:
      operationId: mergeCrmLeads
      tags:
        - CRM Leads
      summary: Merge two leads after human review
      description:
        Both leads must be open, live and in the same pipeline, at the versions
        the reviewer saw. Another tenant's lead answers `404`. The absorbed lead is marked
        `merged`; nothing is moved or deleted, so the merge is undoable within the tenant's
        window. High-risk, audited at warning. Requires `crm_leads.merges.manage`. A signed-in
        person only (`403 INTERACTIVE_SESSION_REQUIRED` for a machine credential); a replay
        of the same `Idempotency-Key` answers the stored response, a different body with it
        `409 IDEMPOTENCY_CONFLICT`. Mutation responses never carry `displayName` (the stored
        replay body must not outlive an erasure).
      parameters:
        - $ref: "#/components/parameters/CorrelationId"
        - $ref: "#/components/parameters/IdempotencyKey"
      responses:
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "503":
          description:
            "`CRM_LEADS_DISABLED` (deployment switch off, answered after authorization)
            or `KEY_RING_UNAVAILABLE`."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "201":
          description: The merge.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    enum:
                      - true
                  data:
                    $ref: "#/components/schemas/CrmMerge"
                  meta:
                    type: object
        "409":
          description:
            "Conflict: `CRM_LEADS_TENANT_DISABLED`, `PIPELINE_MISMATCH`, `LEAD_NOT_OPEN`,
            `VERSION_CONFLICT`, `ABSORBED_LEAD_CONVERTED`, `ABSORBED_LEAD_HAS_MERGES`."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CrmMergeRequest"
  /api/v1/crm-leads/leads/{id}:
    get:
      operationId: getCrmLead
      tags:
        - CRM Leads
      summary: One lead with its history
      description:
        Masked contact points, source touches (the first touch is immutable), transitions
        (each naming its revision), assignments, conversions and merges. Requires `crm_leads.leads.read`.
      parameters:
        - $ref: "#/components/parameters/CorrelationId"
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "503":
          description:
            "`CRM_LEADS_DISABLED` (deployment switch off, answered after authorization)
            or `KEY_RING_UNAVAILABLE`."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "200":
          description: The lead.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    enum:
                      - true
                  data:
                    $ref: "#/components/schemas/CrmLeadDetail"
                  meta:
                    type: object
    patch:
      operationId: updateCrmLead
      tags:
        - CRM Leads
      summary: Change the display name or contact points
      description:
        "Needs `expectedVersion` (`409 VERSION_CONFLICT`). A contact value is never
        edited: revoke it and add another. Requires `crm_leads.leads.update`. A signed-in
        person only (`403 INTERACTIVE_SESSION_REQUIRED` for a machine credential); a replay
        of the same `Idempotency-Key` answers the stored response, a different body with it
        `409 IDEMPOTENCY_CONFLICT`. Mutation responses never carry `displayName` (the stored
        replay body must not outlive an erasure)."
      parameters:
        - $ref: "#/components/parameters/CorrelationId"
        - $ref: "#/components/parameters/IdempotencyKey"
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "503":
          description:
            "`CRM_LEADS_DISABLED` (deployment switch off, answered after authorization)
            or `KEY_RING_UNAVAILABLE`."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "200":
          description: The lead.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    enum:
                      - true
                  data:
                    $ref: "#/components/schemas/CrmLeadWrite"
                  meta:
                    type: object
        "409":
          description: "Conflict: `CRM_LEADS_TENANT_DISABLED`, `VERSION_CONFLICT`, `LEAD_NOT_OPEN`."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "422":
          description: "`CONTACT_POINT_NOT_FOUND`."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CrmUpdateLeadRequest"
    delete:
      operationId: deleteCrmLead
      tags:
        - CRM Leads
      summary: Soft-delete a lead
      description:
        'Restorable. Needs `If-Match: "<version>"` (`428 PRECONDITION_REQUIRED`
        without it). Erasure is `/anonymize`. High-risk, audited at warning. Requires `crm_leads.leads.delete`.
        A signed-in person only (`403 INTERACTIVE_SESSION_REQUIRED` for a machine credential);
        a replay of the same `Idempotency-Key` answers the stored response, a different body
        with it `409 IDEMPOTENCY_CONFLICT`. Mutation responses never carry `displayName` (the
        stored replay body must not outlive an erasure).'
      parameters:
        - $ref: "#/components/parameters/CorrelationId"
        - $ref: "#/components/parameters/IdempotencyKey"
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: If-Match
          in: header
          required: true
          schema:
            type: string
      responses:
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "503":
          description:
            "`CRM_LEADS_DISABLED` (deployment switch off, answered after authorization)
            or `KEY_RING_UNAVAILABLE`."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "200":
          description: Deleted.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    enum:
                      - true
                  data:
                    type: object
                    properties:
                      id:
                        type: string
                        format: uuid
                      deleted:
                        type: boolean
                  meta:
                    type: object
        "409":
          description: "Conflict: `VERSION_CONFLICT`, `LEAD_ALREADY_DELETED`."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "428":
          description: "`PRECONDITION_REQUIRED`."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
