                properties:
                  success:
                    type: boolean
                    enum:
                      - true
                  data:
                    $ref: "#/components/schemas/CrmLeadWrite"
                  meta:
                    type: object
        "409":
          description:
            "Conflict: `CRM_LEADS_TENANT_DISABLED`, `VERSION_CONFLICT`, `LEAD_NOT_OPEN`,
            `TRANSITION_NOT_ALLOWED`, `GUARD_NOT_MET`, `CONVERSION_REQUIRED`, `REVERSAL_REQUIRED`."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "422":
          description: "`STAGE_NOT_FOUND`."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
      requestBody:
        required: true
