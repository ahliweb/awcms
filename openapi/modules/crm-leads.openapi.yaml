          type: string
          format: uuid
        revisionId:
          type: string
          format: uuid
        stageKey:
          type: string
        stageCategory:
          $ref: "#/components/schemas/CrmStageCategory"
        stageEnteredAt:
          type: string
          format: date-time
        ownerTenantUserId:
          type: string
          format: uuid
          nullable: true
        status:
          type: string
          enum:
            - open
            - merged
            - anonymized
        mergedIntoLeadId:
          type: string
          format: uuid
          nullable: true
        externalCustomerRef:
          type: string
          nullable: true
          description: Opaque; written only by a conversion.
        version:
          type: integer
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        deletedAt:
          type: string
          format: date-time
          nullable: true
        anonymizedAt:
          type: string
          format: date-time
          nullable: true
        contactPoints:
          type: array
          items:
            $ref: "#/components/schemas/CrmContactPoint"
        duplicate:
          type: boolean
        transitionId:
          type: string
          format: uuid
        conversionId:
          type: string
          format: uuid
        replayed:
          type: boolean
        changed:
          type: boolean
    CrmLead:
      type: object
      properties:
        id:
          type: string
          format: uuid
        pipelineId:
          type: string
          format: uuid
        revisionId:
          type: string
          format: uuid
        stageKey:
          type: string
        stageCategory:
          $ref: "#/components/schemas/CrmStageCategory"
        stageEnteredAt:
          type: string
          format: date-time
        ownerTenantUserId:
          type: string
          format: uuid
          nullable: true
        status:
          type: string
          enum:
            - open
            - merged
            - anonymized
        mergedIntoLeadId:
          type: string
          format: uuid
          nullable: true
        externalCustomerRef:
          type: string
          nullable: true
          description: Opaque; written only by a conversion.
        version:
          type: integer
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        deletedAt:
          type: string
          format: date-time
          nullable: true
        anonymizedAt:
          type: string
          format: date-time
          nullable: true
        contactPoints:
          type: array
          items:
            $ref: "#/components/schemas/CrmContactPoint"
        displayName:
          type: string
          nullable: true
    CrmLeadDetail:
      allOf:
        - $ref: "#/components/schemas/CrmLead"
        - type: object
          properties:
            history:
              type: object
              properties:
                touches:
                  type: array
                  items:
                    type: object
                transitions:
                  type: array
                  items:
                    type: object
                assignments:
                  type: array
                  items:
                    type: object
                conversions:
                  type: array
                  items:
                    type: object
                merges:
                  type: array
                  items:
                    type: object
