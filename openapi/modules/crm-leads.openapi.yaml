  /api/v1/crm-leads/leads/{id}/move:
    post:
      operationId: moveCrmLead
      tags:
        - CRM Leads
      summary: Move a lead along an allowed edge
      description:
        "Decided under the row lock: `expectedVersion` (the loser of a race gets
        `409 VERSION_CONFLICT`), the edge of the current revision (`409 TRANSITION_NOT_ALLOWED`)
        and its guards re-checked in the transaction (`409 GUARD_NOT_MET` naming the guards).
        A converted stage is entered only by a conversion (`409 CONVERSION_REQUIRED`) and
        left only by its reversal (`409 REVERSAL_REQUIRED`). Requires `crm_leads.stages.update`.
        A signed-in person only (`403 INTERACTIVE_SESSION_REQUIRED` for a machine credential);
        a replay of the same `Idempotency-Key` answers the stored response, a different body
        with it `409 IDEMPOTENCY_CONFLICT`. Mutation responses never carry `displayName` (the
        stored replay body must not outlive an erasure)."
      parameters:
        - $ref: "#/components/parameters/CorrelationId"
        - $ref: "#/components/parameters/IdempotencyKey"
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "503":
          description:
            "`CRM_LEADS_DISABLED` (deployment switch off, answered after authorization)
            or `KEY_RING_UNAVAILABLE`."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "200":
