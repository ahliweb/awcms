# Source fragment for the "Blog Content" module/tag — ported from awcms-mini
# (epic #536, issues #537-#543 plus the later hardening lineage; see
# src/modules/blog-content/module.ts's own description field and README.md
# for the full port-adaptation notes, including what was deliberately
# dropped: the host-resolved /news/** route family and its two ports'
# concrete adapters, replaced here by this module's own no-op adapters).
#
# Owns every `/api/v1/blog/*` admin path and the schemas referenced ONLY by
# this tag's operations. The public, anonymous `/blog/{tenantCode}/...`
# route family (index/detail/category/tag/search/feed/sitemap) is NOT here —
# same convention theming's own public preview routes use (Astro
# text/html/xml routes under src/pages/**, not src/pages/api/v1/**, so they
# are outside the api-spec-check route tree).
#
# ADR-0044 (news_portal merged into blog_content): this fragment ALSO owns the
# two absorbed surfaces — `/api/v1/news-portal/homepage-sections*` (tag
# `News Portal Homepage Sections`) and `/api/v1/news-portal/ad-placements*`
# (tag `News Portal Ad Placements`) — and their schemas, moved here verbatim
# from the deleted openapi/modules/news-portal.openapi.yaml. Paths and tag
# NAMES are deliberately unchanged (ADR-0044 §3/§6: the merge moved ownership,
# not the public surface); what changes here is which module's fragment file
# declares them, so `openapi/modules/*` stays one-file-per-REGISTERED-module
# (ADR-0026) instead of carrying a file for a module that no longer exists.
#
# NOT independently valid OpenAPI -- $ref targets pointing at shared
# components only resolve after `bun run openapi:bundle` merges this file
# with the root and every sibling module fragment. Edit this file (or the
# root for shared components), never the generated bundle.
paths:
  /api/v1/blog/posts:
    get:
      tags:
        - Blog Content
      operationId: blogListPosts
      summary: List this tenant's non-deleted blog posts
      description: |
        Gated by blog_content.posts.read. Optional ?status= and ?locale= filters, ?limit= bounded (default 20, max 100 — max 50 with `view=full`, whose rows carry `contentJson`).

        Ordering defaults to `updated_at DESC` — right for an admin table, and unsound as a keyset key because editing a post moves it, so a row can cross a page boundary between requests and be skipped or repeated. A caller that needs EVERY post (a build feed) passes `?order=created_at`, which is immutable, and follows `nextCursor` until it is null. `?cursor=` without `?order=created_at` is refused with 400 rather than quietly honoured.

        **The default response is `BlogPostSummary`, not `BlogPost`.** It carries no `contentJson`, `excerpt`, `metaDescription`, `canonicalUrl`, or `translationGroupId`. This document used to say otherwise, and a client that believed it built an entire static site with every article body empty — nothing failed, because a missing field reads as `undefined`. A caller that needs the body asks for `?view=full` (which requires `order=created_at`) and receives `BlogPost`.
      parameters:
        - name: status
          in: query
          schema:
            type: string
            enum: [draft, review, scheduled, published, archived]
        - name: locale
          in: query
          description: Exact match on the post's stored locale. Absent means every locale, which is the right default for an admin table but wasteful for a single-language build feed — that is what this parameter exists for. Not shape-validated beyond non-empty and a 35-character bound, because the write path accepts any non-empty string and a stricter read filter would make a stored locale unreachable. An empty value is a 400, never treated as absent.
          schema:
            type: string
            minLength: 1
            maxLength: 35
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
        - name: order
          in: query
          description: Sort key. `created_at` selects the STABLE, cursor-capable traversal; `updated_at` (default) is the admin ordering and rejects `cursor`.
          schema:
            type: string
            enum: [created_at, updated_at]
        - name: cursor
          in: query
          description: Opaque keyset cursor from a previous response's `nextCursor`. Requires `order=created_at`. A malformed value is a 400, never treated as "no cursor".
          schema:
            type: string
        - name: view
          in: query
          description: |
            Response projection. `summary` (default) returns `BlogPostSummary`; `full` returns `BlogPost` — every column the detail endpoint returns, `termIds` and `institutionIds` included.

            Those two were originally left out because fetching them per post would have been one extra query each. A page fetches them for the whole page in one query instead, so the cost is three round trips per page rather than one per post — and without them no consumer could build a category or tag archive at all, which is the state Issue #597 item 1 describes.

            `full` requires `order=created_at`: a full traversal is only sound over the immutable ordering, and the ordering is demanded rather than silently substituted. An unrecognised value is a 400, never a silent fallback to `summary`.
          schema:
            type: string
            enum: [summary, full]
        - $ref: "#/components/parameters/CorrelationId"
      responses:
        "200":
          description: Matching posts.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    enum: [true]
                  data:
                    type: object
                    properties:
                      posts:
                        type: array
                        description: "`BlogPostSummary` by default; `BlogPost` when `view=full`."
                        items:
                          oneOf:
                            - $ref: "#/components/schemas/BlogPostSummary"
                            - $ref: "#/components/schemas/BlogPost"
                      nextCursor:
                        type: string
                        nullable: true
                        description: Present only with `order=created_at`. Null means the traversal is complete.
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
    post:
      tags:
        - Blog Content
      operationId: blogCreatePost
      summary: Create a draft blog post
      description: Gated by blog_content.posts.create. Not idempotency-keyed (a retry duplicating a create is caught by the (tenant_id, locale, slug) partial unique index).
      parameters:
        - $ref: "#/components/parameters/CorrelationId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BlogPostWriteInput"
      responses:
        "200":
          description: Post created.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    enum: [true]
                  data:
                    $ref: "#/components/schemas/BlogPost"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          description: A post already exists for this slug/locale, or the referenced media is not R2-verified in full-online R2-only mode (422 for the latter).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "422":
          description: One or more image/video-thumbnail references are not valid R2 media objects in full-online R2-only mode.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /api/v1/blog/posts/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
    get:
      tags:
        - Blog Content
      operationId: blogGetPost
      summary: Read one blog post
      description: Gated by blog_content.posts.read.
      parameters:
        - $ref: "#/components/parameters/CorrelationId"
      responses:
        "200":
          description: The post.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    enum: [true]
                  data:
                    $ref: "#/components/schemas/BlogPost"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
    patch:
      tags:
        - Blog Content
      operationId: blogUpdatePost
      summary: Update a blog post
      description: Gated by blog_content.posts.update (with an ownership carve-out — a draft's own author may update it without the broader permission). Only fields present in the body are changed. A significant title/contentJson/contentText change snapshots an append-only revision first.
      parameters:
        - $ref: "#/components/parameters/CorrelationId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BlogPostWriteInput"
      responses:
        "200":
          description: Post updated.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    enum: [true]
                  data:
                    $ref: "#/components/schemas/BlogPost"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          description: One or more image/video-thumbnail references are not valid R2 media objects in full-online R2-only mode.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
    delete:
      tags:
        - Blog Content
      operationId: blogDeletePost
      summary: Soft delete a blog post
      description: Gated by blog_content.posts.delete. Soft delete only (deleted_at/deleted_by/delete_reason) — see POST .../purge for the permanent, high-risk purge.
      parameters:
        - $ref: "#/components/parameters/CorrelationId"
      responses:
        "200":
          description: Post soft-deleted.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    enum: [true]
                  data:
                    $ref: "#/components/schemas/BlogPost"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
  /api/v1/blog/posts/{id}/submit-review:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
    post:
      tags:
        - Blog Content
      operationId: blogSubmitPostForReview
      summary: Submit a draft post for review
      description: Transitions draft -> review. Gated by blog_content.posts.update (same ownership carve-out as PATCH .../{id}). Not idempotency-keyed — the status transition is naturally idempotent.
      parameters:
        - $ref: "#/components/parameters/CorrelationId"
      responses:
        "200":
          description: Post submitted for review.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    enum: [true]
                  data:
                    $ref: "#/components/schemas/BlogPost"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: The post's current status cannot transition to review.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /api/v1/blog/posts/{id}/publish:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
    post:
      tags:
        - Blog Content
      operationId: blogPublishPost
      summary: Publish a blog post
      description: Gated by blog_content.posts.publish (no ownership carve-out). High-risk, requires Idempotency-Key. Blocked (422) if the content quality checklist fails when full-online R2-only mode is active for the tenant. On success, also invokes the social-publishing outbox hook (a documented no-op in this base — social_publishing is not ported).
      parameters:
        - name: Idempotency-Key
          in: header
          required: true
          schema:
            type: string
        - $ref: "#/components/parameters/CorrelationId"
      responses:
        "200":
          description: Post published (or an idempotent replay).
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    enum: [true]
                  data:
                    type: object
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: Invalid status transition, or the Idempotency-Key was already used with a different request.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "422":
          description: Publish is blocked by the content quality checklist.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /api/v1/blog/posts/{id}/schedule:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
    post:
      tags:
        - Blog Content
      operationId: blogSchedulePost
      summary: Schedule a blog post for future publishing
      description: Gated by blog_content.posts.schedule. High-risk, requires Idempotency-Key. Same content quality checklist gate as publish. The blog:publish:scheduled job later performs the actual publish once scheduledAt <= now().
      parameters:
        - name: Idempotency-Key
          in: header
          required: true
          schema:
            type: string
        - $ref: "#/components/parameters/CorrelationId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [scheduledAt]
              properties:
                scheduledAt:
                  type: string
                  format: date-time
                unpublishAt:
                  type: string
                  format: date-time
                  nullable: true
                  description: >-
                    Issue #591 — closes the publication window. When the moment
                    arrives, blog:publish:scheduled transitions the post to
                    archived. Must be strictly after scheduledAt; omitted or null
                    means the post stays published until an editor archives it by
                    hand. Carried in the idempotency request hash, so replaying a
                    key with a different withdrawal date is a 409, not a no-op.
      responses:
        "200":
          description: Post scheduled (or an idempotent replay).
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    enum: [true]
                  data:
                    type: object
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: Invalid status transition, or the Idempotency-Key was already used with a different request.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "422":
          description: Scheduling is blocked by the content quality checklist.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /api/v1/blog/posts/{id}/archive:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
    post:
      tags:
        - Blog Content
      operationId: blogArchivePost
      summary: Archive a blog post
      description: Gated by blog_content.posts.archive. High-risk, requires Idempotency-Key.
      parameters:
        - name: Idempotency-Key
          in: header
          required: true
          schema:
            type: string
        - $ref: "#/components/parameters/CorrelationId"
      responses:
        "200":
          description: Post archived (or an idempotent replay).
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    enum: [true]
                  data:
                    $ref: "#/components/schemas/BlogPost"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: Invalid status transition, or the Idempotency-Key was already used with a different request.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /api/v1/blog/posts/{id}/restore:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
    post:
      tags:
        - Blog Content
      operationId: blogRestorePost
      summary: Restore a soft-deleted blog post
      description: Gated by blog_content.posts.restore. High-risk, requires Idempotency-Key.
      parameters:
        - name: Idempotency-Key
          in: header
          required: true
          schema:
            type: string
        - $ref: "#/components/parameters/CorrelationId"
      responses:
        "200":
          description: Post restored (or an idempotent replay).
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    enum: [true]
                  data:
                    $ref: "#/components/schemas/BlogPost"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: The Idempotency-Key was already used with a different request.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /api/v1/blog/posts/{id}/purge:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
    post:
      tags:
        - Blog Content
      operationId: blogPurgePost
      summary: Permanently purge a soft-deleted blog post
      description: Gated by blog_content.posts.purge. High-risk, irreversible, requires Idempotency-Key. Only a previously soft-deleted post may be purged.
      parameters:
        - name: Idempotency-Key
          in: header
          required: true
          schema:
            type: string
        - $ref: "#/components/parameters/CorrelationId"
      responses:
        "200":
          description: Post purged (or an idempotent replay).
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    enum: [true]
                  data:
                    type: object
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: The post is not soft-deleted, or the Idempotency-Key was already used with a different request.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /api/v1/blog/posts/{id}/quality-checklist:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
    get:
      tags:
        - Blog Content
      operationId: blogGetPostQualityChecklist
      summary: Preview the content quality checklist for a post
      description: Read-only preview for the admin editor — runs the exact same evaluator POST .../publish and .../schedule enforce. Gated by blog_content.posts.read (no separate permission).
      parameters:
        - $ref: "#/components/parameters/CorrelationId"
      responses:
        "200":
          description: The checklist result.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    enum: [true]
                  data:
                    type: object
                    properties:
                      postId:
                        type: string
                        format: uuid
                      qualityChecklist:
                        $ref: "#/components/schemas/ContentQualityChecklistResult"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
  /api/v1/blog/posts/{id}/internal-links/preview:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
    get:
      tags:
        - Blog Content
      operationId: blogPreviewPostInternalLinks
      summary: Preview automatic internal tag linking for a post
      description: Read-only preview of which tags would be automatically linked in this post's rendered content before publishing. Gated by blog_content.internal_links.preview.
      parameters:
        - $ref: "#/components/parameters/CorrelationId"
      responses:
        "200":
          description: The preview result.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    enum: [true]
                  data:
                    type: object
                    properties:
                      postId:
                        type: string
                        format: uuid
                      enabled:
                        type: boolean
                      disabledReason:
                        type: string
                        nullable: true
                        enum:
                          [
                            deployment_disabled,
                            tenant_disabled,
                            post_disabled,
                            null
                          ]
                      matches:
                        type: array
                        items:
                          type: object
                      totalLinked:
                        type: integer
                      maxPerPost:
                        type: integer
                      maxPerTag:
                        type: integer
                      vocabulary:
                        type: object
                        description: |
                          How much of the tenant's tag vocabulary the matching engine could see (Issue #648).

                          Only a bounded number of tags enter the engine at once, because it compiles one alternation regex from all of them. Which ones are chosen is by USAGE — the tags carried by the most posts — since those are the ones most likely to occur in prose. Until Issue #648 the selection was the alphabetically-first hundred, inherited from the admin list, so whether a tag was ever linked was decided by its first letter and nothing said so.

                          `truncated: true` is the one reason a tag went unlinked that the editor cannot fix by editing.
                        required: [total, limit, truncated]
                        properties:
                          total:
                            type: integer
                            description: Non-deleted tags this tenant has.
                          limit:
                            type: integer
                            description: The cap applied to the candidate list.
                          truncated:
                            type: boolean
                            description: True when the vocabulary is larger than the cap, so some tags cannot be linked at all.
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
  /api/v1/blog/posts/{id}/revisions:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
    get:
      tags:
        - Blog Content
      operationId: blogListPostRevisions
      summary: List a post's revision history
      description: Gated by blog_content.revisions.read. Newest first.
      parameters:
        - $ref: "#/components/parameters/CorrelationId"
      responses:
        "200":
          description: The revision list.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    enum: [true]
                  data:
                    type: object
                    properties:
                      revisions:
                        type: array
                        items:
                          $ref: "#/components/schemas/BlogRevision"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
  /api/v1/blog/posts/{id}/revisions/{revisionId}:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: revisionId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    get:
      tags:
        - Blog Content
      operationId: blogGetPostRevision
      summary: Read one revision of a post
      description: Gated by blog_content.revisions.read.
      parameters:
        - $ref: "#/components/parameters/CorrelationId"
      responses:
        "200":
          description: The revision.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    enum: [true]
                  data:
                    $ref: "#/components/schemas/BlogRevision"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
  /api/v1/blog/posts/{id}/revisions/{revisionId}/restore:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: revisionId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    post:
      tags:
        - Blog Content
      operationId: blogRestorePostRevision
      summary: Restore a post to an earlier revision
