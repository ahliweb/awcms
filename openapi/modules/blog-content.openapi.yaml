components:
  schemas:
    BlogPostWriteInput:
      type: object
      description: Shared shape for POST /api/v1/blog/posts (all fields required) and PATCH /api/v1/blog/posts/{id} (all fields optional, only present fields change).
      properties:
        title:
          type: string
        slug:
          type: string
        excerpt:
          type: string
          nullable: true
        contentJson:
          $ref: "#/components/schemas/BlogContentJson"
        contentText:
          type: string
        locale:
          type: string
        visibility:
          type: string
          enum: [public, private, unlisted]
        featuredMediaId:
          type: string
          format: uuid
          nullable: true
        seoImageMediaId:
          type: string
          format: uuid
          nullable: true
          description: Explicit "use this image for social/SEO preview" override — takes priority over featuredMediaId.
        seoTitle:
          type: string
          nullable: true
        metaDescription:
          type: string
          nullable: true
        canonicalUrl:
          type: string
          nullable: true
        termIds:
          type: array
          items:
            type: string
            format: uuid
        translationGroupId:
          type: string
          format: uuid
          nullable: true
        autoInternalTagLinksDisabled:
          type: boolean
          description: Per-post opt-out of automatic internal tag linking.
    BlogPostSummary:
      type: object
      description: |
        What the LIST endpoint returns by default — deliberately not a `BlogPost`.

        It exists as its own schema because the list used to be documented as returning `BlogPost`, and it never did: no `contentJson`, `excerpt`, `metaDescription`, `canonicalUrl`, or `translationGroupId`. A client that trusted the document read those as `undefined` and published a site with empty articles, with nothing failing. Ask for `?view=full` to get `BlogPost`.
      required:
        [
          id,
          tenantId,
          title,
          slug,
          status,
          visibility,
          locale,
          createdAt,
          updatedAt
        ]
      properties:
        id:
          type: string
          format: uuid
        tenantId:
          type: string
          format: uuid
        title:
          type: string
        slug:
          type: string
        status:
          type: string
          enum: [draft, review, scheduled, published, archived]
        visibility:
          type: string
          enum: [public, private, unlisted]
        locale:
          type: string
        publishedAt:
          type: string
          format: date-time
          nullable: true
        createdAt:
          type: string
          format: date-time
          description: Immutable — the only sort key this list can paginate over soundly.
        updatedAt:
          type: string
          format: date-time
    BlogPost:
      type: object
      required:
        [
          id,
          tenantId,
          title,
          slug,
          status,
          visibility,
          locale,
          createdAt,
          updatedAt,
          version
        ]
      properties:
        id:
          type: string
          format: uuid
        tenantId:
          type: string
          format: uuid
        authorTenantUserId:
          type: string
          format: uuid
        title:
          type: string
        slug:
          type: string
        excerpt:
          type: string
          nullable: true
        contentJson:
          $ref: "#/components/schemas/BlogContentJson"
        contentText:
          type: string
        status:
          type: string
          enum: [draft, review, scheduled, published, archived]
        visibility:
          type: string
          enum: [public, private, unlisted]
        featuredMediaId:
          type: string
          format: uuid
          nullable: true
        seoImageMediaId:
          type: string
          format: uuid
          nullable: true
        seoTitle:
          type: string
          nullable: true
        metaDescription:
          type: string
          nullable: true
        canonicalUrl:
          type: string
          nullable: true
        locale:
          type: string
        translationGroupId:
          type: string
          format: uuid
          nullable: true
        autoInternalTagLinksDisabled:
          type: boolean
        publishedAt:
          type: string
          format: date-time
          nullable: true
        scheduledAt:
          type: string
          format: date-time
          nullable: true
        unpublishAt:
          type: string
          format: date-time
          nullable: true
          description: Issue #591 — when the scheduled-publish job archives this post. Null = stays published until archived by hand.
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        version:
          type: integer
        termIds:
          type: array
          items:
            type: string
            format: uuid
    BlogPageWriteInput:
      type: object
