        title:
          type: string
        contentJson:
          $ref: "#/components/schemas/BlogContentJson"
        contentText:
          type: string
        excerpt:
          type: string
          nullable: true
        seoTitle:
          type: string
          nullable: true
        metaDescription:
          type: string
          nullable: true
        canonicalUrl:
          type: string
          nullable: true
        status:
          type: string
        changeNote:
          type: string
          nullable: true
        createdByTenantUserId:
          type: string
          format: uuid
        createdAt:
          type: string
          format: date-time
    BlogSettings:
      type: object
      properties:
        blogTitle:
          type: string
          nullable: true
        blogDescription:
          type: string
          nullable: true
        defaultLocale:
          type: string
        defaultVisibility:
          type: string
          enum: [public, private, unlisted]
        postsPerPage:
          type: integer
        seoDefaultTitle:
          type: string
          nullable: true
        seoDefaultDescription:
          type: string
          nullable: true
        rssEnabled:
          type: boolean
        sitemapEnabled:
          type: boolean
        contentQualityChecklistPolicy:
          type: object
        socialPreviewFallbackImageMediaId:
          type: string
          format: uuid
          nullable: true
        socialPreviewContentImageFallbackEnabled:
          type: boolean
    BlogMenuItem:
      type: object
      required: [id, label, linkType, sortOrder]
      properties:
        id:
          type: string
          format: uuid
        parentItemId:
          type: string
          format: uuid
          nullable: true
        label:
          type: string
        linkType:
          type: string
          enum: [post, page, url]
        targetId:
          type: string
          format: uuid
          nullable: true
        url:
          type: string
          nullable: true
        sortOrder:
          type: integer
    BlogContentBlock:
      description: |
        One block of `content_json`. The vocabulary is closed: a value outside
        the six variants below is not stored and not rendered.

        This schema exists because the vocabulary previously lived only in a
        TypeScript type and one prose sentence, so every consumer re-derived it
        by reading. One did, and disagreed with it in three ways at once —
        silently, because a wrong block type raises no error anywhere. It
        renders wrongly, or the section disappears.

        Held to `blog-content/domain/content-block-rendering.ts`'s
        `CONTENT_BLOCK_TYPES` by `tests/content-block-contract.test.ts`, which
        also holds that constant to the renderer's own switch.

        Note two shapes that are easy to guess wrong:
          - Ordering is a FIELD on `list` (`ordered: true`), not a separate
            `ordered_list` type.
          - `gallery` and `video_news` carry NO `text` field. A renderer that
            falls back to "render `text` as a paragraph" drops them entirely.
      oneOf:
        - type: object
          required: [type, text]
          properties:
            type:
              type: string
              enum: [paragraph]
            text:
              type: string
        - type: object
          required: [type, level, text]
          properties:
            type:
              type: string
              enum: [heading]
            level:
              type: integer
              minimum: 1
              maximum: 6
            text:
              type: string
        - type: object
          required: [type, items]
          properties:
            type:
              type: string
              enum: [list]
            ordered:
              description: Absent or false means an unordered list. There is no separate `ordered_list` type.
              type: boolean
            items:
              type: array
              items:
                type: string
        - type: object
          required: [type, text]
          properties:
            type:
              type: string
              enum: [quote]
            text:
              type: string
        - type: object
          required: [type, items]
          properties:
            type:
              type: string
              enum: [gallery]
            items:
              type: array
              items:
                type: object
                required: [mediaType]
                properties:
                  mediaType:
                    type: string
                    enum: [image, video]
                  url:
                    description: Direct absolute URL. Legacy shape — absent when the item uses `mediaObjectId`.
                    type: string
                  mediaObjectId:
                    description: Verified media registry object id. Resolving it to a URL requires a media lookup; a consumer that cannot perform one must show a placeholder rather than dropping the item.
                    type: string
                    format: uuid
                  caption:
                    type: string
        - type: object
          required: [type, provider, videoId]
          properties:
            type:
              type: string
              enum: [video_news]
            provider:
              description: Allowlisted provider. Only `youtube` is recognised today; an unknown provider must not be turned into a URL by guesswork.
              type: string
            videoId:
              description: Provider video id, validated server-side against the provider's own id shape before storage.
              type: string
            title:
              type: string
            caption:
              type: string
            thumbnailMediaObjectId:
              type: string
              format: uuid
            durationSeconds:
              type: integer
            sourceLabel:
              type: string
    BlogContentJson:
      description: "Structured post/page body. `{ blocks: BlogContentBlock[] }` — never raw HTML, by construction: there is no block variant that carries markup."
      type: object
      properties:
        blocks:
          type: array
          items:
            $ref: "#/components/schemas/BlogContentBlock"
    BlogAdPlacement:
      type: object
      required: [placementType]
      properties:
        placementType:
          type: string
          enum: [global, widget, post, page]
        targetId:
          type: string
          format: uuid
          nullable: true
    BlogInternalTagLinkSettings:
      type: object
      required: [enabled, caseInsensitive, disabledTagIds]
      properties:
        enabled:
          type: boolean
        caseInsensitive:
          type: boolean
        disabledTagIds:
          type: array
          items:
            type: string
            format: uuid
    ContentQualityChecklistResult:
      type: object
      required: [applicable, passed, blockers]
      description: "notApplicableChecklistResult() when full-online R2-only mode is not active for the tenant (applicable=false, passed=true, blockers=[]) — otherwise a full evaluation."
      properties:
        applicable:
          type: boolean
        passed:
          type: boolean
        blockers:
          type: array
          items:
            type: object
            required: [ruleId, message]
            properties:
              ruleId:
                type: string
              message:
                type: string
        warnings:
          type: array
          items:
            type: object
    HomepageSectionConfig:
      description: "Shape depends on sectionType — headline: {postId}; latest_posts: {limit?, categorySlug?}; featured_posts/editor_picks: {postIds: []}; category_grid: {categorySlugs: [], postsPerCategory?}; gallery_block: {mediaObjectIds: [], caption?}. Validated server-side per sectionType; every id/slug must already exist for the same tenant, and gallery_block's mediaObjectIds must each be a verified R2 media object."
      type: object
      additionalProperties: true
    HomepageSectionCreateRequest:
      type: object
      required:
        - sectionKey
        - sectionType
        - config
      properties:
        sectionKey:
          type: string
          pattern: ^[a-z0-9][a-z0-9_-]{0,63}$
        sectionType:
          type: string
          enum:
            - headline
            - latest_posts
            - featured_posts
            - editor_picks
            - category_grid
            - gallery_block
        title:
          type: string
          nullable: true
        config:
          $ref: "#/components/schemas/HomepageSectionConfig"
        sortOrder:
          type: integer
        isEnabled:
          type: boolean
        startsAt:
          type: string
          format: date-time
          nullable: true
        endsAt:
          type: string
          format: date-time
          nullable: true
    HomepageSectionItem:
      type: object
      required:
        - id
        - tenantId
        - sectionKey
        - sectionType
        - config
