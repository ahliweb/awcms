          type: string
          format: date-time
    BlogSettings:
      type: object
      properties:
        blogTitle:
          type: string
          nullable: true
        blogDescription:
          type: string
          nullable: true
        defaultLocale:
          type: string
        defaultVisibility:
          type: string
          enum: [public, private, unlisted]
        postsPerPage:
          type: integer
        seoDefaultTitle:
          type: string
          nullable: true
        seoDefaultDescription:
          type: string
          nullable: true
        rssEnabled:
          type: boolean
        sitemapEnabled:
          type: boolean
