components:
  schemas:
    BlogPostWriteInput:
      type: object
      description: Shared shape for POST /api/v1/blog/posts (all fields required) and PATCH /api/v1/blog/posts/{id} (all fields optional, only present fields change).
      properties:
        title:
          type: string
        slug:
          type: string
        excerpt:
          type: string
          nullable: true
        contentJson:
          $ref: "#/components/schemas/BlogContentJson"
          description: >-
            ADR-0100 — the non-body ENVELOPE, optional on write. Its blocks key
            is overwritten with the derived projection; other keys (notably
            awcmsAstro) are preserved.
        bodyPortableText:
          $ref: "#/components/schemas/PortableTextBody"
        locale:
          type: string
        visibility:
          type: string
          enum: [public, private, unlisted]
        featuredMediaId:
          type: string
          format: uuid
          nullable: true
        seoImageMediaId:
          type: string
          format: uuid
          nullable: true
          description: Explicit "use this image for social/SEO preview" override — takes priority over featuredMediaId.
        seoTitle:
          type: string
          nullable: true
        metaDescription:
          type: string
          nullable: true
        canonicalUrl:
          type: string
          nullable: true
        termIds:
          type: array
          items:
            type: string
            format: uuid
        institutionIds:
          description: >-
            Issue #595 — the fourth classification dimension (sql/131).
            Institution is a TABLE rather than a taxonomy type because it
            carries a branch, a region code and its own landing SEO, but on
            this payload it is the same shape as `termIds`. Full-replace
            semantics: absent leaves the assignments alone, `[]` removes them.
          type: array
          items:
            type: string
            format: uuid
        translationGroupId:
          type: string
          format: uuid
          nullable: true
        autoInternalTagLinksDisabled:
          type: boolean
          description: Per-post opt-out of automatic internal tag linking.
    BlogPostSummary:
      type: object
      description: |
        What the LIST endpoint returns by default — deliberately not a `BlogPost`.

        It exists as its own schema because the list used to be documented as returning `BlogPost`, and it never did: no `contentJson`, `excerpt`, `metaDescription`, `canonicalUrl`, or `translationGroupId`. A client that trusted the document read those as `undefined` and published a site with empty articles, with nothing failing. Ask for `?view=full` to get `BlogPost`.
      required:
        [
          id,
          tenantId,
          title,
          slug,
          status,
          visibility,
          locale,
          createdAt,
          updatedAt
        ]
      properties:
        id:
          type: string
          format: uuid
        tenantId:
          type: string
          format: uuid
        title:
          type: string
        slug:
          type: string
        status:
          type: string
          enum: [draft, review, scheduled, published, archived]
        visibility:
          type: string
          enum: [public, private, unlisted]
        locale:
          type: string
        publishedAt:
          type: string
          format: date-time
          nullable: true
        createdAt:
          type: string
          format: date-time
          description: Immutable — the only sort key this list can paginate over soundly.
        updatedAt:
          type: string
          format: date-time
    BlogPost:
      type: object
      required:
        [
          id,
          tenantId,
          title,
          slug,
          status,
          visibility,
          locale,
          createdAt,
          updatedAt,
          version
        ]
      properties:
        id:
          type: string
          format: uuid
        tenantId:
          type: string
          format: uuid
        authorTenantUserId:
          type: string
          format: uuid
        title:
          type: string
        slug:
          type: string
        excerpt:
          type: string
          nullable: true
        contentJson:
          $ref: "#/components/schemas/BlogContentJson"
          description: >-
            ADR-0100 — the non-body ENVELOPE, optional on write. Its blocks key
            is overwritten with the derived projection; other keys (notably
            awcmsAstro) are preserved.
        contentText:
          type: string
          description: >-
            ADR-0100 — DERIVED from bodyPortableText. Still returned (it is what
            the full-text index is built from) but no longer accepted on write.
          readOnly: true
        bodyPortableText:
          $ref: "#/components/schemas/PortableTextBody"
        status:
          type: string
          enum: [draft, review, scheduled, published, archived]
        visibility:
          type: string
          enum: [public, private, unlisted]
        featuredMediaId:
          type: string
          format: uuid
          nullable: true
        seoImageMediaId:
          type: string
          format: uuid
          nullable: true
        seoTitle:
          type: string
          nullable: true
        metaDescription:
          type: string
          nullable: true
        canonicalUrl:
          type: string
          nullable: true
        locale:
          type: string
        translationGroupId:
          type: string
          format: uuid
          nullable: true
        autoInternalTagLinksDisabled:
          type: boolean
        publishedAt:
          type: string
          format: date-time
          nullable: true
        scheduledAt:
          type: string
          format: date-time
          nullable: true
        unpublishAt:
          type: string
          format: date-time
          nullable: true
          description: Issue #591 — when the scheduled-publish job archives this post. Null = stays published until archived by hand.
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        version:
          type: integer
        termIds:
          description: >-
            Category/tag/channel/topic assignments. Returned by
            `GET /api/v1/blog/posts/{id}`, by `PATCH` on the same path, and —
            since Issue #597 — by the `?view=full` traversal that a static site
            is built from. `[]` means the post has none; the field being ABSENT
            means the response shape does not carry it (the lifecycle actions),
            which is a different fact.
          type: array
          items:
            type: string
            format: uuid
        institutionIds:
          description: >-
            Issue #595 — the fourth classification dimension (sql/131).
            Institution is a TABLE rather than a taxonomy type because it
            carries a branch, a region code and its own landing SEO, but on
            this payload it is the same shape as `termIds`, and it is returned
            in the same places for the same reasons.
          type: array
          items:
            type: string
            format: uuid
        authorByline:
          description: >-
            ADR-0109 — the author's OPT-IN public byline, returned by the
            `?view=full` traversal a static site is built from.

            `null` is the normal state and means the article keeps the
            ORGANISATION-level attribution (ADR-0102): a consumer renders no
            individual name for it. It is deliberately NOT the author's internal
            display name — publishing an account name because somebody wrote an
            article is the PII surface Issue #649 refused to open — and it
            carries no id, URL or profile link, only the name.
          type: string
          nullable: true
          maxLength: 120
    BlogPageWriteInput:
      type: object
      description: Shared shape for POST /api/v1/blog/pages and PATCH /api/v1/blog/pages/{id} (all fields optional on update).
      properties:
        title:
          type: string
        slug:
          type: string
        excerpt:
          type: string
          nullable: true
        contentJson:
          $ref: "#/components/schemas/BlogContentJson"
          description: >-
            ADR-0100 — the non-body ENVELOPE, optional on write. Its blocks key
            is overwritten with the derived projection; other keys (notably
            awcmsAstro) are preserved.
        bodyPortableText:
          $ref: "#/components/schemas/PortableTextBody"
        locale:
          type: string
        visibility:
          type: string
          enum: [public, private, unlisted]
        featuredMediaId:
          type: string
          format: uuid
          nullable: true
        seoTitle:
          type: string
          nullable: true
        metaDescription:
          type: string
          nullable: true
        canonicalUrl:
          type: string
          nullable: true
        pageType:
          type: string
          enum: [standard, landing, legal, system]
        parentPageId:
          type: string
          format: uuid
          nullable: true
        menuOrder:
          type: integer
    BlogPage:
      type: object
      required:
        [
          id,
          tenantId,
          title,
          slug,
          status,
          visibility,
          pageType,
          locale,
          createdAt,
          updatedAt,
          version
        ]
      properties:
        id:
          type: string
          format: uuid
        tenantId:
          type: string
          format: uuid
        authorTenantUserId:
          type: string
          format: uuid
        title:
          type: string
        slug:
          type: string
        excerpt:
          type: string
          nullable: true
        contentJson:
          $ref: "#/components/schemas/BlogContentJson"
          description: >-
            ADR-0100 — the non-body ENVELOPE, optional on write. Its blocks key
            is overwritten with the derived projection; other keys (notably
            awcmsAstro) are preserved.
        contentText:
          type: string
          description: >-
            ADR-0100 — DERIVED from bodyPortableText. Still returned (it is what
            the full-text index is built from) but no longer accepted on write.
          readOnly: true
        bodyPortableText:
