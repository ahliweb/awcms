    BlogInstitution:
      type: object
      required: [id, tenantId, branch, name, slug]
      properties:
        id:
          type: string
          format: uuid
        tenantId:
          type: string
          format: uuid
        branch:
          type: string
          enum: [legislative, executive]
        name:
          type: string
        slug:
          type: string
        regionCode:
          type: string
          nullable: true
          description: >-
            Dotted idn_admin_regions code (62, 62.71, 62.71.01, 62.71.01.2001).
            Not a foreign key: that master is dataset-versioned and its ids change
            on every import, so the code is the only stable identifier across
            generations. A code no active dataset resolves degrades to "no region
            label" on render rather than failing the read.
        description:
          type: string
          nullable: true
        seoTitle:
          type: string
          nullable: true
        seoDescription:
          type: string
          nullable: true
    BlogInstitutionCreateInput:
      type: object
      required: [branch, name, slug]
      properties:
        branch:
          type: string
          enum: [legislative, executive]
        name:
          type: string
          maxLength: 150
        slug:
          type: string
          description: Lowercase alphanumeric segments separated by single hyphens.
        regionCode:
          type: string
          nullable: true
          pattern: '^[0-9]{2}(\.[0-9]{2}){0,2}(\.[0-9]{4})?$'
        description:
          type: string
          nullable: true
          maxLength: 500
        seoTitle:
          type: string
          nullable: true
          maxLength: 200
        seoDescription:
          type: string
          nullable: true
          maxLength: 320
    BlogInstitutionUpdateInput:
      type: object
      minProperties: 1
      properties:
        branch:
          type: string
          enum: [legislative, executive]
        name:
          type: string
          maxLength: 150
        slug:
          type: string
        regionCode:
          type: string
          nullable: true
          pattern: '^[0-9]{2}(\.[0-9]{2}){0,2}(\.[0-9]{4})?$'
        description:
          type: string
          nullable: true
          maxLength: 500
        seoTitle:
          type: string
