    PortableTextSpan:
      type: object
      required: [_type, _key, text]
      properties:
        _type:
          type: string
          enum: [span]
        _key:
          type: string
        text:
          type: string
          description: PLAIN text — never markup.
        marks:
          type: array
          items:
            type: string
          description: >-
            Decorator names (strong, em, code) and/or the _key of an annotation
            declared in this block's own markDefs. A mark naming neither is
            refused at write time as a dangling reference.
    PortableTextLinkAnnotation:
      type: object
      required: [_type, _key, href]
      properties:
        _type:
          type: string
          enum: [link]
        _key:
          type: string
        href:
          type: string
          maxLength: 2048
          description: >-
            Relative, or http/https/mailto/tel. Checked by URL parsing rather
            than a pattern, so java\nscript: and JaVaScRiPt: are refused too.
    PortableTextNode:
      type: object
      required: [_type, _key]
      description: >-
        One node of a CLOSED Portable Text vocabulary (ADR-0100). _type is one
        of block, gallery, videoNews — anything else is refused at write time,
        which is what keeps "there is no field where arbitrary markup could
        live" true.
      properties:
        _type:
          type: string
          enum: [block, gallery, videoNews]
        _key:
          type: string
        style:
          type: string
          enum: [normal, h1, h2, h3, h4, h5, h6, blockquote]
        listItem:
          type: string
          enum: [bullet, number]
        level:
          type: integer
          minimum: 1
          maximum: 6
        children:
          type: array
          items:
            $ref: "#/components/schemas/PortableTextSpan"
        markDefs:
          type: array
          items:
            $ref: "#/components/schemas/PortableTextLinkAnnotation"
        items:
          type: array
          description: Gallery items — present when _type is gallery.
          items:
            type: object
        provider:
          type: string
          description: Present when _type is videoNews.
        videoId:
          type: string
          description: Present when _type is videoNews.
    PortableTextBody:
      type: array
      maxItems: 2000
      description: >-
        ADR-0100 — the canonical article body. contentJson.blocks is a derived,
        LOSSY projection of this, written only so ahliweb/awcms-astro keeps
        rendering until it reads this field directly.
      items:
        $ref: "#/components/schemas/PortableTextNode"
    BlogInstitution:
      type: object
      required: [id, tenantId, branch, name, slug]
      properties:
        id:
          type: string
          format: uuid
        tenantId:
          type: string
          format: uuid
        branch:
          type: string
          enum: [legislative, executive]
        name:
          type: string
        slug:
          type: string
        regionCode:
          type: string
          nullable: true
          description: >-
            Dotted idn_admin_regions code (62, 62.71, 62.71.01, 62.71.01.2001).
            Not a foreign key: that master is dataset-versioned and its ids change
            on every import, so the code is the only stable identifier across
            generations. A code no active dataset resolves degrades to "no region
            label" on render rather than failing the read.
        description:
          type: string
          nullable: true
        seoTitle:
          type: string
          nullable: true
        seoDescription:
          type: string
          nullable: true
    BlogInstitutionCreateInput:
      type: object
      required: [branch, name, slug]
      properties:
        branch:
          type: string
          enum: [legislative, executive]
        name:
          type: string
          maxLength: 150
        slug:
          type: string
          description: Lowercase alphanumeric segments separated by single hyphens.
        regionCode:
          type: string
          nullable: true
          pattern: '^[0-9]{2}(\.[0-9]{2}){0,2}(\.[0-9]{4})?$'
        description:
          type: string
          nullable: true
          maxLength: 500
        seoTitle:
          type: string
          nullable: true
          maxLength: 200
        seoDescription:
          type: string
          nullable: true
          maxLength: 320
    BlogInstitutionUpdateInput:
      type: object
      minProperties: 1
      properties:
        branch:
          type: string
          enum: [legislative, executive]
        name:
          type: string
          maxLength: 150
        slug:
          type: string
        regionCode:
          type: string
          nullable: true
          pattern: '^[0-9]{2}(\.[0-9]{2}){0,2}(\.[0-9]{4})?$'
        description:
          type: string
          nullable: true
          maxLength: 500
        seoTitle:
          type: string
          nullable: true
          maxLength: 200
        seoDescription:
          type: string
          nullable: true
          maxLength: 320
