  /api/v1/blog/institutions/{id}/restore:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
    post:
      tags:
        - Blog Content
      operationId: blogRestoreInstitution
      summary: Restore a soft-deleted institution
      description: >-
        Gated by blog_content.institutions.restore. No Idempotency-Key is read: the
        statement only matches a currently soft-deleted row, so a replay writes no
        audit event and answers 404. Deleting released the slug, so 409 is returned
        when a live institution has taken it in the meantime.
      parameters:
        - $ref: "#/components/parameters/CorrelationId"
      responses:
        "200":
          description: Institution restored.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    enum: [true]
                  data:
                    $ref: "#/components/schemas/BlogInstitution"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: A live institution now holds this slug.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /api/v1/blog/institutions/{id}/purge:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
    post:
      tags:
        - Blog Content
      operationId: blogPurgeInstitution
      summary: Permanently remove a soft-deleted institution
      description: >-
        Gated by blog_content.institutions.purge. Requires a prior soft delete: the
        statement matches only a row whose deleted_at is set, so a live institution
        answers 404 rather than being destroyed. Deletes every
        awcms_blog_post_institutions link first, so the articles that named it lose
        this classification permanently. Idempotency-Key is REQUIRED — unlike
        restore, the effect cannot be safely replayed once the row is gone.
      parameters:
        - $ref: "#/components/parameters/CorrelationId"
      responses:
        "200":
          description: Institution purged.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    enum: [true]
                  data:
                    type: object
                    properties:
                      id:
                        type: string
                        format: uuid
                      status:
                        type: string
                        enum: [purged]
                      articleLinksRemoved:
                        type: integer
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: Idempotency-Key was already used with a different request.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
