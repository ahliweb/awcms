          format: date-time
          nullable: true
        targetType:
          description: Targeting scope (ADR-0044). Orthogonal to `placementKey`, which says WHERE on the page the ad sits — this says WHICH pages the slot is filled on. Rendering a page returns its own targeted ads UNIONED with every `global` ad for that slot.
