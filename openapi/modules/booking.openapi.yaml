                $ref: "#/components/schemas/ApiError"
  /api/v1/booking/blocks/{id}/release:
    post:
      operationId: bookingBlockRelease
      tags:
        - Booking
      summary: Release a block and return its nights to sale
      description: "Gated by `booking.blocks.release`. The block is locked and the database releases its allocation rows in the same statement, stamping the block's own release instant on them. Releasing an already released block returns it with `replayed: true` and writes nothing. The body is empty. Requires an Idempotency-Key; replaying it returns the stored response. Audited at info severity (`booking.block.released`). Publishes no domain event in v1."
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - $ref: "#/components/parameters/IdempotencyKey"
        - $ref: "#/components/parameters/CorrelationId"
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
      responses:
        "200":
          description: "The released block, or unchanged with `replayed: true` when it was already released."
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    enum:
                      - true
                  data:
                    allOf:
                      - $ref: "#/components/schemas/BookingBlockResult"
                      - type: object
                        properties:
                          releasedAllocations:
                            type: integer
                            description: Allocation rows released by THIS call (0 on a replay).
                  meta:
                    type: object
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          description: "BLOCK_NOT_FOUND (an unknown id and another tenant's id are the same answer)."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "409":
