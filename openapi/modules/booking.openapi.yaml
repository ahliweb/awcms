              schema:
                $ref: "#/components/schemas/ApiError"
        "422":
          description: "CONSTRAINT_VIOLATED."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
    delete:
      operationId: bookingResourceDelete
      tags:
        - Booking
      summary: "Soft-delete a resource"
      description: "Gated by `booking.resources.delete`. SOFT delete: reservations keep referencing the resource and nothing is removed. Refused with `409 RESOURCE_IN_USE` while a held, confirmed or checked-in reservation or an active block needs it (set `status` to `inactive` to stop selling instead). Deleting a deleted resource returns it with `replayed: true` and writes nothing. Requires an Idempotency-Key. Audited at warning severity (`booking.resource.deleted`)."
