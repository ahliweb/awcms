                  data:
                    type: object
                    required:
                      - offering
                      - replayed
                    properties:
                      offering:
                        $ref: "#/components/schemas/BookingOffering"
                      replayed:
                        type: boolean

                  meta:
                    type: object
        "400":
          description: "VALIDATION_ERROR or IDEMPOTENCY_REQUIRED."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          description: "CODE_TAKEN or IDEMPOTENCY_CONFLICT."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "422":
          description: "CONSTRAINT_VIOLATED."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /api/v1/booking/offerings/{id}:
    get:
      operationId: bookingOfferingGet
      tags:
        - Booking
      summary: "Read one service offering"
      description: "Gated by `booking.offerings.read`. A soft-deleted offering is returned (with `deletedAt`) only to a holder of `booking.offerings.restore`, anyone else gets the neutral 404. An unknown id and another tenant's id are the same `404 OFFERING_NOT_FOUND`."
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - $ref: "#/components/parameters/CorrelationId"
      responses:
        "200":
          description: "The offering."
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    enum:
                      - true
                  data:
                    type: object
                    properties:
                      offering:
                        $ref: "#/components/schemas/BookingOffering"

                  meta:
                    type: object
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          description: "OFFERING_NOT_FOUND."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
    patch:
      operationId: bookingOfferingPatch
      tags:
        - Booking
      summary: "Edit a service offering"
      description: "Gated by `booking.offerings.update`. `code` and `granularity` are fixed; the merged offering must still satisfy the shape of its granularity (`400 VALIDATION_ERROR` otherwise). Changes FUTURE bookings only: a reservation item keeps the snapshot it was made with. `409 OFFERING_DELETED` for a deleted offering. Requires an Idempotency-Key. Audited at info severity (`booking.offering.updated`)."
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - $ref: "#/components/parameters/IdempotencyKey"
        - $ref: "#/components/parameters/CorrelationId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BookingOfferingPatch"
      responses:
        "200":
          description: "The offering."
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    enum:
                      - true
                  data:
                    type: object
                    required:
                      - offering
                      - replayed
                    properties:
                      offering:
                        $ref: "#/components/schemas/BookingOffering"
                      replayed:
                        type: boolean

                  meta:
                    type: object
        "400":
          description: "VALIDATION_ERROR or IDEMPOTENCY_REQUIRED."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          description: "OFFERING_NOT_FOUND."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "409":
          description: "OFFERING_DELETED or IDEMPOTENCY_CONFLICT."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "422":
          description: "CONSTRAINT_VIOLATED."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
    delete:
      operationId: bookingOfferingDelete
      tags:
        - Booking
      summary: "Soft-delete a service offering"
      description: "Gated by `booking.offerings.delete`. SOFT delete; reservations keep their snapshot. Deleting a deleted offering returns it with `replayed: true`. Requires an Idempotency-Key. Audited at warning severity (`booking.offering.deleted`)."
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - $ref: "#/components/parameters/IdempotencyKey"
        - $ref: "#/components/parameters/CorrelationId"
      responses:
        "200":
          description: "The deleted offering."
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    enum:
                      - true
                  data:
                    type: object
                    required:
                      - offering
                      - replayed
                    properties:
                      offering:
                        $ref: "#/components/schemas/BookingOffering"
                      replayed:
                        type: boolean

                  meta:
                    type: object
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          description: "OFFERING_NOT_FOUND."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "409":
          description: "IDEMPOTENCY_CONFLICT."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /api/v1/booking/offerings/{id}/restore:
    post:
      operationId: bookingOfferingRestore
      tags:
        - Booking
      summary: "Restore a soft-deleted service offering"
      description: "Gated by `booking.offerings.restore`. Restoring a live offering returns it with `replayed: true`. The body is empty. Requires an Idempotency-Key. Audited at info severity (`booking.offering.restored`)."
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - $ref: "#/components/parameters/IdempotencyKey"
        - $ref: "#/components/parameters/CorrelationId"
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false

      responses:
        "200":
          description: "The restored offering."
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    enum:
                      - true
                  data:
                    type: object
                    required:
                      - offering
                      - replayed
                    properties:
                      offering:
                        $ref: "#/components/schemas/BookingOffering"
                      replayed:
                        type: boolean

                  meta:
                    type: object
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          description: "OFFERING_NOT_FOUND."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "409":
          description: "IDEMPOTENCY_CONFLICT."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /api/v1/booking/policy:
    get:
      operationId: bookingPolicyGet
      tags:
        - Booking
      summary: "Read the booking policy"
      description: "Gated by `booking.policy.read`. `policy` is what the tenant set (`null` where it did not, meaning the MODULE DEFAULT, not unlimited) and `effective` is what is in force. A tenant that never wrote a policy reads every field `null` and `updatedAt: null`."
      parameters:
        - $ref: "#/components/parameters/CorrelationId"
      responses:
        "200":
          description: "The policy."
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    enum:
                      - true
                  data:
                    $ref: "#/components/schemas/BookingPolicy"
                  meta:
                    type: object
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
    put:
      operationId: bookingPolicyPut
      tags:
        - Booking
      summary: "Replace the booking policy"
      description: "Gated by `booking.policy.configure` (HIGH-RISK: it bounds how much inventory one actor can hold and how far ahead anyone can book). REPLACES the whole policy: every field must be present and `null` selects the module default (hold caps default to 5 per customer and 500 per tenant). Ranges: hold seconds 60 to 86400 with `defaultHoldSeconds` at most `maxHoldSeconds`; hold caps at least 1; `minLeadSeconds` at least 0; `maxHorizonDays` 1 to 3650; `noShowGraceSeconds` 0 to 2592000; `defaultTimezone` an IANA name. Changes FUTURE holds and searches only. Requires an Idempotency-Key; replaying it returns the stored response. Audited at critical severity (`booking.policy.configured`) with the before and after values. No MFA step-up: ADR-0141 flags payroll permissions only."
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
        - $ref: "#/components/parameters/CorrelationId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BookingPolicyInput"
      responses:
        "200":
          description: "The policy now in force."
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    enum:
                      - true
                  data:
                    allOf:
                      - $ref: "#/components/schemas/BookingPolicy"
                      - type: object
                        properties:
                          replayed:
                            type: boolean

                  meta:
                    type: object
        "400":
          description: "VALIDATION_ERROR (a missing or out-of-range field) or IDEMPOTENCY_REQUIRED."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          description: "IDEMPOTENCY_CONFLICT."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "422":
          description: "CONSTRAINT_VIOLATED."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
components:
  schemas:
    BookingLocalWindow:
      type: object
      description: A local wall-clock window [from, to) in the schedule's zone; it never crosses midnight.
      required:
        - from
        - to
      properties:
        from:
          type: string
          example: "09:00"
        to:
          type: string
          description: HH:MM, or 24:00 for the end of the day.
          example: "17:00"
    BookingScheduleRules:
      type: object
      description: The closed rules schema. Only `weekly` is accepted; a weekday absent from it is closed.
      required:
        - weekly
      properties:
        weekly:
          type: object
          description: Weekday keys sun, mon, tue, wed, thu, fri, sat; at most 8 ascending, non-overlapping windows each.
          additionalProperties:
            type: array
            maxItems: 8
            items:
              $ref: "#/components/schemas/BookingLocalWindow"
    BookingScheduleInput:
      type: object
      required:
        - timezone
        - effectiveFrom
        - rules
      properties:
        resourceId:
          type: string
          format: uuid
          nullable: true
          description: Null (or absent) is the tenant default schedule.
        timezone:
          type: string
          description: An IANA zone name such as Asia/Pontianak; an offset or an abbreviation is refused.
        effectiveFrom:
          type: string
          format: date
        effectiveTo:
          type: string
          format: date
          nullable: true
          description: Exclusive end; null for open-ended.
        rules:
          $ref: "#/components/schemas/BookingScheduleRules"
    BookingSchedulePatch:
      type: object
      properties:
        effectiveTo:
          type: string
          format: date
          description: May only shorten the window.
        status:
          type: string
          enum:
            - inactive
    BookingSchedule:
      type: object
      properties:
        id:
          type: string
          format: uuid
        resourceId:
          type: string
          format: uuid
          nullable: true
        timezone:
          type: string
        effectiveFrom:
          type: string
          format: date
        effectiveTo:
          type: string
          format: date
          nullable: true
        rules:
          $ref: "#/components/schemas/BookingScheduleRules"
        status:
          type: string
          enum:
            - active
            - inactive
        createdAt:
          type: string
    BookingScheduleExceptionInput:
      type: object
      required:
        - localFrom
        - localTo
        - kind
      properties:
        scheduleId:
          type: string
          format: uuid
          nullable: true
        resourceId:
          type: string
          format: uuid
          nullable: true
        localFrom:
          type: string
          format: date
        localTo:
          type: string
          format: date
          description: Exclusive end; after localFrom, at most 366 days.
        kind:
          type: string
          enum:
            - closed
            - override_hours
        windows:
          type: array
          maxItems: 8
          description: Required for override_hours, forbidden for closed.
          items:
            $ref: "#/components/schemas/BookingLocalWindow"
        reasonCode:
          type: string
          nullable: true
          description: A short code, never free text.
    BookingScheduleException:
      type: object
      properties:
        id:
          type: string
          format: uuid
        scheduleId:
          type: string
          format: uuid
          nullable: true
        resourceId:
          type: string
          format: uuid
          nullable: true
        localFrom:
          type: string
          format: date
        localTo:
          type: string
          format: date
        kind:
          type: string
          enum:
            - closed
            - override_hours
        windows:
          type: array
          nullable: true
          items:
            $ref: "#/components/schemas/BookingLocalWindow"
        reasonCode:
          type: string
          nullable: true
        createdAt:
          type: string
    BookingSlotAvailability:
      type: object
      properties:
        mode:
          type: string
          enum:
            - slot
        resourceId:
          type: string
          format: uuid
        offeringId:
          type: string
          format: uuid
        timezone:
          type: string
        from:
          type: string
          format: date-time
        to:
          type: string
          format: date-time
        slots:
          type: array
          items:
            type: object
            properties:
              startsAt:
                type: string
                format: date-time
              endsAt:
                type: string
                format: date-time
              freeUnits:
                type: integer
        truncated:
          type: boolean
          description: True when more slots exist than `limit` returned.
        staffAvailability:
          type: string
          enum:
            - checked
            - unchecked
          description: |
            `checked` when the resource names the people who serve it
            (`required_staff_refs`) AND the workforce capability (`hr_workforce`)
            is on for the tenant: every slot listed has at least one such person
            working for the whole service interval and not already serving a live
            claim. `unchecked` otherwise (no staff constraint at all). The answer
            is advisory; a claim that finds no free person is refused
            `SLOT_UNAVAILABLE` with nothing allocated.
    BookingStayAvailability:
      type: object
      properties:
        mode:
          type: string
          enum:
            - stay
        resourceId:
          type: string
          format: uuid
        offeringId:
          type: string
          format: uuid
        timezone:
          type: string
        checkInDate:
          type: string
          format: date
        checkOutDate:
          type: string
          format: date
        available:
          type: boolean
        nights:
          type: integer
          nullable: true
          description: Date arithmetic (check-out minus check-in), never hours; null when the dates were invalid.
        arrivalAt:
          type: string
          format: date-time
          nullable: true
          description: Derived from the configured check-in time; display, lead time and horizon only, never occupancy.
        departureAt:
          type: string
          format: date-time
          nullable: true
        freeUnits:
          type: integer
          nullable: true
          description: Units free for every night (not booked, not blocked).
        reasons:
          type: array
          items:
            type: object
            properties:
              code:
                type: string
                enum:
                  - STAY_DATES_INVALID
                  - MIN_STAY_VIOLATION
                  - MAX_STAY_EXCEEDED
                  - LEAD_TIME_NOT_MET
                  - BEYOND_HORIZON
                  - OUTSIDE_SCHEDULE
                  - BLOCKED
                  - NO_UNIT_AVAILABLE
              overridable:
                type: boolean
              detail:
                type: string
    BookingReservationStay:
      type: object
      properties:
        checkInDate:
          type: string
          format: date
        checkOutDate:
          type: string
          format: date
        nights:
          type: integer
        timezone:
          type: string
    BookingReservationItem:
      type: object
      description: The immutable item snapshot (the offering as it was when booked).
      properties:
        lineNo:
          type: integer
        offeringId:
          type: string
          format: uuid
        offeringCode:
          type: string
        offeringName:
          type: string
        granularity:
          type: string
          enum:
            - time
            - stay
        startsAt:
          type: string
          format: date-time
        endsAt:
          type: string
          format: date-time
        quantity:
          type: integer
        stay:
          nullable: true
          allOf:
            - $ref: "#/components/schemas/BookingReservationStay"
    BookingReservation:
      type: object
      description: A reservation. There is no price, deposit, balance or payment state anywhere in this module, and the customer note is never returned here.
      properties:
        id:
          type: string
          format: uuid
        reservationNo:
          type: string
        lineageId:
          type: string
          format: uuid
        rescheduledFromId:
          type: string
          format: uuid
          nullable: true
        supersededById:
          type: string
          format: uuid
          nullable: true
        status:
          type: string
          enum:
            - held
            - confirmed
            - checked_in
            - completed
            - cancelled
            - rescheduled
            - no_show
            - expired
        partySize:
          type: integer
        startsAt:
          type: string
          format: date-time
        endsAt:
          type: string
          format: date-time
        holdExpiresAt:
          type: string
          format: date-time
          nullable: true
        source:
          type: string
        externalRefType:
          type: string
          nullable: true
        externalRef:
          type: string
          nullable: true
        externalCustomerRef:
          type: string
          nullable: true
          description: The commerce authority's opaque customer token; never a name or a contact.
        lateCancellation:
          type: boolean
        cancelReasonCode:
          type: string
          nullable: true
        statusChangedAt:
          type: string
          format: date-time
        createdAt:
          type: string
        resourceIds:
          type: array
          items:
            type: string
            format: uuid
        items:
          type: array
          items:
            $ref: "#/components/schemas/BookingReservationItem"
    BookingReservationEvent:
      type: object
      description: One row of the append-only transition history. `detail` holds closed keys (ids, instants, counts), never free text or personal data.
      properties:
        seq:
          type: integer
        kind:
          type: string
        fromStatus:
          type: string
          nullable: true
        toStatus:
          type: string
        actorUserId:
          type: string
          format: uuid
          nullable: true
        reasonCode:
          type: string
          nullable: true
        detail:
          type: object
          additionalProperties: true
        occurredAt:
          type: string
          format: date-time
    BookingReservationDetail:
      type: object
      properties:
        reservation:
          $ref: "#/components/schemas/BookingReservation"
        events:
          type: array
          items:
            $ref: "#/components/schemas/BookingReservationEvent"
    BookingReservationResult:
      type: object
      properties:
        reservation:
          $ref: "#/components/schemas/BookingReservation"
        replayed:
          type: boolean
          description: True when the reservation was already in the target state and nothing was written.
        previous:
          allOf:
            - $ref: "#/components/schemas/BookingReservation"
          description: A reschedule only - the superseded reservation, now `rescheduled`; `reservation` is its replacement.
        policyLifted:
          type: array
          description: A reschedule only - the policy rules `booking.reservations.override` lifted.
          items:
            type: string
            enum:
              - OUTSIDE_SCHEDULE
              - LEAD_TIME_VIOLATION
              - HORIZON_EXCEEDED
    BookingReservationCreated:
      type: object
      properties:
        reservation:
          $ref: "#/components/schemas/BookingReservation"
        replayed:
          type: boolean
        policyLifted:
          type: array
          description: The policy rules the override lifted for this call; empty when none needed lifting.
          items:
            type: string
            enum:
              - OUTSIDE_SCHEDULE
              - LEAD_TIME_VIOLATION
              - HORIZON_EXCEEDED
    BookingStayDates:
      type: object
      required:
        - checkInDate
        - checkOutDate
      additionalProperties: false
      properties:
        checkInDate:
          type: string
          format: date
          description: Local date in the resource's zone.
        checkOutDate:
          type: string
          format: date
          description: Exclusive; after `checkInDate`, at most 366 nights.
    BookingCreateReservationInput:
      type: object
      additionalProperties: false
      required:
        - offeringId
      description: Exactly one of `resourceId` or `poolId`, and exactly one of `startsAt` (a slot) or `stay` (a night range). A payment field is refused by name.
      properties:
        offeringId:
          type: string
          format: uuid
        resourceId:
          type: string
          format: uuid
        poolId:
          type: string
          format: uuid
        startsAt:
          type: string
          format: date-time
          description: RFC 3339 with an explicit offset or Z. Slot offerings only.
        stay:
          $ref: "#/components/schemas/BookingStayDates"
        partySize:
          type: integer
          minimum: 1
          maximum: 500
          default: 1
        quantity:
          type: integer
          minimum: 1
          maximum: 500
          default: 1
          description: Units claimed at once, all-or-none.
        holdSeconds:
          type: number
          description: Clamped to [60, max_hold_seconds].
        externalCustomerRef:
          type: string
          nullable: true
          description: The commerce authority's opaque customer token (no spaces, no '@'); null for a walk-in.
        externalRef:
          type: object
          nullable: true
          additionalProperties: false
          required:
            - type
            - id
          properties:
            type:
              type: string
            id:
              type: string
        source:
          type: string
        customerNote:
          type: string
          nullable: true
          maxLength: 500
          description: Free text; classified, never logged, audited or put in an event.
        overridePolicy:
          type: boolean
          default: false
          description: Lift opening hours, lead time and horizon. Needs `booking.reservations.override` in addition.
    BookingRescheduleInput:
      type: object
      additionalProperties: false
      properties:
        startsAt:
          type: string
          format: date-time
        stay:
          $ref: "#/components/schemas/BookingStayDates"
        resourceId:
          type: string
          format: uuid
        poolId:
          type: string
          format: uuid
        overridePolicy:
          type: boolean
          default: false
    BookingCancelInput:
      type: object
      additionalProperties: false
      properties:
        reasonCode:
          type: string
          nullable: true
          description: A short lowercase code, never free text.
    BookingSuppressedNumber:
      type: object
      description: A figure over a group of reservations; withheld (value null, suppressed true) when the group has fewer than five.
      required:
        - suppressed
        - value
      properties:
        suppressed:
          type: boolean
        value:
          type: number
          nullable: true
    BookingOccupancyDay:
      type: object
      required:
        - date
        - units
        - occupiedUnitNights
        - heldUnitNights
        - blockedUnitNights
        - occupancyRate
      properties:
        date:
          type: string
          format: date
        units:
          type: integer
        occupiedUnitNights:
          type: integer
        heldUnitNights:
          type: integer
          description: The hold pipeline for this night. Never part of occupiedUnitNights or occupancyRate (O8).
        blockedUnitNights:
          type: integer
        occupancyRate:
          type: number
          nullable: true
    BookingOccupancyReport:
      type: object
      required:
        - timezone
        - from
        - to
        - resources
        - truncated
      properties:
