# Source fragment for the "booking" module (Issue #938, ADR-0131, ADR-0135).
#
# Owns every path whose operations carry this module's OpenAPI tag, plus every
# components.schemas entry referenced ONLY by this module's operations.
#
# Time semantics (docs/awcms/booking.md section 2): every instant is RFC 3339
# with an explicit offset or Z (a request without one is a 400); every interval
# is half-open [start, end); a zone is an IANA name, never an offset or an
# abbreviation; a stay is a half-open local DATE interval and its nights are date
# arithmetic.
#
# NOT independently valid OpenAPI: $ref targets pointing at shared components
# only resolve after `bun run openapi:bundle` merges this file with the root
# fragment and every sibling module fragment. Edit this file, never the bundle.
paths:
  /api/v1/booking/availability:
    get:
      operationId: bookingAvailabilityGet
      tags:
        - Booking
      summary: Search availability
      description: "Gated by `booking.availability.read`. READ-ONLY: persists and claims nothing, and the answer may be stale when read (the allocator's exclusion constraints prevent a double booking). A SLOT resource is asked with `from` and `to` (RFC 3339 with an explicit offset or Z, half-open, at most 31 days) and answers the bookable slots, ascending, each with the number of free units; slots are bounded by `limit` (500 at most) and `truncated` says whether more exist. A STAY resource is asked with `checkInDate` and `checkOutDate` (local dates in the resource's zone, half-open; an instant is never accepted) and answers `available`, the night count (date arithmetic, never hours), the derived arrival and departure instants, and the reasons it is not available, each flagged `overridable` (lead time, horizon and a soft closure can be lifted by `booking.reservations.override`; a block or an allocation conflict never can). Lead time and horizon come from the offering, then the tenant policy, then the module default. Rate limited per principal (`429 RATE_LIMITED`, `Retry-After`). Tenant-scoped (withTenant + RLS FORCE)."
      parameters:
        - name: resourceId
          in: query
          required: true
          schema:
            type: string
            format: uuid
        - name: offeringId
          in: query
          required: true
          schema:
            type: string
            format: uuid
        - name: quantity
          in: query
          required: false
          description: Units one booking claims at once; default 1.
          schema:
            type: integer
            minimum: 1
            maximum: 500
        - name: from
          in: query
          required: false
          description: Slot resources. Start of the search window, RFC 3339 with an offset or Z.
          schema:
            type: string
            format: date-time
        - name: to
          in: query
          required: false
          description: Slot resources. Exclusive end of the search window; after `from`, at most 31 days later.
          schema:
            type: string
            format: date-time
        - name: limit
          in: query
          required: false
          description: Slot resources. Slots returned at most; default 100, at most 500.
          schema:
            type: integer
            minimum: 1
            maximum: 500
        - name: checkInDate
          in: query
          required: false
          description: Stay resources. Local check-in date YYYY-MM-DD in the resource's zone.
          schema:
            type: string
            format: date
        - name: checkOutDate
          in: query
          required: false
          description: Stay resources. Local check-out date, exclusive; after `checkInDate`, at most 366 nights.
          schema:
            type: string
            format: date
        - $ref: "#/components/parameters/CorrelationId"
      responses:
        "200":
          description: The slots of a slot resource, or the evaluation of a stay.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    enum:
                      - true
                  data:
                    oneOf:
                      - $ref: "#/components/schemas/BookingSlotAvailability"
                      - $ref: "#/components/schemas/BookingStayAvailability"
                  meta:
                    type: object
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          description: RESOURCE_NOT_FOUND (the resource or the offering is not in this tenant, is inactive or is deleted).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "409":
          description: BOOKING_MODE_MISMATCH (from/to sent for a stay resource or offering, or checkInDate/checkOutDate for a slot one).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "422":
          description: QUANTITY_EXCEEDS_UNITS.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "429":
          description: RATE_LIMITED.
          headers:
            Retry-After:
              schema:
                type: integer
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /api/v1/booking/schedules:
    get:
      operationId: bookingSchedulesList
      tags:
        - Booking
      summary: List schedules
      description: "Gated by `booking.schedules.read`. Newest first, keyset paginated (`cursor`). `resourceId` narrows to one resource's schedules; `activeOnly=true` hides deactivated windows. Tenant-scoped (withTenant + RLS FORCE)."
      parameters:
        - name: resourceId
          in: query
          required: false
          schema:
            type: string
            format: uuid
        - name: activeOnly
          in: query
          required: false
          schema:
            type: boolean
        - name: cursor
          in: query
          required: false
          schema:
            type: string
        - $ref: "#/components/parameters/CorrelationId"
      responses:
        "200":
          description: A page of schedules.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    enum:
                      - true
                  data:
                    type: object
                    properties:
                      schedules:
                        type: array
                        items:
                          $ref: "#/components/schemas/BookingSchedule"
                      nextCursor:
                        type: string
                        nullable: true
                  meta:
                    type: object
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
    post:
      operationId: bookingScheduleCreate
      tags:
        - Booking
      summary: Create a schedule window
      description: "Gated by `booking.schedules.create`. Weekly LOCAL windows in an IANA zone (an offset or an abbreviation is a 400). A new window SUPERSEDES rather than edits: it is `409 SCHEDULE_OVERLAP` against an active window of the same scope (one resource, or the tenant default) that overlaps its half-open `[effectiveFrom, effectiveTo)`. A schedule bound to a resource is written in that resource's zone (`409 SCHEDULE_TIMEZONE_MISMATCH`); a tenant-default schedule applies only to resources in its own zone. Changes FUTURE availability only; no reservation is touched. Audited."
      parameters:
        - $ref: "#/components/parameters/CorrelationId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BookingScheduleInput"
      responses:
        "201":
          description: The schedule.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    enum:
                      - true
                  data:
                    $ref: "#/components/schemas/BookingSchedule"
                  meta:
                    type: object
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          description: RESOURCE_NOT_FOUND.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "409":
          description: SCHEDULE_OVERLAP or SCHEDULE_TIMEZONE_MISMATCH.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /api/v1/booking/schedules/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
    get:
      operationId: bookingScheduleGet
      tags:
        - Booking
      summary: Read a schedule
      description: "Gated by `booking.schedules.read`. Tenant-scoped (withTenant + RLS FORCE)."
      parameters:
        - $ref: "#/components/parameters/CorrelationId"
      responses:
        "200":
          description: The schedule.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    enum:
                      - true
                  data:
                    $ref: "#/components/schemas/BookingSchedule"
                  meta:
                    type: object
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          description: RESOURCE_NOT_FOUND.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
    patch:
      operationId: bookingSchedulePatch
      tags:
        - Booking
      summary: Shorten a schedule window
      description: "Gated by `booking.schedules.update`. A window is superseded, not edited: the only change is a SHORTER `effectiveTo` (it can never be lengthened or reopened; create a new window instead) and `status: inactive`. `409 SCHEDULE_NOT_EDITABLE` otherwise. The database trigger holds the same rule for every writer. Audited."
      parameters:
        - $ref: "#/components/parameters/CorrelationId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BookingSchedulePatch"
      responses:
        "200":
          description: The schedule.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    enum:
                      - true
                  data:
                    $ref: "#/components/schemas/BookingSchedule"
                  meta:
                    type: object
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          description: RESOURCE_NOT_FOUND.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "409":
          description: SCHEDULE_NOT_EDITABLE.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
    delete:
      operationId: bookingScheduleDeactivate
      tags:
        - Booking
      summary: Deactivate a schedule
      description: "Gated by `booking.schedules.delete`. DEACTIVATES the window (it is never removed; a confirmed reservation does not depend on it). `409 SCHEDULE_NOT_EDITABLE` when it is already inactive. Audited."
      parameters:
        - $ref: "#/components/parameters/CorrelationId"
      responses:
        "200":
          description: The deactivated schedule.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    enum:
                      - true
                  data:
                    $ref: "#/components/schemas/BookingSchedule"
                  meta:
                    type: object
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          description: RESOURCE_NOT_FOUND.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "409":
          description: SCHEDULE_NOT_EDITABLE.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /api/v1/booking/schedule-exceptions:
    get:
      operationId: bookingScheduleExceptionsList
      tags:
        - Booking
      summary: List schedule exceptions
      description: "Gated by `booking.schedules.read`. Closures and override hours, newest first, keyset paginated (`cursor`). `scheduleId` and `resourceId` narrow the list. Tenant-scoped (withTenant + RLS FORCE)."
      parameters:
        - name: scheduleId
          in: query
          required: false
          schema:
            type: string
            format: uuid
        - name: resourceId
          in: query
          required: false
          schema:
            type: string
            format: uuid
        - name: cursor
          in: query
          required: false
          schema:
            type: string
        - $ref: "#/components/parameters/CorrelationId"
      responses:
        "200":
          description: A page of exceptions.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    enum:
                      - true
                  data:
                    type: object
                    properties:
                      exceptions:
                        type: array
                        items:
                          $ref: "#/components/schemas/BookingScheduleException"
                      nextCursor:
                        type: string
                        nullable: true
                  meta:
                    type: object
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
    post:
      operationId: bookingScheduleExceptionCreate
      tags:
        - Booking
      summary: Create a schedule exception
      description: "Gated by `booking.schedules.create`. A `closed` day range or replacement `override_hours` over a half-open range of LOCAL dates in the schedule's zone (at most 366 days), owned by exactly one of a schedule or a resource. The reason is a short code, never free text. A closure beats an override on the same date; an override only modifies a date a schedule covers. For a stay resource only `closed` applies, as a SOFT closure. Changes FUTURE availability only and never touches an existing reservation. An identical exception is `409 EXCEPTION_DUPLICATE`. Audited."
      parameters:
        - $ref: "#/components/parameters/CorrelationId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BookingScheduleExceptionInput"
      responses:
        "201":
          description: The exception.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    enum:
                      - true
                  data:
                    $ref: "#/components/schemas/BookingScheduleException"
                  meta:
                    type: object
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          description: RESOURCE_NOT_FOUND (the schedule or the resource).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "409":
          description: EXCEPTION_DUPLICATE (an identical exception of the same owner, kind and range exists).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /api/v1/booking/schedule-exceptions/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
    delete:
      operationId: bookingScheduleExceptionDelete
      tags:
        - Booking
      summary: Delete a schedule exception
      description: "Gated by `booking.schedules.delete`. Deletes one exception (configuration with no history value). Audited."
      parameters:
        - $ref: "#/components/parameters/CorrelationId"
      responses:
        "200":
          description: Deleted.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    enum:
                      - true
                  data:
                    type: object
                    properties:
                      id:
                        type: string
                        format: uuid
                      deleted:
                        type: boolean
                  meta:
                    type: object
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          description: RESOURCE_NOT_FOUND.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /api/v1/booking/reservations:
    get:
      operationId: bookingReservationsList
      tags:
        - Booking
      summary: List reservations
      description: "Gated by `booking.reservations.read`. Newest first, keyset paginated (`cursor`). Filters: `status`, `lineageId` (every reservation of one booking across reschedules) and the adapter's natural key (`externalRefType` with `externalRef`, both or neither). The customer note is never returned (it is behind `booking.reservation_notes.read`). Tenant-scoped (withTenant + RLS FORCE)."
      parameters:
        - name: status
          in: query
          required: false
          schema:
            type: string
            enum:
              - held
              - confirmed
              - checked_in
              - completed
              - cancelled
              - rescheduled
              - no_show
              - expired
        - name: lineageId
          in: query
          required: false
          schema:
            type: string
            format: uuid
        - name: externalRefType
          in: query
          required: false
          schema:
            type: string
        - name: externalRef
          in: query
          required: false
          schema:
            type: string
        - name: cursor
          in: query
          required: false
          schema:
            type: string
        - $ref: "#/components/parameters/CorrelationId"
      responses:
        "200":
          description: A page of reservations.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    enum:
                      - true
                  data:
                    type: object
                    properties:
                      reservations:
                        type: array
                        items:
                          $ref: "#/components/schemas/BookingReservation"
                      nextCursor:
                        type: string
                        nullable: true
                  meta:
                    type: object
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
    post:
      operationId: bookingReservationCreate
      tags:
        - Booking
      summary: Place a hold or create a reservation
      description: "Gated by `booking.reservations.create`. Places a HOLD (`held`, expiring on the database clock; `holdSeconds` is clamped to `[60, max_hold_seconds]`) or, when the offering confirms immediately, a `confirmed` reservation. The claim is won all-or-none under the database's exclusion constraints: a taken slot or night is `409 SLOT_UNAVAILABLE` and leaves nothing behind. The server owns the status, the interval (derived from the offering and `startsAt`, or from the `stay` dates in the resource's zone), the buffers and the expiry; a client never sends them. A body that names a payment field (`paid`, `deposit`, `amount`, `balance`, ...) is `400 PAYMENT_FIELD_NOT_ACCEPTED` naming the field, and any other unknown key is a `400 VALIDATION_ERROR`. Holds are capped per customer and per tenant (defaults 5 and 500, tenant-configurable; `429 HOLD_LIMIT_EXCEEDED`). Opening hours (`409 OUTSIDE_SCHEDULE`), lead time (`409 LEAD_TIME_VIOLATION`) and horizon (`409 HORIZON_EXCEEDED`) are refused unless `overridePolicy` is true AND the caller also holds the HIGH-RISK `booking.reservations.override`, checked first through the access chokepoint (action-time separation of duties applies), audited `critical`; an override never lifts a conflict. Requires an Idempotency-Key: replaying it returns the stored response and writes nothing; a fresh key against a live `externalRef` is `409 EXTERNAL_REF_IN_USE`. Audited; publishes `awcms.booking.reservation.created` and `.held` or `.confirmed` in the same transaction. Rejected requests write nothing."
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
        - $ref: "#/components/parameters/CorrelationId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BookingCreateReservationInput"
      responses:
        "201":
          description: "The reservation."
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    enum:
                      - true
                  data:
                    $ref: "#/components/schemas/BookingReservationCreated"
                  meta:
                    type: object
        "400":
          description: VALIDATION_ERROR, PAYMENT_FIELD_NOT_ACCEPTED, STAY_DATES_INVALID or IDEMPOTENCY_REQUIRED.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          description: "RESOURCE_NOT_FOUND or OFFERING_NOT_FOUND (neutral: another tenant's id is the same answer as an unknown one)."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "409":
          description: "SLOT_UNAVAILABLE, OUTSIDE_SCHEDULE, LEAD_TIME_VIOLATION, HORIZON_EXCEEDED, PARTY_SIZE_OUT_OF_RANGE, BOOKING_MODE_MISMATCH, MIN_STAY_VIOLATION, MAX_STAY_EXCEEDED, STAY_POOL_INCONSISTENT, EXTERNAL_REF_IN_USE, CONTENTION_RETRY or IDEMPOTENCY_CONFLICT."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "422":
          description: "QUANTITY_EXCEEDS_UNITS."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "429":
          description: "HOLD_LIMIT_EXCEEDED."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /api/v1/booking/reservations/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
    get:
      operationId: bookingReservationGet
      tags:
        - Booking
      summary: Read a reservation
      description: "Gated by `booking.reservations.read`. The reservation with its items and its append-only transition history. The customer note is never returned (it is behind `booking.reservation_notes.read`). There is no ownership grant on this read: the customer is an opaque reference at the commerce authority, not a tenant user. An unknown id and another tenant's id are the same `404 RESERVATION_NOT_FOUND`. Tenant-scoped (withTenant + RLS FORCE)."
      parameters:
        - $ref: "#/components/parameters/CorrelationId"
      responses:
        "200":
          description: "The reservation and its history."
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    enum:
                      - true
                  data:
                    $ref: "#/components/schemas/BookingReservationDetail"
                  meta:
                    type: object
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          description: "RESERVATION_NOT_FOUND."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /api/v1/booking/reservations/{id}/confirm:
    post:
      operationId: bookingReservationConfirm
      tags:
        - Booking
      summary: Confirm a held reservation
      description: "Gated by `booking.reservations.confirm`. `held` -> `confirmed`; the hold expiry is cleared. Re-checks the hold has not expired under the reservation's row lock, on the DATABASE clock: an elapsed hold is `409 HOLD_EXPIRED` even when the sweep has not run, and so is one the sweep already expired. A confirm racing the sweep serialises on that lock and exactly one wins. Confirming a reservation that is already confirmed returns it with `replayed: true` and writes nothing, with any Idempotency-Key. Body: none (payment is the commerce layer's, which decides WHEN to ask for a confirm). Requires an Idempotency-Key; replaying it returns the stored response. Audited; publishes `awcms.booking.reservation.confirmed`."
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - $ref: "#/components/parameters/IdempotencyKey"
        - $ref: "#/components/parameters/CorrelationId"
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
      responses:
        "200":
          description: "The reservation after the transition, or unchanged with `replayed: true` when it was already in the target state."
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    enum:
                      - true
                  data:
                    $ref: "#/components/schemas/BookingReservationResult"
                  meta:
                    type: object
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          description: "RESERVATION_NOT_FOUND (an unknown id and another tenant's id are the same answer)."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "409":
          description: "HOLD_EXPIRED, INVALID_STATE or IDEMPOTENCY_CONFLICT."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /api/v1/booking/reservations/{id}/cancel:
    post:
      operationId: bookingReservationCancel
      tags:
        - Booking
      summary: Cancel a held or confirmed reservation
      description: "Gated by `booking.reservations.cancel`. `held` or `confirmed` -> `cancelled`, releasing every live allocation in the same transaction. `reasonCode` is an optional short code, never free text. A cancellation inside the offering's `cancellation_cutoff_seconds` of the start (the arrival instant for a stay) is recorded as `lateCancellation: true` on the reservation and the event; the module records the fact, any fee is the commerce layer's. Cancelling an already cancelled reservation returns it with `replayed: true` and writes nothing. Requires an Idempotency-Key; replaying it returns the stored response. Audited at warning severity; publishes `awcms.booking.reservation.cancelled`."
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - $ref: "#/components/parameters/IdempotencyKey"
        - $ref: "#/components/parameters/CorrelationId"
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BookingCancelInput"
      responses:
        "200":
          description: "The reservation after the transition, or unchanged with `replayed: true` when it was already in the target state."
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    enum:
                      - true
                  data:
                    $ref: "#/components/schemas/BookingReservationResult"
