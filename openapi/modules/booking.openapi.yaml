                    required:
                      - resource
                      - replayed
                    properties:
                      resource:
                        $ref: "#/components/schemas/BookingResource"
                      replayed:
                        type: boolean

                  meta:
                    type: object
        "400":
          description: "VALIDATION_ERROR, TIMEZONE_INVALID or IDEMPOTENCY_REQUIRED."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          description: "RESOURCE_NOT_FOUND, POOL_NOT_FOUND or UNIT_NOT_FOUND."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "409":
          description: "BOOKING_MODE_IN_USE, TIMEZONE_IN_USE, SCHEDULE_TIMEZONE_MISMATCH, CAPACITY_REDUCTION_NOT_ALLOWED, RESOURCE_DELETED, GUARD_REFUSED or IDEMPOTENCY_CONFLICT."
