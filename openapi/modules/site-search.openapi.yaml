# Source fragment for the "site_search" module (ADR-0040, ported from
# awcms-micro Issue #270; Gelombang-1 of docs/awcms/absorb-awcms-micro-roadmap.md).
#
# Owns every path whose operations carry this module's OpenAPI tag, plus every
# components.schemas entry referenced ONLY by this module's operations. Schemas
# shared by 2+ modules (or referenced by none) live in the root fragment
# (openapi/awcms-public-api.src.yaml) instead.
#
# Two operations are PUBLIC and anonymous by design (`security: []`, registered
# in ALLOWED_PUBLIC_OPERATIONS in scripts/api-spec-check.ts): the search and
# suggest endpoints resolve their tenant from the request HOST, never from a
# session or a client-supplied tenant header, and every non-serving outcome
# returns the same neutral empty payload. The public `/search` HTML page is an
# Astro route, not part of this REST contract.
#
# NOT independently valid OpenAPI: $ref targets pointing at shared components
# (securitySchemes/parameters/responses and cross-module schemas) only resolve
# after `bun run openapi:bundle` merges this file with the root fragment and
# every sibling module fragment into openapi/awcms-public-api.openapi.yaml.
# Edit this file (or the root fragment for shared components), never the
# generated bundle.
paths:
  /api/v1/site-search/query:
    get:
      operationId: siteSearchQuery
      tags:
        - Site Search
      security: []
      summary: Public full-text search over this site's published content (anonymous)
      description: >-
        PUBLIC, unauthenticated cross-content search. The tenant is resolved from
        the request host (never a session or a tenant header); results come from
        the tenant's search index, which contains PUBLISHED PUBLIC content only
        and is never an authorization source. The query text is always a bound
        parameter into `websearch_to_tsquery`, snippets are HTML-escaped before
        the `<mark>` highlights are inserted, and the endpoint is per-IP
        rate-limited, query-length-bounded (max 128 characters) and result-capped.
        An unresolved host, a disabled module, a search-disabled tenant, and a
        too-short query all return the SAME neutral empty payload — never a
        distinguishing error.
        A request carrying a cross-origin `Origin` resolves its tenant from THAT
        ORIGIN against the tenant-domain table — never from the host, and never
        through the host chain's default-tenant fallback (ADR-0107). It is
        answered with `Access-Control-Allow-Origin` only when the origin is an
        `active` domain of an `active` tenant; any other origin gets the same
        neutral empty payload with no grant header. There is no `OPTIONS`
        handler: a `GET` carrying only CORS-safelisted headers is a simple
        request, so a consumer must not add custom headers.
      parameters:
        - name: q
          in: query
          required: false
          description: Raw search text. Trimmed, whitespace-collapsed, and bounded before use.
          schema:
            type: string
            maxLength: 128
        - name: type
          in: query
          required: false
          description: >-
            Restrict results to one resource type. Honored only when the tenant's
            `enabledResourceTypes` admits it; otherwise silently ignored.
          schema:
            type: string
        - name: channel
          in: query
          required: false
          description: >-
            Term filter (Issue #633). One query parameter per facet name declared
            by the search-source registry — `channel`, `topic`, `institution`,
            `region` today. Filters are ANDed with each other and with `type`.
            The value is a slug or code (never a label), bounded to 200
            characters. An unknown facet name is IGNORED rather than rejected, so
            the tracking parameters that ride along on a shared link do not turn
            a search into a 400.
          schema:
            type: string
            maxLength: 200
        - name: topic
          in: query
          required: false
          description: See `channel`.
          schema:
            type: string
            maxLength: 200
        - name: institution
          in: query
          required: false
          description: See `channel`.
          schema:
            type: string
            maxLength: 200
        - name: region
          in: query
          required: false
          description: >-
            See `channel`. The value is a dotted `idn_admin_regions` code
            (`62`, `62.71`, `62.71.01`), because that is what an article stores.
          schema:
            type: string
            maxLength: 200
        - name: locale
          in: query
          required: false
          description: BCP-47-ish content locale. Malformed values fall back to the tenant default.
          schema:
            type: string
        - name: cursor
          in: query
          required: false
          description: Opaque keyset cursor from a previous response's `nextCursor`.
          schema:
            type: string
      responses:
        "200":
          description: Search results (possibly empty).
          headers:
            Access-Control-Allow-Origin:
              description: >-
                Present ONLY for a cross-origin request whose `Origin` is an
                active domain of an active tenant (ADR-0107). Echoed verbatim,
                never `*`. Absent for a same-origin request and for a refused
                origin — the absence IS the refusal.
              required: false
              schema:
                type: string
            Vary:
              description: >-
                Always `Origin`. The body is identical for a granted and a
                refused request; the headers are not, so a cache must key on it.
              required: false
              schema:
                type: string
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    enum: [true]
                  data:
                    $ref: "#/components/schemas/SiteSearchQueryResult"
        "429":
          description: Too many search requests from this source.
          headers:
            Vary:
              description: >-
                Always `Origin`. The limiter answers before the origin is
                classified, so this response never carries a grant — but it is
                still one of the answers this URL gives (ADR-0107).
              required: false
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /api/v1/site-search/suggest:
    get:
      operationId: siteSearchSuggest
      tags:
        - Site Search
      security: []
      summary: Public bounded title typeahead (anonymous)
      description: >-
        PUBLIC, unauthenticated trigram typeahead over indexed titles, tenant and
        locale scoped. Same host-based tenant resolution, per-IP rate limit, query
        bounds and neutral empty payload as the search endpoint. Returns at most
        the tenant's configured `suggestionLimit`; returns an empty list when the
        tenant has suggestions turned off.
        A request carrying a cross-origin `Origin` resolves its tenant from THAT
        ORIGIN against the tenant-domain table — never from the host, and never
        through the host chain's default-tenant fallback (ADR-0107). It is
        answered with `Access-Control-Allow-Origin` only when the origin is an
        `active` domain of an `active` tenant; any other origin gets the same
        neutral empty payload with no grant header. There is no `OPTIONS`
        handler: a `GET` carrying only CORS-safelisted headers is a simple
        request, so a consumer must not add custom headers.
      parameters:
        - name: q
          in: query
          required: false
          schema:
            type: string
            maxLength: 128
        - name: locale
          in: query
          required: false
          schema:
            type: string
      responses:
        "200":
          description: Title suggestions (possibly empty).
          headers:
            Access-Control-Allow-Origin:
              description: >-
                Present ONLY for a cross-origin request whose `Origin` is an
                active domain of an active tenant (ADR-0107). Echoed verbatim,
                never `*`. Absent for a same-origin request and for a refused
                origin — the absence IS the refusal.
              required: false
              schema:
                type: string
            Vary:
              description: >-
                Always `Origin`. The body is identical for a granted and a
                refused request; the headers are not, so a cache must key on it.
              required: false
              schema:
                type: string
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    enum: [true]
                  data:
                    $ref: "#/components/schemas/SiteSearchSuggestResult"
        "429":
          description: Too many suggestion requests from this source.
          headers:
            Vary:
              description: >-
                Always `Origin`. The limiter answers before the origin is
                classified, so this response never carries a grant — but it is
                still one of the answers this URL gives (ADR-0107).
              required: false
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /api/v1/site-search/settings:
    get:
      operationId: siteSearchSettingsRead
      tags:
        - Site Search
      summary: Read this tenant's search configuration
      description: >-
        Gated by `site_search.settings.read`. Returns the module defaults when the
        tenant has never written a config row. Tenant-scoped (withTenant + RLS
        FORCE).
      parameters:
        - $ref: "#/components/parameters/CorrelationId"
      responses:
        "200":
          description: Tenant search configuration.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    enum: [true]
                  data:
                    $ref: "#/components/schemas/SiteSearchSettings"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
    put:
      operationId: siteSearchSettingsUpdate
      tags:
        - Site Search
      summary: Replace this tenant's search configuration
      description: >-
        Gated by `site_search.settings.update`. Changes what the PUBLIC search
        surface returns (including the tenant-wide search on/off switch and the
        opt-in query-analytics switch), so it requires an Idempotency-Key and is
        audited. Merge semantics: omitted fields keep their current value; unknown
        keys are ignored.
      parameters:
        - name: Idempotency-Key
          in: header
          required: true
          schema:
            type: string
        - $ref: "#/components/parameters/CorrelationId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SiteSearchSettingsUpdateRequest"
      responses:
        "200":
          description: Saved tenant search configuration.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    enum: [true]
                  data:
                    $ref: "#/components/schemas/SiteSearchSettings"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          description: Idempotency-Key was already used with a different request.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "413":
          description: Request body exceeded the endpoint's size ceiling.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /api/v1/site-search/index/status:
    get:
      operationId: siteSearchIndexStatus
      tags:
        - Site Search
      summary: Read this tenant's search index status, freshness, and recent runs
      description: >-
        Gated by `site_search.index.read`. Bounded: document counts by resource
        type, the most recent index run, the open failed-item count, and the 10
        most recent runs.
      parameters:
        - $ref: "#/components/parameters/CorrelationId"
      responses:
        "200":
          description: Index status and recent runs.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    enum: [true]
                  data:
                    type: object
                    properties:
                      status:
                        $ref: "#/components/schemas/SiteSearchIndexStatus"
                      recentRuns:
                        type: array
                        items:
                          $ref: "#/components/schemas/SiteSearchIndexRun"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
  /api/v1/site-search/index/reconcile:
    post:
      operationId: siteSearchIndexReconcile
      tags:
        - Site Search
      summary: Run an idempotent search index reconciliation
      description: >-
        Gated by `site_search.index.reconcile`. Upserts the tenant's currently
        public documents (skipping any whose checksum already matches) and deletes
        index documents whose source row is gone or no longer public, so an
        archive/delete/unpublish never leaves a stale public result. Running it
        while already in sync is a no-op. Deliberately NOT classified high-risk (a
        fully regenerable projection sync), but still Idempotency-Key'd and
        audited.
      parameters:
        - name: Idempotency-Key
          in: header
          required: true
          schema:
            type: string
        - $ref: "#/components/parameters/CorrelationId"
      responses:
        "200":
          description: Reconcile run summary.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    enum: [true]
                  data:
                    $ref: "#/components/schemas/SiteSearchIndexRunResult"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          description: Idempotency-Key was already used with a different request.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /api/v1/site-search/index/rebuild:
    post:
      operationId: siteSearchIndexRebuild
      tags:
        - Site Search
      summary: Force a full search index rebuild
      description: >-
        Gated by `site_search.index.rebuild` — a HIGH-RISK action: it deletes
        every one of the tenant's index documents for the registered sources and
        re-extracts them. Idempotent (the end state is identical regardless of
        prior state), Idempotency-Key'd, and audited.
      parameters:
        - name: Idempotency-Key
          in: header
          required: true
          schema:
            type: string
        - $ref: "#/components/parameters/CorrelationId"
      responses:
        "200":
          description: Rebuild run summary.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    enum: [true]
                  data:
                    $ref: "#/components/schemas/SiteSearchIndexRunResult"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          description: Idempotency-Key was already used with a different request.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /api/v1/site-search/index/failures:
    get:
      operationId: siteSearchIndexFailures
      tags:
        - Site Search
      summary: Read the search index failed-item diagnostics
      description: >-
        Gated by `site_search.diagnostics.read`. Returns up to 100 unresolved
        failed items (aggregated per source/resource/locale) with a SANITIZED
        error class and detail — never a raw stack trace. Each reconcile clears
        its own source's prior failures, so this reflects the latest run.
      parameters:
        - $ref: "#/components/parameters/CorrelationId"
      responses:
        "200":
          description: Failed-item diagnostics.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    enum: [true]
                  data:
                    type: object
                    properties:
                      items:
                        type: array
                        items:
                          $ref: "#/components/schemas/SiteSearchIndexFailure"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
components:
  schemas:
    SiteSearchResultItem:
      type: object
      description: One public search hit. `url` is a server-built absolute PATH, never a source-supplied URL.
      properties:
        resourceType:
          type: string
        resourceId:
          type: string
        url:
          type: string
        title:
          type: string
        snippet:
          type: string
          description: >-
            Pre-escaped safe HTML. The whole `ts_headline` output is HTML-escaped
            FIRST and only then are the non-HTML sentinels replaced with
            `<mark>`/`</mark>`, so the only markup this can ever contain is those
            two tags.
        locale:
          type: string
        rank:
          type: number
      required:
        - resourceType
        - resourceId
        - url
        - title
        - snippet
        - locale
        - rank
    SiteSearchQueryResult:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/SiteSearchResultItem"
        nextCursor:
          type: string
          nullable: true
        facets:
          $ref: "#/components/schemas/SiteSearchFacets"
        query:
          type: string
          description: The NORMALIZED query actually executed (empty when nothing ran).
        locale:
          type: string
        reason:
          type: string
          enum:
            - empty
            - too_short
            - too_long
          description: Present only when the submitted query was rejected by the input bounds.
      required:
        - items
        - nextCursor
        - facets
        - query
        - locale
    SiteSearchFacets:
      type: object
      description: |
        Counts per facet value for the whole result set (Issue #607 for content type, #633 for terms), computed on every page — they describe the result set rather than the page, so omitting them after the first page would make them look like they had changed.

        A facet's OWN filter is never applied to its own count: a facet answers "what else is there", and applying it would zero every other value the moment a reader picks one, leaving no way back to results that still exist. Every OTHER filter is applied — so the `type` counts reflect the active term filters, and each term facet reflects `type` and the other term filters.

        Every remaining predicate is shared with the result query character for character, so a count can never advertise a document the reader cannot reach. Bounded to 20 values PER facet.
      properties:
        resourceTypes:
          type: array
          items:
            $ref: "#/components/schemas/SiteSearchFacetValue"
        terms:
          type: object
          description: |
            Term facets keyed by facet name — `channel`, `topic`, `institution`, `region`, and whatever a future module's search-source descriptor contributes. A facet with no matching documents is ABSENT rather than present-and-empty: the reader is being told what else is there, and an empty list is not something else.

            Filter by one with a query parameter of the same name (`?channel=politik`). Filters are ANDed. Match is on `value` (a slug or code), never `label` — a label is display text an editor may rewrite, and a filter that broke when somebody fixed a capital letter would be a filter nobody trusts.
          additionalProperties:
            type: array
            items:
              $ref: "#/components/schemas/SiteSearchTermFacetValue"
      required:
        - resourceTypes
        - terms
    SiteSearchTermFacetValue:
      type: object
      properties:
        value:
          type: string
          description: The stable value a filter matches and a URL carries — a slug (`politik`) or a code (`62.71`).
        label:
          type: string
          description: Display text for `value`. Falls back to the value itself where the source stored no separate label (the `region` facet, whose human name lives in a dataset-versioned table this does not join).
        count:
          type: integer
      required:
        - value
        - label
        - count
    SiteSearchFacetValue:
      type: object
      properties:
        value:
          type: string
          description: A `resourceType` as stored — `blog_post`, `blog_page`, and whatever a future module contributes.
        count:
          type: integer
      required:
        - value
        - count
    SiteSearchSuggestionItem:
      type: object
      properties:
        resourceType:
          type: string
        resourceId:
          type: string
        url:
          type: string
        title:
          type: string
        locale:
          type: string
      required:
        - resourceType
        - resourceId
        - url
        - title
        - locale
    SiteSearchSuggestResult:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/SiteSearchSuggestionItem"
        query:
          type: string
        locale:
          type: string
      required:
        - items
        - query
        - locale
    SiteSearchSettings:
      type: object
      properties:
        enabled:
          type: boolean
        enabledResourceTypes:
          type: array
          nullable: true
          description: "`null` means every admitted resource type."
          items:
            type: string
        resultLimit:
          type: integer
          minimum: 1
          maximum: 100
        minQueryLength:
          type: integer
          minimum: 1
          maximum: 20
        suggestionsEnabled:
          type: boolean
        suggestionLimit:
          type: integer
          minimum: 1
          maximum: 20
        analyticsEnabled:
          type: boolean
          description: >-
            Opt-in, minimized query logging. Even when on, only a sha256 of the
            normalized query, its length, the locale and the result count are
            stored — never the raw query.
      required:
        - enabled
        - enabledResourceTypes
        - resultLimit
        - minQueryLength
        - suggestionsEnabled
        - suggestionLimit
        - analyticsEnabled
    SiteSearchSettingsUpdateRequest:
      type: object
      description: Every field is optional — an omitted field keeps its current value.
      properties:
        enabled:
          type: boolean
        enabledResourceTypes:
          type: array
          nullable: true
          maxItems: 50
          items:
            type: string
            maxLength: 64
        resultLimit:
          type: integer
          minimum: 1
          maximum: 100
        minQueryLength:
          type: integer
          minimum: 1
          maximum: 20
        suggestionsEnabled:
          type: boolean
        suggestionLimit:
          type: integer
          minimum: 1
          maximum: 20
        analyticsEnabled:
          type: boolean
    SiteSearchIndexRun:
      type: object
      properties:
        id:
          type: string
          format: uuid
        runType:
          type: string
          enum:
            - rebuild
            - reconcile
            - reindex
        status:
          type: string
          enum:
            - running
            - succeeded
            - failed
        trigger:
          type: string
          enum:
            - manual
            - scheduled
        documentsIndexed:
          type: integer
        documentsUpdated:
          type: integer
        documentsRemoved:
          type: integer
        documentsUnchanged:
          type: integer
        sourcesProcessed:
          type: integer
        failureCount:
          type: integer
        lastError:
          type: string
          nullable: true
          description: Sanitized error summary only — never a raw stack trace.
        startedAt:
          type: string
          format: date-time
        finishedAt:
          type: string
          format: date-time
          nullable: true
      required:
        - id
        - runType
        - status
        - trigger
        - documentsIndexed
        - documentsUpdated
        - documentsRemoved
        - documentsUnchanged
        - sourcesProcessed
        - failureCount
        - lastError
        - startedAt
        - finishedAt
    SiteSearchIndexStatus:
      type: object
      properties:
        documentCount:
          type: integer
        byResourceType:
          type: array
          items:
            type: object
            properties:
              resourceType:
                type: string
              count:
                type: integer
            required:
              - resourceType
              - count
        latestIndexedAt:
          type: string
          format: date-time
          nullable: true
        lastRun:
          oneOf:
            - $ref: "#/components/schemas/SiteSearchIndexRun"
            - type: "null"
        openFailureCount:
          type: integer
      required:
        - documentCount
        - byResourceType
        - latestIndexedAt
        - lastRun
        - openFailureCount
    SiteSearchSourceResult:
      type: object
      description: Per-source outcome of one reconcile/rebuild pass.
      properties:
        sourceKey:
          type: string
        resourceType:
          type: string
        sourceCount:
          type: integer
          description: Currently public source rows — the "reconciliation matches source counts" signal.
        added:
          type: integer
        updated:
          type: integer
        unchanged:
          type: integer
        removed:
          type: integer
        failures:
          type: integer
      required:
        - sourceKey
        - resourceType
        - sourceCount
        - added
        - updated
        - unchanged
        - removed
        - failures
    SiteSearchIndexRunResult:
      type: object
      properties:
        runId:
          type: string
          format: uuid
        runType:
          type: string
          enum:
            - rebuild
            - reconcile
            - reindex
        status:
          type: string
          enum:
            - succeeded
            - failed
        totalIndexed:
          type: integer
        totalRemoved:
          type: integer
        failureCount:
          type: integer
        results:
          type: array
          items:
            $ref: "#/components/schemas/SiteSearchSourceResult"
      required:
        - runId
        - runType
        - status
        - totalIndexed
        - totalRemoved
        - failureCount
        - results
    SiteSearchIndexFailure:
      type: object
      properties:
        sourceKey:
          type: string
        resourceId:
          type: string
        locale:
          type: string
        errorClass:
          type: string
        errorDetail:
          type: string
          nullable: true
          description: Sanitized detail only.
        occurrenceCount:
          type: integer
        firstSeenAt:
          type: string
          format: date-time
        lastSeenAt:
          type: string
          format: date-time
      required:
        - sourceKey
        - resourceId
        - locale
        - errorClass
        - errorDetail
        - occurrenceCount
        - firstSeenAt
        - lastSeenAt
