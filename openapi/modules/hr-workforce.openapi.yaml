  /api/v1/hr-workforce/attendance-events:
    get:
      operationId: hrWorkforceAttendanceEventsList
      tags:
        - HR Workforce
      summary: List attendance events
      description: "Gated by `hr_workforce.attendance.read` (every employee), EXCEPT `mine=true` (your OWN events, across EVERY live employment of yours, a terminated one included: a rehired person reads the old and the new) and `reports=true` (the events of the people who report to you through the current manager chain, at most ten levels; a soft-deleted employment is neither listed nor walked through), which need no permission (an ownership grant on the persisted login link / manager chain, ADR-0063; ABAC, scope and SoD still apply, and a machine credential never carries it). `mine` and `reports` cannot be combined, and an `employmentId` outside the chosen basis is 403. Newest claimed instant first, keyset paginated (`cursor`); `from` (inclusive) and `to` (exclusive) bound the claimed instant; `effective=true` hides an event a later approved correction replaced. Confidential behavioural data: no location, photo, device or network value exists. Tenant-scoped (withTenant + RLS FORCE). In the ALL-employee mode AND in the manager-chain `reports` mode the read is recorded as a sensitive read (`sensitive_read.attendance_events`: employment ids and a count, coalesced, attribute `mode`, Issue #1083); only `mine` is not."
      parameters:
        - name: employmentId
          in: query
          required: false
          schema:
            type: string
            format: uuid
        - name: from
          in: query
          required: false
          schema:
            type: string
            format: date-time
        - name: to
          in: query
          required: false
          schema:
            type: string
            format: date-time
        - name: effective
          in: query
          required: false
          schema:
            type: boolean
        - name: mine
          in: query
          required: false
          schema:
            type: boolean
        - name: reports
          in: query
          required: false
          schema:
            type: boolean
        - name: cursor
          in: query
          required: false
          schema:
            type: string
        - $ref: "#/components/parameters/CorrelationId"
      responses:
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "200":
          description: A page of attendance events.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    enum:
                      - true
                  data:
                    type: object
                    properties:
                      events:
                        type: array
                        items:
                          $ref: "#/components/schemas/HrAttendanceEvent"
                      nextCursor:
                        type: string
                        nullable: true
                  meta:
                    type: object
    post:
      operationId: hrWorkforceAttendanceEventCreate
      tags:
        - HR Workforce
      summary: Record an attendance event
      description: "`source: self` records YOUR OWN event and needs `hr_workforce.clock.create` plus an employment linked to your login (anything else is 403 whether the employment exists or not); `supervisor`, `kiosk` and `import` record for another employment and need `hr_workforce.attendance.create`. The SERVER clock decides `recordedAt`; `occurredAt` is bounded by the tenant clock-skew setting: in the future -> 422 `ATTENDANCE_TIME_IN_FUTURE`; for `self`/`supervisor`, older than the skew -> 422 `ATTENDANCE_BACKDATED` (request a correction); a `kiosk`/`import` replay is accepted up to seven days old (older -> 422 `ATTENDANCE_TOO_OLD`) and flagged `late` past fifteen minutes. A replay of the same `clientEventKey` for the same employment returns the ORIGINAL with 200 (a different event under a used key is 409 `CLIENT_EVENT_KEY_CONFLICT`). The body has NO photo, device or network field and an unknown field is refused. The ONE optional position field is `positionSample` (Issue #970, ADR-0138): only a `self` clock_in / clock_out may carry it (any other source or kind -> 400), the server evaluates it IN THE REQUEST against the geofences of the event's office and DISCARDS it (no coordinate, raw accuracy, address or device value is ever stored, logged or audited), and the response carries `locationVerdict` (`inside`, `outside` or `not_provided`; `null` while the tenant's switch is off, the default, when the sample is ignored). A declined / absent / too-coarse / unacknowledged sample is `not_provided` and never blocks clocking. Requires an Idempotency-Key. Audited when recorded for somebody else: every `supervisor` event, and a `kiosk`/`import` event flagged `late` (ids, kind, source and claimed instant only; the actor is the recorder); a `self` event and a punctual kiosk/import tap are not (high volume: the event is the record). The seven-day replay window is NOT an approval path: it exists for offline queues, which is why the stale ones leave a trace."
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
        - $ref: "#/components/parameters/CorrelationId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/HrAttendanceEventInput"
      responses:
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "201":
          description: The recorded event.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    enum:
                      - true
                  data:
                    $ref: "#/components/schemas/HrAttendanceEventRecorded"
                  meta:
                    type: object
        "200":
          description: "A replay of an already-recorded clientEventKey: the original event."
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    enum:
                      - true
                  data:
                    $ref: "#/components/schemas/HrAttendanceEventRecorded"
                  meta:
                    type: object
        "409":
          description: IDEMPOTENCY_CONFLICT, CLIENT_EVENT_KEY_CONFLICT or EMPLOYMENT_TERMINATED.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "422":
          description: EMPLOYMENT_NOT_FOUND, OFFICE_NOT_FOUND, ATTENDANCE_TIME_IN_FUTURE, ATTENDANCE_BACKDATED or ATTENDANCE_TOO_OLD.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /api/v1/hr-workforce/attendance-corrections:
    get:
      operationId: hrWorkforceAttendanceCorrectionsList
      tags:
        - HR Workforce
      summary: List attendance corrections
      description: "Gated by `hr_workforce.corrections.read`, EXCEPT `mine=true` (the corrections of every live employment of yours, a terminated one included) and `reports=true` (your reports\u0027, through the manager chain), which need no permission (ownership grants, ADR-0063). Newest first, keyset paginated. The list NEVER carries the sensitive `reason`; read one correction for it. Tenant-scoped (withTenant + RLS FORCE)."
      parameters:
        - name: employmentId
          in: query
          required: false
          schema:
            type: string
            format: uuid
        - name: status
          in: query
          required: false
          schema:
            type: string
            enum:
              - pending
              - approved
              - rejected
              - withdrawn
        - name: mine
          in: query
          required: false
          schema:
            type: boolean
        - name: reports
          in: query
          required: false
          schema:
            type: boolean
        - name: cursor
          in: query
          required: false
          schema:
            type: string
        - $ref: "#/components/parameters/CorrelationId"
      responses:
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "200":
          description: A page of corrections (no reason).
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    enum:
                      - true
                  data:
                    type: object
                    properties:
                      corrections:
                        type: array
                        items:
                          $ref: "#/components/schemas/HrAttendanceCorrection"
                      nextCursor:
                        type: string
                        nullable: true
                  meta:
                    type: object
    post:
      operationId: hrWorkforceAttendanceCorrectionCreate
      tags:
        - HR Workforce
      summary: Request an attendance correction
      description: "Gated by `hr_workforce.corrections.create`; the employment must be YOURS unless you also hold `hr_workforce.attendance.create`. Proposes adding a missing event (`kind: add`) or replacing one (`kind: replace` + `targetEventId`) with a mandatory `reason`. It NEVER edits the original: on approval a NEW event is appended that supersedes the old one. Approval is REQUIRED and fail-closed: with no published workflow under the tenant\u0027s correction workflow key (or `workflow` disabled for the tenant) -> 409 `APPROVAL_WORKFLOW_NOT_CONFIGURED` and nothing is created. A `proposedOccurredAt` further in the future than the tenant clock-skew bound is refused with 422 `ATTENDANCE_TIME_IN_FUTURE` and nothing is created (the event guard would refuse it at approval and the correction would stay pending for good). The workflow instance is started with NO facts. The reason is sensitive: it is never written to an audit row, an event or the workflow store. Requires an Idempotency-Key. Audited without the reason."
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
        - $ref: "#/components/parameters/CorrelationId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/HrAttendanceCorrectionInput"
      responses:
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "201":
          description: The pending correction, with its reason (the requester may read it).
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    enum:
                      - true
                  data:
                    $ref: "#/components/schemas/HrAttendanceCorrection"
                  meta:
                    type: object
        "409":
          description: IDEMPOTENCY_CONFLICT, CORRECTION_ALREADY_PENDING, TARGET_EVENT_SUPERSEDED, APPROVAL_WORKFLOW_NOT_CONFIGURED or APPROVAL_WORKFLOW_MISCONFIGURED.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "422":
          description: EMPLOYMENT_NOT_FOUND, TARGET_EVENT_NOT_FOUND or ATTENDANCE_TIME_IN_FUTURE.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /api/v1/hr-workforce/attendance-corrections/{id}:
    get:
      operationId: hrWorkforceAttendanceCorrectionGet
      tags:
        - HR Workforce
      summary: Get an attendance correction
      description: "Gated by `hr_workforce.corrections.read`, EXCEPT for the REQUESTER, a workflow ASSIGNEE of its approval instance, the employee it is about and a supervisor above that employee (an ownership grant, ADR-0063). The sensitive `reason` is included only for the requester, an assignee, or a holder of `corrections.read`; a supervisor reading through the manager chain alone sees everything but the reason. A missing id and someone else\u0027s correction are both 403 to a caller without the permission."
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - $ref: "#/components/parameters/CorrelationId"
      responses:
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "200":
          description: The correction (reason only where permitted).
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    enum:
                      - true
                  data:
                    $ref: "#/components/schemas/HrAttendanceCorrection"
                  meta:
                    type: object
        "404":
          description: RESOURCE_NOT_FOUND.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /api/v1/hr-workforce/attendance-corrections/{id}/withdraw:
    post:
      operationId: hrWorkforceAttendanceCorrectionWithdraw
      tags:
        - HR Workforce
      summary: Withdraw a pending attendance correction
      description: "Gated by `hr_workforce.corrections.cancel` (high-risk). The REQUESTER only withdraws a still-pending correction (its approval instance is cancelled first); someone else\u0027s and a missing id answer alike (404). Requires an Idempotency-Key. Audited without the reason."
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - $ref: "#/components/parameters/IdempotencyKey"
        - $ref: "#/components/parameters/CorrelationId"
      responses:
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "200":
          description: The withdrawn correction.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    enum:
                      - true
                  data:
                    $ref: "#/components/schemas/HrAttendanceCorrection"
                  meta:
                    type: object
        "404":
          description: RESOURCE_NOT_FOUND.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "409":
          description: IDEMPOTENCY_CONFLICT, CORRECTION_NOT_PENDING or CORRECTION_ALREADY_DECIDED.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /api/v1/hr-workforce/attendance-corrections/{id}/settle:
    post:
      operationId: hrWorkforceAttendanceCorrectionSettle
      tags:
        - HR Workforce
      summary: Apply the approval workflow verdict to a correction
      description: "Gated by `hr_workforce.corrections.approve` (high-risk). The decision is made in `workflow_approval`; this materialises it: instance pending -> 409 `CORRECTION_STILL_PENDING`; approved -> the correction becomes `approved` and a NEW event superseding the old one is appended in the same transaction (the original is never edited); rejected / cancelled -> `rejected` / `withdrawn`. Normally this happens by itself: a domain-event consumer applies the verdict as soon as the workflow instance finishes, and this route is the manual fallback for a verdict it declined to apply. SEGREGATION OF DUTIES: the requester cannot settle their own APPROVED (or still pending) correction (the chokepoint\u0027s self-approval guard, 403); a `rejected` or `cancelled` verdict applies nothing, so the requester may close their own refused request; an approved instance with no human approving decision is 409 `CORRECTION_NO_APPROVER`; one the requester, or the employee the correction is about (the login linked when it was requested, and the one linked now), approved directly or as the delegator whose standing a delegate used, or that employee settling it, is 409 `CORRECTION_SELF_APPROVED`; the database refuses each of these too. Requires an Idempotency-Key. Audited (warning when approved) without the reason."
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - $ref: "#/components/parameters/IdempotencyKey"
        - $ref: "#/components/parameters/CorrelationId"
      responses:
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "200":
          description: The settled correction.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    enum:
                      - true
                  data:
                    $ref: "#/components/schemas/HrAttendanceCorrection"
                  meta:
                    type: object
        "404":
          description: RESOURCE_NOT_FOUND.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "409":
          description: IDEMPOTENCY_CONFLICT, CORRECTION_NOT_PENDING, CORRECTION_STILL_PENDING, CORRECTION_NO_APPROVER, CORRECTION_SELF_APPROVED, TARGET_EVENT_SUPERSEDED or CORRECTION_NOT_APPLICABLE.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /api/v1/hr-workforce/geolocation/settings:
    get:
      operationId: hrWorkforceGeolocationSettingsGet
      tags:
        - HR Workforce
      summary: Read the geolocation evidence settings
      description: "Gated by `hr_workforce.geolocation_evidence.configure` (not granted to the tenant owner by default, ADR-0138 section 3). The switch is FALSE for every tenant until an authorised person enables it. Responses are `no-store`."
      parameters:
        - $ref: "#/components/parameters/CorrelationId"
      responses:
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "200":
          description: The settings.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    enum:
                      - true
                  data:
                    $ref: "#/components/schemas/HrGeolocationSettings"
                  meta:
                    type: object
    put:
      operationId: hrWorkforceGeolocationSettingsSet
      tags:
        - HR Workforce
      summary: Switch geolocation attendance evidence on or off
      description: 'ENABLING needs `hr_workforce.geolocation_evidence.configure` (403 otherwise) and, in the resulting state, a DPIA reference + date (409 `GEOLOCATION_DPIA_REQUIRED`), a published notice (409 `GEOLOCATION_NOTICE_REQUIRED`) and at least one live geofence (409 `GEOLOCATION_GEOFENCE_REQUIRED`). DISABLING has no precondition, and a holder of `hr_workforce.settings.configure` may send a bare `{ "enabled": false }`; anything else needs the dedicated permission. An omitted field keeps its value; `null` clears `dpiaReference`, `dpiaRecordedOn` or `noticeId`. Requires an Idempotency-Key. Audited at CRITICAL severity when the switch flips (warning otherwise) with the before/after STATE and the actor, never a location. Pointing `noticeId` at a newer version re-requests every employee''s acknowledgement.'
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
        - $ref: "#/components/parameters/CorrelationId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/HrGeolocationSettingsInput"
      responses:
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
