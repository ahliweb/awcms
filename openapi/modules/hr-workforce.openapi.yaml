            - outside
            - not_provided
        distanceBand:
          type: string
          nullable: true
          enum:
            - within
            - lt_250m
            - lt_1km
            - gte_1km
            - null
        accuracyBand:
          type: string
          nullable: true
          enum:
            - lt_25m
            - lt_100m
            - lt_500m
