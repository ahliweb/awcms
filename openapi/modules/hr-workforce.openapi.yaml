                  success:
                    type: boolean
                    enum:
                      - true
                  data:
                    $ref: "#/components/schemas/HrShiftAssignment"
                  meta:
                    type: object
        "404":
          description: RESOURCE_NOT_FOUND.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "409":
          description: IDEMPOTENCY_CONFLICT, SHIFT_NOT_DRAFT or EMPLOYMENT_DELETED.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /api/v1/hr-workforce/shift-assignments/{id}/cancel:
    post:
      operationId: hrWorkforceShiftAssignmentCancel
      tags:
        - HR Workforce
      summary: Cancel a shift assignment
      description: "Gated by `hr_workforce.shifts.cancel` (high-risk). draft or published -> cancelled (terminal). The row stays; it stops counting for the overlap rule and for availability. Requires an Idempotency-Key. Audited at warning severity."
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - $ref: "#/components/parameters/IdempotencyKey"
        - $ref: "#/components/parameters/CorrelationId"
      responses:
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "200":
