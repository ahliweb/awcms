                  meta:
                    type: object
  /api/v1/hr-workforce/workforce-metrics/employees:
    get:
      operationId: hrWorkforceMetricsEmployeesList
      tags:
        - HR Workforce
      summary: Workforce facts per employee
      description: "Transparent attendance, hours, shift-coverage and productivity FACTS per employee over a UTC window (`from` inclusive, `to` exclusive, both required, at most 31 days). Gated by `hr_workforce.workforce_metrics.read` (HR: every employee), EXCEPT `mine=true` (your OWN employments) and `reports=true` (your DIRECT reports only, one level, and only from when the reporting line began; a soft-deleted, terminated or re-assigned report, or a terminated manager, drops out), which need no permission (an ownership grant on the persisted login link / current manager link, ADR-0063; ABAC, scope and SoD still apply, and a machine credential never carries it). `mine` and `reports` cannot be combined, and an `employmentId` outside the chosen basis is 403, the same as an id that does not exist. Malformed input from a caller entitled to nothing is 403, not 400. Keyset paginated by employment id (`cursor`, 50 per page). There is NO composite score, ranking or flag; every figure is a count, minutes, or a ratio defined in `docs/awcms/workforce-metrics.md`. Reads attendance events (effective record only) and published work shifts only; no photo, biometric, device, location or payroll data exists in or is read by this surface. Never cached. Tenant-scoped (withTenant + RLS FORCE). The all-employee mode and the `reports` mode (the manager chain can make a director with no HR permission a reader of everyone) are recorded as a sensitive read (`sensitive_read.workforce_metrics`: the employment ids, a count and the `mode`, never a figure; coalesced per actor in a five-minute window, Issue #1083). Only the employee's own (`mine`) read is not recorded."
      parameters:
        - name: from
          in: query
          required: true
          schema:
            type: string
            format: date-time
        - name: to
          in: query
          required: true
          schema:
            type: string
            format: date-time
        - name: employmentId
          in: query
          required: false
          schema:
            type: string
            format: uuid
        - name: mine
          in: query
          required: false
          schema:
            type: boolean
        - name: reports
          in: query
          required: false
          schema:
            type: boolean
        - name: cursor
          in: query
          required: false
          schema:
            type: string
            format: uuid
        - $ref: "#/components/parameters/CorrelationId"
      responses:
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "200":
          description: A page of per-employee workforce facts.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    enum:
                      - true
                  data:
                    type: object
                    properties:
                      contractVersion:
                        type: integer
                      window:
                        type: object
                        properties:
                          from:
                            type: string
                            format: date-time
                          to:
                            type: string
                            format: date-time
                      governance:
                        type: string
                      employees:
                        type: array
                        items:
                          type: object
                          properties:
                            employmentId:
                              type: string
                              format: uuid
                            employeeNo:
                              type: string
                            facts:
                              $ref: "#/components/schemas/HrWorkforceFacts"
                      nextCursor:
                        type: string
                        format: uuid
                        nullable: true
                  meta:
                    type: object
  /api/v1/hr-workforce/workforce-metrics/groups:
    get:
      operationId: hrWorkforceMetricsGroupsList
      tags:
        - HR Workforce
      summary: Workforce aggregates per office, small groups withheld
      description: "Per-OFFICE workforce aggregates (the office of each employee's current terms; `officeId: null` is no office assigned) over exactly ONE CLOSED UTC ISO week (`from` a Monday 00:00Z, `to` the next Monday); weeks are disjoint and never nest, so no two accepted windows can be subtracted to leave a slice. A calendar month, any other window, and a bucket that has not ended, is 400: free windows let two requests that differ by a tail slice isolate one person. Gated by `hr_workforce.workforce_metrics.analyze` (or `.read`); there is no ownership grant, an aggregate is not a person's own record. Returns NO individual row. A group with fewer than five CONTRIBUTING employees (at least four hours scheduled or worked in the bucket) is returned `suppressed: true` with no number at all; an employee under the four-hour floor is neither counted nor summed. A shown group reports only a contributor BAND (`5-9`, `10-19`, `20+`), never an exact count. There is deliberately no tenant-wide total, so a withheld group cannot be recovered by subtraction. Ratios are recomputed from the group sums, never averaged. 422 `WORKFORCE_METRICS_SCOPE_TOO_LARGE` when the tenant has more than 10000 employments (decided from a COUNT before any page is read). No composite score. Never cached. Tenant-scoped (withTenant + RLS FORCE). A suppressed group carries no `officeId` (Issue #1083, L2). The read is recorded as a sensitive read under the permission that actually granted it (`sensitive_read.workforce_metrics` for `.read`, `sensitive_read.workforce_metrics_aggregate` for `.analyze`; the group count and no ids). Residual: the offices that DO appear are the shown ones, so a caller who knows the tenant's offices by other means can infer by set difference which are withheld. Residual risk (documented, not enforced by an SoD rule): a caller who knows some members of a small group (as their supervisor through `?reports=true`, or because they can create or publish its shifts) can subtract them from a shown figure; do not combine `.analyze` with those over the same people (docs/awcms/workforce-metrics.md section 6)."
      parameters:
        - name: from
          in: query
          required: true
          schema:
            type: string
            format: date-time
        - name: to
          in: query
          required: true
          schema:
            type: string
            format: date-time
        - $ref: "#/components/parameters/CorrelationId"
      responses:
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "422":
          description: The tenant has too many employments for one aggregate request.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "200":
          description: Per-office aggregates; small groups withheld.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    enum:
                      - true
                  data:
                    type: object
                    properties:
                      contractVersion:
                        type: integer
                      window:
                        type: object
                        properties:
                          from:
                            type: string
                            format: date-time
                          to:
                            type: string
                            format: date-time
                          bucket:
                            type: string
                            enum:
                              - iso_week
                      governance:
                        type: string
                      suppression:
                        type: object
                        properties:
                          minContributors:
                            type: integer
                          minContributionMinutes:
                            type: integer
                      groups:
                        type: array
                        items:
                          $ref: "#/components/schemas/HrWorkforceGroupFigure"
                  meta:
                    type: object
  /api/v1/hr-workforce/me:
    get:
      operationId: hrWorkforceMeGet
      tags:
        - HR Workforce
      summary: The caller's own employment summary
      description: "Gated by `hr_workforce.self_service.read` (default-deny). Returns ONLY the employments linked to the caller's login (the persisted link, computed in the query; no parameter names another person) and whether anyone reports to them directly, so the employee and supervisor screens (Issue #952) know which employment a correction request is for and whether to offer the team view. No profile id, name or contact is returned. The permission is a screen gate: the data of the self-service reads stays bound to the login link and the manager chain through the ownership grants of the attendance, shift and metrics routes. Never cached. Tenant-scoped (withTenant + RLS FORCE)."
      parameters:
        - $ref: "#/components/parameters/CorrelationId"
      responses:
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "200":
          description: The caller's own employments and the supervisor flag.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    enum:
                      - true
                  data:
                    type: object
                    properties:
                      employments:
                        type: array
                        items:
                          type: object
                          properties:
                            id:
                              type: string
                              format: uuid
                            employeeNo:
                              type: string
                            hiredOn:
                              type: string
                              format: date
                            terminatedOn:
                              type: string
                              format: date
                              nullable: true
                            currentTerm:
                              type: object
                              nullable: true
                              properties:
                                officeId:
                                  type: string
                                  format: uuid
                                  nullable: true
                                jobTitle:
                                  type: string
                                  nullable: true
                                employmentType:
                                  type: string
                                status:
                                  type: string
                      hasDirectReports:
                        type: boolean
                  meta:
                    type: object
components:
  schemas:
    HrWorkforceFacts:
      type: object
      description: "The transparent business facts of one employment (or the sum of a group) over a window. Counts, minutes and ratios only; no score. Definitions: docs/awcms/workforce-metrics.md section 4."
      properties:
        scheduledShifts:
          type: integer
          description: Published, non-cancelled work shifts that have started inside the window.
        attendedShifts:
          type: integer
          description: Of those, shifts with a clock-in from two hours before the start until the end.
        missedShifts:
          type: integer
          description: Of those, shifts that have ended with no matching clock-in.
        lateArrivals:
          type: integer
          description: Attended shifts whose clock-in came more than five minutes after the start.
        scheduledMinutes:
          type: integer
          description: Planned minutes (length less planned break) of shifts that have ended.
        workedMinutes:
          type: integer
          description: Minutes between a clock-in and its clock-out, less breaks taken, for sessions whose clock-in is in the window.
        breakMinutes:
          type: integer
        incompleteSessions:
          type: integer
          description: Clock-ins with no plausible clock-out (over 24 hours); never counted as worked time.
        coverageRatio:
          type: number
          nullable: true
          description: attended / (attended + missed); null when no shift has settled.
        workedToScheduledRatio:
          type: number
          nullable: true
          description: worked / scheduled minutes; null when nothing was scheduled; may exceed 1. A fact, not a target.
    HrWorkforceGroupFigure:
      type: object
      description: "One office's aggregate. When `suppressed` is true the object carries NO figure (no facts, no contributor count) and NO `officeId`: the group is too small, and a caller holding only `.analyze` must not learn which offices exist or which are under the threshold (Issue #1083, L2). Suppressed groups are listed after the shown ones."
      properties:
        officeId:
          type: string
          format: uuid
          nullable: true
          description: Absent on a suppressed group.
        suppressed:
          type: boolean
        reason:
          type: string
          enum:
            - small_group
        contributorsBand:
          type: string
          enum:
            - 5-9
            - 10-19
            - 20+
          description: Present only when not suppressed. A band, never an exact count.
        facts:
          $ref: "#/components/schemas/HrWorkforceFacts"
    HrEmploymentTerm:
      type: object
      properties:
        id:
          type: string
          format: uuid
        officeId:
          type: string
          format: uuid
          nullable: true
        managerEmploymentId:
          type: string
          format: uuid
          nullable: true
        jobTitle:
          type: string
          nullable: true
        employmentType:
          type: string
          enum:
            - permanent
            - fixed_term
            - part_time
            - casual
        status:
          type: string
          enum:
            - active
            - on_leave
            - suspended
            - terminated
        effectiveFrom:
          type: string
          format: date
        effectiveTo:
          type: string
          format: date
          nullable: true
          description: Exclusive end; null for the current row.
    HrEmployment:
      type: object
      description:
        An employment. It REFERENCES a profile_identity party by `profileId`; the person's name and
        identifiers are read from profile_identity, never from here. `accountLinked` says whether a
        login is attached; the login's id is not returned.
      properties:
        id:
          type: string
          format: uuid
        profileId:
          type: string
          format: uuid
        employeeNo:
          type: string
        hiredOn:
          type: string
          format: date
        terminatedOn:
          type: string
          format: date
          nullable: true
        accountLinked:
          type: boolean
        createdAt:
          type: string
          format: date-time
        deletedAt:
          type: string
          format: date-time
          nullable: true
        currentTerm:
          nullable: true
          allOf:
            - $ref: "#/components/schemas/HrEmploymentTerm"
    HrTermsFields:
      type: object
      properties:
        officeId:
          type: string
          format: uuid
          nullable: true
        managerEmploymentId:
          type: string
          format: uuid
          nullable: true
        jobTitle:
          type: string
          minLength: 1
          maxLength: 120
          nullable: true
        employmentType:
          type: string
          enum:
            - permanent
            - fixed_term
            - part_time
            - casual
        status:
          type: string
          enum:
            - active
            - on_leave
            - suspended
            - terminated
    HrEmploymentInput:
      type: object
      additionalProperties: false
      required:
        - profileId
        - employeeNo
        - hiredOn
        - employmentType
        - status
      properties:
        profileId:
          type: string
          format: uuid
        employeeNo:
          type: string
          pattern: ^[A-Za-z0-9][A-Za-z0-9_./-]{0,63}$
        hiredOn:
          type: string
          format: date
        officeId:
          type: string
          format: uuid
          nullable: true
        managerEmploymentId:
          type: string
          format: uuid
          nullable: true
        jobTitle:
          type: string
          minLength: 1
          maxLength: 120
          nullable: true
        employmentType:
          type: string
          enum:
            - permanent
            - fixed_term
            - part_time
            - casual
        status:
          type: string
          description: A new employment cannot start terminated.
          enum:
            - active
            - on_leave
            - suspended
    HrTermsChangeInput:
      type: object
      additionalProperties: false
      required:
        - effectiveFrom
        - employmentType
        - status
      properties:
        effectiveFrom:
          type: string
          format: date
        officeId:
          type: string
          format: uuid
          nullable: true
        managerEmploymentId:
          type: string
          format: uuid
          nullable: true
        jobTitle:
          type: string
          minLength: 1
          maxLength: 120
          nullable: true
        employmentType:
          type: string
          enum:
            - permanent
            - fixed_term
            - part_time
            - casual
        status:
          type: string
          enum:
            - active
            - on_leave
            - suspended
            - terminated
    HrAccountInput:
      type: object
      additionalProperties: false
      required:
        - tenantUserId
      properties:
        tenantUserId:
          type: string
          format: uuid
          nullable: true
    HrReasonInput:
      type: object
      additionalProperties: false
      properties:
        reason:
          type: string
          minLength: 1
          maxLength: 500
    HrWorkforceSettings:
      type: object
      properties:
        clockSkewSeconds:
          type: integer
          minimum: 0
          maximum: 3600
        correctionWorkflowKey:
          type: string
    HrWorkforceSettingsInput:
      type: object
      additionalProperties: false
      properties:
        clockSkewSeconds:
          type: integer
          minimum: 0
          maximum: 3600
        correctionWorkflowKey:
          type: string
          pattern: ^[a-z][a-z0-9_.-]{0,99}$
    HrShiftTemplate:
      type: object
      description: A shift pattern. It names no person.
      properties:
        id:
          type: string
          format: uuid
        code:
          type: string
        name:
          type: string
        localStart:
          type: string
          description: Local wall-clock start, HH:MM (24 hours), in `timeZone`.
        durationMinutes:
          type: integer
          description: ELAPSED minutes; the end is the start plus this, whatever the wall clock does.
        breakOffsetMinutes:
          type: integer
          nullable: true
        breakMinutes:
          type: integer
          nullable: true
        timeZone:
          type: string
          description: IANA zone name.
        officeId:
          type: string
          format: uuid
          nullable: true
        createdAt:
          type: string
          format: date-time
        deletedAt:
          type: string
          format: date-time
          nullable: true
    HrShiftTemplateInput:
      type: object
      additionalProperties: false
      required:
        - code
        - name
        - localStart
        - durationMinutes
        - timeZone
      properties:
        code:
          type: string
          pattern: "^[A-Za-z0-9][A-Za-z0-9_.-]{0,31}$"
        name:
          type: string
          minLength: 1
          maxLength: 120
        localStart:
          type: string
          pattern: "^([01][0-9]|2[0-3]):[0-5][0-9]$"
        durationMinutes:
          type: integer
          minimum: 15
          maximum: 1440
        breakOffsetMinutes:
          type: integer
          minimum: 0
          maximum: 1439
        breakMinutes:
          type: integer
          minimum: 1
          maximum: 1440
        timeZone:
          type: string
        officeId:
          type: string
          format: uuid
    HrShiftTemplatePatch:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 120
        localStart:
          type: string
          pattern: "^([01][0-9]|2[0-3]):[0-5][0-9]$"
        durationMinutes:
          type: integer
          minimum: 15
          maximum: 1440
        breakOffsetMinutes:
          type: integer
          nullable: true
        breakMinutes:
          type: integer
          nullable: true
        timeZone:
          type: string
        officeId:
          type: string
          format: uuid
          nullable: true
    HrShiftAssignment:
      type: object
      description:
        One scheduled interval for one employment, in UTC and half-open `[startsAt, endsAt)`. It carries
        no name and no free text; time off has a coarse `timeOffKind` and never a reason.
      properties:
        id:
          type: string
          format: uuid
        employmentId:
          type: string
          format: uuid
        templateId:
          type: string
          format: uuid
          nullable: true
          description: Provenance only; the instants are authoritative and never recomputed.
        kind:
          type: string
          enum:
            - work
            - time_off
        timeOffKind:
          type: string
          nullable: true
          enum:
            - leave
            - holiday
            - other
        startsAt:
          type: string
          format: date-time
        endsAt:
          type: string
          format: date-time
        breakStartsAt:
          type: string
          format: date-time
          nullable: true
        breakEndsAt:
          type: string
          format: date-time
          nullable: true
        timeZone:
          type: string
          description: The IANA zone the interval was resolved in (a snapshot).
        officeId:
          type: string
          format: uuid
          nullable: true
        status:
          type: string
          enum:
            - draft
            - published
            - cancelled
        publishedAt:
          type: string
          format: date-time
          nullable: true
        cancelledAt:
          type: string
          format: date-time
          nullable: true
        createdAt:
          type: string
          format: date-time
    HrShiftAssignmentInput:
      type: object
      additionalProperties: false
      description:
        "Send EITHER `templateId` + `localDate` (work only) OR `startsAt` + `endsAt` + `timeZone`.
        Instants are whole-minute UTC ending in Z; a work shift is at most 24 hours, time off at most
        31 days; an optional single break must lie inside a work interval."
      required:
        - employmentId
        - kind
      properties:
        employmentId:
          type: string
          format: uuid
        kind:
          type: string
          enum:
            - work
            - time_off
        timeOffKind:
          type: string
          enum:
            - leave
            - holiday
            - other
        templateId:
          type: string
          format: uuid
        localDate:
          type: string
          format: date
        startsAt:
          type: string
          format: date-time
        endsAt:
          type: string
          format: date-time
        breakStartsAt:
          type: string
          format: date-time
        breakEndsAt:
          type: string
          format: date-time
        timeZone:
          type: string
        officeId:
          type: string
          format: uuid
    HrAttendanceEvent:
      type: object
      description:
        One attendance fact. Append-only; it is never edited or deleted. It carries no location, photo,
        device or network value (owner decision O6, ADR-0138).
      properties:
        id:
          type: string
          format: uuid
        employmentId:
          type: string
          format: uuid
        kind:
          type: string
          enum:
            - clock_in
            - clock_out
            - break_start
            - break_end
        occurredAt:
          type: string
          format: date-time
          description: The CLAIMED instant, bounded by the tenant clock-skew setting.
        recordedAt:
          type: string
          format: date-time
          description: The DATABASE clock at insert; a client can never supply it.
        source:
          type: string
          enum:
            - self
            - supervisor
            - kiosk
            - import
            - correction
        clientEventKey:
          type: string
        officeId:
          type: string
          format: uuid
          nullable: true
        supersedesEventId:
          type: string
          format: uuid
          nullable: true
        supersededByEventId:
          type: string
          format: uuid
          nullable: true
        correctionId:
          type: string
          format: uuid
          nullable: true
        late:
          type: boolean
          description: An offline kiosk/import replay whose claimed time was more than fifteen minutes old; set by the server.
    HrAttendanceEventRecorded:
      description: A recorded attendance event plus the verdict of its location evidence (ADR-0138).
      allOf:
        - $ref: "#/components/schemas/HrAttendanceEvent"
        - type: object
          properties:
            locationVerdict:
              type: string
              nullable: true
              enum:
                - inside
                - outside
                - not_provided
                - null
              description:
                Null while the tenant's geolocation switch is off (the default). Otherwise the verdict of the
                position sample for a self clock_in / clock_out. A supporting indicator, never proof.
    HrPositionSample:
      type: object
      additionalProperties: false
      description:
        One position sample, evaluated by the server in the request and DISCARDED. It is never persisted,
        logged, audited, queued, cached or returned. Exactly these three numbers; an altitude, speed, heading,
        address or device value is refused.
      required:
        - latitude
        - longitude
        - accuracyMeters
      properties:
        latitude:
          type: number
          minimum: -90
          maximum: 90
        longitude:
          type: number
          minimum: -180
          maximum: 180
        accuracyMeters:
          type: number
          exclusiveMinimum: 0
          maximum: 100000
    HrGeolocationSettings:
      type: object
      properties:
        enabled:
          type: boolean
          description: FALSE for every tenant until an authorised person enables it.
        accuracyCeilingMeters:
          type: integer
          minimum: 10
          maximum: 500
        dpiaReference:
          type: string
          nullable: true
          description: A reference to the tenant's data-protection impact assessment, never its content.
        dpiaRecordedOn:
          type: string
          format: date
          nullable: true
        noticeId:
          type: string
          format: uuid
          nullable: true
        noticeVersion:
          type: integer
          nullable: true
    HrGeolocationSettingsInput:
      type: object
      additionalProperties: false
      required:
        - enabled
      properties:
        enabled:
          type: boolean
        accuracyCeilingMeters:
          type: integer
          minimum: 10
          maximum: 500
        dpiaReference:
          type: string
          nullable: true
          maxLength: 200
        dpiaRecordedOn:
          type: string
          format: date
          nullable: true
        noticeId:
          type: string
          format: uuid
          nullable: true
    HrGeofence:
      type: object
      properties:
        id:
          type: string
          format: uuid
        revision:
          type: integer
          minimum: 1
          description: Bumped by every replace; the audit row carries it with a geometry fingerprint.
        officeId:
          type: string
          format: uuid
        label:
          type: string
        shape:
          type: string
          enum:
            - circle
            - polygon
        latitude:
          type: number
          nullable: true
          description: The CENTRE OF THE WORK SITE (circle); a place of business, not a person.
        longitude:
          type: number
          nullable: true
        radiusMeters:
          type: integer
          nullable: true
        vertices:
          type: array
          nullable: true
          items:
            type: array
            minItems: 2
            maxItems: 2
            items:
              type: number
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        deletedAt:
          type: string
          format: date-time
          nullable: true
    HrGeofenceInput:
      type: object
      additionalProperties: false
      required:
        - officeId
        - label
        - shape
      properties:
        officeId:
          type: string
          format: uuid
        label:
          type: string
          minLength: 1
          maxLength: 80
        shape:
          type: string
          enum:
            - circle
            - polygon
        latitude:
          type: number
          minimum: -90
          maximum: 90
        longitude:
          type: number
          minimum: -180
          maximum: 180
        radiusMeters:
          type: integer
          minimum: 50
          maximum: 5000
        vertices:
          type: array
          minItems: 3
          maxItems: 32
          items:
            type: array
            minItems: 2
            maxItems: 2
            items:
              type: number
    HrGeolocationNotice:
      type: object
      properties:
        id:
          type: string
          format: uuid
        version:
          type: integer
        texts:
          type: object
          additionalProperties:
