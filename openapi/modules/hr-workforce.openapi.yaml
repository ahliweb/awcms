        - source
        - clientEventKey
      properties:
        employmentId:
          type: string
          format: uuid
        kind:
          type: string
          enum:
            - clock_in
            - clock_out
            - break_start
            - break_end
        occurredAt:
          type: string
          format: date-time
          description: A UTC instant ending in Z.
        source:
          type: string
          enum:
            - self
            - supervisor
            - kiosk
            - import
        clientEventKey:
          type: string
          maxLength: 128
          pattern: "^[A-Za-z0-9][A-Za-z0-9_.:-]{0,127}$"
        officeId:
          type: string
          format: uuid
