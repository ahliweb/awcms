        - proposedOccurredAt
        - reason
      properties:
        employmentId:
          type: string
          format: uuid
        kind:
          type: string
          enum:
            - add
            - replace
        targetEventId:
          type: string
          format: uuid
          description: Required for `replace`, forbidden for `add`.
        proposedKind:
          type: string
          enum:
            - clock_in
            - clock_out
            - break_start
            - break_end
        proposedOccurredAt:
          type: string
          format: date-time
        reason:
          type: string
          minLength: 1
          maxLength: 500
