        workflowInstanceId:
          type: string
          format: uuid
        requestedBy:
          type: string
          format: uuid
        decidedBy:
          type: string
          format: uuid
          nullable: true
        decidedAt:
          type: string
          format: date-time
          nullable: true
        createdAt:
          type: string
          format: date-time
        appliedEventId:
          type: string
          format: uuid
          nullable: true
