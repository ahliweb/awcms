# Source fragment for the "hr_workforce" module (Issue #945, #946, ADR-0132).
#
# Owns every path whose operations carry this module's OpenAPI tag, plus every
# components.schemas entry referenced ONLY by this module's operations.
#
# An employment REFERENCES a profile_identity party (`profileId`) and never
# carries its name, contact or national id; no operation accepts or returns a
# photo, biometric or device field (owner decision O6). `terminatedOn` is derived
# from a terminated term and can never be asserted by a client.
#
# NOT independently valid OpenAPI: $ref targets pointing at shared components
# only resolve after `bun run openapi:bundle` merges this file with the root
# fragment and every sibling module fragment. Edit this file, never the bundle.
paths:
  /api/v1/hr-workforce/employments:
    get:
      operationId: hrWorkforceEmploymentsList
      tags:
        - HR Workforce
      summary: List employments
      description: "Gated by `hr_workforce.employments.read`, EXCEPT `mine=true`, which answers only the caller's own employment and needs no permission (an ownership grant on the persisted login link, ADR-0063; ABAC, scope and SoD still apply, and a machine credential never carries it). Newest first, keyset paginated (`cursor`). Each row REFERENCES its person (`profileId`); no name, contact or national id is ever returned. Soft-deleted rows are hidden unless `includeDeleted=true`, which additionally needs `hr_workforce.employments.restore`. Tenant-scoped (withTenant + RLS FORCE)."
      parameters:
        - name: state
          in: query
          required: false
          schema:
            type: string
            enum:
              - active
              - terminated
        - name: officeId
          in: query
          required: false
          schema:
            type: string
            format: uuid
        - name: mine
          in: query
          required: false
          schema:
            type: boolean
        - name: includeDeleted
          in: query
          required: false
          schema:
            type: boolean
        - name: cursor
          in: query
          required: false
          schema:
            type: string
        - $ref: "#/components/parameters/CorrelationId"
      responses:
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "200":
          description: A page of employments.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    enum:
                      - true
                  data:
                    type: object
                    properties:
                      employments:
                        type: array
                        items:
                          $ref: "#/components/schemas/HrEmployment"
                      nextCursor:
                        type: string
                        nullable: true
                  meta:
                    type: object
    post:
      operationId: hrWorkforceEmploymentCreate
      tags:
        - HR Workforce
      summary: Create an employment
      description: "Gated by `hr_workforce.employments.create`. Creates the employment for an existing, active `profile_identity` party together with its first terms effective on `hiredOn`. A body naming a personal field (name, contact, national id) or `terminatedOn` is a 400. One ACTIVE employment per profile and tenant (`409 ALREADY_EMPLOYED`); employee numbers are unique among live rows (`409 EMPLOYEE_NO_CONFLICT`). Requires an Idempotency-Key. Audited."
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
        - $ref: "#/components/parameters/CorrelationId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/HrEmploymentInput"
      responses:
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "201":
          description: The employment.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    enum:
                      - true
                  data:
                    $ref: "#/components/schemas/HrEmployment"
                  meta:
                    type: object
        "409":
          description: IDEMPOTENCY_CONFLICT, ALREADY_EMPLOYED, EMPLOYEE_NO_CONFLICT, MANAGER_CYCLE or MANAGER_CHAIN_TOO_DEEP.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "422":
          description: PROFILE_NOT_FOUND, OFFICE_NOT_FOUND or MANAGER_NOT_FOUND.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /api/v1/hr-workforce/employments/{id}:
    get:
      operationId: hrWorkforceEmploymentGet
      tags:
        - HR Workforce
      summary: Get an employment
      description: "Gated by `hr_workforce.employments.read`; the employee the employment is linked to may read their own without it (an ownership grant). A missing id and someone else's employment are indistinguishable to a caller without the permission (both 403)."
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - $ref: "#/components/parameters/CorrelationId"
      responses:
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "200":
          description: The employment with its current terms.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    enum:
                      - true
                  data:
                    $ref: "#/components/schemas/HrEmployment"
                  meta:
                    type: object
        "404":
          description: RESOURCE_NOT_FOUND.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
    delete:
      operationId: hrWorkforceEmploymentDelete
      tags:
        - HR Workforce
      summary: Soft-delete an employment
      description: "Gated by `hr_workforce.employments.delete` (high-risk). For an employment entered by mistake; a real end of employment is a terminated term. Optional `reason` (at most 500 characters, never echoed into the audit row). Requires an Idempotency-Key. Audited at warning severity."
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - $ref: "#/components/parameters/IdempotencyKey"
        - $ref: "#/components/parameters/CorrelationId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/HrReasonInput"
      responses:
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "200":
          description: The deleted employment.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    enum:
                      - true
                  data:
                    $ref: "#/components/schemas/HrEmployment"
                  meta:
                    type: object
        "404":
          description: RESOURCE_NOT_FOUND.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "409":
          description: IDEMPOTENCY_CONFLICT or EMPLOYMENT_DELETED.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /api/v1/hr-workforce/employments/{id}/restore:
    post:
      operationId: hrWorkforceEmploymentRestore
      tags:
        - HR Workforce
      summary: Restore an employment
      description: "Gated by `hr_workforce.employments.restore` (high-risk). Refused with 409 while the employee number, the person's active employment or the linked login has been taken meanwhile. Requires an Idempotency-Key. Audited at warning severity."
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - $ref: "#/components/parameters/IdempotencyKey"
        - $ref: "#/components/parameters/CorrelationId"
      responses:
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "200":
          description: The restored employment.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    enum:
                      - true
                  data:
                    $ref: "#/components/schemas/HrEmployment"
                  meta:
                    type: object
        "404":
          description: RESOURCE_NOT_FOUND.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "409":
          description: IDEMPOTENCY_CONFLICT, EMPLOYMENT_NOT_DELETED, EMPLOYEE_NO_CONFLICT, ALREADY_EMPLOYED or ACCOUNT_IN_USE.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /api/v1/hr-workforce/employments/{id}/terms:
    get:
      operationId: hrWorkforceEmploymentTermsList
      tags:
        - HR Workforce
      summary: List an employment's terms
      description: "Gated by `hr_workforce.employments.read`; the linked employee may read their own history without it (an ownership grant). Effective-dated and append-only, oldest first (at most 500)."
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - $ref: "#/components/parameters/CorrelationId"
      responses:
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "200":
          description: The terms history.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    enum:
                      - true
                  data:
                    type: object
                    properties:
                      terms:
                        type: array
                        items:
                          $ref: "#/components/schemas/HrEmploymentTerm"
                  meta:
                    type: object
        "404":
          description: RESOURCE_NOT_FOUND.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
    post:
      operationId: hrWorkforceEmploymentTermsChange
      tags:
        - HR Workforce
      summary: Append the next terms
      description: "Gated by `hr_workforce.employments.update`. Appends the next terms from `effectiveFrom` (strictly after the current terms' start, never before the hire date); the open row is closed, never edited. `status: terminated` ends the employment and is terminal (rehire is a new employment). The manager chain must stay acyclic and at most 10 deep. Re-sending identical terms is a no-op answering 200 `replayed: true`. Requires an Idempotency-Key. Audited."
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - $ref: "#/components/parameters/IdempotencyKey"
        - $ref: "#/components/parameters/CorrelationId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/HrTermsChangeInput"
      responses:
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "201":
          description: The terms were appended.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    enum:
                      - true
                  data:
                    type: object
                    properties:
                      replayed:
                        type: boolean
                      employment:
                        $ref: "#/components/schemas/HrEmployment"
                  meta:
                    type: object
        "200":
          description: The identical terms were already current (replayed).
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    enum:
                      - true
                  data:
                    type: object
                    properties:
                      replayed:
                        type: boolean
                      employment:
                        $ref: "#/components/schemas/HrEmployment"
                  meta:
                    type: object
        "404":
          description: RESOURCE_NOT_FOUND.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "409":
          description: IDEMPOTENCY_CONFLICT, EMPLOYMENT_DELETED, EMPLOYMENT_TERMINATED, TERMS_OUT_OF_ORDER, MANAGER_CYCLE or MANAGER_CHAIN_TOO_DEEP.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "422":
          description: EFFECTIVE_BEFORE_HIRE, OFFICE_NOT_FOUND or MANAGER_NOT_FOUND.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /api/v1/hr-workforce/employments/{id}/account:
    put:
      operationId: hrWorkforceEmploymentAccountAssign
      tags:
        - HR Workforce
      summary: Link or unlink the employee's login
      description: 'Gated by `hr_workforce.employments.assign` (high-risk). `{"tenantUserId": "<uuid>"}` links the login that IS this employee; `null` unlinks. This is the basis of self-service ownership. One active employment per login. The audit row records the login UUID (not PII) and the previous one. Requires an Idempotency-Key.'
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - $ref: "#/components/parameters/IdempotencyKey"
        - $ref: "#/components/parameters/CorrelationId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/HrAccountInput"
      responses:
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "200":
          description: The employment, with `replayed` true when the link was already as asked.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    enum:
                      - true
                  data:
                    type: object
                    properties:
                      replayed:
                        type: boolean
                      employment:
                        $ref: "#/components/schemas/HrEmployment"
                  meta:
                    type: object
        "404":
          description: RESOURCE_NOT_FOUND.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "409":
          description: IDEMPOTENCY_CONFLICT, EMPLOYMENT_DELETED, EMPLOYMENT_TERMINATED or ACCOUNT_IN_USE.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "422":
          description: USER_NOT_FOUND.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /api/v1/hr-workforce/settings:
    get:
      operationId: hrWorkforceSettingsGet
      tags:
        - HR Workforce
      summary: Read the workforce settings
      description: "Gated by `hr_workforce.settings.read`. Defaults apply until a row exists. There is no evidence, location or photo setting, by construction (owner decision O6)."
      parameters:
        - $ref: "#/components/parameters/CorrelationId"
      responses:
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "200":
          description: The settings.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    enum:
                      - true
                  data:
                    $ref: "#/components/schemas/HrWorkforceSettings"
                  meta:
                    type: object
    put:
      operationId: hrWorkforceSettingsSet
      tags:
        - HR Workforce
      summary: Change the workforce settings
      description: "Gated by `hr_workforce.settings.configure` (high-risk). An omitted field keeps its value; at least one is required. Requires an Idempotency-Key. Audited at warning severity (the row records which setting changed, not its value)."
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
        - $ref: "#/components/parameters/CorrelationId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/HrWorkforceSettingsInput"
      responses:
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "200":
          description: The settings.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    enum:
                      - true
                  data:
                    $ref: "#/components/schemas/HrWorkforceSettings"
                  meta:
                    type: object
        "409":
          description: IDEMPOTENCY_CONFLICT.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /api/v1/hr-workforce/shift-templates:
    get:
      operationId: hrWorkforceShiftTemplatesList
      tags:
        - HR Workforce
      summary: List shift templates
      description: "Gated by `hr_workforce.templates.read`. Live templates, newest first, keyset paginated (`cursor`). A template is a pattern and names no person. Tenant-scoped (withTenant + RLS FORCE)."
      parameters:
        - name: cursor
          in: query
          required: false
          schema:
            type: string
        - $ref: "#/components/parameters/CorrelationId"
      responses:
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "200":
          description: A page of shift templates.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    enum:
                      - true
                  data:
                    type: object
                    properties:
                      templates:
                        type: array
                        items:
                          $ref: "#/components/schemas/HrShiftTemplate"
                      nextCursor:
                        type: string
                        nullable: true
                  meta:
                    type: object
    post:
      operationId: hrWorkforceShiftTemplateCreate
      tags:
        - HR Workforce
      summary: Create a shift template
      description: "Gated by `hr_workforce.templates.create`. A pattern: a local start time, an ELAPSED duration in minutes, an optional single break and an IANA zone. Codes are unique among live templates (`409 TEMPLATE_CODE_CONFLICT`). Requires an Idempotency-Key. Audited."
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
        - $ref: "#/components/parameters/CorrelationId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/HrShiftTemplateInput"
      responses:
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "201":
          description: The template.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    enum:
                      - true
                  data:
                    $ref: "#/components/schemas/HrShiftTemplate"
                  meta:
                    type: object
        "409":
          description: IDEMPOTENCY_CONFLICT or TEMPLATE_CODE_CONFLICT.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "422":
          description: OFFICE_NOT_FOUND or INVALID_TIME_ZONE.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /api/v1/hr-workforce/shift-templates/{id}:
    get:
      operationId: hrWorkforceShiftTemplateGet
      tags:
        - HR Workforce
      summary: Get a shift template
      description: "Gated by `hr_workforce.templates.read`. A soft-deleted template is a 404."
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - $ref: "#/components/parameters/CorrelationId"
      responses:
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "200":
          description: The template.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    enum:
                      - true
                  data:
                    $ref: "#/components/schemas/HrShiftTemplate"
                  meta:
                    type: object
        "404":
          description: RESOURCE_NOT_FOUND.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
    patch:
      operationId: hrWorkforceShiftTemplateUpdate
      tags:
        - HR Workforce
      summary: Edit a shift template
      description: "Gated by `hr_workforce.templates.update`. Only the keys sent change (the code is fixed); `officeId: null`, or both break keys `null`, clear them. Assignments already made are NOT moved: they hold their own resolved instants. The call sets values, so repeating it is harmless and it needs no Idempotency-Key. Audited."
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - $ref: "#/components/parameters/CorrelationId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/HrShiftTemplatePatch"
      responses:
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "200":
          description: The template.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    enum:
                      - true
                  data:
                    $ref: "#/components/schemas/HrShiftTemplate"
                  meta:
                    type: object
        "404":
          description: RESOURCE_NOT_FOUND.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "422":
          description: OFFICE_NOT_FOUND, INVALID_TIME_ZONE or VALIDATION_ERROR (the break must end within the shift).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
    delete:
      operationId: hrWorkforceShiftTemplateDelete
      tags:
        - HR Workforce
      summary: Soft-delete a shift template
      description: "Gated by `hr_workforce.templates.delete` (high-risk). Soft delete; frees the code. Assignments made from it are unaffected. Requires an Idempotency-Key. Audited at warning severity."
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - $ref: "#/components/parameters/IdempotencyKey"
        - $ref: "#/components/parameters/CorrelationId"
      responses:
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "200":
          description: The deleted template.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    enum:
                      - true
                  data:
                    $ref: "#/components/schemas/HrShiftTemplate"
                  meta:
                    type: object
        "404":
          description: RESOURCE_NOT_FOUND.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "409":
          description: IDEMPOTENCY_CONFLICT or TEMPLATE_DELETED.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /api/v1/hr-workforce/shift-assignments:
    get:
      operationId: hrWorkforceShiftAssignmentsList
      tags:
        - HR Workforce
      summary: List shift assignments
      description: "Gated by `hr_workforce.shifts.read` (drafts visible), EXCEPT `mine=true`, which answers only the caller\u0027s OWN PUBLISHED schedule and needs no permission (an ownership grant on the persisted login link, ADR-0063; ABAC, scope and SoD still apply, and a machine credential never carries it). Oldest start first, keyset paginated (`cursor`); `from` (inclusive) and `to` (exclusive) are whole-minute UTC instants and an assignment is listed when it overlaps that window. Tenant-scoped (withTenant + RLS FORCE)."
      parameters:
        - name: employmentId
          in: query
          required: false
          schema:
            type: string
            format: uuid
        - name: from
          in: query
          required: false
          schema:
            type: string
            format: date-time
        - name: to
          in: query
          required: false
          schema:
            type: string
            format: date-time
        - name: status
          in: query
          required: false
          schema:
            type: string
            enum:
              - draft
              - published
              - cancelled
        - name: mine
          in: query
          required: false
          schema:
            type: boolean
        - name: cursor
          in: query
          required: false
          schema:
            type: string
        - $ref: "#/components/parameters/CorrelationId"
      responses:
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "200":
          description: A page of assignments.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    enum:
                      - true
                  data:
                    type: object
                    properties:
                      assignments:
                        type: array
                        items:
                          $ref: "#/components/schemas/HrShiftAssignment"
                      nextCursor:
                        type: string
                        nullable: true
                  meta:
                    type: object
    post:
      operationId: hrWorkforceShiftAssignmentCreate
      tags:
        - HR Workforce
      summary: Draft a shift or time-off assignment
      description: "Gated by `hr_workforce.shifts.create`. Send EITHER `templateId` + `localDate` (the wall clock is resolved to UTC once, here, in the template\u0027s zone) OR the explicit `startsAt`/`endsAt` UTC interval with its `timeZone`. Created as a DRAFT: invisible to scheduling consumers until published, but it already counts for the overlap rule. An employment cannot have two non-cancelled assignments that overlap (half-open, across kinds): `409 SHIFT_CONFLICT`, with the other assignment\u0027s id in `error.details.conflictingAssignmentId` ONLY when the caller also holds `hr_workforce.shifts.read` (otherwise the id is omitted, so a create-only caller cannot enumerate other people\u0027s schedule ids). Time off carries a coarse `timeOffKind` and NEVER a reason; no free-text field exists. Requires an Idempotency-Key. Audited."
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
        - $ref: "#/components/parameters/CorrelationId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/HrShiftAssignmentInput"
      responses:
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "201":
          description: The draft assignment.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    enum:
                      - true
                  data:
                    $ref: "#/components/schemas/HrShiftAssignment"
                  meta:
                    type: object
        "409":
          description: IDEMPOTENCY_CONFLICT or SHIFT_CONFLICT.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "422":
          description: EMPLOYMENT_NOT_FOUND, TEMPLATE_NOT_FOUND, OFFICE_NOT_FOUND or INVALID_TIME_ZONE.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /api/v1/hr-workforce/shift-assignments/{id}/publish:
    post:
      operationId: hrWorkforceShiftAssignmentPublish
      tags:
        - HR Workforce
      summary: Publish a shift assignment
      description: "Gated by `hr_workforce.shifts.publish` (high-risk). draft -> published. Only a published assignment is visible to scheduling consumers (the `StaffAvailabilityPort`). A published assignment is immutable: it is cancelled, never edited or deleted. Requires an Idempotency-Key. Audited."
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - $ref: "#/components/parameters/IdempotencyKey"
        - $ref: "#/components/parameters/CorrelationId"
      responses:
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "200":
          description: The published assignment.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    enum:
                      - true
                  data:
                    $ref: "#/components/schemas/HrShiftAssignment"
                  meta:
                    type: object
        "404":
          description: RESOURCE_NOT_FOUND.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "409":
          description: IDEMPOTENCY_CONFLICT, SHIFT_NOT_DRAFT or EMPLOYMENT_DELETED.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /api/v1/hr-workforce/shift-assignments/{id}/cancel:
    post:
      operationId: hrWorkforceShiftAssignmentCancel
      tags:
        - HR Workforce
      summary: Cancel a shift assignment
      description: "Gated by `hr_workforce.shifts.cancel` (high-risk). draft or published -> cancelled (terminal). The row stays; it stops counting for the overlap rule and for availability. Requires an Idempotency-Key. Audited at warning severity."
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - $ref: "#/components/parameters/IdempotencyKey"
        - $ref: "#/components/parameters/CorrelationId"
      responses:
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "200":
          description: The cancelled assignment.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    enum:
                      - true
                  data:
                    $ref: "#/components/schemas/HrShiftAssignment"
                  meta:
                    type: object
        "404":
          description: RESOURCE_NOT_FOUND.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "409":
          description: IDEMPOTENCY_CONFLICT or SHIFT_ALREADY_CANCELLED.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
components:
  schemas:
    HrEmploymentTerm:
      type: object
      properties:
        id:
          type: string
          format: uuid
        officeId:
          type: string
          format: uuid
          nullable: true
        managerEmploymentId:
          type: string
          format: uuid
          nullable: true
        jobTitle:
          type: string
          nullable: true
        employmentType:
          type: string
          enum:
            - permanent
            - fixed_term
            - part_time
            - casual
        status:
          type: string
          enum:
            - active
            - on_leave
            - suspended
            - terminated
        effectiveFrom:
          type: string
          format: date
        effectiveTo:
          type: string
          format: date
          nullable: true
          description: Exclusive end; null for the current row.
    HrEmployment:
      type: object
      description:
        An employment. It REFERENCES a profile_identity party by `profileId`; the person's name and
        identifiers are read from profile_identity, never from here. `accountLinked` says whether a
        login is attached; the login's id is not returned.
      properties:
        id:
          type: string
          format: uuid
        profileId:
          type: string
          format: uuid
        employeeNo:
          type: string
        hiredOn:
          type: string
          format: date
        terminatedOn:
          type: string
          format: date
          nullable: true
        accountLinked:
          type: boolean
        createdAt:
          type: string
          format: date-time
        deletedAt:
          type: string
          format: date-time
          nullable: true
        currentTerm:
          nullable: true
          allOf:
            - $ref: "#/components/schemas/HrEmploymentTerm"
    HrTermsFields:
      type: object
      properties:
        officeId:
          type: string
          format: uuid
          nullable: true
        managerEmploymentId:
          type: string
          format: uuid
          nullable: true
        jobTitle:
          type: string
          minLength: 1
          maxLength: 120
          nullable: true
        employmentType:
          type: string
          enum:
            - permanent
            - fixed_term
            - part_time
            - casual
        status:
          type: string
          enum:
            - active
            - on_leave
            - suspended
            - terminated
    HrEmploymentInput:
      type: object
      additionalProperties: false
      required:
        - profileId
        - employeeNo
        - hiredOn
        - employmentType
        - status
      properties:
        profileId:
          type: string
          format: uuid
        employeeNo:
          type: string
          pattern: ^[A-Za-z0-9][A-Za-z0-9_./-]{0,63}$
        hiredOn:
          type: string
          format: date
        officeId:
          type: string
          format: uuid
          nullable: true
        managerEmploymentId:
          type: string
          format: uuid
          nullable: true
        jobTitle:
          type: string
          minLength: 1
          maxLength: 120
          nullable: true
        employmentType:
          type: string
          enum:
            - permanent
            - fixed_term
            - part_time
            - casual
        status:
          type: string
          description: A new employment cannot start terminated.
          enum:
            - active
            - on_leave
            - suspended
    HrTermsChangeInput:
      type: object
      additionalProperties: false
      required:
        - effectiveFrom
        - employmentType
        - status
      properties:
        effectiveFrom:
          type: string
          format: date
        officeId:
          type: string
          format: uuid
          nullable: true
        managerEmploymentId:
          type: string
          format: uuid
          nullable: true
        jobTitle:
          type: string
          minLength: 1
          maxLength: 120
          nullable: true
        employmentType:
          type: string
          enum:
            - permanent
            - fixed_term
            - part_time
            - casual
        status:
          type: string
          enum:
            - active
            - on_leave
            - suspended
            - terminated
    HrAccountInput:
      type: object
      additionalProperties: false
      required:
        - tenantUserId
      properties:
        tenantUserId:
          type: string
          format: uuid
          nullable: true
    HrReasonInput:
      type: object
      additionalProperties: false
      properties:
        reason:
          type: string
          minLength: 1
          maxLength: 500
    HrWorkforceSettings:
      type: object
      properties:
        clockSkewSeconds:
          type: integer
          minimum: 0
          maximum: 3600
        correctionWorkflowKey:
          type: string
    HrWorkforceSettingsInput:
      type: object
      additionalProperties: false
      properties:
        clockSkewSeconds:
          type: integer
          minimum: 0
          maximum: 3600
        correctionWorkflowKey:
          type: string
          pattern: ^[a-z][a-z0-9_.-]{0,99}$
    HrShiftTemplate:
      type: object
      description: A shift pattern. It names no person.
      properties:
        id:
          type: string
          format: uuid
        code:
          type: string
        name:
          type: string
        localStart:
          type: string
          description: Local wall-clock start, HH:MM (24 hours), in `timeZone`.
        durationMinutes:
          type: integer
          description: ELAPSED minutes; the end is the start plus this, whatever the wall clock does.
        breakOffsetMinutes:
          type: integer
          nullable: true
        breakMinutes:
          type: integer
          nullable: true
        timeZone:
          type: string
          description: IANA zone name.
        officeId:
          type: string
          format: uuid
          nullable: true
        createdAt:
          type: string
          format: date-time
        deletedAt:
          type: string
          format: date-time
          nullable: true
    HrShiftTemplateInput:
      type: object
      additionalProperties: false
      required:
        - code
        - name
        - localStart
        - durationMinutes
        - timeZone
      properties:
        code:
          type: string
          pattern: "^[A-Za-z0-9][A-Za-z0-9_.-]{0,31}$"
        name:
          type: string
          minLength: 1
          maxLength: 120
        localStart:
          type: string
          pattern: "^([01][0-9]|2[0-3]):[0-5][0-9]$"
        durationMinutes:
          type: integer
          minimum: 15
          maximum: 1440
        breakOffsetMinutes:
          type: integer
          minimum: 0
          maximum: 1439
        breakMinutes:
          type: integer
          minimum: 1
          maximum: 1440
        timeZone:
          type: string
        officeId:
          type: string
          format: uuid
    HrShiftTemplatePatch:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 120
        localStart:
          type: string
          pattern: "^([01][0-9]|2[0-3]):[0-5][0-9]$"
        durationMinutes:
          type: integer
          minimum: 15
          maximum: 1440
        breakOffsetMinutes:
          type: integer
          nullable: true
        breakMinutes:
          type: integer
          nullable: true
        timeZone:
          type: string
        officeId:
          type: string
          format: uuid
          nullable: true
    HrShiftAssignment:
      type: object
      description:
        One scheduled interval for one employment, in UTC and half-open `[startsAt, endsAt)`. It carries
        no name and no free text; time off has a coarse `timeOffKind` and never a reason.
      properties:
        id:
          type: string
          format: uuid
        employmentId:
          type: string
          format: uuid
        templateId:
          type: string
          format: uuid
          nullable: true
          description: Provenance only; the instants are authoritative and never recomputed.
        kind:
          type: string
          enum:
            - work
            - time_off
        timeOffKind:
          type: string
          nullable: true
          enum:
            - leave
            - holiday
            - other
        startsAt:
          type: string
          format: date-time
        endsAt:
          type: string
          format: date-time
        breakStartsAt:
          type: string
          format: date-time
          nullable: true
        breakEndsAt:
          type: string
          format: date-time
          nullable: true
        timeZone:
          type: string
          description: The IANA zone the interval was resolved in (a snapshot).
        officeId:
          type: string
          format: uuid
          nullable: true
        status:
          type: string
          enum:
            - draft
            - published
            - cancelled
        publishedAt:
          type: string
          format: date-time
          nullable: true
        cancelledAt:
          type: string
          format: date-time
          nullable: true
        createdAt:
          type: string
          format: date-time
    HrShiftAssignmentInput:
      type: object
      additionalProperties: false
      description:
        "Send EITHER `templateId` + `localDate` (work only) OR `startsAt` + `endsAt` + `timeZone`.
        Instants are whole-minute UTC ending in Z; a work shift is at most 24 hours, time off at most
        31 days; an optional single break must lie inside a work interval."
      required:
        - employmentId
        - kind
      properties:
        employmentId:
          type: string
          format: uuid
        kind:
          type: string
          enum:
            - work
            - time_off
        timeOffKind:
          type: string
          enum:
            - leave
            - holiday
            - other
        templateId:
          type: string
          format: uuid
        localDate:
          type: string
          format: date
        startsAt:
          type: string
          format: date-time
        endsAt:
          type: string
          format: date-time
        breakStartsAt:
          type: string
          format: date-time
        breakEndsAt:
          type: string
          format: date-time
        timeZone:
          type: string
        officeId:
          type: string
          format: uuid
