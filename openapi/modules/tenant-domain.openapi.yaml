# Source fragment for the "Tenant Domain" module — ported from awcms-micro
# (epic #555). One file per MODULE (Issue #182 convention): this file owns every
# path carrying the "Tenant Domains" tag and every schema referenced ONLY by
# those operations.
#
# Adapted to this base's shared-component vocabulary: success responses are
# modelled inline (no `ApiSuccess` schema here), the Idempotency-Key header is
# declared inline where a mutation requires it, and only the shared components
# this base defines (CorrelationId; BadRequest/Unauthorized/Forbidden/NotFound;
# ApiError) are referenced. All operations inherit the global bearerAuth +
# tenantHeader security requirement from the root fragment.
#
# NOT independently valid OpenAPI — $ref targets pointing at shared components
# only resolve after `bun run openapi:bundle` merges this file with the root and
# every sibling module fragment into openapi/awcms-public-api.openapi.yaml. Edit
# this file (or the root for shared components), never the generated bundle.
paths:
  /api/v1/tenant/domains:
    get:
      tags:
        - Tenant Domains
      summary: List this tenant's domain/subdomain mappings
      description: Gated by tenant_domain.domains.read. Non-deleted mappings only, keyset-paginated newest first (limit 100).
      operationId: tenantDomainsList
      parameters:
        - name: cursor
          in: query
          required: false
          description: Opaque keyset cursor from a previous page's `nextCursor`.
          schema:
            type: string
        - $ref: "#/components/parameters/CorrelationId"
      responses:
        "200":
          description: A page of tenant domain mappings.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    enum: [true]
                  data:
                    type: object
                    properties:
                      domains:
                        type: array
                        items:
                          $ref: "#/components/schemas/TenantDomain"
                      nextCursor:
                        type: string
                        nullable: true
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
    post:
      tags:
        - Tenant Domains
      summary: Add a tenant domain/subdomain mapping
      description: Gated by tenant_domain.domains.create. A duplicate normalized hostname always returns a generic 409 (never reveals whether the hostname belongs to another tenant). Audited.
      operationId: tenantDomainsCreate
      parameters:
        - $ref: "#/components/parameters/CorrelationId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateTenantDomainRequest"
      responses:
        "200":
          description: Mapping created.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    enum: [true]
                  data:
                    $ref: "#/components/schemas/TenantDomain"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          description: The hostname is already mapped to a tenant (HOSTNAME_CONFLICT).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /api/v1/tenant/domains/{id}:
    get:
      tags:
        - Tenant Domains
      summary: Read one tenant domain mapping
      description: Gated by tenant_domain.domains.read. Unknown/cross-tenant/soft-deleted id all return a generic 404.
      operationId: tenantDomainsGet
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - $ref: "#/components/parameters/CorrelationId"
      responses:
        "200":
          description: The tenant domain mapping.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    enum: [true]
                  data:
                    $ref: "#/components/schemas/TenantDomain"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
    patch:
      tags:
        - Tenant Domains
      summary: Partially update a tenant domain mapping
      description: "Gated by tenant_domain.domains.update. Idempotent by construction. `hostname`/`is_primary` are immutable here and `status` can never be set to `active` (use POST .../verify). Audited."
      operationId: tenantDomainsUpdate
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - $ref: "#/components/parameters/CorrelationId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateTenantDomainRequest"
      responses:
        "200":
          description: Mapping updated.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    enum: [true]
                  data:
                    $ref: "#/components/schemas/TenantDomain"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
    delete:
      tags:
        - Tenant Domains
      summary: Soft-delete a tenant domain mapping
      description: Gated by tenant_domain.domains.delete. Reason-required soft delete; never hard-deletes, and frees the normalized hostname for reuse. Audited.
      operationId: tenantDomainsDelete
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - $ref: "#/components/parameters/CorrelationId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DeleteTenantDomainRequest"
      responses:
        "200":
          description: Mapping soft-deleted.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    enum: [true]
                  data:
                    type: object
                    properties:
                      id:
                        type: string
                        format: uuid
                      deleted:
                        type: boolean
                        enum: [true]
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
  /api/v1/tenant/domains/{id}/verify:
    post:
      tags:
        - Tenant Domains
      summary: Verify a tenant domain by DNS TXT record
      description: "Gated by tenant_domain.domains.verify. Requires Idempotency-Key. Resolves the TXT records at the domain's server-minted `verificationRecordName` and activates the domain only if one of them carries its `verificationRecordValue` exactly (ADR-0106). The lookup runs outside the database transaction. A miss records `status = failed` and answers 409 DOMAIN_NOT_VERIFIED; a resolver failure changes nothing and answers 503. Rate limited per tenant. Audited on both outcomes."
      operationId: tenantDomainsVerify
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: Idempotency-Key
          in: header
          required: true
          schema:
            type: string
        - $ref: "#/components/parameters/CorrelationId"
      responses:
        "200":
          description: Domain verified (status `active`), or replay of a prior identical request.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    enum: [true]
                  data:
                    $ref: "#/components/schemas/TenantDomain"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: "The DNS TXT challenge was not found and the domain is now `failed` (DOMAIN_NOT_VERIFIED); a challenge was just issued and has not been published yet (DOMAIN_NOT_VERIFIED); the hostname is too long to carry one (DOMAIN_NOT_VERIFIABLE); the status is not verifiable (INVALID_STATUS_TRANSITION); the row changed mid-verification (CONFLICT); or the Idempotency-Key was reused with a different request (IDEMPOTENCY_CONFLICT)."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "429":
          description: Too many verification attempts for this tenant (RATE_LIMITED). Carries `Retry-After`.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "503":
          description: The DNS lookup could not be completed (SERVICE_UNAVAILABLE). Nothing was written — the domain's status is unchanged.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /api/v1/tenant/domains/{id}/set-primary:
    post:
      tags:
        - Tenant Domains
      summary: Set a tenant domain as the active primary
      description: "Gated by tenant_domain.domains.set_primary. Requires Idempotency-Key. Atomically makes the domain this tenant's single primary, unsetting any previous primary. Only an `active` (verified) domain is eligible. Audited."
      operationId: tenantDomainsSetPrimary
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: Idempotency-Key
          in: header
          required: true
          schema:
            type: string
        - $ref: "#/components/parameters/CorrelationId"
      responses:
        "200":
          description: Domain set as primary, or replay of a prior identical request.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    enum: [true]
                  data:
                    $ref: "#/components/schemas/TenantDomain"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: Domain is not `active` (INVALID_STATUS_TRANSITION), a concurrent request already changed the primary (CONCURRENT_UPDATE), or the Idempotency-Key was reused with a different request (IDEMPOTENCY_CONFLICT).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
components:
  schemas:
    TenantDomain:
      type: object
      description: A tenant hostname/subdomain mapping. `verification_token_hash` is never exposed.
      properties:
        id:
          type: string
          format: uuid
        tenantId:
          type: string
          format: uuid
        hostname:
          type: string
        normalizedHostname:
          type: string
        domainType:
          type: string
          enum: [subdomain, custom_domain]
        routeMode:
          type: string
          enum: [canonical, legacy_blog]
        status:
          type: string
          enum: [pending_verification, active, suspended, failed]
        isPrimary:
          type: boolean
        redirectToPrimary:
          type: boolean
        verificationMethod:
          type: string
          nullable: true
          description: "Server-managed. `dns_txt` for every domain this application creates; `null` only on a row created before ADR-0106 that has not been verified since. Rows migrated from an older build may still carry `dns_cname`, `file` or `manual`, which this application no longer writes or honours."
          enum: [dns_txt, dns_cname, file, manual, null]
        verificationRecordName:
          type: string
          nullable: true
          description: "Server-minted DNS name to publish the challenge at (`_awcms-verify.<hostname>`). Read-only."
        verificationRecordValue:
          type: string
          nullable: true
          description: "Server-minted TXT value that must appear at `verificationRecordName`. Read-only, and not a secret — it is published in DNS."
        verifiedAt:
          type: string
          format: date-time
          nullable: true
        lastCheckedAt:
          type: string
          format: date-time
          nullable: true
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        createdBy:
          type: string
          format: uuid
          nullable: true
        updatedBy:
          type: string
          format: uuid
          nullable: true
    CreateTenantDomainRequest:
      type: object
      required:
        - hostname
      properties:
        hostname:
          type: string
          description: DNS hostname (no port). Normalized to lowercase for uniqueness/lookup.
        domainType:
          type: string
          enum: [subdomain, custom_domain]
          default: custom_domain
        routeMode:
          type: string
          enum: [canonical, legacy_blog]
          default: canonical
        redirectToPrimary:
          type: boolean
          default: false
    UpdateTenantDomainRequest:
      type: object
      description: "At least one field required. `status` may not be `active` (use verify); `hostname`/`is_primary` are immutable. `verificationMethod` and `verificationRecordName`/`Value` are server-managed (ADR-0106) and are REFUSED with 400 rather than ignored if supplied."
      properties:
        domainType:
          type: string
          enum: [subdomain, custom_domain]
        routeMode:
          type: string
          enum: [canonical, legacy_blog]
        status:
          type: string
          enum: [pending_verification, suspended, failed]
        redirectToPrimary:
          type: boolean
    DeleteTenantDomainRequest:
      type: object
      required:
        - reason
      properties:
        reason:
          type: string
          description: Non-empty soft-delete reason (audited).
