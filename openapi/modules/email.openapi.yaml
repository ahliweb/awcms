                properties:
                  success:
                    type: boolean
                    enum:
                      - true
                  data:
                    type: object
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
    post:
      tags:
        - Email
      operationId: emailCreateSuppression
      summary: Manually suppress a recipient address (audited).
      parameters:
        - $ref: "#/components/parameters/CorrelationId"
