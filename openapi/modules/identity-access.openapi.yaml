# Source fragment for the "identity-access" module (Issue #182, epic #177).
#
# Owns every path whose operations carry this module's OpenAPI tag(s), plus
# every components.schemas entry referenced ONLY by this module's operations.
# Schemas shared by 2+ modules (or referenced by none) live in the root
# fragment (openapi/awcms-public-api.src.yaml) instead.
#
# NOT independently valid OpenAPI: $ref targets pointing at shared components
# (securitySchemes/parameters/responses and cross-module schemas) only resolve
# after `bun run openapi:bundle` merges this file with the root fragment and
# every sibling module fragment into openapi/awcms-public-api.openapi.yaml.
# Edit this file (or the root fragment for shared components), never the
# generated bundle.
paths:
  /api/v1/abac/policies:
    get:
      operationId: listAbacPolicies
      tags:
        - Identity & Access
      summary: List the current tenant's ABAC policies (seeded-empty by default; built-in rules apply).
      responses:
        "200":
          description: The tenant's ABAC policies (limit 100).
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    enum:
                      - true
                  data:
                    type: object
                    properties:
                      items:
                        type: array
                        items:
                          $ref: "#/components/schemas/AbacPolicy"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
    post:
      operationId: createAbacPolicy
      tags:
        - Identity & Access
      summary: Author a new ABAC policy for the current tenant (high-risk access-control change; audit-logged).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - policyCode
                - effect
              properties:
                policyCode:
                  type: string
                  description: Unique per tenant. Starts alphanumeric; letters, digits, '.', '_', '-' only (max 100 chars).
                effect:
                  type: string
                  enum:
                    - allow
                    - deny
                description:
                  type: string
                  nullable: true
      responses:
        "201":
          description: Policy created.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    enum:
                      - true
                  data:
                    $ref: "#/components/schemas/AbacPolicy"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          description: policyCode is already taken in this tenant (POLICY_CODE_ALREADY_EXISTS).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /api/v1/abac/policies/{id}:
    patch:
      operationId: updateAbacPolicy
      tags:
        - Identity & Access
      summary: Update an ABAC policy's effect/description and/or enable-disable it (high-risk; audit-logged).
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        description: Provide at least one of effect, description, isActive. A null description clears it.
        content:
          application/json:
            schema:
              type: object
              properties:
                effect:
                  type: string
                  enum:
                    - allow
                    - deny
                description:
                  type: string
                  nullable: true
                isActive:
                  type: boolean
      responses:
        "200":
          description: Policy updated.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    enum:
                      - true
                  data:
                    $ref: "#/components/schemas/AbacPolicy"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
  /api/v1/access/assignments:
    post:
      operationId: createRoleAssignment
      tags:
        - Identity & Access
      summary: Assign a role to a tenant user (high-risk, audited, idempotent).
      description: Grants a role to a tenant user. Idempotent at the DB unique index — a repeat assign returns 409. Gated on `identity_access.access_control.assign`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - tenantUserId
                - roleId
              properties:
                tenantUserId:
                  type: string
                  format: uuid
                roleId:
                  type: string
                  format: uuid
      responses:
        "200":
          description: The created assignment.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    enum:
                      - true
                  data:
                    type: object
                    properties:
                      id:
                        type: string
                        format: uuid
                      tenantUserId:
                        type: string
                        format: uuid
                      roleId:
                        type: string
                        format: uuid
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: The role is already assigned to this tenant user.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
    delete:
      operationId: deleteRoleAssignment
      tags:
        - Identity & Access
      summary: Revoke a role from a tenant user (high-risk, audited).
      description: Removes a role assignment. 404 when no such assignment exists. Gated on `identity_access.access_control.assign`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - tenantUserId
                - roleId
              properties:
                tenantUserId:
                  type: string
                  format: uuid
                roleId:
                  type: string
                  format: uuid
      responses:
        "200":
          description: The assignment was removed.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    enum:
                      - true
                  data:
                    type: object
                    properties:
                      removed:
                        type: boolean
                        enum:
                          - true
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
  /api/v1/access/evaluate:
    post:
      operationId: accessEvaluate
      tags:
        - Identity & Access
      summary: Reflect the ABAC decision for the caller's own access on a hypothetical request (Issue #179).
      description: Returns what `evaluateAccess` would decide for the CALLER'S OWN access against the tenant's current active ABAC policies. Requires a valid session but no specific permission. The decision is recorded to the ABAC decision log.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AccessEvaluateRequest"
      responses:
        "200":
          description: The evaluated decision.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    enum:
                      - true
                  data:
                    $ref: "#/components/schemas/AccessEvaluateResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
  /api/v1/access/policies:
    get:
      operationId: accessListAbacPolicies
      tags:
        - Identity & Access
      summary: List the tenant's dynamic ABAC (DSL) policies (Issue #179).
      description: Reads every stored DSL policy for the tenant (active and inactive). Gated on `identity_access.abac_policies.read`.
      responses:
        "200":
          description: The tenant's DSL ABAC policies.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    enum:
                      - true
                  data:
                    type: object
                    properties:
                      policies:
                        type: array
                        items:
                          $ref: "#/components/schemas/AbacDslPolicy"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
    post:
      operationId: accessCreateAbacPolicy
      tags:
        - Identity & Access
      summary: Author a new dynamic ABAC (DSL) policy (high-risk; audit-logged; only valid DSL is stored).
      description: Validates the condition DSL fail-closed before any write, so an invalid policy can never be stored or enabled. Created disabled by default unless `isActive:true`. Gated on `identity_access.abac_policies.configure`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AbacDslPolicyWriteRequest"
      responses:
        "200":
          description: The created policy.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    enum:
                      - true
                  data:
                    type: object
                    properties:
                      policy:
                        $ref: "#/components/schemas/AbacDslPolicy"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          description: A policy with that policyCode already exists (RESOURCE_CONFLICT).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /api/v1/access/policies/simulate:
    post:
      operationId: accessSimulateAbacPolicy
      tags:
        - Identity & Access
      summary: Read-only ABAC decision simulation/preview (Issue #179; audited, never mutates).
      description: Returns what `evaluateAccess` would decide for a hypothetical subject/request/environment against the tenant's active policies, plus a per-policy structural trace (no attribute VALUES, no PII). Writes no decision log. Gated on `identity_access.abac_policies.analyze`; simulating a DIFFERENT existing tenant user additionally requires `identity_access.access_control.read`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AbacSimulationRequest"
      responses:
        "200":
          description: The simulated decision and per-policy trace.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    enum:
                      - true
                  data:
                    $ref: "#/components/schemas/AbacSimulationResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
  /api/v1/access/policies/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
    get:
      operationId: accessGetAbacPolicy
      tags:
        - Identity & Access
      summary: Read one dynamic ABAC (DSL) policy (Issue #179).
      description: Gated on `identity_access.abac_policies.read`. 404 when the policy does not exist in this tenant.
      responses:
        "200":
          description: The policy.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    enum:
                      - true
                  data:
                    type: object
                    properties:
                      policy:
                        $ref: "#/components/schemas/AbacDslPolicy"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
    put:
      operationId: accessUpdateAbacPolicy
      tags:
        - Identity & Access
      summary: Replace a dynamic ABAC (DSL) policy (high-risk; audit-logged; only valid DSL is stored).
      description: Validates the condition DSL fail-closed before any write. Gated on `identity_access.abac_policies.configure`. 404 when the policy does not exist; 409 on a policyCode collision.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AbacDslPolicyWriteRequest"
      responses:
        "200":
          description: The updated policy.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    enum:
                      - true
                  data:
                    type: object
                    properties:
                      policy:
                        $ref: "#/components/schemas/AbacDslPolicy"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: A policy with that policyCode already exists (RESOURCE_CONFLICT).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /api/v1/access/policies/{id}/enable:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
    post:
      operationId: accessEnableAbacPolicy
      tags:
        - Identity & Access
      summary: Enable a dynamic ABAC (DSL) policy (high-risk; audit-logged).
      description: Marks the policy active so the evaluator applies it. Gated on `identity_access.abac_policies.configure`. 404 when the policy does not exist.
      responses:
        "200":
          description: The enabled policy.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    enum:
                      - true
                  data:
                    type: object
                    properties:
                      policy:
                        $ref: "#/components/schemas/AbacDslPolicy"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
  /api/v1/access/policies/{id}/disable:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
    post:
      operationId: accessDisableAbacPolicy
      tags:
        - Identity & Access
      summary: Disable a dynamic ABAC (DSL) policy (high-risk; audit-logged).
      description: Marks the policy inactive so the evaluator stops applying it (deactivate-not-delete). Gated on `identity_access.abac_policies.configure`. 404 when the policy does not exist.
      responses:
        "200":
          description: The disabled policy.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    enum:
                      - true
                  data:
                    type: object
                    properties:
                      policy:
                        $ref: "#/components/schemas/AbacDslPolicy"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
  /api/v1/access/machine-credentials:
    get:
      operationId: accessListMachineCredentials
      tags:
        - Identity & Access
      summary: List this tenant's machine credentials (never their secrets).
      description: Gated on `identity_access.machine_credentials.read`. Returns derived `active`/`expired`/`revoked` status plus `lastUsedAt`, so a leak can be traced without any secret material leaving the server.
      responses:
        "200":
          description: The tenant's machine credentials, newest first (limit 200).
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    enum:
                      - true
                  data:
                    type: object
                    properties:
                      items:
                        type: array
                        items:
                          $ref: "#/components/schemas/MachineCredential"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
    post:
      operationId: accessIssueMachineCredential
      tags:
        - Identity & Access
      summary: Issue a read-only machine credential (high-risk; audit-logged).
      description: |
        Mints a bearer for a non-human caller, bound to an existing tenant user (a service account), and returns the plaintext token EXACTLY ONCE — no endpoint can return it again. Gated on `identity_access.machine_credentials.create`.

        The credential AUTHENTICATES only: every request it makes still passes module-enabled, RBAC, ABAC (default-deny) and SoD. `allowedPermissionKeys` NARROWS — effective permissions are the intersection with what the service account holds, so granting that account another role never widens an already-issued credential. Requests authenticated this way are refused unless the action is read-only (ADR-0049 §3).

        Not idempotency-keyed, deliberately: replaying the response would mean persisting the plaintext token.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/IssueMachineCredentialRequest"
      responses:
        "201":
          description: The credential, plus its plaintext token (shown once).
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    enum:
                      - true
                  data:
                    type: object
                    properties:
                      credential:
                        $ref: "#/components/schemas/MachineCredential"
                      token:
                        type: string
                        description: The plaintext bearer. Shown once; only its hash is stored.
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "413":
          description: Request body exceeded the endpoint's size ceiling.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "422":
          description: The issuance request failed validation (VALIDATION_FAILED); `error.details` lists every offending field.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /api/v1/access/machine-credentials/{id}/revoke:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
    post:
      operationId: accessRevokeMachineCredential
      tags:
        - Identity & Access
      summary: Revoke a machine credential (high-risk; audit-logged).
      description: Effective on the credential's very next request, because authentication reads the same row. Gated on `identity_access.machine_credentials.revoke` — separate from `create` so a leak can be stopped by someone who cannot mint one. Re-revoking returns 409 rather than a silent success.
      responses:
        "200":
          description: The revoked credential.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    enum:
                      - true
                  data:
                    type: object
                    properties:
                      credential:
                        $ref: "#/components/schemas/MachineCredential"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: The credential is already revoked (ALREADY_REVOKED).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /api/v1/auth/login:
    post:
      operationId: postAuthLogin
      tags:
        - Identity & Access
      summary: Authenticate with a login identifier and password; issues a session token.
      security: []
      parameters:
        - name: X-AWCMS-Tenant-ID
          in: header
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - loginIdentifier
                - password
              properties:
                loginIdentifier:
                  type: string
                password:
                  type: string
                turnstileToken:
                  type: string
                  description: >-
                    Cloudflare Turnstile response token (Issue #186). Required
                    only on a full-online deployment where Turnstile is enabled;
                    absent and ignored on every LAN/offline deployment. Verified
                    server-side before password verification.
      responses:
        "200":
          description: Session issued.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    enum:
                      - true
                  data:
                    type: object
                    properties:
                      token:
                        type: string
                      expiresAt:
                        type: string
                        format: date-time
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "429":
          description: Too many login attempts from this source.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /api/v1/auth/logout:
    post:
      operationId: postAuthLogout
      tags:
        - Identity & Access
      summary: Revoke the current session.
      responses:
        "200":
          description: Logged out.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    enum:
                      - true
                  data:
                    type: object
                    properties:
                      loggedOut:
                        type: boolean
        "401":
          $ref: "#/components/responses/Unauthorized"
  /api/v1/auth/me:
    get:
      operationId: getAuthMe
      tags:
        - Identity & Access
      summary: Current authenticated identity.
      responses:
        "200":
          description: Current identity.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    enum:
                      - true
                  data:
                    type: object
                    properties:
                      identityId:
                        type: string
                        format: uuid
                      loginIdentifier:
                        type: string
                      profileId:
                        type: string
                        format: uuid
                      status:
                        type: string
                      lastLoginAt:
                        type: string
                        format: date-time
                        nullable: true
        "401":
          $ref: "#/components/responses/Unauthorized"
  /api/v1/auth/mfa/status:
    get:
      operationId: getAuthMfaStatus
      tags:
        - Identity & Access
      summary: Current identity's MFA enrollment state.
      responses:
        "200":
          description: MFA status.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    enum:
                      - true
                  data:
                    type: object
                    properties:
                      enabled:
                        type: boolean
                      factorType:
                        type: string
                        enum:
                          - totp
                      activatedAt:
                        type: string
                        format: date-time
        "401":
          $ref: "#/components/responses/Unauthorized"
  /api/v1/auth/mfa/totp/enroll/start:
    post:
      operationId: postAuthMfaEnrollStart
      tags:
        - Identity & Access
      summary: Begin TOTP enrollment; returns a one-time secret and otpauth URI.
      description: Authorized by EITHER a live session OR an enrollment grant (X-AWCMS-MFA-Enrollment-Token) issued by POST /auth/login when a tenant policy requires MFA for an identity without a factor.
      parameters:
        - name: X-AWCMS-MFA-Enrollment-Token
          in: header
          required: false
          description: Enrollment grant token from a login that returned MFA_ENROLLMENT_REQUIRED; used in place of a session.
          schema:
            type: string
      responses:
        "200":
          description: Pending factor created; secret shown once.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    enum:
                      - true
                  data:
                    type: object
                    properties:
                      secret:
                        type: string
                      otpauthUri:
                        type: string
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          description: MFA already active for this account.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "500":
          description: MFA encryption key is missing/invalid (misconfigured).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /api/v1/auth/mfa/totp/enroll/verify:
    post:
      operationId: postAuthMfaEnrollVerify
      tags:
        - Identity & Access
      summary: Confirm a pending TOTP enrollment; activates the factor and returns recovery codes.
      description: Authorized by EITHER a live session OR an enrollment grant. When authorized via an enrollment grant (a login that returned MFA_ENROLLMENT_REQUIRED), the grant is consumed and a fresh aal2 session token is returned.
      parameters:
        - name: X-AWCMS-MFA-Enrollment-Token
          in: header
          required: false
          description: Enrollment grant token; used in place of a session to complete the "must enroll" login.
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - code
              properties:
                code:
                  type: string
      responses:
        "200":
          description: Factor activated; recovery codes shown once. token/expiresAt/assuranceLevel are present only when enrolled via an enrollment grant.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    enum:
                      - true
                  data:
                    type: object
                    properties:
                      activated:
                        type: boolean
                      recoveryCodes:
                        type: array
                        items:
                          type: string
                      token:
                        type: string
                      expiresAt:
                        type: string
                        format: date-time
                      assuranceLevel:
                        type: string
                        enum:
                          - aal2
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          description: MFA misconfigured.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /api/v1/auth/mfa/totp/verify:
    post:
      operationId: postAuthMfaVerify
      tags:
        - Identity & Access
      summary: Complete a login paused with MFA_REQUIRED by submitting a TOTP or recovery code.
      description: Authenticated by possession of the mfaChallengeToken from POST /auth/login, not by a session. On success issues an aal2 session.
      security: []
      parameters:
        - name: X-AWCMS-Tenant-ID
          in: header
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - mfaChallengeToken
              properties:
                mfaChallengeToken:
                  type: string
                code:
                  type: string
                recoveryCode:
                  type: string
      responses:
        "200":
          description: MFA verified; aal2 session issued.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    enum:
                      - true
                  data:
                    type: object
                    properties:
                      token:
                        type: string
                      expiresAt:
                        type: string
                        format: date-time
                      assuranceLevel:
                        type: string
                        enum:
                          - aal2
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "429":
          description: Too many verification attempts from this source.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "500":
          description: MFA misconfigured.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /api/v1/auth/mfa/totp/disable:
    post:
      operationId: postAuthMfaDisable
      tags:
        - Identity & Access
      summary: Self-service disable of the current identity's MFA factor.
      responses:
        "200":
          description: MFA disabled.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    enum:
                      - true
                  data:
                    type: object
                    properties:
                      disabled:
                        type: boolean
        "401":
          $ref: "#/components/responses/Unauthorized"
        "409":
          description: No active MFA to disable.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /api/v1/auth/mfa/recovery-codes/regenerate:
    post:
      operationId: postAuthMfaRecoveryRegenerate
      tags:
        - Identity & Access
      summary: Invalidate existing recovery codes and issue a fresh single-use set.
      responses:
        "200":
          description: New recovery codes shown once.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    enum:
                      - true
                  data:
                    type: object
                    properties:
                      recoveryCodes:
                        type: array
                        items:
                          type: string
        "401":
          $ref: "#/components/responses/Unauthorized"
        "409":
          description: No active MFA.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /api/v1/auth/mfa/step-up:
    post:
      operationId: postAuthMfaStepUp
      tags:
        - Identity & Access
      summary: Raise the current session to aal2 for high-risk actions.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                code:
                  type: string
                recoveryCode:
                  type: string
      responses:
        "200":
          description: Session stepped up to aal2 (rotated when rising from aal1).
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    enum:
                      - true
                  data:
                    type: object
                    properties:
                      assuranceLevel:
                        type: string
                        enum:
                          - aal2
                      rotated:
                        type: boolean
                      token:
                        type: string
                      expiresAt:
                        type: string
                        format: date-time
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "429":
          description: Too many verification attempts from this source.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "500":
          description: MFA misconfigured.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /api/v1/auth/mfa/admin/reset:
    post:
      operationId: postAuthMfaAdminReset
      tags:
        - Identity & Access
      summary: Administratively reset another user's MFA factor (requires reason).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - identityId
                - reason
              properties:
                identityId:
                  type: string
                  format: uuid
                reason:
                  type: string
      responses:
        "200":
          description: Target MFA reset.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    enum:
                      - true
                  data:
                    type: object
                    properties:
                      reset:
                        type: boolean
                      hadFactor:
                        type: boolean
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
  /api/v1/auth/mfa/policy:
    get:
      operationId: getAuthMfaPolicy
      tags:
        - Identity & Access
      summary: Read the tenant MFA enforcement policy.
      responses:
        "200":
          description: Tenant MFA policy.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    enum:
                      - true
                  data:
                    $ref: "#/components/schemas/TenantMfaPolicy"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
    put:
      operationId: putAuthMfaPolicy
      tags:
        - Identity & Access
      summary: Set the tenant MFA enforcement level.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - enforcementLevel
              properties:
                enforcementLevel:
                  type: string
                  enum:
                    - optional
                    - required_for_privileged
                    - required_for_all
      responses:
        "200":
          description: Policy updated.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    enum:
                      - true
                  data:
                    $ref: "#/components/schemas/TenantMfaPolicy"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
  /api/v1/auth/password/forgot:
    post:
      operationId: postAuthPasswordForgot
      tags:
        - Identity & Access
      summary: Request a password reset link (account-enumeration-safe).
      description: >-
        Always returns the same 200 body regardless of whether the identifier
        matched an eligible account. An unknown identifier, an inactive
        identity or tenant-user, an identity the tenant has taken off password
        login, and a successfully queued email are indistinguishable to the
        caller by response body, status code, or error code. Rate limited per
        client IP and tenant.
      security: []
      parameters:
        - name: X-AWCMS-Tenant-ID
          in: header
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - loginIdentifier
              properties:
                loginIdentifier:
                  type: string
                turnstileToken:
                  type: string
                  description: >-
                    Cloudflare Turnstile response token (Issue #186), solved for
                    the `password_reset` action. Required only on a full-online
                    deployment where Turnstile is enabled; absent and ignored on
                    every LAN/offline deployment.
      responses:
        "200":
          description: >-
            Request accepted. Says nothing about whether an account exists.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    enum:
                      - true
                  data:
                    type: object
                    properties:
                      requested:
                        type: boolean
                      message:
                        type: string
        "400":
          $ref: "#/components/responses/BadRequest"
        "429":
          description: Too many password reset requests from this source.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /api/v1/auth/password/reset:
    post:
      operationId: postAuthPasswordReset
      tags:
        - Identity & Access
      summary: Complete a password reset with a single-use token.
      description: >-
        On success the password is replaced, the lockout counters are cleared,
        the token is burned, and every session belonging to that identity is
        revoked. Every rejection — unknown token, expired, already used, the
        identity deactivated since issue, or password login disabled for it —
        returns the same `PASSWORD_RESET_INVALID` error, so the endpoint cannot
        be used to fingerprint the state of a token.
      security: []
      parameters:
        - name: X-AWCMS-Tenant-ID
          in: header
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - token
                - newPassword
              properties:
                token:
                  type: string
                  description: The raw single-use token from the emailed link.
                newPassword:
                  type: string
                  minLength: 8
                turnstileToken:
                  type: string
                  description: >-
                    Cloudflare Turnstile response token (Issue #186), solved for
                    the `password_reset` action. Required only on a full-online
                    deployment where Turnstile is enabled.
      responses:
        "200":
          description: Password changed and all sessions revoked.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    enum:
                      - true
                  data:
                    type: object
                    properties:
                      reset:
                        type: boolean
        "400":
          $ref: "#/components/responses/BadRequest"
        "429":
          description: Too many password reset attempts from this source.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /api/v1/auth/register:
    post:
      operationId: postAuthRegister
      tags:
        - Identity & Access
      summary: Submit a self-registration request for admin review.
      description: >-
        Records a request; it NEVER creates an account. Accepts no password and
        no privilege field — approval creates the account with an unusable
        credential and emails a password-reset link. Returns `404` when
        `AUTH_SELF_REGISTRATION_ENABLED` is not `true`, indistinguishable from a
        route that does not exist. When enabled, an address that already has an
        account, an address with a request already pending, and a freshly
        recorded request all return the identical 200.
      security: []
      parameters:
        - name: X-AWCMS-Tenant-ID
          in: header
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - displayName
                - loginIdentifier
              properties:
                displayName:
                  type: string
                  maxLength: 120
                loginIdentifier:
                  type: string
                  maxLength: 320
                  description: Must be an email address — the approval link is sent to it.
                turnstileToken:
                  type: string
                  description: >-
                    Cloudflare Turnstile response token (Issue #186), solved for
                    the `register` action. Required only on a full-online
                    deployment where Turnstile is enabled.
      responses:
        "200":
          description: >-
            Request accepted. Says nothing about whether the address is already
            registered or already pending.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    enum:
                      - true
                  data:
                    type: object
                    properties:
                      requested:
                        type: boolean
                      message:
                        type: string
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          description: Self-registration is not enabled for this deployment.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "429":
          description: Too many registration attempts from this source.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /api/v1/registration-requests:
    get:
      operationId: listRegistrationRequests
      tags:
        - Identity & Access
      summary: Pending self-registration requests for this tenant.
      description: >-
        Oldest first, bounded. Login identifiers are MASKED — a reviewer decides
        on a name and a domain, and this is the one response that would
        otherwise expose every applicant address at once.
      responses:
        "200":
          description: The pending queue.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    enum:
                      - true
                  data:
                    type: object
                    properties:
                      items:
                        type: array
                        items:
                          $ref: "#/components/schemas/RegistrationRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
  /api/v1/registration-requests/{id}/approve:
    post:
      operationId: approveRegistrationRequest
      tags:
        - Identity & Access
      summary: Approve a request, creating a real account.
      description: >-
        The only path that materializes profile + identity + tenant_user, hence
        its own permission (`registration_requests.approve`), separate from
        `reject`. The account is created with an UNUSABLE password and the
        applicant is emailed a password-reset link; `delivery` reports whether
        that link could actually be queued. `roleIds` is optional and defaults
        to none — an approval never grants a role by default, and a SYSTEM role
        (`owner`) is refused with 409 `ROLE_SYSTEM_PROTECTED`: admitting a
        person to a tenant is not the authority to hand out the tenant's whole
        permission catalogue.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                roleIds:
                  type: array
                  items:
                    type: string
                    format: uuid
      responses:
        "200":
          description: Account created.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    enum:
                      - true
                  data:
                    type: object
                    properties:
                      approved:
                        type: boolean
                      identityId:
                        type: string
                        format: uuid
                      tenantUserId:
                        type: string
                        format: uuid
                      delivery:
                        type: string
                        enum:
                          - queued
                          - unavailable
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: >-
            `IDENTIFIER_TAKEN` — an account with that login identifier already
            exists; or `ROLE_SYSTEM_PROTECTED` — one of `roleIds` names a system
            role, which no approval may grant.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /api/v1/registration-requests/{id}/reject:
    post:
      operationId: rejectRegistrationRequest
      tags:
        - Identity & Access
      summary: Reject a request. Creates nothing and notifies nobody.
      description: >-
        A rejection email would confirm to an anonymous submitter that this
        tenant exists and reviewed them — the same disclosure the public submit
        endpoint refuses to make.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Request rejected.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    enum:
                      - true
                  data:
                    type: object
                    properties:
                      rejected:
                        type: boolean
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
  /api/v1/identity/business-scope/assignments:
    get:
      operationId: listBusinessScopeAssignments
      tags:
        - Identity & Access
      summary: List this tenant's business-scope assignments (Issue #180).
      description: >-
        Lists business-scope assignments for the caller's tenant, optionally
        filtered by status/tenantUserId/scopeType. Gated on
        `identity_access.business_scope_assignments.read`.
      parameters:
        - name: status
          in: query
          required: false
          schema:
            type: string
            enum:
              - active
              - expired
              - revoked
        - name: tenantUserId
          in: query
          required: false
          schema:
            type: string
            format: uuid
        - name: scopeType
          in: query
          required: false
          schema:
            type: string
      responses:
        "200":
          description: The tenant's business-scope assignments (newest first, bounded).
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    enum:
                      - true
                  data:
                    type: object
                    properties:
                      assignments:
                        type: array
                        items:
                          $ref: "#/components/schemas/BusinessScopeAssignment"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
    post:
      operationId: createBusinessScopeAssignment
      tags:
        - Identity & Access
      summary: Create a business-scope assignment (high-risk, audited, idempotent).
      description: >-
        Grants a subject a role/permission context restricted to one business
        scope. The `(scopeType, scopeId)` reference is validated server-side
        through the `BusinessScopeHierarchyPort` capability (never trusted from
        the request alone); an unresolved scope is denied `SCOPE_UNRESOLVED`.
        Self-grant is denied. Gated on
        `identity_access.business_scope_assignments.create`. Requires
        `Idempotency-Key`.
      parameters:
        - name: Idempotency-Key
          in: header
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - tenantUserId
                - scopeType
                - scopeId
              properties:
                tenantUserId:
                  type: string
                  format: uuid
                roleId:
                  type: string
                  format: uuid
                  nullable: true
                scopeType:
                  type: string
                  description: Lowercase snake_case scope type (e.g. "office").
                scopeId:
                  type: string
                  format: uuid
                effectiveFrom:
                  type: string
                  format: date-time
                effectiveTo:
                  type: string
                  format: date-time
                  nullable: true
                isTemporary:
                  type: boolean
                reason:
                  type: string
                  nullable: true
      responses:
        "200":
          description: The created business-scope assignment.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    enum:
                      - true
                  data:
                    type: object
                    properties:
                      assignment:
                        $ref: "#/components/schemas/BusinessScopeAssignment"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: The Idempotency-Key was already used with a different request.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /api/v1/identity/business-scope/assignments/{id}/revoke:
    post:
      operationId: revokeBusinessScopeAssignment
      tags:
        - Identity & Access
      summary: Revoke a business-scope assignment (high-risk, audited, idempotent).
      description: >-
        Revokes an active business-scope assignment (transitions it to
        `revoked`; append-only lifecycle history is recorded). Revocation takes
        effect on the next authorization decision immediately. Gated on
        `identity_access.business_scope_assignments.revoke`. Requires
        `Idempotency-Key`.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: Idempotency-Key
          in: header
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - revokeReason
              properties:
                revokeReason:
                  type: string
      responses:
        "200":
          description: The revoked business-scope assignment.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    enum:
                      - true
                  data:
                    type: object
                    properties:
                      assignment:
                        $ref: "#/components/schemas/BusinessScopeAssignment"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: The assignment is not active, or the Idempotency-Key was reused with a different request.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /api/v1/identity/business-scope/conflicts:
    get:
      operationId: listSoDConflictEvaluations
      tags:
        - Identity & Access
      summary: List the SoD conflict evaluation log (Issue #181).
      description: >-
        Keyset-paginated, permission-gated segregation-of-duties conflict
        evaluation history (the conflict preview / audit view). Recorded for
        every assignment-create and high-risk-action conflict check, regardless
        of outcome. Safe projection: rule key, subject id, trigger context,
        outcome, reason, and timestamp only. Gated on
        `identity_access.business_scope_conflicts.read`.
      parameters:
        - name: cursor
          in: query
          required: false
          schema:
            type: string
          description: Opaque keyset cursor from a previous page's `nextCursor`.
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 200
        - name: ruleKey
          in: query
          required: false
          schema:
            type: string
        - name: conflictDetected
          in: query
          required: false
          schema:
            type: string
            enum:
              - "true"
              - "false"
      responses:
        "200":
          description: A page of SoD conflict evaluations (newest first) plus the next cursor.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    enum:
                      - true
                  data:
                    type: object
                    properties:
                      conflicts:
                        type: array
                        items:
                          $ref: "#/components/schemas/SoDConflictEvaluation"
                      nextCursor:
                        type: string
                        nullable: true
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
  /api/v1/identity/business-scope/exceptions:
    get:
      operationId: listSoDConflictExceptions
      tags:
        - Identity & Access
      summary: List this tenant's SoD conflict exceptions (Issue #181).
      description: >-
