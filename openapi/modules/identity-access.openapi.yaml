              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    enum: [true]
                  data:
                    type: object
                    properties:
                      revokedCount:
                        type: integer
                        minimum: 0
                      keptCallerSession:
                        type: boolean
                        description: True when the target was the caller's own tenant user, so their current session was left alive.
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
  /api/v1/auth/session-handoff/issue:
    post:
      operationId: issueSessionHandoffCode
      tags:
        - Identity & Access
      summary: Mint a one-time code letting a registered BFF obtain a session as the caller.
      description: |
        ADR-0050. The authenticated human asks for a short-lived (≤60 second), single-use code; a registered BFF then spends it server-to-server at `/api/v1/auth/session-handoff/redeem` and receives a session token for that person.

        **Self-service, not permission-gated.** The identity and assurance level come from the presented session, never from the body, so the caller can only ever mint a code for themselves. There is no permission that answers "may I hand my own session to a client I am already logged into", and inventing one would deny everyone including the tenant owner. Same reasoning as `GET /api/v1/auth/session`.

        What constrains it is the CLIENT registry: a code is only issued for a registered, enabled client, bound to a `redirectUri` on that client's **exact-match** allow-list. Prefix and origin matches are refused — `https://app.example.com` prefix-matches `https://app.example.com.evil.test`, and an attacker who can choose the path on a permitted origin can forward the code onward.

        Every rejection — unknown client, non-allow-listed URI, a URI carrying a query or fragment, a non-https URI — answers the same `400 HANDOFF_NOT_ALLOWED`. Distinguishing them turns this into a probe for which clients are registered and which URIs they accept.

        **No `Idempotency-Key`**, deliberately: each call mints a fresh single-use credential, and replaying one would mean two live codes for one request.
      parameters:
        - $ref: "#/components/parameters/CorrelationId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/IssueSessionHandoffRequest"
      responses:
        "200":
          description: A one-time code, and the redirect_uri it is bound to.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    enum: [true]
                  data:
                    $ref: "#/components/schemas/SessionHandoffCodeIssued"
        "400":
          description: The client and redirect_uri combination cannot be used (`HANDOFF_NOT_ALLOWED`), or the body is missing a field.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /api/v1/auth/session-handoff/redeem:
    post:
      operationId: redeemSessionHandoffCode
      tags:
        - Identity & Access
      summary: Spend a one-time handoff code and receive a session token (server-to-server).
      description: |
        ADR-0050. The only endpoint here authenticated by a **client secret** rather than a session: this is the request that obtains a session, so there is none to present yet. Not a machine credential either — those are read-only by construction (ADR-0049), and a read-only principal minting a human session would be an escalation path.

        Call it from the BFF's SERVER. The token must never reach a browser: the BFF stores it server-side and gives the browser its own portal cookie.

        The code is spent exactly once, claimed with a guarded `UPDATE … WHERE redeemed_at IS NULL` so two concurrent redemptions cannot both succeed. The spent row is kept rather than deleted, so a replay is answered from evidence instead of from the absence of it.

        **Every failure is one answer.** Unknown code, expired code, already-spent code, wrong client, wrong `redirectUri`, bad secret — all `401 HANDOFF_REJECTED`, including a malformed body. The distinctions are recorded in the audit trail; handing them to the caller tells whoever holds a stolen code whether it was ever valid.

        The minted session inherits the assurance level the original login REACHED and never more: an `aal1` login cannot be laundered into an `aal2` session.

        **No `Idempotency-Key`**: the code IS the idempotency key, with the opposite contract — the second attempt must fail rather than replay the first response.
      parameters:
        - $ref: "#/components/parameters/CorrelationId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RedeemSessionHandoffRequest"
      responses:
        "200":
          description: A session token for the human who authenticated.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    enum: [true]
                  data:
                    $ref: "#/components/schemas/SessionHandoffRedeemed"
        "401":
          description: The handoff could not be completed (`HANDOFF_REJECTED`) — one answer for every cause, deliberately.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /api/v1/auth/sessions:
    get:
      operationId: listOwnAuthSessions
      tags:
        - Identity & Access
      summary: List the caller's own live sessions (self-service, no permission).
      description: >-
        Where am I signed in? Self-service by construction — the subject is the
        session bearer and the route accepts no tenantUserId, so there is nobody
        else it could be pointed at. Deliberately UNPERMISSIONED, like
        GET /api/v1/auth/session: inventing a permission for "see your own
        sessions" would wall off the feature and install a latent-authz trap
        (an action nothing seeds denies everyone, including the tenant owner).
        Returns no token, no raw IP and no raw User-Agent. clientIpHash is a
        keyed pseudonym and is null on a deployment without AUTH_IP_HASH_SECRET,
        because the fallback key is per-process and a stored hash would stop
        being comparable after a restart.
      parameters:
        - $ref: "#/components/parameters/CorrelationId"
      responses:
        "200":
          description: The caller's live sessions, newest first.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    enum: [true]
                  data:
                    type: object
                    properties:
                      sessions:
                        type: array
                        items:
                          $ref: "#/components/schemas/OwnSessionSummary"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "429":
          description: Too many session requests from this source.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /api/v1/auth/sessions/{id}:
    delete:
      operationId: revokeOwnAuthSession
      tags:
        - Identity & Access
      summary: End one of the caller's own sessions (self-service, no permission).
      description: >-
        Ownership is enforced in the UPDATE's WHERE clause, never by a preceding
        read. Unknown id, another person's session, another tenant's session and
        one already revoked or expired all answer 404 — distinguishing them
        would make this an existence oracle for session ids, and the caller
        could do nothing differently with the distinction. Revoking the CURRENT
        session answers 409: that is POST /api/v1/auth/logout's job, which also
        clears the cookies.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - $ref: "#/components/parameters/CorrelationId"
      responses:
        "200":
          description: The session was revoked.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    enum: [true]
                  data:
                    type: object
                    properties:
                      revoked:
                        type: boolean
                        enum: [true]
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: The id names the session making this request (SESSION_IS_CURRENT) — use POST /api/v1/auth/logout.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "429":
          description: Too many revocation requests from this source.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /api/v1/auth/session:
    get:
      operationId: introspectAuthSession
      tags:
        - Identity & Access
      summary: Introspect the calling session — safe claims only (for a cross-origin BFF).
      description: |
        Cross-origin session introspection (ADR-0045 §3, ADR-0049 §7). Intended for `awcms-astro`'s BFF, which holds the session token server-side; a browser never calls it directly.

        Self-service: authorized by holding the session, not by a permission. Returns ONLY claims a portal header needs — never a token, token hash, password state, MFA secret/recovery code, or a raw email/phone identifier.

        Anti-oracle: a missing bearer, an unknown/expired/revoked session, a deactivated identity, and a machine credential presented here all produce the SAME 401. Rate-limited per source; `Cache-Control: private, no-store` on every path.
      responses:
        "200":
          description: Safe claims for the live session.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    enum:
                      - true
                  data:
                    $ref: "#/components/schemas/SessionIntrospection"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "429":
          description: Too many introspection requests from this source (RATE_LIMITED); `Retry-After` carries the window.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /api/v1/auth/sso/{providerKey}/start:
    get:
      operationId: getAuthSsoStart
      tags:
        - Identity & Access
      summary: Begin an OIDC SSO login — 302-redirects to the tenant provider's authorization endpoint (Auth Code + PKCE + state + nonce).
      security: []
      parameters:
        - name: providerKey
          in: path
          required: true
          schema:
            type: string
        - name: tenantId
          in: query
          required: false
          description: Tenant id fallback when no tenant header/cookie is present (a fresh browser navigation).
          schema:
            type: string
            format: uuid
        - name: returnTo
          in: query
          required: false
          description: Same-origin relative path to return to after login (sanitized server-side; open-redirect targets are ignored).
          schema:
            type: string
      responses:
        "302":
          description: Redirect to the provider's authorization endpoint.
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          description: Too many requests from this source (RATE_LIMITED).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "502":
          description: The provider could not be reached (SSO_PROVIDER_UNAVAILABLE).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /api/v1/auth/sso/{providerKey}/callback:
    get:
      operationId: getAuthSsoCallback
      tags:
        - Identity & Access
      summary: OIDC provider redirect target — validates state/nonce/PKCE/ID-token, then mints an opaque awcms session (or a 401 MFA_REQUIRED).
      security: []
      parameters:
        - name: providerKey
          in: path
          required: true
          schema:
            type: string
        - name: state
          in: query
          required: false
          schema:
            type: string
        - name: code
          in: query
          required: false
          schema:
            type: string
        - name: error
          in: query
          required: false
          schema:
            type: string
      responses:
        "302":
          description: Login (or link) succeeded — redirect to the return path.
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          description: The provider account is already linked (SSO_ALREADY_LINKED).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "502":
          description: The provider could not be reached (SSO_PROVIDER_UNAVAILABLE).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /api/v1/auth/sso/{providerKey}/link:
    post:
      operationId: postAuthSsoLink
      tags:
        - Identity & Access
      summary: Explicitly link an OIDC provider account to the caller's identity (authenticated + step-up required; never auto-links by email).
      parameters:
        - name: providerKey
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: The provider authorization URL to complete the link.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    enum:
                      - true
                  data:
                    type: object
                    properties:
                      authorizationUrl:
                        type: string
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "502":
          description: The provider could not be reached (SSO_PROVIDER_UNAVAILABLE).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /api/v1/auth/sso/{providerKey}/unlink:
    post:
      operationId: postAuthSsoUnlink
      tags:
        - Identity & Access
      summary: Unlink the caller's OIDC provider account (authenticated + step-up required; audit-logged).
      parameters:
        - name: providerKey
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: The provider account was unlinked.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    enum:
                      - true
                  data:
                    type: object
                    properties:
                      unlinked:
                        type: boolean
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: No provider account is currently linked (SSO_NOT_LINKED).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /api/v1/auth/sso-providers:
    get:
      operationId: listSsoProviders
      tags:
        - Identity & Access
      summary: List the tenant's configured OIDC SSO providers (client secrets are never returned).
      responses:
        "200":
          description: The tenant's SSO providers.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    enum:
                      - true
                  data:
                    type: object
                    properties:
                      providers:
                        type: array
                        items:
                          $ref: "#/components/schemas/SsoProvider"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
    post:
      operationId: createSsoProvider
      tags:
        - Identity & Access
      summary: Add a tenant OIDC SSO provider (high-risk; audit-logged). Exactly one of clientSecret / clientSecretEnvVar.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - providerKey
                - displayName
                - issuerUrl
                - clientId
              properties:
                providerKey:
                  type: string
                  description: Stable slug (^[a-z0-9][a-z0-9_-]*$), used in the /sso/{providerKey}/... path.
                displayName:
                  type: string
                issuerUrl:
                  type: string
                  description: HTTPS issuer/discovery base URL.
                clientId:
                  type: string
                clientSecret:
                  type: string
                  nullable: true
                  description: Plaintext client secret (encrypted at rest; never returned). Provide this OR clientSecretEnvVar.
                clientSecretEnvVar:
                  type: string
                  nullable: true
                  description: Name of an env var holding the secret (resolved at token-exchange time; never persisted).
                scopes:
                  type: string
                allowedEmailDomains:
                  type: array
                  items:
                    type: string
                enabled:
                  type: boolean
      responses:
        "200":
          description: The created provider.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    enum:
                      - true
                  data:
                    $ref: "#/components/schemas/SsoProvider"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          description: providerKey conflict or per-tenant provider limit reached (SSO_PROVIDER_KEY_CONFLICT / SSO_PROVIDER_LIMIT_EXCEEDED).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "500":
          description: The credential encryption key is not configured (SSO_MISCONFIGURED).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /api/v1/auth/sso-providers/{id}:
    get:
      operationId: getSsoProvider
      tags:
        - Identity & Access
      summary: Read one tenant OIDC SSO provider (client secret never returned).
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: The provider.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    enum:
                      - true
                  data:
                    $ref: "#/components/schemas/SsoProvider"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
    patch:
      operationId: updateSsoProvider
      tags:
        - Identity & Access
      summary: Update a tenant OIDC SSO provider (partial; high-risk; audit-logged).
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                displayName:
                  type: string
                issuerUrl:
                  type: string
                clientId:
                  type: string
                clientSecret:
                  type: string
                  nullable: true
                clientSecretEnvVar:
                  type: string
                  nullable: true
                scopes:
                  type: string
                allowedEmailDomains:
                  type: array
                  items:
                    type: string
                enabled:
                  type: boolean
      responses:
        "200":
          description: The updated provider.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    enum:
                      - true
                  data:
                    $ref: "#/components/schemas/SsoProvider"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          description: The credential encryption key is not configured (SSO_MISCONFIGURED).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
    delete:
      operationId: deleteSsoProvider
      tags:
        - Identity & Access
      summary: Soft delete a tenant OIDC SSO provider (reason required; high-risk; audit-logged).
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - reason
              properties:
                reason:
                  type: string
      responses:
        "200":
          description: The provider was soft-deleted.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    enum:
                      - true
                  data:
                    type: object
                    properties:
                      id:
                        type: string
                        format: uuid
                      deleted:
                        type: boolean
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
  /api/v1/auth/sso-policy:
    get:
      operationId: getSsoPolicy
      tags:
        - Identity & Access
      summary: Read the tenant authentication policy (password/SSO/JIT/break-glass).
      responses:
        "200":
          description: The tenant authentication policy.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    enum:
                      - true
                  data:
                    $ref: "#/components/schemas/TenantAuthPolicy"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
    patch:
      operationId: updateSsoPolicy
      tags:
        - Identity & Access
      summary: Update the tenant authentication policy (partial upsert; high-risk; audit-logged; break-glass enforced server-side).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                passwordLoginEnabled:
                  type: boolean
                ssoEnabled:
                  type: boolean
                ssoRequired:
                  type: boolean
                autoLinkVerifiedEmail:
                  type: boolean
                jitProvisioningEnabled:
                  type: boolean
                allowedEmailDomains:
                  type: array
                  items:
                    type: string
                breakGlassIdentityIds:
                  type: array
                  items:
                    type: string
                    format: uuid
      responses:
        "200":
          description: The updated policy.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    enum:
                      - true
                  data:
                    $ref: "#/components/schemas/TenantAuthPolicy"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          description: sso_required/password_login_disabled without an eligible break-glass owner (BREAK_GLASS_REQUIRED).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
components:
  schemas:
    OwnSessionSummary:
      type: object
      description: One live session belonging to the caller. Carries no token, no raw IP and no raw User-Agent.
      required:
        - id
        - issuedAt
        - expiresAt
        - assuranceLevel
        - originAuth
        - current
      additionalProperties: false
      properties:
        id:
          type: string
          format: uuid
        issuedAt:
          type: string
          format: date-time
        expiresAt:
          type: string
          format: date-time
        assuranceLevel:
          type: string
          enum: [aal1, aal2]
        originAuth:
          type: string
          enum: [password, sso, handoff]
          description: How the session was issued. A step-up rotation carries the original value forward.
        clientIpHash:
          type: [string, "null"]
          description: Keyed, non-reversible pseudonym of the client IP. null when the deployment has no stable AUTH_IP_HASH_SECRET.
        userAgentSummary:
          type: [string, "null"]
        current:
          type: boolean
          description: True for the session this request is authenticated by.
    TenantUserSessionSummary:
      type: object
      description: One live session of a named tenant user, as seen by an administrator. Same exclusions as OwnSessionSummary — no token, no raw IP, no raw User-Agent.
      required:
        - id
        - issuedAt
        - expiresAt
        - assuranceLevel
        - originAuth
        - isCallerSession
      additionalProperties: false
      properties:
        id:
          type: string
          format: uuid
        issuedAt:
          type: string
          format: date-time
        expiresAt:
          type: string
          format: date-time
        assuranceLevel:
          type: string
          enum: [aal1, aal2]
        originAuth:
          type: string
          enum: [password, sso, handoff]
        clientIpHash:
          type: [string, "null"]
          description: Keyed, non-reversible pseudonym of the client IP. null when the deployment has no stable AUTH_IP_HASH_SECRET.
        userAgentSummary:
          type: [string, "null"]
        isCallerSession:
          type: boolean
          description: True only when the endpoint is pointed at the caller's own tenant user AND this row is the session making the request.
    IssueSessionHandoffRequest:
      type: object
      required:
        - clientKey
        - redirectUri
      properties:
        clientKey:
          type: string
          description: The registered BFF client's public key. Not a secret, and never treated as one — the secret authenticates at redeem time.
        redirectUri:
          type: string
          format: uri
          description: Must appear EXACTLY in the client's registered allow-list. https only, no query, no fragment.
    SessionHandoffCodeIssued:
      type: object
      properties:
        code:
          type: string
          description: Single-use, ≤60 second lifetime. Returned once and never stored in clear text.
        redirectUri:
          type: string
          format: uri
          description: The URI the code is bound to. Redemption must present the same value.
        expiresAt:
          type: string
          format: date-time
    RedeemSessionHandoffRequest:
      type: object
      required:
        - clientKey
        - clientSecret
        - code
        - redirectUri
      properties:
        clientKey:
          type: string
        clientSecret:
          type: string
          description: Server-to-server only. A browser must never hold this.
        code:
          type: string
        redirectUri:
          type: string
          format: uri
          description: Must equal the URI the code was issued against.
    SessionHandoffRedeemed:
      type: object
      properties:
        token:
          type: string
          description: A session token for the human who authenticated. Store it SERVER-SIDE; it must never reach a browser.
        expiresAt:
          type: string
          format: date-time
        assuranceLevel:
          type: string
          enum: [aal1, aal2]
          description: Inherited from the original login, never above it.
    MachineCredential:
      type: object
      description: A read-only machine credential (ADR-0049). Never carries the token or its hash — an operator tracing a leak needs to know which credential is alive and whether anything still uses it, and none of that requires secret material.
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        tenantUserId:
          type: string
          format: uuid
          description: The service account this credential authenticates AS. Its roles, narrowed by allowedPermissionKeys, are the whole of what the credential may do.
        allowedPermissionKeys:
          type: array
          description: NARROWING filter — effective permissions are the intersection with what the service account holds. It can never widen them.
          items:
            type: string
        expiresAt:
          type: string
          format: date-time
        lastUsedAt:
          type: string
          format: date-time
          nullable: true
          description: Refreshed at most hourly, so an idle or leaked credential is visible without a write on every request.
        revokedAt:
          type: string
          format: date-time
          nullable: true
        createdByTenantUserId:
          type: string
          format: uuid
        createdAt:
          type: string
          format: date-time
        status:
          type: string
          description: Derived from the clock and revokedAt, not stored.
          enum:
            - active
            - expired
            - revoked
    IssueMachineCredentialRequest:
      type: object
      required:
        - name
        - tenantUserId
        - allowedPermissionKeys
        - expiresAt
      properties:
        name:
          type: string
          maxLength: 120
          description: Operator-facing label, e.g. "awcms-astro build feed".
        tenantUserId:
          type: string
          format: uuid
          description: An existing tenant user in THIS tenant (the service account).
        allowedPermissionKeys:
          type: array
          minItems: 1
          maxItems: 50
          description: Permission keys (`module.activity.action`) this credential may use. Required and non-empty — an empty list means "can do nothing", never "unrestricted".
          items:
            type: string
        expiresAt:
          type: string
          format: date-time
          description: Required, in the future, at most 365 days away. There is no perpetual credential.
    SessionIntrospection:
      type: object
      description: Safe claims for a live session (ADR-0049 §7). Deliberately excludes the raw login identifier that GET /api/v1/auth/me returns.
      properties:
        identityId:
          type: string
          format: uuid
        tenantId:
          type: string
          format: uuid
        displayName:
          type: string
        roles:
          type: array
          items:
            type: string
        assuranceLevel:
          type: string
          enum:
            - aal1
            - aal2
        expiresAt:
          type: string
          format: date-time
        scopes:
          type: array
          description: Active, effective-dated business-scope references — the same evaluation the authorization layer uses.
          items:
            type: object
            properties:
              scopeType:
                type: string
              scopeId:
                type: string
                format: uuid
    RegistrationRequest:
      type: object
      description: A pending self-registration request. The login identifier is masked — the raw address is never returned in a list.
      properties:
        id:
          type: string
          format: uuid
        loginIdentifierMasked:
          type: string
        displayName:
          type: string
        requestedAt:
          type: string
          format: date-time
    SsoProvider:
      type: object
      description: A tenant OIDC SSO provider. The client secret is never included — only whether one is configured and, for the env-referenced case, the variable name.
      properties:
        id:
          type: string
          format: uuid
        providerKey:
          type: string
        providerType:
          type: string
        displayName:
          type: string
        issuerUrl:
          type: string
        clientId:
          type: string
        secretSource:
          type: string
          enum:
            - encrypted
            - env
        clientSecretEnvVar:
          type: string
          nullable: true
        scopes:
          type: string
        allowedEmailDomains:
          type: array
          items:
            type: string
        enabled:
          type: boolean
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    TenantAuthPolicy:
      type: object
      properties:
        tenantId:
          type: string
          format: uuid
        passwordLoginEnabled:
          type: boolean
        ssoEnabled:
          type: boolean
        ssoRequired:
          type: boolean
        autoLinkVerifiedEmail:
          type: boolean
        jitProvisioningEnabled:
          type: boolean
        allowedEmailDomains:
          type: array
          items:
            type: string
        breakGlassIdentityIds:
          type: array
          items:
            type: string
            format: uuid
        updatedAt:
          type: string
          format: date-time
          nullable: true
    TenantMfaPolicy:
      type: object
      properties:
        tenantId:
          type: string
          format: uuid
        enforcementLevel:
          type: string
          enum:
            - optional
            - required_for_privileged
            - required_for_all
        updatedAt:
          type: string
          format: date-time
          nullable: true
    AbacPolicy:
      type: object
      properties:
        id:
          type: string
          format: uuid
        policyCode:
          type: string
        effect:
          type: string
          enum:
            - allow
            - deny
        description:
          type: string
          nullable: true
        isActive:
          type: boolean
    AbacDslPolicyConditions:
      type: object
      description: >-
        A bounded, deterministic condition AST (Issue #179). A node is either a
        composition — exactly one of `allOf` (array; empty = true), `anyOf`
        (array; empty = false), or `not` (a single node) — or a leaf
        `{ attr, op, value | valueAttr }` over the server-side attribute
        allow-list (`subject.*`, `resource.*`, `action`, `env.*`) with the
        bounded operator set (eq, ne, in, nin, lt, lte, gt, gte, exists). No
        regex, functions, or arbitrary expressions. Depth ≤ 32, ≤ 512 nodes.
      additionalProperties: true
    AbacDslPolicy:
      type: object
      description: One stored dynamic ABAC (DSL) policy (Issue #179). Applicability fields are wildcards when null.
      properties:
        id:
          type: string
          format: uuid
        policyCode:
          type: string
        effect:
          type: string
          enum:
            - allow
            - deny
        description:
          type: string
          nullable: true
        moduleKey:
          type: string
          nullable: true
        activityCode:
          type: string
          nullable: true
        action:
          type: string
          nullable: true
        resourceType:
          type: string
          nullable: true
        dslVersion:
          type: integer
        priority:
          type: integer
        conditions:
          $ref: "#/components/schemas/AbacDslPolicyConditions"
        isActive:
          type: boolean
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    AbacDslPolicyWriteRequest:
      type: object
      required:
        - policyCode
        - effect
        - conditions
      properties:
        policyCode:
          type: string
          description: 3-100 chars, alphanumerics plus . _ - (not at the edges).
        effect:
          type: string
          enum:
            - allow
            - deny
        description:
          type: string
          nullable: true
        moduleKey:
          type: string
          nullable: true
          description: Applicability filter — null is a wildcard.
        activityCode:
          type: string
          nullable: true
        action:
          type: string
          nullable: true
        resourceType:
          type: string
          nullable: true
        dslVersion:
          type: integer
          description: Defaults to the current DSL version (1). A value newer than supported is rejected.
        priority:
          type: integer
          description: Lower evaluates first (deterministic). Defaults to 100.
        conditions:
          $ref: "#/components/schemas/AbacDslPolicyConditions"
        isActive:
          type: boolean
          description: On create only — author enabled immediately. Defaults to false (author, then enable).
    AbacSimulationRequest:
      type: object
      required:
        - request
      properties:
        subject:
          type: object
          properties:
            tenantUserId:
              type: string
              format: uuid
              nullable: true
              description: Simulate an EXISTING tenant user (resolves their real roles). Different from the caller requires identity_access.access_control.read.
            roles:
              type: array
              items:
                type: string
              description: Simulate a hypothetical role-code set instead of an existing user.
        request:
          type: object
          required:
            - moduleKey
            - activityCode
            - action
          properties:
            moduleKey:
              type: string
            activityCode:
              type: string
            action:
              type: string
            resourceType:
              type: string
              nullable: true
            resourceAttributes:
              type: object
              additionalProperties: true
              description: Hypothetical resource attributes (treated as server-verified).
        environment:
          type: object
          properties:
            ipTrusted:
              type: boolean
            now:
              type: string
              format: date-time
              nullable: true
    AbacSimulationResponse:
      type: object
      properties:
        decision:
          type: object
          properties:
            allowed:
              type: boolean
            reason:
              type: string
            matchedPolicy:
              type: string
              nullable: true
            matchedPolicyVersion:
              type: integer
              nullable: true
        evaluatedPolicies:
          type: array
          description: Per-policy structural trace — booleans only, never attribute VALUES (no PII).
          items:
            type: object
            properties:
              policyCode:
                type: string
              effect:
                type: string
                enum:
                  - allow
                  - deny
              dslVersion:
                type: integer
              priority:
                type: integer
              applicable:
                type: boolean
              conditionSatisfied:
                type: boolean
                nullable: true
              invalid:
                type: boolean
        subject:
          type: object
          properties:
            tenantUserId:
              type: string
            roles:
              type: array
              items:
                type: string
    AccessEvaluateRequest:
      type: object
      required:
        - moduleKey
        - activityCode
        - action
      properties:
        moduleKey:
          type: string
        activityCode:
          type: string
        action:
          type: string
        resourceType:
          type: string
        resourceId:
          type: string
          format: uuid
        resourceAttributes:
          type: object
          additionalProperties: true
    AccessEvaluateResponse:
      type: object
      properties:
        allowed:
          type: boolean
        reason:
          type: string
        matchedPolicy:
          type: string
          nullable: true
        matchedPolicyVersion:
          type: integer
          nullable: true
    Role:
      type: object
      properties:
        id:
          type: string
          format: uuid
        roleCode:
          type: string
        roleName:
          type: string
        isSystem:
          type: boolean
        permissionCount:
          type: integer
    TenantUserMasked:
      type: object
      properties:
        id:
          type: string
          format: uuid
        loginIdentifierMasked:
          type: string
          description: Masked login identifier — PII is never returned raw in a list.
        status:
          type: string
        roles:
          type: array
          items:
            type: string
          description: Assigned role codes (empty when the user holds no role).
    BusinessScopeAssignment:
      type: object
      description: One business-scope assignment (Issue #180) — a subject granted a role/permission context restricted to one generic business scope, with effective dating and a lifecycle status.
      properties:
        id:
          type: string
          format: uuid
        tenantId:
          type: string
          format: uuid
        tenantUserId:
          type: string
          format: uuid
        roleId:
          type: string
          format: uuid
          nullable: true
        scopeType:
          type: string
        scopeId:
          type: string
          format: uuid
        effectiveFrom:
          type: string
          format: date-time
        effectiveTo:
          type: string
          format: date-time
          nullable: true
        isTemporary:
          type: boolean
        reason:
          type: string
          nullable: true
        grantedByTenantUserId:
          type: string
          format: uuid
        approvedByTenantUserId:
          type: string
          format: uuid
          nullable: true
        status:
          type: string
          enum:
            - active
            - expired
            - revoked
        revokedAt:
          type: string
          format: date-time
          nullable: true
        revokedByTenantUserId:
          type: string
          format: uuid
          nullable: true
        revokeReason:
          type: string
          nullable: true
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    SoDConflictEvaluation:
      type: object
      description: One append-only segregation-of-duties conflict-check decision log entry (Issue #181). Safe projection — no request/resource payload.
      properties:
        id:
          type: string
          format: uuid
        ruleKey:
          type: string
        subjectTenantUserId:
          type: string
          format: uuid
          nullable: true
        triggerContext:
          type: string
          enum:
            - assignment_create
            - high_risk_decision
        conflictDetected:
          type: boolean
        resolvedVia:
          type: string
          enum:
            - none
            - exception
            - denied
        decisionReason:
          type: string
        occurredAt:
          type: string
          format: date-time
    SoDConflictException:
      type: object
      description: One segregation-of-duties conflict exception (Issue #181) — a scope-bound, time-bound, revocable, audited override to a detected conflict.
      properties:
        id:
          type: string
          format: uuid
        tenantId:
          type: string
          format: uuid
        ruleKey:
          type: string
        subjectTenantUserId:
          type: string
          format: uuid
        scopeType:
          type: string
          nullable: true
        scopeId:
          type: string
          format: uuid
          nullable: true
        justification:
          type: string
        requestedByTenantUserId:
          type: string
          format: uuid
        approvedByTenantUserId:
          type: string
          format: uuid
          nullable: true
        status:
          type: string
          enum:
            - pending
            - approved
            - rejected
            - expired
            - revoked
        effectiveFrom:
          type: string
          format: date-time
        effectiveTo:
          type: string
          format: date-time
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
