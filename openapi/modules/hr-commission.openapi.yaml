              schema:
                $ref: "#/components/schemas/ApiError"
  /api/v1/hr-commission/accruals/{id}/approve:
    post:
      operationId: hrCommissionAccrualApprove
      tags:
        - HR Commission
      summary: Approve a pending commission accrual
      description: "Gated by `hr_commission.accruals.approve` (high-risk). `pending` -> `approved`. Segregation of duties, also enforced by a database trigger: the beneficiary (the employment's own login) cannot approve their own accrual (`403 APPROVE_OWN_ACCRUAL_FORBIDDEN`) and whoever created the accrual cannot approve it (`403 SEGREGATION_OF_DUTIES`). Body: none. Requires an Idempotency-Key; replaying it returns the stored response. A transition the status does not allow is 409 `ACCRUAL_INVALID_STATE`. Audited at warning severity (employment, rule key and version, from and to status; never an amount). The beneficiary is identified by the employment's login now AND the login snapshotted when the accrual was created, so unlinking the login changes nothing; when the employment has neither, the transition is refused as 409 `BENEFICIARY_LOGIN_UNRESOLVED` until a login is linked (fail closed)."
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - $ref: "#/components/parameters/IdempotencyKey"
        - $ref: "#/components/parameters/CorrelationId"
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
      responses:
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: Forbidden, APPROVE_OWN_ACCRUAL_FORBIDDEN or SEGREGATION_OF_DUTIES.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "200":
          description: The accrual after the transition.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    enum:
                      - true
                  data:
                    $ref: "#/components/schemas/HrCommissionAccrual"
                  meta:
                    type: object
        "404":
          description: RESOURCE_NOT_FOUND.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "409":
          description: IDEMPOTENCY_CONFLICT, ACCRUAL_INVALID_STATE or BENEFICIARY_LOGIN_UNRESOLVED.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /api/v1/hr-commission/accruals/{id}/release:
    post:
      operationId: hrCommissionAccrualRelease
      tags:
        - HR Commission
      summary: Release an approved accrual as payable
      description: "Gated by `hr_commission.accruals.release` (high-risk). `approved` -> `payable`: from here payroll may pay it. The beneficiary cannot release their own accrual (`403 SEGREGATION_OF_DUTIES`). Body: none. Requires an Idempotency-Key; replaying it returns the stored response. A transition the status does not allow is 409 `ACCRUAL_INVALID_STATE`. Audited at warning severity (employment, rule key and version, from and to status; never an amount). The beneficiary is identified by the employment's login now AND the login snapshotted when the accrual was created, so unlinking the login changes nothing; when the employment has neither, the transition is refused as 409 `BENEFICIARY_LOGIN_UNRESOLVED` until a login is linked (fail closed)."
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - $ref: "#/components/parameters/IdempotencyKey"
        - $ref: "#/components/parameters/CorrelationId"
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
      responses:
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: Forbidden, or SEGREGATION_OF_DUTIES.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "200":
          description: The accrual after the transition.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    enum:
                      - true
                  data:
                    $ref: "#/components/schemas/HrCommissionAccrual"
                  meta:
                    type: object
        "404":
          description: RESOURCE_NOT_FOUND.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "409":
          description: IDEMPOTENCY_CONFLICT, ACCRUAL_INVALID_STATE or BENEFICIARY_LOGIN_UNRESOLVED.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /api/v1/hr-commission/accruals/{id}/void:
    post:
      operationId: hrCommissionAccrualVoid
      tags:
        - HR Commission
      summary: Void a pending or approved accrual
      description: "Gated by `hr_commission.accruals.cancel` (high-risk). `pending` or `approved` -> `voided`. No money has moved, so no compensating row exists. A voided accrual can never be approved, released or paid, and its source identity stays taken PERMANENTLY: a redelivery returns the voided original and the commission cannot be re-earned for that source until reversal and a re-accrual path exist (a known gap, #962 and the reversal phase). Optional `reasonCode` is a short code, never free text. Requires an Idempotency-Key; replaying it returns the stored response. A transition the status does not allow is 409 `ACCRUAL_INVALID_STATE`. Audited at warning severity (employment, rule key and version, from and to status; never an amount)."
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - $ref: "#/components/parameters/IdempotencyKey"
        - $ref: "#/components/parameters/CorrelationId"
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/HrCommissionAccrualVoidInput"
      responses:
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: Forbidden, or SEGREGATION_OF_DUTIES.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "200":
          description: The accrual after the transition.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    enum:
                      - true
                  data:
                    $ref: "#/components/schemas/HrCommissionAccrual"
                  meta:
                    type: object
        "404":
          description: RESOURCE_NOT_FOUND.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "409":
          description: IDEMPOTENCY_CONFLICT or ACCRUAL_INVALID_STATE.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /api/v1/hr-commission/accruals/{id}/pay:
    post:
      operationId: hrCommissionAccrualPay
      tags:
        - HR Commission
      summary: Record that a payable accrual has been paid
      description: "Gated by `hr_commission.accruals.pay` (high-risk). `payable` -> `paid`, terminal: an accrual is paid once. Whoever approved the accrual, and the beneficiary, cannot pay it (`403 SEGREGATION_OF_DUTIES`). Optional `paymentReference` is an opaque reference (a payout batch), never an account number. Requires an Idempotency-Key; replaying it returns the stored response. A transition the status does not allow is 409 `ACCRUAL_INVALID_STATE`. Audited at warning severity (employment, rule key and version, from and to status; never an amount). The beneficiary is identified by the employment's login now AND the login snapshotted when the accrual was created, so unlinking the login changes nothing; when the employment has neither, the transition is refused as 409 `BENEFICIARY_LOGIN_UNRESOLVED` until a login is linked (fail closed)."
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - $ref: "#/components/parameters/IdempotencyKey"
        - $ref: "#/components/parameters/CorrelationId"
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/HrCommissionAccrualPayInput"
      responses:
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: Forbidden, or SEGREGATION_OF_DUTIES.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "200":
          description: The accrual after the transition.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    enum:
                      - true
                  data:
                    $ref: "#/components/schemas/HrCommissionAccrual"
                  meta:
                    type: object
        "404":
          description: RESOURCE_NOT_FOUND.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "409":
          description: IDEMPOTENCY_CONFLICT, ACCRUAL_INVALID_STATE or BENEFICIARY_LOGIN_UNRESOLVED.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
components:
  schemas:
    HrCommissionRuleFields:
      type: object
      description:
        The editable terms of a rule version. Money is a decimal STRING. PERCENT needs `rate` (2.5
        means 2.5 %, at most 6 fractional digits, 0 to 100) and no `fixedAmount`; FIXED needs
        `fixedAmount` (per unit) and no `rate`. `minAmount` and `maxAmount` clamp the ROUNDED
        commission and carry no more fractional digits than `roundingScale`. The window is
        half-open, `effectiveTo` exclusive; omit it for an open-ended version.
      required:
        - name
        - sourceType
        - calculation
        - currencyCode
        - roundingMode
        - roundingScale
        - effectiveFrom
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 120
        sourceType:
          type: string
          pattern: "^[a-z][a-z0-9_.-]{0,62}$"
        calculation:
          type: string
          enum:
            - percent
            - fixed
        rate:
          type: string
          nullable: true
          example: "2.5"
        fixedAmount:
          type: string
          nullable: true
          example: "10"
        minAmount:
          type: string
          nullable: true
        maxAmount:
          type: string
          nullable: true
        currencyCode:
          type: string
          pattern: "^[A-Z]{3}$"
        roundingMode:
          type: string
          enum:
            - half_up
            - half_down
            - half_even
            - up
            - down
            - ceiling
            - floor
        roundingScale:
          type: integer
          minimum: 0
          maximum: 6
        effectiveFrom:
          type: string
          format: date
        effectiveTo:
          type: string
          format: date
          nullable: true
    HrCommissionRuleInput:
      allOf:
        - $ref: "#/components/schemas/HrCommissionRuleFields"
        - type: object
          required:
            - expectedContentDigest
          properties:
            expectedContentDigest:
              type: string
              pattern: "^[0-9a-f]{64}$"
              description: The `contentDigest` of the version this edit is based on; a mismatch is 409 RULE_CHANGED.
    HrCommissionPublishInput:
      type: object
      required:
        - expectedContentDigest
      properties:
        expectedContentDigest:
          type: string
          pattern: "^[0-9a-f]{64}$"
          description: The `contentDigest` of the terms the publisher reviewed; a mismatch is 409 RULE_CHANGED.
        backdatedReason:
          type: string
          minLength: 1
          maxLength: 500
          description: Required when the window starts before today (UTC); stored on the rule, never in the audit log. Ignored otherwise.
    HrCommissionRuleCreateInput:
      allOf:
        - $ref: "#/components/schemas/HrCommissionRuleFields"
        - type: object
          required:
            - ruleKey
          properties:
            ruleKey:
              type: string
              pattern: "^[a-z][a-z0-9_.-]{0,62}$"
    HrCommissionRule:
      description:
        A commission rule version. Immutable once `published`; `retired` is terminal. The rule in
        force for an event is the published version whose window contains the event's own date.
      allOf:
        - $ref: "#/components/schemas/HrCommissionRuleFields"
        - type: object
          properties:
            id:
              type: string
              format: uuid
            ruleKey:
              type: string
            versionNo:
              type: integer
              minimum: 1
            status:
              type: string
              enum:
                - draft
                - published
                - retired
            contentDigest:
              type: string
              pattern: "^[0-9a-f]{64}$"
              description: SHA-256 version token of the editable terms (and key and version). Name it when editing or publishing.
            createdAt:
              type: string
              format: date-time
            publishedAt:
              type: string
              format: date-time
              nullable: true
            retiredAt:
              type: string
              format: date-time
              nullable: true
            publishBackdated:
              type: boolean
              description: The window started before the UTC date it was published on. Stamped by the database; cannot be asserted.
            backdatedReason:
              type: string
              nullable: true
              description: The publisher's reason for a back-dated window; null otherwise.
    HrCommissionAccrualStatus:
      type: string
      enum:
        - pending
        - approved
        - payable
        - paid
        - voided
    HrCommissionAccrualCreateInput:
      type: object
      additionalProperties: false
      required:
        - employmentId
        - ruleKey
        - source
        - currencyCode
        - occurredAt
        - occurredOn
      description: Exactly one of `baseAmount` (a percent rule) or `units` (a fixed rule). No amount, rule version, status or stamp is accepted.
      properties:
        employmentId:
          type: string
          format: uuid
          description: The beneficiary, an hr_workforce employment.
        ruleKey:
          type: string
          pattern: "^[a-z][a-z0-9_.-]{0,62}$"
        source:
          type: object
          additionalProperties: false
          required:
            - type
            - ref
          properties:
            type:
              type: string
              pattern: "^[a-z][a-z0-9_.-]{0,62}$"
              description: Must equal the rule's `sourceType`.
            ref:
              type: string
              pattern: "^[A-Za-z0-9_.:-]{1,200}$"
              description: Opaque to the ledger; the adapter keeps it stable.
            line:
              type: string
              pattern: "^[A-Za-z0-9_.:-]{0,64}$"
        baseAmount:
          type: string
          description: Non-negative decimal string, at most 12 integer and 6 fractional digits. A JSON number is refused.
          example: "1000.10"
        units:
          type: integer
          minimum: 0
          maximum: 1000000
        currencyCode:
          type: string
          pattern: "^[A-Z]{3}$"
          description: Must equal the rule's currency.
        occurredAt:
          type: string
          format: date-time
          description: The instant of the sale; not more than a day ahead of the server clock and not more than 730 days old.
        occurredOn:
          type: string
          format: date
          description: The sale's civil date in the tenant's own time, derived by the caller; within one day of the UTC date of `occurredAt`. Selects the rule version.
    HrCommissionAccrualVoidInput:
      type: object
      additionalProperties: false
      properties:
        reasonCode:
          type: string
          pattern: "^[a-z][a-z0-9_.-]{0,39}$"
    HrCommissionAccrualPayInput:
      type: object
      additionalProperties: false
      properties:
        paymentReference:
          type: string
          pattern: "^[A-Za-z0-9_.:/-]{1,64}$"
    HrCommissionAccrualCreated:
      type: object
      properties:
        success:
          type: boolean
          enum:
            - true
        data:
          type: object
          properties:
            replayed:
              type: boolean
            accrual:
              $ref: "#/components/schemas/HrCommissionAccrual"
        meta:
          type: object
    HrCommissionAccrual:
      description: One commission earned by one employment from one source event. The monetary facts are immutable by trigger; only `status` and its stamps advance. `amount` is a fixed-scale decimal string.
      type: object
      properties:
        id:
          type: string
          format: uuid
        employmentId:
          type: string
          format: uuid
        ruleId:
          type: string
          format: uuid
        ruleKey:
          type: string
        ruleVersion:
          type: integer
          minimum: 1
        status:
          $ref: "#/components/schemas/HrCommissionAccrualStatus"
        amount:
          type: string
          example: "25.000000"
        currencyCode:
          type: string
        sourceType:
          type: string
        sourceRef:
          type: string
        sourceLine:
          type: string
        operation:
          type: string
          enum:
            - accrue
        calculation:
          type: string
          enum:
            - percent
            - fixed
        baseAmount:
          type: string
          nullable: true
        units:
          type: integer
          nullable: true
        rate:
          type: string
          nullable: true
        fixedAmount:
          type: string
          nullable: true
        occurredAt:
          type: string
          format: date-time
        occurredOn:
          type: string
          format: date
        createdAt:
          type: string
          format: date-time
        approvedAt:
          type: string
          format: date-time
          nullable: true
        releasedAt:
          type: string
          format: date-time
          nullable: true
        paidAt:
          type: string
          format: date-time
          nullable: true
        paymentReference:
          type: string
          nullable: true
        voidedAt:
          type: string
          format: date-time
          nullable: true
        voidReasonCode:
          type: string
          nullable: true
    HrCommissionAccrualTransition:
      type: object
      properties:
        seq:
          type: integer
        fromStatus:
          allOf:
            - $ref: "#/components/schemas/HrCommissionAccrualStatus"
          nullable: true
        toStatus:
          $ref: "#/components/schemas/HrCommissionAccrualStatus"
        actorTenantUserId:
          type: string
          format: uuid
          nullable: true
        reasonCode:
          type: string
          nullable: true
        occurredAt:
          type: string
          format: date-time
