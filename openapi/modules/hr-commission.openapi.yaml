# Source fragment for the "hr_commission" module (Issue #950, ADR-0132).
#
# Owns every path whose operations carry this module's OpenAPI tag, plus every
# components.schemas entry referenced ONLY by this module's operations.
#
# A commission rule is jurisdiction-neutral, tenant-authored configuration. It
# references no person or employment. Every rate and amount is a decimal STRING:
# a JSON number is refused (400) because it has already been through a float.
# `status`, `versionNo` and the stamps are derived and can never be asserted by a
# client.
#
# NOT independently valid OpenAPI: $ref targets pointing at shared components
# only resolve after `bun run openapi:bundle` merges this file with the root
# fragment and every sibling module fragment. Edit this file, never the bundle.
paths:
  /api/v1/hr-commission/rules:
    get:
      operationId: hrCommissionRulesList
      tags:
        - HR Commission
      summary: List commission rule versions
      description: "Gated by `hr_commission.rules.read`. Newest first, keyset paginated (`cursor`), optionally filtered by `ruleKey` and `status`. Tenant-scoped (withTenant + RLS FORCE)."
      parameters:
        - name: ruleKey
          in: query
          required: false
          schema:
            type: string
            pattern: "^[a-z][a-z0-9_.-]{0,62}$"
        - name: status
          in: query
          required: false
          schema:
            type: string
            enum:
              - draft
              - published
              - retired
        - name: cursor
          in: query
          required: false
          schema:
            type: string
        - $ref: "#/components/parameters/CorrelationId"
      responses:
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "200":
          description: A page of rule versions.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    enum:
                      - true
                  data:
                    type: object
                    properties:
                      rules:
                        type: array
                        items:
                          $ref: "#/components/schemas/HrCommissionRule"
                      nextCursor:
                        type: string
                        nullable: true
                  meta:
                    type: object
    post:
      operationId: hrCommissionRuleCreate
      tags:
        - HR Commission
      summary: Create a draft commission rule version
      description: "Gated by `hr_commission.rules.create`. Creates a DRAFT; the version number is assigned (the next one for `ruleKey`, or 1) and the status is always `draft`. A draft never applies to anything. A body naming `status`, `versionNo`, a stamp, an employment or a JSON-number amount is a 400. Requires an Idempotency-Key. Audited (rule key and version only)."
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
        - $ref: "#/components/parameters/CorrelationId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/HrCommissionRuleCreateInput"
      responses:
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "201":
          description: The draft rule version.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    enum:
                      - true
                  data:
                    $ref: "#/components/schemas/HrCommissionRule"
                  meta:
                    type: object
        "409":
          description: IDEMPOTENCY_CONFLICT.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /api/v1/hr-commission/rules/{id}:
    get:
      operationId: hrCommissionRuleGet
      tags:
        - HR Commission
      summary: Get a commission rule version
      description: "Gated by `hr_commission.rules.read`."
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - $ref: "#/components/parameters/CorrelationId"
      responses:
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "200":
          description: The rule version.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    enum:
                      - true
                  data:
                    $ref: "#/components/schemas/HrCommissionRule"
                  meta:
                    type: object
        "404":
          description: RESOURCE_NOT_FOUND.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
    put:
      operationId: hrCommissionRuleUpdate
      tags:
        - HR Commission
      summary: Replace a draft commission rule version
      description: "Gated by `hr_commission.rules.update`. Replaces every editable field of a DRAFT; `ruleKey` and the version never change. The body names the `expectedContentDigest` of the version you were shown; if the terms changed since (another editor) it is `409 RULE_CHANGED` and nothing is written. A published or retired version is immutable (`409 RULE_NOT_DRAFT`, also enforced by a database trigger): create a new version instead. Replacing a draft with the same body is a no-op, so no Idempotency-Key is required. Audited (rule key and version only)."
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - $ref: "#/components/parameters/CorrelationId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/HrCommissionRuleInput"
      responses:
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "200":
          description: The updated draft.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    enum:
                      - true
                  data:
                    $ref: "#/components/schemas/HrCommissionRule"
                  meta:
                    type: object
        "404":
          description: RESOURCE_NOT_FOUND.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "409":
          description: RULE_NOT_DRAFT or RULE_CHANGED.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /api/v1/hr-commission/rules/{id}/publish:
    post:
      operationId: hrCommissionRulePublish
      tags:
        - HR Commission
      summary: Publish a commission rule version
      description: "Gated by `hr_commission.rules.publish` (high-risk). Makes a draft IMMUTABLE and eligible to apply. The body names the `expectedContentDigest` of the terms the publisher reviewed: if they changed since it is `409 RULE_CHANGED`. Maker / checker: whoever created or last edited the draft cannot publish it (`403 PUBLISH_BY_AUTHOR_FORBIDDEN`). Refused with 409 `RULE_WINDOW_OVERLAP`, naming the conflicting version, when its window overlaps another published version of the same rule (race-safe: concurrent publishes serialise). Requires an Idempotency-Key; replaying it returns the stored response. Audited at warning severity (rule key, version, window and the content digest of what was published — never a rate or an amount). Publishing a version whose window starts in the past is not specially gated in this phase: no ledger consumes rules yet, and the guard belongs with the accrual issue (docs/awcms/hr-payroll.md section 6)."
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - $ref: "#/components/parameters/IdempotencyKey"
        - $ref: "#/components/parameters/CorrelationId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/HrCommissionPublishInput"
      responses:
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: Forbidden, or PUBLISH_BY_AUTHOR_FORBIDDEN (the creator or last editor of the draft may not publish it).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "200":
          description: The published rule version.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    enum:
                      - true
                  data:
                    $ref: "#/components/schemas/HrCommissionRule"
                  meta:
                    type: object
        "404":
          description: RESOURCE_NOT_FOUND.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "409":
          description: IDEMPOTENCY_CONFLICT, RULE_NOT_DRAFT, RULE_CHANGED or RULE_WINDOW_OVERLAP.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /api/v1/hr-commission/rules/{id}/retire:
    post:
      operationId: hrCommissionRuleRetire
      tags:
        - HR Commission
      summary: Retire a commission rule version
      description: "Gated by `hr_commission.rules.retire` (high-risk). Withdraws a draft (abandoning it) or a published version (it no longer applies to new events). Terminal: a retired version never changes again. Requires an Idempotency-Key. Audited at warning severity."
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - $ref: "#/components/parameters/IdempotencyKey"
        - $ref: "#/components/parameters/CorrelationId"
      responses:
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "200":
          description: The retired rule version.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    enum:
                      - true
                  data:
                    $ref: "#/components/schemas/HrCommissionRule"
                  meta:
                    type: object
        "404":
          description: RESOURCE_NOT_FOUND.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "409":
          description: IDEMPOTENCY_CONFLICT or RULE_ALREADY_RETIRED.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
components:
  schemas:
    HrCommissionRuleFields:
      type: object
      description:
        The editable terms of a rule version. Money is a decimal STRING. PERCENT needs `rate` (2.5
        means 2.5 %, at most 6 fractional digits, 0 to 100) and no `fixedAmount`; FIXED needs
        `fixedAmount` (per unit) and no `rate`. `minAmount` and `maxAmount` clamp the ROUNDED
        commission and carry no more fractional digits than `roundingScale`. The window is
        half-open, `effectiveTo` exclusive; omit it for an open-ended version.
      required:
        - name
        - sourceType
        - calculation
        - currencyCode
        - roundingMode
        - roundingScale
        - effectiveFrom
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 120
        sourceType:
          type: string
          pattern: "^[a-z][a-z0-9_.-]{0,62}$"
        calculation:
          type: string
          enum:
            - percent
            - fixed
        rate:
          type: string
          nullable: true
          example: "2.5"
        fixedAmount:
          type: string
          nullable: true
          example: "10"
        minAmount:
          type: string
          nullable: true
        maxAmount:
          type: string
          nullable: true
        currencyCode:
          type: string
          pattern: "^[A-Z]{3}$"
        roundingMode:
          type: string
          enum:
            - half_up
            - half_down
            - half_even
            - up
            - down
            - ceiling
            - floor
        roundingScale:
          type: integer
          minimum: 0
          maximum: 6
        effectiveFrom:
          type: string
          format: date
        effectiveTo:
          type: string
          format: date
          nullable: true
    HrCommissionRuleInput:
      allOf:
        - $ref: "#/components/schemas/HrCommissionRuleFields"
        - type: object
          required:
            - expectedContentDigest
          properties:
            expectedContentDigest:
              type: string
              pattern: "^[0-9a-f]{64}$"
              description: The `contentDigest` of the version this edit is based on; a mismatch is 409 RULE_CHANGED.
    HrCommissionPublishInput:
      type: object
      required:
        - expectedContentDigest
      properties:
        expectedContentDigest:
          type: string
          pattern: "^[0-9a-f]{64}$"
          description: The `contentDigest` of the terms the publisher reviewed; a mismatch is 409 RULE_CHANGED.
    HrCommissionRuleCreateInput:
      allOf:
        - $ref: "#/components/schemas/HrCommissionRuleFields"
        - type: object
          required:
            - ruleKey
          properties:
            ruleKey:
              type: string
              pattern: "^[a-z][a-z0-9_.-]{0,62}$"
    HrCommissionRule:
      description:
        A commission rule version. Immutable once `published`; `retired` is terminal. The rule in
        force for an event is the published version whose window contains the event's own date.
      allOf:
        - $ref: "#/components/schemas/HrCommissionRuleFields"
        - type: object
          properties:
            id:
              type: string
              format: uuid
            ruleKey:
              type: string
            versionNo:
              type: integer
              minimum: 1
            status:
              type: string
              enum:
                - draft
                - published
                - retired
            contentDigest:
              type: string
              pattern: "^[0-9a-f]{64}$"
              description: SHA-256 version token of the editable terms (and key and version). Name it when editing or publishing.
            createdAt:
              type: string
              format: date-time
            publishedAt:
              type: string
              format: date-time
              nullable: true
            retiredAt:
              type: string
              format: date-time
              nullable: true
