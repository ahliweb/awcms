        "403":
          $ref: "#/components/responses/Forbidden"
        "200":
          description: The accrual and its append-only transition log.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    enum:
                      - true
                  data:
                    type: object
                    properties:
                      accrual:
                        $ref: "#/components/schemas/HrCommissionAccrual"
                      transitions:
                        type: array
                        items:
                          $ref: "#/components/schemas/HrCommissionAccrualTransition"
                  meta:
                    type: object
        "404":
          description: RESOURCE_NOT_FOUND.
          content:
