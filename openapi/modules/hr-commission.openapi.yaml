# Source fragment for the "hr_commission" module (Issue #950, ADR-0132).
#
# Owns every path whose operations carry this module's OpenAPI tag, plus every
# components.schemas entry referenced ONLY by this module's operations.
#
# A commission rule is jurisdiction-neutral, tenant-authored configuration. It
# references no person or employment. The accrual LEDGER (Issue #951) records one
# commission per (source, employment); its amount is computed from the published
# rule in force on the event's own date and can never be asserted by a client. Every rate and amount is a decimal STRING:
# a JSON number is refused (400) because it has already been through a float.
# `status`, `versionNo` and the stamps are derived and can never be asserted by a
# client.
#
# NOT independently valid OpenAPI: $ref targets pointing at shared components
# only resolve after `bun run openapi:bundle` merges this file with the root
# fragment and every sibling module fragment. Edit this file, never the bundle.
paths:
  /api/v1/hr-commission/rules:
    get:
      operationId: hrCommissionRulesList
      tags:
        - HR Commission
      summary: List commission rule versions
      description: "Gated by `hr_commission.rules.read`. Newest first, keyset paginated (`cursor`), optionally filtered by `ruleKey` and `status`. Tenant-scoped (withTenant + RLS FORCE)."
      parameters:
        - name: ruleKey
          in: query
          required: false
          schema:
            type: string
            pattern: "^[a-z][a-z0-9_.-]{0,62}$"
        - name: status
          in: query
          required: false
          schema:
            type: string
            enum:
              - draft
              - published
              - retired
        - name: cursor
          in: query
          required: false
          schema:
            type: string
        - $ref: "#/components/parameters/CorrelationId"
      responses:
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "200":
          description: A page of rule versions.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    enum:
                      - true
                  data:
                    type: object
                    properties:
                      rules:
                        type: array
                        items:
                          $ref: "#/components/schemas/HrCommissionRule"
                      nextCursor:
                        type: string
                        nullable: true
                  meta:
                    type: object
    post:
      operationId: hrCommissionRuleCreate
      tags:
        - HR Commission
      summary: Create a draft commission rule version
      description: "Gated by `hr_commission.rules.create`. Creates a DRAFT; the version number is assigned (the next one for `ruleKey`, or 1) and the status is always `draft`. A draft never applies to anything. A body naming `status`, `versionNo`, a stamp, an employment or a JSON-number amount is a 400. Requires an Idempotency-Key. Audited (rule key and version only)."
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
        - $ref: "#/components/parameters/CorrelationId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/HrCommissionRuleCreateInput"
      responses:
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "201":
          description: The draft rule version.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    enum:
                      - true
                  data:
                    $ref: "#/components/schemas/HrCommissionRule"
                  meta:
                    type: object
        "409":
          description: IDEMPOTENCY_CONFLICT.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /api/v1/hr-commission/rules/{id}:
    get:
      operationId: hrCommissionRuleGet
      tags:
        - HR Commission
      summary: Get a commission rule version
      description: "Gated by `hr_commission.rules.read`."
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - $ref: "#/components/parameters/CorrelationId"
      responses:
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "200":
          description: The rule version.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    enum:
                      - true
                  data:
                    $ref: "#/components/schemas/HrCommissionRule"
                  meta:
                    type: object
        "404":
          description: RESOURCE_NOT_FOUND.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
    put:
      operationId: hrCommissionRuleUpdate
      tags:
        - HR Commission
      summary: Replace a draft commission rule version
      description: "Gated by `hr_commission.rules.update`. Replaces every editable field of a DRAFT; `ruleKey` and the version never change. The body names the `expectedContentDigest` of the version you were shown; if the terms changed since (another editor) it is `409 RULE_CHANGED` and nothing is written. A published or retired version is immutable (`409 RULE_NOT_DRAFT`, also enforced by a database trigger): create a new version instead. Replacing a draft with the same body is a no-op, so no Idempotency-Key is required. Audited (rule key and version only)."
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - $ref: "#/components/parameters/CorrelationId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/HrCommissionRuleInput"
      responses:
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "200":
          description: The updated draft.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    enum:
                      - true
                  data:
                    $ref: "#/components/schemas/HrCommissionRule"
                  meta:
                    type: object
        "404":
          description: RESOURCE_NOT_FOUND.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "409":
          description: RULE_NOT_DRAFT or RULE_CHANGED.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /api/v1/hr-commission/rules/{id}/publish:
    post:
      operationId: hrCommissionRulePublish
      tags:
        - HR Commission
      summary: Publish a commission rule version
      description: "Gated by `hr_commission.rules.publish` (high-risk). Makes a draft IMMUTABLE and eligible to apply. The body names the `expectedContentDigest` of the terms the publisher reviewed: if they changed since it is `409 RULE_CHANGED`. Maker / checker: whoever created or last edited the draft cannot publish it (`403 PUBLISH_BY_AUTHOR_FORBIDDEN`). Refused with 409 `RULE_WINDOW_OVERLAP`, naming the conflicting version, when its window overlaps another published version of the same rule (race-safe: concurrent publishes serialise). Requires an Idempotency-Key; replaying it returns the stored response. Audited at warning severity (rule key, version, window and the content digest of what was published — never a rate or an amount). A window that starts BEFORE TODAY (the UTC date of the publishing transaction) is back-dated: it changes which rule applies to events that already happened but are not accrued yet, so it needs a `backdatedReason` (409 `RULE_BACKDATED_REASON_REQUIRED` without one). The database stamps `publishBackdated` and keeps the reason on the rule; the audit row carries `backdated: true` and never the reason. Accruals that already exist are untouched. A reason sent for a window starting today or later is dropped."
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - $ref: "#/components/parameters/IdempotencyKey"
        - $ref: "#/components/parameters/CorrelationId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/HrCommissionPublishInput"
      responses:
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: Forbidden, or PUBLISH_BY_AUTHOR_FORBIDDEN (the creator or last editor of the draft may not publish it).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "200":
          description: The published rule version.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    enum:
                      - true
                  data:
                    $ref: "#/components/schemas/HrCommissionRule"
                  meta:
                    type: object
        "404":
          description: RESOURCE_NOT_FOUND.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "409":
          description: IDEMPOTENCY_CONFLICT, RULE_NOT_DRAFT, RULE_CHANGED, RULE_BACKDATED_REASON_REQUIRED or RULE_WINDOW_OVERLAP.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /api/v1/hr-commission/rules/{id}/retire:
    post:
      operationId: hrCommissionRuleRetire
      tags:
        - HR Commission
      summary: Retire a commission rule version
      description: "Gated by `hr_commission.rules.retire` (high-risk). Withdraws a draft (abandoning it) or a published version (it no longer applies to new events). Terminal: a retired version never changes again. Requires an Idempotency-Key. Audited at warning severity."
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - $ref: "#/components/parameters/IdempotencyKey"
        - $ref: "#/components/parameters/CorrelationId"
      responses:
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "200":
          description: The retired rule version.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    enum:
                      - true
                  data:
                    $ref: "#/components/schemas/HrCommissionRule"
                  meta:
                    type: object
        "404":
          description: RESOURCE_NOT_FOUND.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "409":
          description: IDEMPOTENCY_CONFLICT or RULE_ALREADY_RETIRED.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /api/v1/hr-commission/accruals:
    get:
      operationId: hrCommissionAccrualsList
      tags:
        - HR Commission
      summary: List commission accruals
      description: "Gated by `hr_commission.accruals.read`. Newest first, keyset paginated (`cursor`), optionally filtered by `employmentId`, `status` and `sourceType`. Amounts are decimal strings and a person's earnings, which is why the permission is its own. Tenant-scoped (withTenant + RLS FORCE)."
      parameters:
        - name: employmentId
          in: query
          required: false
          schema:
            type: string
            format: uuid
        - name: status
          in: query
          required: false
          schema:
            $ref: "#/components/schemas/HrCommissionAccrualStatus"
        - name: sourceType
          in: query
          required: false
          schema:
            type: string
            pattern: "^[a-z][a-z0-9_.-]{0,62}$"
        - name: cursor
          in: query
          required: false
          schema:
            type: string
        - $ref: "#/components/parameters/CorrelationId"
      responses:
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "200":
          description: A page of accruals.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    enum:
                      - true
                  data:
                    type: object
                    properties:
                      accruals:
                        type: array
                        items:
                          $ref: "#/components/schemas/HrCommissionAccrual"
                      nextCursor:
                        type: string
                        nullable: true
                  meta:
                    type: object
    post:
      operationId: hrCommissionAccrualCreate
      tags:
        - HR Commission
      summary: Report a sale fact and accrue its commission
      description: "Gated by `hr_commission.accruals.accrue` (high-risk, its own action so the action-time SoD check can be authored over who may post). Accrues the commission a source event earns an EMPLOYMENT, exactly once per `(source type, source ref, source line, employment)` (a database unique key, race-safe). The AMOUNT is computed from the PUBLISHED version of `ruleKey` whose window contains `occurredOn` (never now()), by exact decimal arithmetic; the body can never assert an amount, a rule version, a status or a stamp, and money is a decimal string (a JSON number is 400). `source.type` must equal the rule's source type and `currencyCode` its currency. A redelivery of the same canonical request returns the ORIGINAL with `replayed: true` (200) whatever Idempotency-Key it arrives under, also after the accrual was voided; the same source with a different amount, date, rule or currency is 409 `SOURCE_CONFLICT`. The employment must be live and employed on `occurredOn`, and the event at most 730 days old; the database recomputes the stored amount from the rule version and refuses a mismatch. Requires an Idempotency-Key. A NEW accrual is audited at info severity (employment, rule key and version, source type; never an amount, a base, a rate or a source reference); a replay audits nothing. The in-process adapter contract is `_shared/ports/commission-accrual-port.ts`. Employee commission only: affiliate and referral commission is not here."
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
        - $ref: "#/components/parameters/CorrelationId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/HrCommissionAccrualCreateInput"
      responses:
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "201":
          description: A new accrual, status `pending`.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HrCommissionAccrualCreated"
        "200":
          description: "The same source was already accrued for this employment with the same request; the original is returned (`replayed: true`)."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HrCommissionAccrualCreated"
        "404":
          description: EMPLOYMENT_NOT_FOUND.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "409":
          description: IDEMPOTENCY_CONFLICT, SOURCE_CONFLICT, NO_EFFECTIVE_RULE, RULE_AMBIGUOUS, SOURCE_TYPE_MISMATCH, CURRENCY_MISMATCH or EMPLOYMENT_NOT_ELIGIBLE.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /api/v1/hr-commission/accruals/{id}:
    get:
      operationId: hrCommissionAccrualGet
      tags:
        - HR Commission
      summary: Get a commission accrual with its transition history
      description: "Gated by `hr_commission.accruals.read`."
      parameters:
        - name: id
          in: path
          required: true
