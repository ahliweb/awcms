# Source fragment for the "whatsapp_delivery" module (Issue #963, ADR-0133).
#
# Owns every path whose operations carry this module's OpenAPI tag, plus every
# components.schemas entry referenced ONLY by this module's operations. Schemas
# shared by 2+ modules (or referenced by none) live in the root fragment
# (openapi/awcms-public-api.src.yaml) instead.
#
# NOT independently valid OpenAPI: $ref targets pointing at shared components
# (securitySchemes/parameters/responses) only resolve after
# `bun run openapi:bundle` merges this file with the root fragment and every
# sibling module fragment into openapi/awcms-public-api.openapi.yaml. Edit this
# file (or the root fragment for shared components), never the generated bundle.
#
# ## What is deliberately NOT here
#
# There is no "send a message" or "enqueue" endpoint. Queueing is a capability
# port call (`WhatsappDeliveryPort`, `_shared/ports/whatsapp-delivery-port.ts`)
# made in the CONSUMER's own transaction and authorised by the consumer's own
# permission for its own business action. Nothing on this surface ever returns a
# phone number, a message body or a template variable: recipients are masked.
#
# ## Sender routing (Issue #1141, ADR-0148 section 4)
#
# Two operations are ADDED, and one projection gains two fields, additively
# (port 1.1.0; REST info version unchanged): `GET /senders` (per-sender
# diagnostics and the default-sender policy) and `PUT /sender-policy` (set a
# business scope's default sender, prospective, high-risk). A message's sender is
# an account id of the caller's own tenant and is never a token, a phone number id
# or a device id: no operation here accepts one.
#
# ## Meta multi-WABA senders (Issue #1143)
#
# Four operations are ADDED (port 1.3.0; REST info version unchanged): the
# per-WABA template approvals (`GET`/`PUT /meta-templates`), clearing a WABA
# restriction (`POST /meta-signals/{id}/clear-restriction`) and the PUBLIC Meta
# webhook (`GET`/`POST /webhooks/meta/{token}`), authenticated by the opaque
# per-account callback token AND `X-Hub-Signature-256`, never by a session.
paths:
  /api/v1/whatsapp/diagnostics:
    get:
      operationId: getWhatsappDiagnostics
      tags:
        - WhatsApp Delivery
      summary: The tenant's WhatsApp queue - counts, recent messages, attempts.
      description: >-
        One endpoint rather than three because the parts are only readable together:
        they come from ONE transaction, so a queue count and a message list can
        never describe two different instants. Bounded rather than paginated; the
        historical tail is removed by retention (`bun run whatsapp:queue:purge`),
        not browsed, and `hasMoreMessages` says when the list was cut. Recipients
        are MASKED and message bodies and variables are never projected (a security-
        class body can hold an OTP until it is terminal). `configured` reports the
        DEPLOYMENT's flag and adapter name, which is what distinguishes a stuck
        queue from a deployment where WhatsApp is simply off. Requires
        `whatsapp_delivery.messages.read`.
      parameters:
        - name: status
          in: query
          required: false
          description: Narrow the message list to one queue status.
          schema:
            $ref: "#/components/schemas/WhatsappMessageStatus"
        - name: limit
          in: query
          required: false
          description: >-
            1-200, default 50. Out-of-range values are REJECTED rather than clamped.
          schema:
            type: integer
            minimum: 1
            maximum: 200
      responses:
        "200":
          description: WhatsApp queue diagnostics.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    enum:
                      - true
                  data:
                    $ref: "#/components/schemas/WhatsappDiagnostics"
                  meta:
                    type: object
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "422":
          description: >-
            `status` or `limit` is invalid.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /api/v1/whatsapp/senders:
    get:
      operationId: listWhatsappSenders
      tags:
        - WhatsApp Delivery
      summary: The tenant's WhatsApp senders with per-sender diagnostics, and the default-sender policy.
      description: >-
        One entry per sender that has any queue row in the last 35 days, plus the
        deployment sender (`senderAccountId: null`), from ONE transaction. Per
        sender: whether it may send a business-initiated message right now (a
        coarse reason code when it may not), the queue (waiting, in flight, failed
        in the last day, oldest waiting, last failure code) and the quota (what it
        really sent in the trailing hour and day against the per-sender caps, and
        whether it is `throttled`). A throttled or unavailable sender's rows WAIT or
        fail terminally; they are never rerouted to another sender, number or
        provider. Bounded to 200 senders. Nothing here is a credential, a secret
        reference, a phone number or a device id: a sender is its account id.
        Requires `whatsapp_delivery.senders.read`. Only what the caller may see
        by the rules of `channel_accounts` is returned: an account the caller is
        not assigned to (when it has assignees) or whose business scope the
        caller does not hold is left out, and a caller confined to business
        scopes gets neither the tenant-wide deployment lane nor the tenant-wide
        policy, nor a policy whose scope or sender they cannot see.
      responses:
        "200":
          description: Sender diagnostics and the default-sender policies.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    enum:
                      - true
                  data:
                    $ref: "#/components/schemas/WhatsappSenderDiagnostics"
                  meta:
                    type: object
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
  /api/v1/whatsapp/senders/{id}/progress:
    get:
      operationId: getWhatsappSenderProgress
      tags:
        - WhatsApp Delivery
      summary: Snapshot of one sender's delivery progress (the stream's REST snapshot and polling fallback).
      description: >-
        Issue #1171, ADR-0154. Counts per queue status for this sender, the 20
        most recently changed messages (id, status, when — never a number, a body,
        a template, a provider response or an error text) and the `cursor` a
        stream resumes from. It is the page's state with no stream, the polling
        fallback, and what a client re-fetches on `snapshot-required`. Requires
        `whatsapp_delivery.progress.read`, and the sender must be an account the
        caller may see by the rules of `channel_accounts` (assignment, business
        scope). An unknown id, another tenant's account and a hidden account are
        one answer: `404`. A caller confined to business scopes sees, through a
        tenant-wide sender, only the messages whose own business scope they
        hold (counts, `recent` and `cursor` alike); unscoped messages are not
        visible to them. `counts` covers messages created in the last 7 days
        (`countWindowDays`).
      parameters:
        - name: id
          in: path
          required: true
          description: The sender's channel account id (uuid).
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: The progress snapshot.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    enum:
                      - true
                  data:
                    $ref: "#/components/schemas/WhatsappSenderProgressSnapshot"
                  meta:
                    type: object
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
  /api/v1/whatsapp/senders/{id}/progress/stream:
    get:
      operationId: streamWhatsappSenderProgress
      tags:
        - WhatsApp Delivery
      summary: Server-Sent Events stream of one sender's delivery progress, re-authorized every tick.
      description: >-
        Issue #1171, ADR-0154. `text/event-stream` from the existing Bun process;
        there is no WebSocket. A projection of committed queue rows: a frame
        never causes a send, an enqueue or a status change.


        **Opening.** A present `Origin` that is not the site's own origin, or
        `Sec-Fetch-Site: cross-site`, or `Sec-Fetch-Mode: navigate`, is refused
        with `403 ORIGIN_REFUSED` before any work. Rows are filtered exactly as
        in the snapshot (business scope of a confined caller, 7-day counting
        window). The caller needs
        `whatsapp_delivery.progress.read` and must be able to see the sender
        (same rule as the snapshot); otherwise `401`/`403`/`404`, and no stream
        opens. Over the per-actor, per-tenant or per-instance cap the answer is
        `429 STREAM_CAPACITY_REACHED` with `Retry-After`, never a queued stream.
        A client resumes by sending the last event id back as `Last-Event-ID`
        (`EventSource` does this by itself).


        **Events.** Every data event carries `id: <cursor>` (a database keyset
        position). `progress` carries a `WhatsappSenderProgressFrame`: the
        current counts (coalesced, latest value per tick) and the messages that
        changed since the previous cursor, at most 50; a tick with nothing new
        writes a heartbeat comment instead. `snapshot-required` means re-fetch
        `GET /api/v1/whatsapp/senders/{id}/progress`: the `Last-Event-ID` was
        malformed, foreign or purged, or more than 50 messages changed at once.
        Terminal: `authorization-revoked` (do NOT reconnect; the role, the
        assignment, the business scope or the session ended — audited),
        `stream-error` (the database refused; back off with jitter),
        `slow-consumer` (the client fell behind and was evicted) and
        `stream-expired` (the 10-minute lifetime ended; reconnect with the
        cursor). Re-authorized every 5 s, which is also the revocation latency.
      parameters:
        - name: id
          in: path
          required: true
          description: The sender's channel account id (uuid).
          schema:
            type: string
            format: uuid
        - name: Last-Event-ID
          in: header
          required: false
          description: The cursor of the last event received, sent back on reconnect.
          schema:
            type: string
            maxLength: 256
      responses:
        "200":
          description: The event stream.
          content:
            text/event-stream:
              schema:
                type: string
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          description: A connection cap is reached; retry after `Retry-After` seconds or use the snapshot.
          headers:
            Retry-After:
              schema:
                type: integer
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "503":
          description: The database refused the opening transaction; retry later.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /api/v1/whatsapp/sender-policy:
    put:
      operationId: setWhatsappSenderPolicy
      tags:
        - WhatsApp Delivery
      summary: Set the default sender of a business scope (prospective).
      description: >-
        Sets which of the tenant's own accounts sends WhatsApp messages when the
        caller names none, for one business scope or tenant-wide
        (`businessScope: null`). `defaultSenderAccountId: null` is an explicit
        decision to use the deployment sender for that scope (it overrides a
        tenant-wide default). PROSPECTIVE: it applies to messages enqueued after the
        change; a message already queued keeps the sender and the `configVersion`
        it was given. Both keys are required. The sender must be an account of THIS
        tenant that may send a business-initiated message now and that has an
        adapter on this deployment; anything else, including another tenant's
        account, is the same `422 SENDER_UNAVAILABLE` (no existence oracle). A
        change to the same default is a no-op that bumps nothing (`changed:
        false`). High-risk: audited at `warning`. `Idempotency-Key` required. A
        missing `Idempotency-Key`, an oversized body or a body that is not valid
        JSON is answered (`400`/`413`) to any caller with a bearer token before the
        permission check; the request schema (the field-level `400`) is validated
        only after authorization. Requires
        `whatsapp_delivery.sender_policy.configure`.
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WhatsappSenderPolicyRequest"
      responses:
        "200":
          description: The policy as now configured.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    enum:
                      - true
                  data:
                    allOf:
                      - $ref: "#/components/schemas/WhatsappSenderPolicy"
                      - type: object
                        properties:
                          changed:
                            type: boolean
                  meta:
                    type: object
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          description: "`IDEMPOTENCY_CONFLICT`: the key was already used with a different request."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "413":
          description: Request body too large.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "422":
          description: >-
            `SENDER_UNAVAILABLE` (the account is not usable as a WhatsApp sender
            for this tenant) or `CHANNEL_ACCOUNTS_UNAVAILABLE`.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /api/v1/whatsapp/meta-templates:
    get:
      operationId: listWhatsappMetaTemplates
      tags:
        - WhatsApp Delivery
      summary: Meta template approvals per WABA, and each WABA's signals.
      description: >-
        Which Meta templates (name, language, category, Meta's own status) are
        recorded on which WABA account (`items`), and each WABA's latest
        restriction and messaging-limit tier as Meta reported them through a
        signed webhook (`signals`). Only WABA accounts the caller may see
        (`channel_accounts` assignments and business-scope confinement);
        default-deny when the channel module cannot be loaded. An evidence
        reference is never returned (only `hasEvidence`). A template is SENDABLE
        through a tenant-owned Meta number only when its row on THAT number's
        WABA is `APPROVED` or `REINSTATED` and its category matches the
        message's purpose (marketing MARKETING, transactional UTILITY, security
        AUTHENTICATION). Requires `whatsapp_delivery.meta_templates.read`.
      responses:
        "200":
          description: Template approvals and WABA signals.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    enum:
                      - true
                  data:
                    type: object
                    properties:
                      items:
                        type: array
                        items:
                          $ref: "#/components/schemas/WhatsappMetaTemplate"
                      signals:
                        type: array
                        items:
                          $ref: "#/components/schemas/WhatsappMetaSignal"
                  meta:
                    type: object
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
    put:
      operationId: recordWhatsappMetaTemplate
      tags:
        - WhatsApp Delivery
      summary: Record a Meta template's status on one WABA.
      description: >-
        An operator records what Meta shows for ONE template on ONE WABA account
        (bootstrap: Meta sends a status webhook only when a status CHANGES, so an
        already-approved template is recorded here). `status` is Meta's own
        vocabulary; `APPROVED`/`REINSTATED` require an `evidenceRef` (where the
        approval can be checked). A later signed Meta webhook with a newer event
        time overrides this record. The WABA must be a live `waba` account of
        THIS tenant that the caller operates; anything else is the same `422
        CONTAINER_NOT_FOUND`. HIGH-RISK (an approved row lets messages be sent
        with that template through that WABA's numbers): audited at `warning`,
        `Idempotency-Key` required. Requires
        `whatsapp_delivery.meta_templates.configure`.
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WhatsappMetaTemplateRequest"
      responses:
        "200":
          description: The template record as now stored.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    enum:
                      - true
                  data:
                    $ref: "#/components/schemas/WhatsappMetaTemplate"
                  meta:
                    type: object
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          description: "`IDEMPOTENCY_CONFLICT`: the key was already used with a different request."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "413":
          description: Request body too large.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "422":
          description: "`CONTAINER_NOT_FOUND`: not a live WABA account of this tenant that the caller operates."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /api/v1/whatsapp/meta-signals/{id}/clear-restriction:
    post:
      operationId: clearWhatsappMetaRestriction
      tags:
        - WhatsApp Delivery
      summary: Clear a recorded WABA restriction.
      description: >-
        Clears the restriction Meta reported for a WABA (`{id}` is the WABA
        account) after the operator verified at Meta that it was lifted. Meta's
        documented reversals (a ban `REINSTATE`, `ACCOUNT_RECONNECTED`) clear
        their own restriction automatically; a policy restriction, a deletion or
        an app uninstall is cleared only here. While restricted, the WABA's
        numbers are refused at enqueue (`SENDER_UNAVAILABLE`) and held at
        dispatch (bounded retries); nothing is rerouted to another number.
        HIGH-RISK: audited at `warning`, `Idempotency-Key` required. Requires
        `whatsapp_delivery.meta_signals.configure`.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - $ref: "#/components/parameters/IdempotencyKey"
      responses:
        "200":
          description: The restriction was cleared.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    enum:
                      - true
                  data:
                    type: object
                    properties:
                      containerAccountId:
                        type: string
                        format: uuid
                      cleared:
                        type: boolean
                  meta:
                    type: object
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: "`NOT_RESTRICTED` (nothing to clear) or `IDEMPOTENCY_CONFLICT`."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /api/v1/whatsapp/webhooks/meta/{token}:
    parameters:
      - name: token
        in: path
        required: true
        description: >-
          The opaque per-account callback token
          (`wcb1.<tenant uuid>.<subscription uuid>.<43 base64url characters>`),
          shown once by `POST /api/v1/channel-accounts/accounts/{id}/webhook-subscription`.
          Tenant and account are resolved from it, never from the payload; only
          its SHA-256 is stored.
        schema:
          type: string
          maxLength: 160
    get:
      operationId: verifyWhatsappMetaWebhook
      tags:
        - WhatsApp Delivery
      security: []
      summary: Meta's webhook subscription handshake.
      description: >-
        Meta calls it once when the callback URL is configured. Answers the
        `hub.challenge` as plain text only when `hub.mode` is `subscribe`, the
        token names an ACTIVE signed subscription, and `hub.verify_token` equals
        the callback token itself (constant time). Anything else is `403`. `404`
        when `WHATSAPP_ENABLED` is not `true`.
      parameters:
        - name: hub.mode
          in: query
          required: true
          schema:
            type: string
            enum:
              - subscribe
        - name: hub.verify_token
          in: query
          required: true
          schema:
            type: string
        - name: hub.challenge
          in: query
          required: true
          schema:
            type: string
            pattern: "^[A-Za-z0-9._-]{1,256}$"
      responses:
        "200":
          description: The challenge, echoed.
          content:
            text/plain:
              schema:
                type: string
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          description: Too many attempts from this address for this tenant.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "503":
          description: Temporarily unavailable.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
    post:
      operationId: receiveWhatsappMetaWebhook
      tags:
        - WhatsApp Delivery
      security: []
      summary: Meta Cloud API webhooks for one tenant-owned number.
      description: >-
        Called by Meta, never by a person or a browser. Authenticated by TWO
        facts, both compared in constant time: the callback token in the path
        and `X-Hub-Signature-256`, the HMAC-SHA256 of the exact request body
        under that number's Meta app secret (stored write-only). Order: (1)
        `404` when `WHATSAPP_ENABLED` is not `true`; (2) a per-(tenant of the
        token, address) attempt bucket BEFORE any database work, `429` with
        `retry-after` when exhausted (Meta retries a non-200, so nothing is
        dropped, only delayed); (3) the body, capped at 128 KiB; (4) in the
        token's tenant transaction, verification (a bad token, an inactive or
        rotated subscription, a number without a live WABA, a missing app
        secret, or a wrong or missing signature are ONE `401`, counted against a
        smaller per-(tenant, address) denial bucket that answers `429`); (5) the
        body hash is recorded per subscription and a repeated body (a replay or
        a provider retry) changes nothing; (6) the payload is read WITHIN the
        token's binding: an entry of another WABA, or a `messages` change of
        another phone number id, is dropped. Statuses reconcile only rows of the
        bound sender with that provider message id (and that recipient, when
        Meta names it), forward-only (sent, delivered, read; failed only before
        delivery); inbound messages open the 24-hour customer-service window of
        (that number, that recipient hash) and NOTHING of their content is read
        or stored; template status, messaging-limit and account events update
        the bound WABA's records only. Answered `200` with `{}`.
      parameters:
        - name: X-Hub-Signature-256
          in: header
          required: true
          description: "`sha256=<64 lower-case hex>` over the exact body bytes."
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              description: >-
                Meta's `whatsapp_business_account` webhook object. Fields read:
                `entry[].id` (WABA id), `entry[].time`, `changes[].field`
                (`messages`, `message_template_status_update`,
                `phone_number_quality_update`, `account_update`), and per field
                the values documented in the module README.
      responses:
        "200":
          description: Accepted (applied, a duplicate, or nothing applicable).
          content:
            application/json:
              schema:
                type: object
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "413":
          description: Request body too large.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "429":
          description: Too many attempts or refusals from this address for this tenant.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "503":
          description: Temporarily unavailable; Meta retries.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /api/v1/whatsapp/templates:
    get:
      operationId: listWhatsappTemplates
      tags:
        - WhatsApp Delivery
      summary: The registered WhatsApp templates.
      description: >-
        Key, version, the ONE purpose each template is registered with, its variable
        allow-list and which variables are secret. The wording is not returned: it
        is the owning module's copy. Requires `whatsapp_delivery.templates.read`.
      responses:
        "200":
          description: Registered templates.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    enum:
                      - true
                  data:
                    $ref: "#/components/schemas/WhatsappTemplateList"
                  meta:
                    type: object
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
  /api/v1/whatsapp/messages/{id}/cancel:
    post:
      operationId: cancelWhatsappMessage
      tags:
        - WhatsApp Delivery
      summary: Cancel a WhatsApp message that has not been sent yet.
      description: >-
        Only `queued` and `retry_wait` are cancellable. A row in `sending` has been
        claimed by a dispatcher pass that may already be inside the HTTP call, so
        recording it as cancelled would be a claim this system cannot substantiate.
        A secret-bearing body is cleared with the cancel. Deliberately NOT
        idempotency-keyed: a second call performs no new work. Requires
        `whatsapp_delivery.messages.cancel`.
      parameters:
        - name: id
          in: path
          required: true
          description: The message id.
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: The message was cancelled before delivery.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    enum:
                      - true
                  data:
                    type: object
                    properties:
                      cancelled:
                        type: boolean
                        enum:
                          - true
                  meta:
                    type: object
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          description: >-
            Not cancellable. One answer for "no such message", "already sent", "already failed", "already cancelled" and "being sent right now" - distinguishing them would hand a narrow grant an existence oracle over the queue.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /api/v1/whatsapp/suppressions:
    get:
      operationId: listWhatsappSuppressions
      tags:
        - WhatsApp Delivery
      summary: List the suppression list.
      description: >-
        Numbers that no WhatsApp message is sent to, with the reason; recipients
        masked. Bounded: `hasMore` says whether the list was cut. Requires
        `whatsapp_delivery.suppressions.read`.
      parameters:
        - name: limit
          in: query
          required: false
          description: >-
            1-200, default 50. Out-of-range values are REJECTED rather than clamped.
          schema:
            type: integer
            minimum: 1
            maximum: 200
      responses:
        "200":
          description: Suppression entries.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    enum:
                      - true
                  data:
                    $ref: "#/components/schemas/WhatsappSuppressionPage"
                  meta:
                    type: object
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "422":
          description: >-
            `limit` is invalid.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
    post:
      operationId: createWhatsappSuppression
      tags:
        - WhatsApp Delivery
      summary: Suppress a number.
      description: >-
        Records a `manual` or `stop_reply` suppression; waiting transactional and
        marketing messages to the number are cancelled in the same transaction (a
        security-class message honours hard failures only). `hard_failure` is
        written only by the dispatcher on a provider verdict, so an operator cannot
        forge one. Naturally idempotent: suppressing an already suppressed number
        answers 200 with `alreadySuppressed`, which is why no Idempotency-Key is
        taken. The body is validated after authorization. Requires
        `whatsapp_delivery.suppressions.create`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WhatsappSuppressionCreateRequest"
      responses:
        "201":
          description: The number was suppressed.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    enum:
                      - true
                  data:
                    $ref: "#/components/schemas/WhatsappSuppression"
                  meta:
                    type: object
        "200":
          description: The number was already suppressed.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    enum:
                      - true
                  data:
                    $ref: "#/components/schemas/WhatsappSuppression"
                  meta:
                    type: object
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "413":
          description: Request body too large.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "503":
          description: The deployment has no usable recipient-hash key ring (`WHATSAPP_HASH_KEYS_UNAVAILABLE`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /api/v1/whatsapp/suppressions/{id}:
    delete:
      operationId: deleteWhatsappSuppression
      tags:
        - WhatsApp Delivery
      summary: Remove a suppression entry.
      description: >-
        A hard delete: a suppression is a live operational flag, not master data
        with a restore workflow. High-risk because it RESUMES sending to a number
        that was stopped, so it is audited at warning severity with the original
        reason. Not idempotency-keyed: a second call finds nothing and answers 404.
        Requires `whatsapp_delivery.suppressions.delete`.
      parameters:
        - name: id
          in: path
          required: true
          description: The suppression id.
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: The entry was removed.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    enum:
                      - true
                  data:
                    type: object
                    properties:
                      id:
                        type: string
                        format: uuid
                      deleted:
                        type: boolean
                        enum:
                          - true
                  meta:
                    type: object
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
  /api/v1/whatsapp/consents:
    get:
      operationId: listWhatsappConsents
      tags:
        - WhatsApp Delivery
      summary: List recorded marketing consents.
      description: >-
        Per-recipient consent records (masked). Consent is never inferred from
        segment, list or campaign-audience membership; only this record decides who
        may receive a marketing message. Bounded: `hasMore` says whether the list
        was cut. Requires `whatsapp_delivery.consents.read`. Each entry's
        `businessScopes` lists only the brands the caller holds (business-scope
        confinement; Issue #1231 M4).
      parameters:
        - name: status
          in: query
          required: false
          description: Narrow to granted or withdrawn consents.
          schema:
            $ref: "#/components/schemas/WhatsappConsentStatus"
        - name: limit
          in: query
          required: false
          description: >-
            1-200, default 50. Out-of-range values are REJECTED rather than clamped.
          schema:
            type: integer
            minimum: 1
            maximum: 200
      responses:
        "200":
          description: Consent entries.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    enum:
                      - true
                  data:
                    $ref: "#/components/schemas/WhatsappConsentPage"
                  meta:
                    type: object
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "422":
          description: >-
            `status` or `limit` is invalid.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
    post:
      operationId: grantWhatsappConsent
      tags:
        - WhatsApp Delivery
      summary: Record an explicit marketing opt-in.
      description: >-
        Explicit, per recipient, per channel, recorded with its source and time
        (ADR-0133 section 4). Naturally idempotent: the unique key is (tenant,
        recipient, purpose), so a retry re-stamps the same row instead of adding
        one, which is why no Idempotency-Key is taken. A re-grant after a withdrawal
        is a new, deliberate act; history lives in the audit log and the
        `whatsapp.consent.*` events. The body is validated after authorization.
        Re-granting over a WITHDRAWN consent reverses an opt-out, so it is never implicit: it is refused with 409 unless the body sets `reinstateWithdrawn` with an `evidenceRef`, it is refused for `source` `import` (422), it needs `whatsapp_delivery.consents.restore` (high-risk) instead, and the withdrawal is kept in the row's history. Requires `whatsapp_delivery.consents.create` (or `consents.restore` when reinstating). 503 when the deployment has no recipient-hash key ring.
        Since Issue #1231 M4 (owner decision, option (c)) the opt-in records the business scope (brand) it was collected for: `businessScope` appends that brand to the consent, and marketing of a brand is eligible only when the consent lists it (enqueue refuses `CONSENT_SCOPE_REQUIRED` otherwise, and the dispatcher re-checks before every send). Omitted or `null` records an opt-in for the tenant itself, which covers only marketing that names no business scope. The scope must be one the caller holds (business-scope confinement, 403; an unknown scope is not held, so it is 403 too) and must exist in this tenant (422 `SCOPE_UNRESOLVED`); a caller confined to business scopes cannot record the unscoped opt-in (403). Only `office` scopes resolve today. A reinstatement covers only the brand it names. A brand grant does not change the consent's own `source`/`grantedAt`. The response lists only the brands the caller holds. The consent stays one record per recipient, and a withdrawal stays tenant-wide. Note that a message's brand is the scope its CALLER declares: it is tied to the sending number only when that sender is itself scoped.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WhatsappConsentGrantRequest"
      responses:
        "200":
          description: The consent was recorded.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    enum:
                      - true
                  data:
                    $ref: "#/components/schemas/WhatsappConsent"
                  meta:
                    type: object
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          description: The recipient opted out and the request did not ask to reinstate, including when a concurrent withdrawal committed first (`CONSENT_WITHDRAWN`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "413":
          description: Request body too large.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "422":
          description: >-
            Reinstatement refused (`REINSTATEMENT_REFUSED`) - an import cannot
            reverse an opt-out, and evidence is required; the business scope does
            not exist in this tenant (`SCOPE_UNRESOLVED`); or the consent already
            lists the maximum of 256 brands (`CONSENT_SCOPE_LIMIT`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "503":
          description: The deployment has no usable recipient-hash key ring (`WHATSAPP_HASH_KEYS_UNAVAILABLE`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /api/v1/whatsapp/consents/{id}/withdraw:
    post:
      operationId: withdrawWhatsappConsent
      tags:
        - WhatsApp Delivery
      summary: Record a marketing opt-out.
      description: >-
        Immediate, and wins over everything queued: the recipient's waiting
        marketing messages are cancelled in the same transaction, and the dispatcher
        re-checks consent again right before every send. Naturally idempotent
        (withdrawing a withdrawn consent keeps the original stamp). Withdrawing is
        protective, so it is a separate, lower-friction permission than granting.
        Requires `whatsapp_delivery.consents.withdraw`. Tenant-wide and NOT
        business-scope confined (Issue #1231 M4, owner decision): it ends the
        opt-in for every brand the consent covered, whichever brands the caller
        holds; the response's `businessScopes` is therefore empty.
      parameters:
        - name: id
          in: path
          required: true
          description: The consent id.
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: The consent was withdrawn.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    enum:
                      - true
                  data:
                    $ref: "#/components/schemas/WhatsappConsentWithdrawal"
                  meta:
                    type: object
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
components:
  schemas:
    WhatsappPurpose:
      type: string
      enum:
        - transactional
        - security
        - marketing
      description: >-
        Set by the template's registration, never by the caller. `transactional`
        needs no marketing consent; `security` (OTP, step-up code) is never
        blocked by an opt-out and always carries an expiry; `marketing` needs a
        recorded opt-in, checked at enqueue and again at dispatch.
    WhatsappMessageStatus:
      type: string
      enum:
        - queued
        - retry_wait
        - sending
        - sent
        - failed
        - cancelled
        - expired
    WhatsappConsentStatus:
      type: string
      enum:
        - granted
        - withdrawn
    WhatsappSuppressionReason:
      type: string
      enum:
        - hard_failure
        - stop_reply
        - manual
    WhatsappMessage:
      type: object
      description: >-
        A queue row. The raw number, the rendered body and the template variables
        are never part of this projection.
      properties:
        id:
          type: string
          format: uuid
        templateKey:
          type: string
        purpose:
          $ref: "#/components/schemas/WhatsappPurpose"
        status:
          $ref: "#/components/schemas/WhatsappMessageStatus"
        recipientMasked:
          type: string
        correlationId:
          type: string
          nullable: true
        retryCount:
          type: integer
        failureCode:
          type: string
          nullable: true
        lastError:
          type: string
          nullable: true
        providerName:
          type: string
          nullable: true
        senderAccountId:
          type: string
          format: uuid
          nullable: true
          description: >-
            The tenant-owned sender account snapshotted at enqueue (immutable), or
            null for the deployment sender. An id, never a number or a credential.
        senderSelection:
          type: string
          enum:
            - deployment
            - explicit
            - policy
            - reply
          description: How the sender was chosen. `reply` is thread affinity.
        notBefore:
          type: string
          format: date-time
          nullable: true
        expiresAt:
          type: string
          format: date-time
          nullable: true
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        sentAt:
          type: string
          format: date-time
          nullable: true
    WhatsappDeliveryAttempt:
      type: object
      properties:
        id:
          type: string
          format: uuid
        messageId:
          type: string
          format: uuid
        attemptNo:
          type: integer
        outcome:
          type: string
          enum:
            - success
            - failure
        providerName:
          type: string
        providerResponseSnippet:
          type: string
          nullable: true
        errorMessage:
          type: string
          nullable: true
        createdAt:
          type: string
          format: date-time
    WhatsappQueueSummary:
      type: object
      properties:
        countsByStatus:
          type: object
          description: Every status is present, with 0 when it has no rows.
          additionalProperties:
            type: integer
        oldestPendingAt:
          type: string
          format: date-time
          nullable: true
        suppressions:
          type: integer
        grantedConsents:
          type: integer
    WhatsappDiagnostics:
      type: object
      properties:
        summary:
          $ref: "#/components/schemas/WhatsappQueueSummary"
        messages:
          type: array
          items:
            $ref: "#/components/schemas/WhatsappMessage"
        hasMoreMessages:
          type: boolean
        attempts:
          type: array
          items:
            $ref: "#/components/schemas/WhatsappDeliveryAttempt"
        configured:
          type: object
          properties:
            enabled:
              type: boolean
            provider:
              type: string
              nullable: true
              description: The adapter name (`log`, `fonnte` or `meta`), or null when unset or unknown. Never a credential.
    WhatsappTemplateList:
      type: object
      properties:
        templates:
          type: array
          items:
            type: object
            properties:
              key:
                type: string
              version:
                type: integer
              purpose:
                $ref: "#/components/schemas/WhatsappPurpose"
              variables:
                type: array
                items:
                  type: string
              secretVariables:
                type: array
                items:
                  type: string
              hasApprovedProviderTemplate:
                type: boolean
    WhatsappSuppression:
      type: object
      properties:
        id:
          type: string
          format: uuid
        recipientMasked:
          type: string
        reason:
          $ref: "#/components/schemas/WhatsappSuppressionReason"
        createdAt:
          type: string
          format: date-time
        alreadySuppressed:
          type: boolean
          description: Present and true only when the number was already suppressed.
    WhatsappSuppressionPage:
      type: object
      properties:
        entries:
          type: array
          items:
            $ref: "#/components/schemas/WhatsappSuppression"
        hasMore:
          type: boolean
    WhatsappSuppressionCreateRequest:
      type: object
      additionalProperties: false
      required:
        - phone
        - reason
      properties:
        phone:
          type: string
          description: >-
            E.164 (`+62...`) or `00`-prefixed; a national number with a leading 0
            is accepted only when the deployment configures a default country
            code. Never echoed back.
        reason:
          type: string
          enum:
            - manual
            - stop_reply
    WhatsappConsent:
      type: object
      properties:
        id:
          type: string
          format: uuid
        recipientMasked:
          type: string
        purpose:
          type: string
          enum:
            - marketing
        status:
          $ref: "#/components/schemas/WhatsappConsentStatus"
        source:
          type: string
        grantedAt:
          type: string
          format: date-time
        withdrawnAt:
          type: string
          format: date-time
          nullable: true
        businessScopes:
          type: array
          maxItems: 256
          description: >-
            Issue #1231 M4. The business scopes (brands) this opt-in was collected
            for that the CALLER holds; marketing of a brand is eligible only when
            it is listed on the stored consent. Empty on a withdrawn consent (a
            withdrawal is tenant-wide).
          items:
            $ref: "#/components/schemas/WhatsappConsentScopeGrant"
        unscopedGranted:
          type: boolean
          nullable: true
          description: >-
            Issue #1231 M4. `true`: an opt-in collected for the tenant itself, with
            no brand; it covers only marketing that names no business scope.
            `null`: recorded before brands were recorded (legacy), read the same
            way and never as any brand. Never `true` on a withdrawn consent.
    WhatsappConsentScopeGrant:
      type: object
      properties:
        type:
          type: string
          pattern: "^[a-z][a-z0-9_]*$"
        id:
          type: string
          format: uuid
        source:
          type: string
          description: Where this brand's opt-in came from.
        grantedAt:
          type: string
          format: date-time
    WhatsappConsentWithdrawal:
      allOf:
        - $ref: "#/components/schemas/WhatsappConsent"
        - type: object
          properties:
            cancelledMessages:
              type: integer
              description: Waiting marketing messages to this recipient cancelled by the withdrawal.
    WhatsappConsentPage:
      type: object
      properties:
        entries:
          type: array
          items:
            $ref: "#/components/schemas/WhatsappConsent"
        hasMore:
          type: boolean
    WhatsappConsentGrantRequest:
      type: object
      additionalProperties: false
      required:
        - phone
        - source
      properties:
        phone:
          type: string
          description: Same forms as the suppression request. Never echoed back.
        businessScope:
          type: object
          nullable: true
          additionalProperties: false
          required:
            - type
            - id
          description: >-
            Issue #1231 M4. The business scope (brand) this opt-in was collected
            for. Omitted or `null`: an opt-in for the tenant itself, covering only
            marketing that names no business scope. Must be held by the caller and
            exist in this tenant; only `office` resolves today.
          properties:
            type:
              type: string
              maxLength: 64
              pattern: "^[a-z][a-z0-9_]*$"
            id:
              type: string
              format: uuid
        reinstateWithdrawn:
          type: boolean
          description: Must be true to grant over a recorded opt-out; needs `consents.restore` and `evidenceRef`.
        evidenceRef:
          type: string
          minLength: 1
          maxLength: 200
          description: A reference to the evidence of the new consent (ticket, form id). Required when reinstating.
        source:
          type: string
          pattern: "^[a-z][a-z0-9_]{0,63}$"
          description: Where the opt-in came from (`admin`, `form`, `import`, `inbound_reply`); recorded as evidence.
    WhatsappSenderPolicy:
      type: object
      properties:
        id:
          type: string
          format: uuid
        businessScope:
          $ref: "#/components/schemas/WhatsappBusinessScope"
        defaultSenderAccountId:
          type: string
          format: uuid
          nullable: true
          description: Null is an explicit decision to use the deployment sender.
        configVersion:
          type: integer
          minimum: 1
          description: Snapshotted on each message the policy selects (`sender_policy_version`).
        effectiveFrom:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    WhatsappBusinessScope:
      type: object
      nullable: true
      description: A brand or unit (the generic business-scope pair). Null is tenant-wide.
      required:
        - type
        - id
      properties:
        type:
          type: string
          pattern: "^[a-z][a-z0-9_]*$"
          maxLength: 64
        id:
          type: string
          format: uuid
    WhatsappMetaTemplate:
      type: object
      description: "Issue #1143. A Meta template's status on one WABA account."
      properties:
        id:
          type: string
          format: uuid
        containerAccountId:
          type: string
          format: uuid
          description: The `waba` channel account the template is registered on.
        name:
          type: string
        language:
          type: string
        category:
          type: string
          enum:
            - MARKETING
            - UTILITY
            - AUTHENTICATION
        providerStatus:
          $ref: "#/components/schemas/WhatsappMetaTemplateStatus"
        source:
          type: string
          enum:
            - operator
            - webhook
        hasEvidence:
          type: boolean
        lastEventAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    WhatsappMetaTemplateStatus:
      type: string
      description: >-
        Meta's own template status vocabulary. Only `APPROVED` and `REINSTATED`
        are sendable; every other value (including `FLAGGED`) is refused.
      enum:
        - APPROVED
        - ARCHIVED
        - UNARCHIVED
        - DELETED
        - DISABLED
        - FLAGGED
        - IN_APPEAL
        - LIMIT_EXCEEDED
        - LOCKED
        - PAUSED
        - PENDING
        - REINSTATED
        - PENDING_DELETION
        - REJECTED
    WhatsappMetaTemplateRequest:
      type: object
      additionalProperties: false
      required:
        - containerAccountId
        - name
        - language
        - category
        - status
      properties:
        containerAccountId:
          type: string
          format: uuid
        name:
          type: string
          pattern: "^[a-z0-9_]+$"
          maxLength: 512
        language:
          type: string
          pattern: "^[A-Za-z]{2,3}([_-][A-Za-z0-9]{2,8}){0,2}$"
        category:
          type: string
          enum:
            - MARKETING
            - UTILITY
            - AUTHENTICATION
        status:
          $ref: "#/components/schemas/WhatsappMetaTemplateStatus"
        evidenceRef:
          type: string
          nullable: true
          maxLength: 200
          description: Required when `status` is `APPROVED` or `REINSTATED`.
    WhatsappMetaSignal:
      type: object
      description: "Issue #1143. The latest restriction and messaging-limit tier Meta reported for a WABA."
      properties:
        containerAccountId:
          type: string
          format: uuid
        restrictionReason:
          type: string
          nullable: true
          enum:
            - ACCOUNT_DELETED
            - ACCOUNT_RESTRICTION
            - DISABLED
            - OFFBOARDED
            - APP_UNINSTALLED
            - null
        restrictedAt:
          type: string
          format: date-time
          nullable: true
        messagingLimitTier:
          type: string
          nullable: true
          enum:
            - TIER_50
            - TIER_250
            - TIER_1K
            - TIER_2K
            - TIER_10K
            - TIER_100K
            - TIER_NOT_SET
            - TIER_UNLIMITED
            - null
        updatedAt:
          type: string
          format: date-time
    WhatsappSenderPolicyRequest:
      type: object
      additionalProperties: false
      required:
        - businessScope
        - defaultSenderAccountId
      properties:
        businessScope:
          $ref: "#/components/schemas/WhatsappBusinessScope"
        defaultSenderAccountId:
          type: string
          format: uuid
          nullable: true
          description: >-
            An account of this tenant, or null for the deployment sender. Never a
            token, a phone number id, a device id or a provider name.
    WhatsappSenderStatus:
      type: object
      properties:
        senderAccountId:
          type: string
          format: uuid
          nullable: true
          description: Null is the deployment sender.
        availability:
          nullable: true
          description: Null for the deployment sender, which has no account record.
          oneOf:
            - type: object
              properties:
                usable:
                  type: boolean
                  enum:
                    - true
            - type: object
              properties:
                usable:
                  type: boolean
                  enum:
                    - false
                reason:
                  type: string
                  description: A coarse reason code (for example `ACCOUNT_REVOKED`, `CAPABILITY_DENIED`, `RISK_ACKNOWLEDGEMENT_REQUIRED` for an unofficial provider such as StarSender whose current risk text the tenant has not acknowledged).
        queue:
          type: object
          properties:
            waiting:
              type: integer
            sending:
              type: integer
            failed:
              type: integer
              description: Failed in the last day.
            oldestPendingAt:
              type: string
              format: date-time
              nullable: true
            lastFailureCode:
              type: string
              nullable: true
        quota:
          type: object
          properties:
            sentLastHour:
              type: integer
            sentLastDay:
              type: integer
            hourlyLimit:
              type: integer
            dailyLimit:
              type: integer
            throttled:
              type: boolean
              description: >-
                A cap is reached; the dispatcher stops claiming this sender's rows
                until the window moves. Always false for the deployment sender.
    WhatsappSenderDiagnostics:
      type: object
      properties:
        senders:
          type: array
          items:
            $ref: "#/components/schemas/WhatsappSenderStatus"
        policies:
          type: array
          items:
            $ref: "#/components/schemas/WhatsappSenderPolicy"
    WhatsappSenderProgressCounts:
      type: object
      description: >-
        Messages of this sender created within the counting window (7 days) per
        queue status, every status present, zero included. For a caller confined
        to business scopes, only messages whose own business scope the caller
        holds are counted; an unscoped message is not.
      required:
        - queued
        - retry_wait
        - sending
        - sent
        - failed
        - cancelled
        - expired
      properties:
        queued:
          type: integer
        retry_wait:
          type: integer
        sending:
          type: integer
        sent:
          type: integer
        failed:
          type: integer
        cancelled:
          type: integer
        expired:
          type: integer
    WhatsappSenderProgressChange:
      type: object
      description: One message that changed. Identifiers, status and time only (ADR-0154 R7).
      required:
        - id
        - status
        - updatedAt
      properties:
        id:
          type: string
          format: uuid
        status:
          $ref: "#/components/schemas/WhatsappMessageStatus"
        updatedAt:
          type: string
          format: date-time
    WhatsappSenderProgressSnapshot:
      type: object
      required:
        - v
        - topic
        - resourceId
        - cursor
        - at
        - counts
        - countWindowDays
        - recent
      properties:
        v:
          type: integer
          enum:
            - 1
        topic:
          type: string
          enum:
            - whatsapp.sender.progress
        resourceId:
          type: string
          format: uuid
        cursor:
          type: string
          description: Opaque keyset position; send it as `Last-Event-ID` to stream from here.
        at:
          type: string
          format: date-time
        counts:
          $ref: "#/components/schemas/WhatsappSenderProgressCounts"
        countWindowDays:
          type: integer
          description: The counting window of `counts`, in days (messages created within it).
        recent:
          type: array
          maxItems: 20
          items:
            $ref: "#/components/schemas/WhatsappSenderProgressChange"
    WhatsappSenderProgressFrame:
      type: object
      description: >-
        The `data` of a `progress` event on the progress stream (versioned
        envelope, ADR-0154 section 8). Documented here because SSE frames have
        no OpenAPI media-type schema of their own.
      required:
        - v
        - topic
        - resourceId
        - cursor
        - at
        - counts
        - changes
      properties:
        v:
          type: integer
          enum:
            - 1
        topic:
          type: string
          enum:
            - whatsapp.sender.progress
        resourceId:
          type: string
          format: uuid
        cursor:
          type: string
        at:
          type: string
          format: date-time
        counts:
          $ref: "#/components/schemas/WhatsappSenderProgressCounts"
        changes:
          type: array
          maxItems: 50
          items:
            $ref: "#/components/schemas/WhatsappSenderProgressChange"
