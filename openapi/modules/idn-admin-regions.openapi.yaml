# Source fragment for the "Indonesia Regions" module (ADR-0046). One file per
# MODULE (Issue #182 convention): this file owns every path carrying the
# "Indonesia Regions" tag and every schema referenced ONLY by those operations.
#
# The IMPORT is deliberately absent from this contract: it is a worker job
# (`bun run idn-regions:import`) reading a repo-vendored dump, not an HTTP
# operation — same administrative-operation posture as data_lifecycle's real
# archive/purge. What IS here: the read-only lookup, the dataset/provenance
# listing, and the two audited lifecycle actions (activate, rollback).
#
# NOT independently valid OpenAPI — $ref targets pointing at shared components
# only resolve after `bun run openapi:bundle` merges this file with the root and
# every sibling module fragment into openapi/awcms-public-api.openapi.yaml. Edit
# this file (or the root for shared components), never the generated bundle.
paths:
  /api/v1/idn-regions/regions:
    get:
      tags:
        - Indonesia Regions
      summary: Look up Indonesia administrative regions
      description: "Gated by idn_admin_regions.region.read. Filter by tier (`level` 1-4), by `parentCode`, and/or by `search` (case-folded substring over the normalized name); keyset-paginated on `code`. Reads the ACTIVE dataset unless `dataset` names another version. When no dataset has been activated the response is an empty page with `reason: no_active_dataset` — a fresh install is a real state, not an error. The rows are global reference data, but the endpoint still requires a session, a tenant context, and the permission grant."
      operationId: idnRegionsList
      parameters:
        - name: dataset
          in: query
          required: false
          description: Dataset code to query. Defaults to the active dataset.
          schema:
            type: string
        - name: level
          in: query
          required: false
          description: 1 province, 2 regency/city, 3 district, 4 village. An out-of-range value is rejected rather than ignored.
          schema:
            type: integer
            minimum: 1
            maximum: 4
        - name: parentCode
          in: query
          required: false
          description: Dotted code of the parent region, e.g. `11.01` to list its districts.
          schema:
            type: string
        - name: search
          in: query
          required: false
          description: Case-folded substring of the region name. LIKE wildcards in the input are matched literally.
          schema:
            type: string
        - name: limit
          in: query
          required: false
          description: Page size, clamped to 200.
          schema:
            type: integer
            minimum: 1
            maximum: 200
            default: 50
        - name: after
          in: query
          required: false
          description: Keyset cursor — the `code` of the last item on the previous page.
          schema:
            type: string
        - $ref: "#/components/parameters/CorrelationId"
      responses:
        "200":
          description: One page of regions from the resolved dataset.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    enum: [true]
                  data:
                    type: object
                    properties:
                      datasetCode:
                        type: string
                        nullable: true
                      items:
                        type: array
                        items:
                          $ref: "#/components/schemas/IdnRegionItem"
                      nextCursor:
                        type: string
                        nullable: true
                      reason:
                        type: string
                        nullable: true
                        enum: [no_active_dataset, dataset_not_found, null]
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
  /api/v1/idn-regions/regions/{code}:
    get:
      tags:
        - Indonesia Regions
      summary: Read one region by its Kemendagri code
      description: Gated by idn_admin_regions.region.read. Returns the region plus its resolved ancestor path, so a caller rendering a full address label needs one request instead of four.
      operationId: idnRegionsGet
      parameters:
        - name: code
          in: path
          required: true
          description: Dotted Kemendagri code, e.g. `11`, `11.01`, `11.01.01`, `11.01.01.2001`.
          schema:
            type: string
        - name: dataset
          in: query
          required: false
          description: Dataset code to query. Defaults to the active dataset.
          schema:
            type: string
        - $ref: "#/components/parameters/CorrelationId"
      responses:
        "200":
          description: The region.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    enum: [true]
                  data:
                    type: object
                    properties:
                      datasetCode:
                        type: string
                        nullable: true
                      region:
                        $ref: "#/components/schemas/IdnRegionItem"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
  /api/v1/idn-regions/datasets:
    get:
      tags:
        - Indonesia Regions
      summary: List imported region dataset versions with their provenance
      description: "Gated by idn_admin_regions.dataset.read. Newest import first, with upstream repository, commit SHA, file checksum, decree reference, row count, and lifecycle status. The official-reference caveat travels in the same response body: anyone reading this is deciding whether to trust these rows for something official, and the answer — a community packaging of the decree, not a Kemendagri feed — has to arrive with the data."
      operationId: idnRegionsDatasetList
      parameters:
        - $ref: "#/components/parameters/CorrelationId"
      responses:
        "200":
          description: Imported dataset versions plus static source provenance.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    enum: [true]
                  data:
                    type: object
                    properties:
                      items:
                        type: array
                        items:
                          $ref: "#/components/schemas/IdnRegionDataset"
                      activeDatasetCode:
                        type: string
                        nullable: true
                      provenance:
                        $ref: "#/components/schemas/IdnRegionSourceProvenance"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
  /api/v1/idn-regions/datasets/rollback:
    post:
      tags:
        - Indonesia Regions
      summary: Roll back to the previously active dataset version
      description: "Gated by idn_admin_regions.dataset.restore. High-risk, `Idempotency-Key` required, audited. The target is resolved from `activated_at` history, never supplied by the caller — letting the client name the destination would make this an activation wearing a safer-sounding name. Returns 409 when there is no previously activated version."
      operationId: idnRegionsDatasetRollback
      parameters:
        - name: Idempotency-Key
          in: header
          required: true
          schema:
            type: string
        - $ref: "#/components/parameters/CorrelationId"
      responses:
        "200":
          description: The dataset that is now active.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    enum: [true]
                  data:
                    type: object
                    properties:
                      dataset:
                        $ref: "#/components/schemas/IdnRegionDataset"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          description: Idempotency-Key was already used with a different request, or the dataset cannot be activated/rolled back in its current state.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /api/v1/idn-regions/datasets/{id}/activate:
    post:
      tags:
        - Indonesia Regions
      summary: Activate one imported dataset version
      description: "Gated by idn_admin_regions.dataset.configure. High-risk, `Idempotency-Key` required, audited with the dataset codes on both sides of the switch: this changes what every address form and regional report in the product returns, for every tenant at once. Activating the already-active dataset is a no-op success (`changed: false`), because a retried request that lands on the state it asked for succeeded. Only one dataset can be active — enforced by a partial unique index, so two concurrent activations end with one committed and one rejected."
      operationId: idnRegionsDatasetActivate
      parameters:
        - name: id
          in: path
          required: true
          description: Dataset UUID.
          schema:
            type: string
            format: uuid
        - name: Idempotency-Key
          in: header
          required: true
          schema:
            type: string
        - $ref: "#/components/parameters/CorrelationId"
      responses:
        "200":
          description: The activated dataset.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    enum: [true]
                  data:
                    type: object
                    properties:
                      dataset:
                        $ref: "#/components/schemas/IdnRegionDataset"
                      changed:
                        type: boolean
                        description: false when the dataset was already active.
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: Idempotency-Key was already used with a different request, or the dataset cannot be activated/rolled back in its current state.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
components:
  schemas:
    IdnRegionItem:
      type: object
      required: [code, codeCompact, level, regionType, name]
      properties:
        code:
          type: string
          description: Dotted Kemendagri code, e.g. `11.01.01.2001`.
        codeCompact:
          type: string
          description: The same code without separators.
        parentCode:
          type: string
          nullable: true
        level:
          type: integer
          minimum: 1
          maximum: 4
        regionType:
          type: string
          enum: [province, regency, district, village]
        localTerm:
          type: string
          nullable: true
          description: 'Indonesian term this row carries (Provinsi/Kabupaten/Kota/Desa/Kelurahan/Desa Adat). Null where upstream states none — districts ship bare names, and filling in "Kecamatan" would be wrong for the provinces that call the tier "Distrik".'
        name:
          type: string
          description: Official name exactly as upstream spells it, prefix included.
        shortName:
          type: string
          nullable: true
          description: Name with the tier term stripped ("Aceh Selatan" for "Kabupaten Aceh Selatan").
        fullPathName:
          type: string
          nullable: true
          description: Ancestor path in breadcrumb order, e.g. "Aceh, Kabupaten Aceh Selatan, Bakongan, Keude Bakongan".
    IdnRegionDataset:
      type: object
      required: [id, datasetCode, status, rowCount]
      properties:
        id:
          type: string
          format: uuid
        datasetCode:
          type: string
          description: Deterministic code derived from the upstream commit and file checksum, so re-importing identical bytes collides instead of creating a duplicate version.
        status:
          type: string
          enum: [validated, active, superseded, rejected]
        rowCount:
          type: integer
        sourceRepository:
          type: string
        sourceCommitSha:
          type: string
        sourceLicense:
          type: string
        sourceReference:
          type: string
          nullable: true
          description: The Kepmendagri decree the imported file's own header cites.
        sourceFileSha256:
          type: string
        createdAt:
          type: string
          format: date-time
        activatedAt:
          type: string
          format: date-time
          nullable: true
    IdnRegionSourceProvenance:
      type: object
      description: Static, code-level facts about WHICH upstream project this data is vendored from — true of every import, unlike the per-import fields on IdnRegionDataset.
      properties:
        repository:
          type: string
        sourcePath:
          type: string
        license:
          type: string
        dumpPath:
          type: string
        manifestPath:
          type: string
        upstreamStatement:
          type: string
        decreeReference:
          type: string
        officialReferenceCaveat:
          type: string
          description: Must be surfaced wherever this dataset is shown to an operator — this is a community packaging of the decree, not an official Kemendagri API or export.
