# Source fragment for the "telegram_engagement" module (Issue #1156, ADR-0152).
#
# Owns every path whose operations carry this module's OpenAPI tag, plus every
# components.schemas entry referenced ONLY by this module's operations.
#
# NOT independently valid OpenAPI: $ref targets pointing at shared components
# (securitySchemes/parameters/responses) only resolve after
# `bun run openapi:bundle` merges this file with the root fragment and every
# sibling module fragment into openapi/awcms-public-api.openapi.yaml. Edit this
# file (or the root fragment for shared components), never the generated bundle.
#
# ## Separate from telegram_delivery
#
# Customer conversations through a tenant's own bots. The staff-only
# `telegram_delivery` operations (`/api/v1/telegram/*`) are unchanged and share
# nothing with these.
#
# ## Why the webhook operation has `security: []`
#
# Telegram calls it. It is authenticated by a different mechanism: the opaque
# per-bot callback token in the PATH and the `X-Telegram-Bot-Api-Secret-Token`
# header, compared in constant time before the body is read. It takes NO tenant
# header: the tenant, the bot and the business scope come from the token.
paths:
  /api/v1/telegram-engagement/webhooks/{callbackToken}:
    post:
      operationId: telegramEngagementWebhook
      tags:
        - Telegram Engagement
      summary: Receive a Telegram update for one customer bot (called by Telegram)
      security: []
      description: >-
        Called by Telegram, never by a person. One route per customer bot: the
        `callbackToken` (`tge1.<tenantId>.<endpointId>.<secret>`) is generated by
        the server, registered with Telegram through `setWebhook`, and stored only
        as a SHA-256. The bot, the tenant and the business scope are resolved
        from it, NEVER from the update body.


        Order: the deployment switch (`404` when off, nothing probed); the token
        is parsed and the named tenant's endpoint row is proven against the
        stored hash; the account must be a live telegram bot and the tenant's
        module toggle on; the `X-Telegram-Bot-Api-Secret-Token` header must equal
        the per-bot value (derived from the endpoint's encrypted seed) in
        constant time. Only then is the body read (default body cap). Every
        failure before that point is the SAME `401` (a missing or wrong header, an
        unknown, malformed, revoked or foreign token, a disabled account), so the
        route is not an oracle; failures are counted and audited once a minute in
        aggregate on the platform tenant, and repeated failures from one address
        are throttled to `429`.


        Idempotent on `(bot account, update_id)`: a replay, a Telegram retry or a
        concurrent duplicate has ONE effect. Private chats only; a bot sender, a
        group or channel update, an edited message and a forwarded `/start` change
        nothing. `/start` creates a contact and grants `support` only; `/stop`, a
        block and the opt-in buttons record append-only consent evidence. Nothing
        here calls Telegram: the answer is `{}` or, for a consent button, the Bot
        API's webhook-reply form `answerCallbackQuery`.
      parameters:
        - name: callbackToken
          in: path
          required: true
          schema:
            type: string
            maxLength: 140
        - name: X-Telegram-Bot-Api-Secret-Token
          in: header
          required: true
          schema:
            type: string
            maxLength: 256
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              description: A Telegram `Update` object (only `message`, `my_chat_member` and `callback_query` are registered).
      responses:
        "200":
          description: >-
            Received (or deliberately ignored, or an over-limit chat). Either an
            empty object or a webhook reply.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TelegramEngagementWebhookReply"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          description: "`UNAUTHORIZED`: the uniform refusal (see above)."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "404":
          description: The module is switched off on this deployment.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "413":
          description: The body is larger than the cap.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "429":
          description: Rate limited (per address or per bot endpoint). Telegram retries.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "503":
          description: The database is unavailable. Telegram retries; the replay key makes the retry safe.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /api/v1/telegram-engagement/bots:
    get:
      operationId: listTelegramEngagementBots
      tags:
        - Telegram Engagement
      summary: List the tenant's customer Telegram bots
      description: >-
        Requires `telegram_engagement.bots.read`. Only bots whose channel account
        the caller may see (channel-account assignments and business scope).
        Never a token, a secret, a callback URL or a header value.
      parameters:
        - $ref: "#/components/parameters/CorrelationId"
      responses:
        "200":
          description: The bots.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TelegramEngagementBotList"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
    post:
      operationId: registerTelegramEngagementBot
      tags:
        - Telegram Engagement
      summary: Register an existing telegram bot channel account for a verified webhook
      description: >-
        Requires `telegram_engagement.bots.configure`, a signed-in person and,
        when the person has an MFA factor, a fresh step-up. Audited at warning.
        The bot is an existing `channel_accounts` account (provider `telegram`,
        kind `bot`, `external_id` = the bot's numeric id) whose token was stored
        write-only through `PUT /api/v1/channel-accounts/accounts/{id}/credential`.
        The deployment's STAFF bot is refused (`STAFF_BOT_REFUSED`). Creates a
        `pending` endpoint with a fresh webhook seed; the connector job then calls
        `getMe` (the bot id must equal the account's external id) and `setWebhook`
        and only then marks it `active`. No provider call happens in this request.
      parameters:
        - $ref: "#/components/parameters/CorrelationId"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TelegramEngagementRegisterBotRequest"
      responses:
        "201":
          description: Registered (pending until the connector job finishes).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TelegramEngagementBotEnvelope"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: "`ALREADY_REGISTERED` or `IDEMPOTENCY_CONFLICT`."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "422":
          description: "`ACCOUNT_NOT_USABLE`, `CREDENTIAL_MISSING` or `STAFF_BOT_REFUSED`."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "503":
          description: "`KEY_RING_UNAVAILABLE` or `CHANNEL_ACCOUNTS_UNAVAILABLE`."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /api/v1/telegram-engagement/bots/{id}/rotate:
    post:
      operationId: rotateTelegramEngagementBot
      tags:
        - Telegram Engagement
      summary: Rotate a bot's webhook secret (hard cut)
      description: >-
        Requires `telegram_engagement.bots.configure`, a signed-in person and a
        conditional step-up. Audited at warning. `{id}` is the bot's channel
        account id. The live endpoint is revoked in this transaction (its
        callback URL and header stop working at once, no grace window) and a new
        `pending` one is created; the connector job registers it with Telegram.
        Use after a BotFather token rotation (store the new token first) or a
        suspected leak. The body must be empty or `{}`. Every check registration
        makes is made again: a revoked, disabled or non-bot-token account, one
        with no stored token, and the deployment's staff bot are refused (`422`),
        and nothing is revoked.
      parameters:
        - $ref: "#/components/parameters/CorrelationId"
        - $ref: "#/components/parameters/IdempotencyKey"
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Rotated.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TelegramEngagementBotEnvelope"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: "`IDEMPOTENCY_CONFLICT`."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "422":
          description: "`ACCOUNT_NOT_USABLE`, `CREDENTIAL_MISSING` or `STAFF_BOT_REFUSED`."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "503":
          description: "`KEY_RING_UNAVAILABLE` or `CHANNEL_ACCOUNTS_UNAVAILABLE`."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /api/v1/telegram-engagement/bots/{id}/revoke:
    post:
      operationId: revokeTelegramEngagementBot
      tags:
        - Telegram Engagement
      summary: Revoke a bot's webhook
      description: >-
        Requires `telegram_engagement.bots.configure`, a signed-in person and a
        conditional step-up. Audited at warning. `{id}` is the bot's channel
        account id. Ends the webhook at once, cancels every queued message of the
        bot, and asks the connector job to call `deleteWebhook`. The channel
        account and its credential are untouched (disconnect them through
        `channel_accounts`). The body must be empty or `{}`.
      parameters:
        - $ref: "#/components/parameters/CorrelationId"
        - $ref: "#/components/parameters/IdempotencyKey"
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Revoked.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TelegramEngagementRevokeEnvelope"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: "`IDEMPOTENCY_CONFLICT`."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /api/v1/telegram-engagement/contacts:
    get:
      operationId: listTelegramEngagementContacts
      tags:
        - Telegram Engagement
      summary: List the contacts of one bot
      description: >-
        Requires `telegram_engagement.contacts.read`. `accountId` is required:
        the contacts of ONE bot the caller may see (another tenant's or an
        invisible bot is the same `404`). Newest first, keyset-paginated. A
        masked label and states only, never a Telegram id, chat id, username or
        message.
      parameters:
        - $ref: "#/components/parameters/CorrelationId"
        - name: accountId
          in: query
          required: true
          schema:
            type: string
            format: uuid
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 50
        - name: cursor
          in: query
          required: false
          schema:
            type: string
            maxLength: 200
      responses:
        "200":
          description: One page.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TelegramEngagementContactPage"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
  /api/v1/telegram-engagement/contacts/{id}:
    get:
      operationId: getTelegramEngagementContact
      tags:
        - Telegram Engagement
      summary: Read one contact with its per-purpose eligibility
      description: >-
        Requires `telegram_engagement.contacts.read`. Unknown, another tenant's
        and a contact of a bot the caller may not see are ONE answer (`404`).
        Carries the eligibility for `support`, `transactional` and `marketing`
        and the status of the 20 latest outbound messages (never their text).
      parameters:
        - $ref: "#/components/parameters/CorrelationId"
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: The contact.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TelegramEngagementContactDetailEnvelope"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
  /api/v1/telegram-engagement/contacts/{id}/erase:
    post:
      operationId: eraseTelegramEngagementContact
      tags:
        - Telegram Engagement
      summary: End a contact (data-subject request or controller decision)
      description: >-
        Requires `telegram_engagement.contacts.delete`, a signed-in person and a
        conditional step-up. Audited at warning. Withdraws every purpose and
        cancels queued messages; the encrypted chat id, the masked label and the
        keyed hash are erased in ONE statement, so the row can no longer be
        found from the person's Telegram id and a returning person starts an
        unrelated contact. Consent evidence is kept for its proof window.
        Terminal; ending an ended contact answers `alreadyEnded: true`. The body
        must be empty or `{}`.
      parameters:
        - $ref: "#/components/parameters/CorrelationId"
        - $ref: "#/components/parameters/IdempotencyKey"
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Ended.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TelegramEngagementEraseEnvelope"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: "`IDEMPOTENCY_CONFLICT`."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /api/v1/telegram-engagement/contacts/{id}/messages:
    post:
      operationId: queueTelegramEngagementMessage
      tags:
        - Telegram Engagement
      summary: Queue a reply or an opted-in notice to one contact
      description: >-
        Requires `telegram_engagement.messages.create` and a signed-in person.
        Audited (ids and the purpose, never the text). The ONLY addressee is an
        existing contact of this tenant, i.e. a person who started the bot:
        there is no field for a chat id, a handle, a phone number or an imported
        id, and an unknown field is a `400`. Eligibility is checked here and
        again at dispatch: `support` needs the `/start`, `transactional` and
        `marketing` need the explicit opt-in; the bot needs an active verified
        webhook and the `dm` capability with evidence. Sent later by the
        dispatcher; never a fallback to another channel or bot.
      parameters:
        - $ref: "#/components/parameters/CorrelationId"
        - $ref: "#/components/parameters/IdempotencyKey"
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TelegramEngagementSendMessageRequest"
      responses:
        "202":
          description: Queued.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TelegramEngagementQueuedEnvelope"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: "`IDEMPOTENCY_CONFLICT`."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "422":
          description: >-
            `CONTACT_NOT_STARTED`, `CONSENT_REQUIRED`, `CONSENT_WITHDRAWN`,
            `BOT_NOT_ACTIVE` or `CAPABILITY_DENIED`.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "503":
          description: "`KEY_RING_UNAVAILABLE` or `CHANNEL_ACCOUNTS_UNAVAILABLE`."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /api/v1/telegram-engagement/contacts/{id}/consent-prompts:
    post:
      operationId: queueTelegramEngagementConsentPrompt
      tags:
        - Telegram Engagement
      summary: Queue the explicit opt-in step for marketing or transactional
      description: >-
        Requires `telegram_engagement.messages.create` and a signed-in person.
        Audited. Queues the notice text the controller approved, its version and
        two buttons (agree / decline). The prompt is itself a `support` message in
        the conversation the person opened. The person's press on THIS message,
        for this purpose and notice version, is the consent evidence; a press on
        any other message or version is ignored. `/start` never grants these
        purposes.
      parameters:
        - $ref: "#/components/parameters/CorrelationId"
        - $ref: "#/components/parameters/IdempotencyKey"
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TelegramEngagementConsentPromptRequest"
      responses:
        "202":
          description: Queued.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TelegramEngagementQueuedEnvelope"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: "`IDEMPOTENCY_CONFLICT`."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "422":
          description: "`CONTACT_NOT_STARTED`, `CONSENT_WITHDRAWN`, `BOT_NOT_ACTIVE` or `CAPABILITY_DENIED`."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "503":
          description: "`KEY_RING_UNAVAILABLE` or `CHANNEL_ACCOUNTS_UNAVAILABLE`."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
components:
  schemas:
    TelegramEngagementWebhookReply:
      type: object
      description: >-
        `{}`, or the Bot API webhook-reply form for a consent button:
        `{ "method": "answerCallbackQuery", "callback_query_id": "..." }`.
      properties:
        method:
          type: string
          enum: [answerCallbackQuery]
        callback_query_id:
          type: string
    TelegramEngagementRegisterBotRequest:
      type: object
      additionalProperties: false
      required: [accountId]
      properties:
        accountId:
          type: string
          format: uuid
          description: A telegram bot channel account of this tenant.
        dailySendCeiling:
          type: integer
          minimum: 1
          maximum: 100000
          nullable: true
          description: Per-bot daily outbound ceiling; never above the deployment cap. Defaults to 500.
    TelegramEngagementBot:
      type: object
      properties:
        endpointId: { type: string, format: uuid }
        accountId: { type: string, format: uuid }
        accountName: { type: string }
        accountStatus: { type: string }
        businessScope:
          type: object
          nullable: true
          properties:
            type: { type: string }
            id: { type: string, format: uuid }
        state: { type: string, enum: [pending, active, failed, revoked] }
        pendingProviderAction:
          { type: string, enum: [set, delete], nullable: true }
        verifiedBotId: { type: string, nullable: true }
        botUsername: { type: string, nullable: true }
        lastErrorCode: { type: string, nullable: true }
        dailySendCeiling: { type: integer }
        breakerOpenUntil: { type: string, format: date-time, nullable: true }
        activatedAt: { type: string, format: date-time, nullable: true }
        lastUpdateAt: { type: string, format: date-time, nullable: true }
        createdAt: { type: string, format: date-time }
        revokedAt: { type: string, format: date-time, nullable: true }
    TelegramEngagementBotEnvelope:
      type: object
      properties:
        success: { type: boolean, enum: [true] }
        data:
          $ref: "#/components/schemas/TelegramEngagementBot"
        meta: { type: object }
    TelegramEngagementBotList:
      type: object
      properties:
        success: { type: boolean, enum: [true] }
        data:
          type: object
          properties:
            items:
              type: array
              items:
                $ref: "#/components/schemas/TelegramEngagementBot"
        meta: { type: object }
    TelegramEngagementRevokeEnvelope:
      type: object
      properties:
        success: { type: boolean, enum: [true] }
        data:
          type: object
          properties:
            accountId: { type: string, format: uuid }
            revoked: { type: boolean, enum: [true] }
            cancelledMessages: { type: integer }
        meta: { type: object }
    TelegramEngagementContact:
      type: object
      properties:
        id: { type: string, format: uuid }
        accountId: { type: string, format: uuid }
        label:
          type: string
          nullable: true
          description: A masked label derived from the keyed hash (`TG-1A2B3C`); carries no digit of the Telegram id. `null` once ended.
        state: { type: string, enum: [started, stopped, blocked, ended] }
        startParam:
          type: string
          nullable: true
          description: The first `/start` deep-link parameter (provenance, never consent).
        startedAt: { type: string, format: date-time }
        lastInboundAt: { type: string, format: date-time, nullable: true }
        stoppedAt: { type: string, format: date-time, nullable: true }
        blockedAt: { type: string, format: date-time, nullable: true }
        endedAt: { type: string, format: date-time, nullable: true }
        privacyClass: { type: string, enum: [conversation_meta] }
    TelegramEngagementEligibility:
      type: object
      properties:
        eligible: { type: boolean }
        reason:
          type: string
          nullable: true
          enum: [CONTACT_NOT_STARTED, CONSENT_REQUIRED, CONSENT_WITHDRAWN, null]
    TelegramEngagementContactPage:
      type: object
      properties:
        success: { type: boolean, enum: [true] }
        data:
          type: object
          properties:
            items:
              type: array
              items:
                $ref: "#/components/schemas/TelegramEngagementContact"
            nextCursor: { type: string, nullable: true }
        meta: { type: object }
    TelegramEngagementContactDetailEnvelope:
      type: object
      properties:
        success: { type: boolean, enum: [true] }
        data:
          allOf:
            - $ref: "#/components/schemas/TelegramEngagementContact"
            - type: object
              properties:
                eligibility:
                  type: object
                  properties:
                    support:
                      $ref: "#/components/schemas/TelegramEngagementEligibility"
                    transactional:
                      $ref: "#/components/schemas/TelegramEngagementEligibility"
                    marketing:
                      $ref: "#/components/schemas/TelegramEngagementEligibility"
                recentMessages:
                  type: array
                  items:
                    type: object
                    properties:
                      id: { type: string, format: uuid }
                      purpose:
                        {
                          type: string,
                          enum: [support, transactional, marketing]
                        }
                      kind: { type: string, enum: [text, consent_prompt] }
                      status:
                        {
                          type: string,
                          enum:
                            [
                              queued,
                              sending,
                              sent,
                              uncertain,
                              failed,
                              cancelled
                            ]
                        }
                      failureCode: { type: string, nullable: true }
                      createdAt: { type: string, format: date-time }
                      sentAt:
                        { type: string, format: date-time, nullable: true }
        meta: { type: object }
    TelegramEngagementEraseEnvelope:
      type: object
      properties:
        success: { type: boolean, enum: [true] }
        data:
          type: object
          properties:
            id: { type: string, format: uuid }
            state: { type: string, enum: [ended] }
