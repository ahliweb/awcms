        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: Idempotency-Key reused with a different request, or the task is not pending.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /api/v1/workflows/tasks/{id}/reassign:
    post:
      tags:
        - Workflow Approval
      operationId: workflowsReassignTask
      summary: Administrative recovery — reassign a pending task to another tenant user (idempotent, audited).
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: Idempotency-Key
          in: header
          required: true
          schema:
            type: string
        - $ref: "#/components/parameters/CorrelationId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - toTenantUserId
                - reason
              properties:
                toTenantUserId:
                  type: string
                  format: uuid
                reason:
                  type: string
      responses:
        "200":
          description: Task reassigned.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    enum:
                      - true
                  data:
                    type: object
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: Idempotency-Key reused with a different request, the task is not pending, or the target has already decided this task (reassigning to them would let one person's authority count twice toward quorum).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
components:
