            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /api/v1/user-groups/members:
    post:
      operationId: addUserGroupMember
      tags:
        - Identity & Access
      summary: Add a tenant user to a group (identity_access.user_groups.assign, audited).
      description: |-
        A grant in everything but name: membership confers every role the group holds, at once and with no further step. `assign` is a HIGH-RISK action, so this additionally passes the segregation-of-duties chokepoint.
        Idempotent by intent: re-adding somebody already in the group answers 200 with `added: false`. Adding a person to a group they are already in changes nothing about their access, and a 409 there would be an error message about the state the caller asked for.
      parameters:
        - $ref: "#/components/parameters/CorrelationId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UserGroupMembershipInput"
      responses:
        "200":
          description: Membership after the call.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    enum:
                      - true
                  data:
                    type: object
                    properties:
                      added:
                        type: boolean
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: The group is directory-managed (GROUP_EXTERNALLY_MANAGED).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
    delete:
      operationId: removeUserGroupMember
      tags:
        - Identity & Access
      summary: Remove a tenant user from a group (identity_access.user_groups.assign, audited).
      description: Takes away every role the group confers on that person, effective on their next authorization decision — there is no cache between membership and the grant read.
      parameters:
        - $ref: "#/components/parameters/CorrelationId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UserGroupMembershipInput"
      responses:
        "200":
          description: The membership was removed.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    enum:
                      - true
                  data:
                    type: object
                    properties:
                      removed:
                        type: boolean
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: The group is directory-managed (GROUP_EXTERNALLY_MANAGED).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
