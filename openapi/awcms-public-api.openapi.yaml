          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /api/v1/comments/{id}/report:
    post:
      operationId: reportPublicComment
      tags:
        - Comments
      summary: Report a comment for moderator attention.
      description: PUBLIC. De-duplicated per (comment, reporter ip hash, reason) by a database unique index, so repeated reports from one source do not inflate the queue's report count.
