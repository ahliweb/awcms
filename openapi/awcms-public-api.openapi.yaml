      operationId: submitPublicCommentReply
      tags:
        - Comments
      summary: Reply to an existing comment.
      description: PUBLIC. Same policy and anti-abuse gates as a top-level submission, with the parent supplied by the path and depth derived from it and capped. The parent's resource is re-confirmed as still published before the reply is accepted. Returns the same neutral acknowledgement shape as submit.
      security: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
