  /api/v1/push/diagnostics:
    get:
      operationId: getPushDiagnostics
      tags:
        - Push Delivery
      summary: The tenant's push outbox — queue counts, recent messages, attempts, devices.
      description: "One endpoint rather than four because the four parts are only readable together: they come from ONE transaction, so a queue count and a message list can never describe two different instants. Bounded rather than paginated — the historical tail is removed by retention (`bun run push:queue:purge`), not browsed. Endpoints are masked everywhere and notification bodies are never projected. `configured` reports the DEPLOYMENT's push flag and adapter name, which is what distinguishes a stuck queue from a deployment where push is simply off. Requires `push_delivery.diagnostics.read`."
      parameters:
        - name: status
          in: query
          required: false
          description: Narrow the message list to one queue status.
          schema:
            $ref: "#/components/schemas/PushMessageStatus"
        - name: limit
          in: query
          required: false
          description: '1-200, default 50. Out-of-range values are REJECTED rather than clamped: a caller asking for 1000 and silently receiving 200 would read the short list as "that is all there is".'
          schema:
            type: integer
            minimum: 1
            maximum: 200
      responses:
        "200":
          description: Push outbox diagnostics.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    enum:
                      - true
                  data:
                    type: object
                    properties:
                      summary:
                        $ref: "#/components/schemas/PushQueueSummary"
                      messages:
                        type: array
                        items:
                          $ref: "#/components/schemas/PushMessage"
                      attempts:
                        type: array
                        items:
                          $ref: "#/components/schemas/PushDeliveryAttempt"
                      subscriptions:
                        type: array
                        items:
                          $ref: "#/components/schemas/PushSubscription"
                      configured:
                        $ref: "#/components/schemas/PushDeploymentConfig"
                  meta:
                    type: object
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "422":
          description: Unknown status filter, or a limit outside 1-200.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /api/v1/push/messages/{id}/cancel:
    post:
      operationId: cancelPushMessage
      tags:
        - Push Delivery
      summary: Cancel a push notification that has not been sent yet.
      description: "Only `queued` and `retry_wait` are cancellable. A row in `sending` has been claimed by a dispatcher pass that may already be inside the HTTP call, so recording it as cancelled would be a claim this system cannot substantiate. Deliberately NOT idempotency-keyed: a second call performs no new work, so there is no replay contract to honour. Requires `push_delivery.messages.cancel`."
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: The message was cancelled before delivery.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    enum:
                      - true
                  data:
                    type: object
                    properties:
                      cancelled:
                        type: boolean
                        enum:
                          - true
                  meta:
                    type: object
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          description: Not cancellable. One answer for "no such message", "already sent", "already failed", "already cancelled" and "being sent right now" — distinguishing them would hand a narrow grant an existence oracle over the queue.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /api/v1/push/stream:
    get:
      operationId: streamPushQueueSummary
      tags:
        - Push Delivery
      summary: Server-sent stream of the push queue summary, re-authorized every tick.
      description: |-
        `text/event-stream`. The only SSE endpoint in this contract, and the one place where an authorization decision would otherwise become a STANDING permission: an ordinary route returns its connection to the pool before any byte reaches the client, so a thirty-minute stream would keep serving a role revoked at minute two. ADR-0075 decides otherwise — every tick opens its own transaction, runs the full guard chain again, and reads only after it allows.

        Three event names. `push-queue-summary` carries a `PushQueueSummary` every 5 s. `authorization-revoked` is terminal and the client must NOT reconnect — whatever it held is gone. `stream-error` is terminal and retryable, and is deliberately a DIFFERENT name: telling a client its access was revoked when the database was merely busy is a lie in the direction that gets investigated as a permissions bug.

        A connection ends after 10 minutes regardless; `EventSource` reconnects by itself, so the ceiling costs a reconnect while its absence would cost a connection slot forever. The message and attempt lists are NOT streamed — they are bounded at 50 rows and change shape rather than value. Requires `push_delivery.diagnostics.read`, re-checked per tick.
      responses:
        "200":
          description: The event stream.
          content:
            text/event-stream:
              schema:
                type: string
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /api/v1/push/subscriptions:
    get:
      operationId: listOwnPushSubscriptions
      tags:
        - Push Delivery
      summary: List the caller's own registered push devices.
      description: "Every device the calling identity has registered in this tenant, newest first, with the endpoint MASKED — the raw endpoint is credential-grade and is projected by exactly one server-side function, immediately before a provider call. Also returns whether Web Push is configured on this deployment and, if so, the VAPID application server key the browser needs for PushManager.subscribe(). That key is public by definition; it travels with the list so a client needs one round trip rather than two. A machine credential presented here receives the ordinary 401: it has no device."
      responses:
        "200":
          description: The caller's devices plus the deployment's Web Push capability.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    enum:
                      - true
                  data:
                    type: object
                    properties:
                      subscriptions:
                        type: array
                        items:
                          $ref: "#/components/schemas/PushSubscription"
                      webPush:
                        $ref: "#/components/schemas/WebPushCapability"
                  meta:
                    type: object
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
    post:
      operationId: registerOwnPushSubscription
      tags:
        - Push Delivery
      summary: Register (or re-activate) a push device for the caller.
      description: 'Takes the browser''s own PushSubscription.toJSON() shape plus a transport discriminator. The owner is the calling identity and cannot be supplied: there is no recipient parameter on this endpoint. Re-registration is safe and expected — browsers re-issue PushManager.subscribe() on every page load once permission is granted, so a conflict on the endpoint hash updates the existing row (and re-activates it if a push service had previously reported it gone) instead of creating a second one. Returns 201 in both cases: "created" versus "already yours" is a distinction the client cannot act on. A suspended tenant is refused (ADR-0073).'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PushSubscriptionRegistration"
      responses:
        "201":
          description: The registered device.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    enum:
                      - true
                  data:
                    type: object
                    properties:
                      subscription:
                        $ref: "#/components/schemas/PushSubscription"
                  meta:
                    type: object
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "422":
          description: Malformed registration — unknown transport, a non-https endpoint, an endpoint pointing at a literal private address, or key material that is not the RFC 8291 size.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /api/v1/push/subscriptions/{id}:
    delete:
      operationId: revokeOwnPushSubscription
      tags:
        - Push Delivery
      summary: Retire one of the caller's own push devices.
      description: 'Ownership is matched inside the UPDATE rather than checked after a read, so there is no window between the two and no way to learn whether an id belongs to somebody else. "No such subscription", "belongs to another user" and "already revoked" all answer 404. The row survives as evidence that the device was revoked and when, but the stored endpoint does not: a user-initiated revocation destroys it, because unlike a subscription the push service reported gone, this one may still be perfectly usable.'
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: The device was revoked.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    enum:
                      - true
                  data:
                    type: object
                    properties:
                      revoked:
                        type: boolean
                        enum:
                          - true
                  meta:
                    type: object
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
  /api/v1/push/test:
    post:
      operationId: sendPushTestNotification
      tags:
        - Push Delivery
      summary: Queue a test notification to the caller's own devices.
      description: "Proves the parts of the chain nothing else can see — that the VAPID key pair matches the one the browser subscribed with, that the service worker registered at the right scope, that the operating system is not withholding permission. Each of those fails as a queue that drains cleanly and a device that shows nothing. The recipient is the CALLER and the endpoint accepts no recipient parameter: a test that took one would be an arbitrary-notification surface, delivering system-branded text of the sender's choosing to any colleague's lock screen. Title and body are fixed for the same reason. Requires `push_delivery.diagnostics.check`."
      responses:
        "200":
          description: How many devices the test was queued to.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    enum:
                      - true
                  data:
                    type: object
                    properties:
                      queuedCount:
                        type: integer
                        minimum: 1
                  meta:
                    type: object
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          description: Push is disabled on this deployment (the dispatcher would claim nothing, leaving the probe queued forever), or the caller has no active device to send to.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /api/v1/registration-requests:
    get:
      operationId: listRegistrationRequests
      tags:
        - Identity & Access
      summary: Pending self-registration requests for this tenant.
      description: Oldest first, bounded. Login identifiers are MASKED — a reviewer decides on a name and a domain, and this is the one response that would otherwise expose every applicant address at once.
      responses:
        "200":
          description: The pending queue.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    enum:
                      - true
                  data:
                    type: object
                    properties:
                      items:
                        type: array
                        items:
                          $ref: "#/components/schemas/RegistrationRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
  /api/v1/registration-requests/{id}/approve:
    post:
      operationId: approveRegistrationRequest
      tags:
        - Identity & Access
      summary: Approve a request, creating a real account.
      description: "The only path that materializes profile + identity + tenant_user, hence its own permission (`registration_requests.approve`), separate from `reject`. The account is created with an UNUSABLE password and the applicant is emailed a password-reset link; `delivery` reports whether that link could actually be queued. `roleIds` is optional and defaults to none — an approval never grants a role by default, and a SYSTEM role (`owner`) is refused with 409 `ROLE_SYSTEM_PROTECTED`: admitting a person to a tenant is not the authority to hand out the tenant's whole permission catalogue."
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                roleIds:
                  type: array
                  items:
                    type: string
                    format: uuid
      responses:
        "200":
          description: Account created.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    enum:
                      - true
                  data:
                    type: object
                    properties:
                      approved:
                        type: boolean
                      identityId:
                        type: string
                        format: uuid
                      tenantUserId:
                        type: string
                        format: uuid
                      delivery:
                        type: string
                        enum:
                          - queued
                          - unavailable
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: "`IDENTIFIER_TAKEN` — an account with that login identifier already exists; or `ROLE_SYSTEM_PROTECTED` — one of `roleIds` names a system role, which no approval may grant."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
