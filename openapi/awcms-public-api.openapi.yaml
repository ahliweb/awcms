      operationId: submitFormDraft
      tags:
        - Form Drafts
      summary: Mark a draft as submitted.
      description: "High-risk: hands the payload to a domain action, so an Idempotency-Key is required and the same key with a different body is a conflict. Guarded on `form_drafts.draft.update` — there is no separate `submit` permission, because an action nobody seeds into a role denies even the tenant owner while looking correct."
      parameters:
        - name: id
          in: path
          required: true
