                                  type: boolean
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
  /api/v1/tenants:
    get:
      operationId: listTenants
      tags:
        - Tenant Admin
      summary: List every tenant on the deployment (PLATFORM-scoped).
      description: "Gated by tenant_admin.tenant_provisioning.read, which is scope: platform (ADR-0053) — the chokepoint refuses it unless the acting tenant IS the platform tenant. Deliberately platform-scoped rather than tenant-scoped: this lists EVERY tenant, so a tenant-scoped read would let any customer enumerate the platform's customer list. The projection is narrow on purpose (code, name, status, created_at) — a directory answers who is on the deployment, not what is inside their tenant."
      parameters:
        - $ref: "#/components/parameters/CorrelationId"
      responses:
        "200":
          description: The tenant directory, newest first.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    enum:
                      - true
                  data:
                    type: object
                    properties:
                      items:
                        type: array
                        items:
                          $ref: "#/components/schemas/TenantDirectoryEntry"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
    post:
      operationId: provisionTenant
      tags:
        - Tenant Admin
      summary: Provision a new tenant with its owner account (PLATFORM-scoped).
      description: "Gated by tenant_admin.tenant_provisioning.create, which is scope: platform. Creates the tenant, its head office, the owner profile/identity/tenant-user, the system `owner` role, and that role's grants — the SAME code path the setup wizard uses, so the `WHERE scope = 'tenant'` filter on those grants cannot drift between the two. A provisioned tenant NEVER receives platform-scoped permissions. `Idempotency-Key` required; audited in the platform tenant's log. Returns 409 when the tenant_code is taken."
      parameters:
        - name: Idempotency-Key
          in: header
          required: true
          schema:
            type: string
        - $ref: "#/components/parameters/CorrelationId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - tenantCode
                - tenantName
                - officeCode
                - officeName
                - ownerLoginIdentifier
                - ownerPassword
                - ownerDisplayName
              properties:
                tenantCode:
                  type: string
                tenantName:
                  type: string
                officeCode:
                  type: string
                officeName:
                  type: string
                ownerLoginIdentifier:
                  type: string
                ownerPassword:
                  type: string
                  minLength: 8
                ownerDisplayName:
                  type: string
      responses:
        "200":
          description: The provisioned tenant.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    enum:
                      - true
                  data:
                    type: object
                    properties:
                      tenant:
                        type: object
                        properties:
                          id:
                            type: string
                            format: uuid
                          tenantCode:
                            type: string
                          tenantName:
                            type: string
                          officeId:
                            type: string
                            format: uuid
                          ownerTenantUserId:
                            type: string
                            format: uuid
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          description: Idempotency-Key reused with a different request, or tenant_code already taken.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /api/v1/tenants/{id}/restore:
    post:
      operationId: restoreTenant
      tags:
        - Tenant Admin
      summary: Lift a tenant suspension and resume service (PLATFORM-scoped).
      description: "ADR-0073. Gated by tenant_admin.tenant_lifecycle.restore — a SEPARATE permission from disable, on purpose: during an incident you want someone who can bring a customer back without being able to cut one off, the same split machine_credentials already draws between create and revoke. Restoring an already-active tenant returns 200 with changed=false."
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - $ref: "#/components/parameters/CorrelationId"
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                reason:
                  type: string
                  maxLength: 500
                  nullable: true
      responses:
        "200":
          description: The tenant's resulting status.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    enum:
                      - true
                  data:
                    $ref: "#/components/schemas/TenantLifecycleResult"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
  /api/v1/tenants/{id}/suspend:
    post:
      operationId: suspendTenant
      tags:
        - Tenant Admin
      summary: Suspend a tenant, stopping service (PLATFORM-scoped).
      description: "ADR-0073. Gated by tenant_admin.tenant_lifecycle.disable, which is scope: platform — suspending a tenant changes ANOTHER party's state, so no ordinary tenant may hold it however its roles are arranged. No revocation sweep runs and none is needed: the chokepoint checks the TENANT, not the credential, so every live session and every machine credential (which can live up to a year) is refused from its next request onward. Before this existed, suspending a tenant killed its public site instantly and left its admin sessions and machine credentials fully working. Re-suspending an already-suspended tenant returns 200 with changed=false and writes no transition row. Suspending the PLATFORM tenant returns 409: it would be refused every action including the one that lifts the suspension."
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - $ref: "#/components/parameters/CorrelationId"
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                reason:
                  type: string
                  maxLength: 500
                  nullable: true
                  description: Recorded on the tenant, in its status-transition log, and in its own audit trail — a suspended customer is entitled to see why.
      responses:
        "200":
          description: The tenant's resulting status.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    enum:
                      - true
                  data:
                    $ref: "#/components/schemas/TenantLifecycleResult"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: The PLATFORM tenant cannot be suspended (PLATFORM_TENANT_PROTECTED) — it would be refused every action, including the one that lifts the suspension.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
