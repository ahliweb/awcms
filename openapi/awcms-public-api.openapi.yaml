  /api/v1/data-lifecycle/registry:
    get:
      tags:
        - Data Lifecycle
      summary: List the high-volume table lifecycle registry
      description: Gated by data_lifecycle.registry.read. Code-declared descriptor metadata only (table/owner/scope/cursor/retention bounds/execution mode) — never row contents, never a live count. The response body is identical for every tenant; auth/ABAC still applies. Two arrays, because a table's owner is either a module or infrastructure and the two cannot be spelled the same way (ADR-0076).
      operationId: dataLifecycleRegistryList
      parameters:
        - $ref: "#/components/parameters/CorrelationId"
      responses:
        "200":
          description: The registered high-volume table descriptors.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    enum:
                      - true
                  data:
                    type: object
                    properties:
                      descriptors:
                        type: array
                        items:
                          $ref: "#/components/schemas/DataLifecycleDescriptor"
                      infrastructureDescriptors:
                        type: array
                        description: Descriptors for tables owned by src/lib/ infrastructure rather than by a module (ADR-0076). Always executionMode "delegated" — the generic engine purges on behalf of an owning module, and these have none.
                        items:
                          $ref: "#/components/schemas/DataLifecycleInfrastructureDescriptor"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
