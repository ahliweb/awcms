                                  type: integer
                                hidden:
                                  type: boolean
                          items:
                            type: array
                            items:
                              type: object
                              properties:
                                entryKey:
                                  type: string
                                typeKey:
                                  type: string
                                  nullable: true
                                position:
                                  type: integer
                                labelOverride:
                                  type: string
                                  nullable: true
                                hidden:
                                  type: boolean
