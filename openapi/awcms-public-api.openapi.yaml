            type: string
        - name: search
          in: query
          required: false
          description: Case-folded substring of the region name. LIKE wildcards in the input are matched literally.
          schema:
            type: string
        - name: limit
          in: query
          required: false
          description: Page size, clamped to 200.
          schema:
            type: integer
            minimum: 1
            maximum: 200
            default: 50
        - name: after
          in: query
          required: false
          description: Keyset cursor — the `code` of the last item on the previous page.
          schema:
            type: string
        - $ref: "#/components/parameters/CorrelationId"
      responses:
