                  format: uuid
                roleId:
                  type: string
                  format: uuid
                  nullable: true
                scopeType:
                  type: string
                  description: Lowercase snake_case scope type (e.g. "office").
                scopeId:
                  type: string
                  format: uuid
                effectiveFrom:
                  type: string
                  format: date-time
                effectiveTo:
                  type: string
                  format: date-time
                  nullable: true
                isTemporary:
                  type: boolean
                reason:
                  type: string
