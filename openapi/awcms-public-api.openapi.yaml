            - file
            - manual
            - null
        verificationRecordName:
          type: string
          nullable: true
        verificationRecordValue:
          type: string
          nullable: true
        verifiedAt:
          type: string
          format: date-time
          nullable: true
        lastCheckedAt:
          type: string
          format: date-time
          nullable: true
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        createdBy:
          type: string
          format: uuid
          nullable: true
        updatedBy:
          type: string
          format: uuid
          nullable: true
    TenantLifecycleResult:
      type: object
      description: Result of a suspend/restore transition (ADR-0073).
      properties:
        tenantId:
          type: string
          format: uuid
        status:
          type: string
          description: The tenant's status after the call.
        changed:
          type: boolean
          description: False when the tenant was already in the requested status — the caller got what they asked for, and no transition row was written.
      required:
        - tenantId
        - status
        - changed
    TenantMfaPolicy:
      type: object
      properties:
        tenantId:
          type: string
          format: uuid
        enforcementLevel:
          type: string
          enum:
            - optional
            - required_for_privileged
            - required_for_all
        updatedAt:
          type: string
          format: date-time
          nullable: true
    TenantModule:
      type: object
      properties:
        moduleKey:
          type: string
        name:
          type: string
        version:
          type: string
        isCore:
          type: boolean
        tenantEnabled:
          type: boolean
        enabledAt:
          type: string
          format: date-time
          nullable: true
        disabledAt:
          type: string
          format: date-time
          nullable: true
        disableReason:
          type: string
          nullable: true
    TenantUserMasked:
      type: object
      properties:
        id:
          type: string
          format: uuid
        loginIdentifierMasked:
          type: string
          description: Masked login identifier — PII is never returned raw in a list.
        status:
          type: string
        roles:
          type: array
          items:
            type: string
          description: Assigned role codes (empty when the user holds no role).
    TenantUserSessionSummary:
      type: object
      description: One live session of a named tenant user, as seen by an administrator. Same exclusions as OwnSessionSummary — no token, no raw IP, no raw User-Agent.
      required:
        - id
        - issuedAt
        - expiresAt
        - assuranceLevel
        - originAuth
        - isCallerSession
      additionalProperties: false
      properties:
        id:
          type: string
          format: uuid
        issuedAt:
          type: string
          format: date-time
        expiresAt:
          type: string
          format: date-time
        assuranceLevel:
          type: string
          enum:
            - aal1
            - aal2
        originAuth:
          type: string
          enum:
            - password
            - sso
            - handoff
        clientIpHash:
          type:
            - string
            - "null"
          description: Keyed, non-reversible pseudonym of the client IP. null when the deployment has no stable AUTH_IP_HASH_SECRET.
        userAgentSummary:
          type:
            - string
            - "null"
        isCallerSession:
          type: boolean
          description: True only when the endpoint is pointed at the caller's own tenant user AND this row is the session making the request.
    ThemeConfigRequest:
      type: object
      description: A tenant's DATA-only theme configuration. Every key/value is validated against the chosen theme descriptor; unknown tokens/slots/assets/sections are rejected, and token values are validated by rejection against strict CSS grammars (no url()/expression()/@import/javascript:/comment-breakout).
      required:
        - themeKey
      properties:
        themeKey:
          type: string
          maxLength: 64
          description: A registered (build-time) theme key.
        tokenOverrides:
          type: object
          additionalProperties:
            type: string
          description: tokenKey -> validated token value (color/dimension/number, or a font-family allow-list key). Unknown token keys are rejected.
        slotSelections:
          type: object
          additionalProperties:
            type: string
          description: slotKey -> chosen variant key (from the slot's allow-list).
        assetRefs:
          type: object
          additionalProperties:
            type: string
            format: uuid
            nullable: true
          description: assetSlotKey -> media object UUID (never a URL); null clears the slot.
        sectionOrder:
          type: array
          items:
            type: string
          description: An ordering of the theme's declared content-section keys.
        navPlacement:
          type: string
          description: One of the theme's declared nav placements.
    ThemeDraft:
      type: object
      required:
        - versionId
        - themeKey
        - config
        - configHash
      properties:
        versionId:
          type: string
          format: uuid
        themeKey:
          type: string
        config:
          type: object
          description: The validated, normalized config as stored.
        configHash:
          type: string
    ThemeValidationResult:
      type: object
      required:
        - valid
        - errors
        - previewCss
      properties:
        valid:
          type: boolean
        errors:
          type: array
          items:
            type: object
            required:
              - field
              - message
            properties:
              field:
                type: string
              message:
                type: string
        previewCss:
          type: string
          nullable: true
          description: The `:root { … }` custom-property block that would be served, when valid; null when invalid.
    ThemeVersion:
      type: object
      required:
        - versionId
        - themeKey
        - versionNumber
      properties:
        versionId:
          type: string
          format: uuid
        themeKey:
          type: string
        versionNumber:
          type: integer
          nullable: true
        configHash:
          type: string
        publishedAt:
          type: string
          format: date-time
          nullable: true
    ThemingState:
      type: object
      required:
        - themes
        - state
        - draft
        - versions
      properties:
        themes:
          type: array
          description: Available reviewed, build-time theme descriptors.
          items:
            type: object
        state:
          type: object
          required:
            - activeThemeKey
            - activeVersionId
            - draftThemeKey
          properties:
            activeThemeKey:
              type: string
              nullable: true
            activeVersionId:
              type: string
              format: uuid
              nullable: true
            draftThemeKey:
              type: string
              nullable: true
        draft:
          type: object
          nullable: true
        versions:
          type: array
          items:
            $ref: "#/components/schemas/ThemeVersion"
    UpdateTenantDomainRequest:
      type: object
      description: At least one field required. `status` may not be `active` (use verify); `hostname`/`is_primary` are immutable.
      properties:
        domainType:
          type: string
          enum:
            - subdomain
            - custom_domain
        routeMode:
          type: string
          enum:
            - canonical
            - legacy_blog
        status:
          type: string
          enum:
            - pending_verification
            - suspended
            - failed
        verificationMethod:
          type: string
          nullable: true
          enum:
            - dns_txt
            - dns_cname
            - file
            - manual
            - null
        verificationRecordName:
          type: string
          nullable: true
        verificationRecordValue:
          type: string
          nullable: true
        redirectToPrimary:
          type: boolean
    UserGroupMembershipInput:
      type: object
      required:
        - userGroupId
        - tenantUserId
      properties:
        userGroupId:
          type: string
          format: uuid
        tenantUserId:
          type: string
          format: uuid
    UserGroupRecord:
      type: object
      required:
        - id
        - groupCode
        - groupName
        - source
      properties:
        id:
          type: string
          format: uuid
        groupCode:
          type: string
        groupName:
          type: string
        description:
          type: string
          nullable: true
        source:
          type: string
          enum:
            - local
            - scim
    UserGroupSummary:
      type: object
      description: One live user group, with the two counts that make the list decidable.
      required:
        - id
        - groupCode
        - groupName
        - source
        - memberCount
        - roleCount
      properties:
        id:
          type: string
          format: uuid
        groupCode:
          type: string
        groupName:
          type: string
        description:
          type: string
          nullable: true
        source:
          type: string
          enum:
            - local
            - scim
        externalId:
          type: string
          nullable: true
          description: The directory's own identifier. It is the sync key rather than groupCode, because humans rename group codes and a rename must not orphan the group.
        memberCount:
          type: integer
          minimum: 0
        roleCount:
          type: integer
          minimum: 0
          description: Active role grants held BY the group. Everyone in the group holds them too.
    VisitEvent:
      type: object
      description: A single page-view/API event. Raw-detail fields (ipHash/userAgentHash) are null unless the caller holds visitor_analytics.raw_detail.read.
      properties:
        id:
          type: string
          format: uuid
        visitorSessionId:
          type: string
          format: uuid
          nullable: true
        identityId:
          type: string
          format: uuid
          nullable: true
        occurredAt:
          type: string
          format: date-time
        method:
          type: string
        statusCode:
          type: integer
          nullable: true
        area:
          type: string
        routePattern:
          type: string
          nullable: true
        pathSanitized:
          type: string
        referrerDomain:
          type: string
          nullable: true
        durationMs:
          type: integer
          nullable: true
        userAgentParsed:
          type: object
          additionalProperties: true
        geo:
          type: object
          additionalProperties: true
        humanStatus:
          type: string
          enum:
            - human
            - bot
            - unknown
        correlationId:
          type: string
          nullable: true
        ipHash:
          type: string
          nullable: true
        userAgentHash:
          type: string
          nullable: true
    VisitorSession:
      type: object
      description: A visitor session. Raw-detail fields (ipAddress/ipHash/userAgentHash/loginIdentifierSnapshot) are null unless the caller holds visitor_analytics.raw_detail.read.
      properties:
        id:
          type: string
          format: uuid
        visitorKeyHash:
          type: string
        identityId:
          type: string
          format: uuid
          nullable: true
        isAuthenticated:
          type: boolean
        area:
          type: string
        currentPath:
          type: string
          nullable: true
        firstSeenAt:
          type: string
          format: date-time
        lastSeenAt:
          type: string
          format: date-time
        browserName:
          type: string
          nullable: true
        browserVersionMajor:
          type: string
          nullable: true
        osName:
          type: string
          nullable: true
        deviceType:
          type: string
          nullable: true
        isHuman:
          type: boolean
        botReason:
          type: string
          nullable: true
        countryCode:
          type: string
          nullable: true
        region:
          type: string
          nullable: true
        city:
          type: string
          nullable: true
        timezone:
          type: string
          nullable: true
        loginIdentifierSnapshot:
          type: string
          nullable: true
        ipHash:
          type: string
          nullable: true
        ipAddress:
          type: string
          nullable: true
        userAgentHash:
          type: string
          nullable: true
    WebPushCapability:
      type: object
      properties:
        enabled:
          type: boolean
          description: "False is a normal answer, not an error: an offline/LAN deployment has no push service to reach and no VAPID key pair configured."
        applicationServerKey:
          type: string
          nullable: true
          description: base64url VAPID public key, passed straight to PushManager.subscribe(). Public by definition — it is the value the browser hands the push service to identify this application server. Rotating it does NOT re-key existing subscriptions; it makes every one of them permanently undeliverable until the user subscribes again.
security:
  - bearerAuth: []
    tenantHeader: []
