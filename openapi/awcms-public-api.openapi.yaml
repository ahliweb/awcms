        effectiveFrom:
          type: string
          format: date-time
          nullable: true
        effectiveUntil:
          type: string
          format: date-time
          nullable: true
        preserveQuery:
          type: boolean
          default: false
        reason:
          type: string
          nullable: true
          maxLength: 500
        origin:
          type: string
          enum:
            - manual
            - slug_change
            - domain_change
            - locale_change
            - import
            - legacy_blog
          default: manual
    SeoRedirectSettings:
      type: object
      description: Per-tenant redirect governance policy (awcms_seo_redirect_settings).
      required:
        - legacyBlogRedirectEnabled
        - urlChangeAutoPolicy
      properties:
        legacyBlogRedirectEnabled:
          type: boolean
          default: false
          description: INERT in awcms (no /news route family) — retained for parity. When true (and the tenant has a verified primary host) /blog/{tenantCode}... would 301-redirect to the canonical /news... equivalent. Default false = behavior unchanged.
        urlChangeAutoPolicy:
          type: string
          enum:
            - skip
            - propose
            - create
          default: propose
          description: Default action when a URL change is captured. 'propose' (default) creates an INACTIVE rule for operator review; 'create' activates immediately; 'skip' does nothing.
    SeoRedirectUpdateRequest:
      type: object
      required:
        - target
      description: Update the mutable fields (source path is immutable — supplied only at create).
      properties:
        target:
          type: string
          maxLength: 2048
        localeScope:
          type: string
          nullable: true
        domainScopeHost:
          type: string
          nullable: true
        statusCode:
          type: integer
          enum:
            - 301
            - 302
            - 307
            - 308
          default: 301
        state:
          type: string
          enum:
            - active
            - inactive
            - archived
          default: active
        effectiveFrom:
          type: string
          format: date-time
          nullable: true
        effectiveUntil:
          type: string
          format: date-time
          nullable: true
        preserveQuery:
          type: boolean
          default: false
        reason:
          type: string
          nullable: true
          maxLength: 500
    SeoTenantSettings:
      type: object
      description: Resolved, render-ready tenant SEO defaults. Media id fields are bare object ids resolved through media_library at render time (never raw URLs). All string fields are trimmed and empty-collapsed to null.
      required:
        - siteName
        - defaultMetaDescription
        - defaultSocialMediaId
        - twitterSiteHandle
        - organizationName
        - organizationLogoMediaId
        - defaultRobotsNoindex
        - feedTitle
        - feedDescription
        - feedLogoMediaId
        - feedItemLimit
        - includedResourceTypes
        - sitemapEnabled
        - feedsEnabled
      additionalProperties: false
      properties:
        siteName:
          type: string
          nullable: true
          maxLength: 200
        defaultMetaDescription:
          type: string
          nullable: true
          maxLength: 500
        defaultSocialMediaId:
          type: string
          format: uuid
          nullable: true
        twitterSiteHandle:
          type: string
          nullable: true
          maxLength: 80
        organizationName:
          type: string
          nullable: true
          maxLength: 200
        organizationLogoMediaId:
          type: string
          format: uuid
          nullable: true
        defaultRobotsNoindex:
          type: boolean
          description: Tenant-wide "this whole site is noindex" switch — when true every surface degrades to noindex and robots.txt disallows all crawling.
        feedTitle:
          type: string
          nullable: true
          maxLength: 200
        feedDescription:
          type: string
          nullable: true
          maxLength: 500
        feedLogoMediaId:
          type: string
          format: uuid
          nullable: true
        feedItemLimit:
          type: integer
