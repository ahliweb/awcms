                          properties:
                            moduleKey:
                              type: string
                            activityCode:
                              type: string
                            action:
                              type: string
                            description:
                              type: string
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
  /api/v1/access/policies:
    get:
      operationId: accessListAbacPolicies
      tags:
        - Identity & Access
      summary: List the tenant's dynamic ABAC (DSL) policies (Issue
      description: Reads every stored DSL policy for the tenant (active and inactive). Gated on `identity_access.abac_policies.read`.
      responses:
        "200":
          description: The tenant's DSL ABAC policies.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    enum:
                      - true
                  data:
                    type: object
                    properties:
                      policies:
                        type: array
                        items:
                          $ref: "#/components/schemas/AbacDslPolicy"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
    post:
      operationId: accessCreateAbacPolicy
      tags:
        - Identity & Access
      summary: Author a new dynamic ABAC (DSL) policy (high-risk; audit-logged; only valid DSL is stored).
      description: Validates the condition DSL fail-closed before any write, so an invalid policy can never be stored or enabled. Created disabled by default unless `isActive:true`. Gated on `identity_access.abac_policies.configure`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AbacDslPolicyWriteRequest"
      responses:
        "200":
          description: The created policy.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    enum:
                      - true
                  data:
                    type: object
                    properties:
                      policy:
