            - tenant
            - global
        cursorColumn:
          type: string
        retentionClass:
          type: string
        retentionMinDays:
          type: integer
        retentionMaxDays:
          type: integer
        defaultRetentionDays:
          type: integer
        batchLimit:
          type: integer
        executionMode:
