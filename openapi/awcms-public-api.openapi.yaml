                        type: boolean
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "413":
          $ref: "#/components/responses/BadRequest"
  /api/v1/sync/push:
    post:
      operationId: syncPush
      tags:
        - Sync Storage
      summary: Push a batch of local events to the server (idempotent per batchId, HMAC-authenticated).
      security:
        - syncHmac: []
          tenantHeader: []
      parameters:
        - $ref: "#/components/parameters/SyncNodeId"
        - $ref: "#/components/parameters/SyncTimestamp"
        - $ref: "#/components/parameters/SyncSignature"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - batchId
                - events
              properties:
                batchId:
                  type: string
                events:
                  type: array
                  items:
                    type: object
                    required:
                      - eventType
                      - aggregateType
                      - payload
                    properties:
                      eventType:
                        type: string
                      aggregateType:
                        type: string
                      aggregateId:
                        type: string
                        format: uuid
                      baseVersion:
                        type: integer
                        minimum: 0
                      payload: {}
      responses:
        "200":
          description: Batch accepted (or already applied, if the batchId was seen before).
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    enum:
                      - true
                  data:
                    type: object
                    properties:
                      batchId:
                        type: string
                      accepted:
                        type: integer
                      conflicted:
                        type: integer
                      duplicate:
                        type: boolean
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "413":
          $ref: "#/components/responses/BadRequest"
  /api/v1/sync/status:
    get:
      operationId: syncGetStatus
      tags:
        - Sync Storage
