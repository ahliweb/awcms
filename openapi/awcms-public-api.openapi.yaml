  /api/v1/user-groups:
    get:
      operationId: listUserGroups
      tags:
        - Identity & Access
      summary: List the tenant's user groups (identity_access.user_groups.read).
      description: |-
        A group is a SUBJECT that can hold role grants, so this list carries a `roleCount` beside `memberCount`: a group holding grants is an authority no amount of looking at PEOPLE would reveal.
        `source` is `local` or `scim`. A `scim` group is managed by an external directory and refuses local mutation with 409 GROUP_EXTERNALLY_MANAGED — SCIM itself is not implemented, only the refusal, because a local edit a later sync silently reverts is worse than one that was never accepted.
      parameters:
        - $ref: "#/components/parameters/CorrelationId"
      responses:
        "200":
          description: The tenant's live user groups, ordered by code.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    enum:
                      - true
                  data:
                    type: object
                    properties:
                      groups:
                        type: array
                        items:
                          $ref: "#/components/schemas/UserGroupSummary"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
    post:
      operationId: createUserGroup
      tags:
        - Identity & Access
      summary: Create a local user group (identity_access.user_groups.create, audited).
      description: "Creates a group with no members and no grants. `source` is never accepted from the request: a caller who could declare a group `scim` would be declaring it un-editable through the only surface that exists, with no directory behind it to edit it instead."
      parameters:
        - $ref: "#/components/parameters/CorrelationId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - groupCode
                - groupName
              properties:
                groupCode:
                  type: string
                  pattern: ^[a-z][a-z0-9_-]{1,63}$
                groupName:
                  type: string
                  maxLength: 200
                description:
                  type: string
                  nullable: true
                  maxLength: 1000
      responses:
        "201":
          description: The created group.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    enum:
                      - true
                  data:
                    $ref: "#/components/schemas/UserGroupRecord"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          description: A live group already holds this code (GROUP_CODE_TAKEN).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
