            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    enum:
                      - true
                  data:
                    type: object
                    properties:
                      conflicts:
                        type: array
                        items:
                          type: object
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
  /api/v1/sync/conflicts/{id}/resolve:
    post:
      operationId: syncResolveConflict
      tags:
        - Sync Storage
      summary: Resolve a sync conflict (bearer session, not HMAC, audited).
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - resolution
              properties:
                resolution:
                  type: string
                  enum:
                    - accept_incoming
                    - keep_existing
                    - manual
                note:
                  type: string
      responses:
        "200":
          description: Conflict resolved.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    enum:
                      - true
                  data:
                    type: object
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: Conflict is already resolved.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "413":
          $ref: "#/components/responses/BadRequest"
  /api/v1/sync/nodes:
    get:
      operationId: syncListNodes
      tags:
        - Sync Storage
      summary: List sync nodes for the tenant (bearer session or SSR cookie, not HMAC).
      description: Admin-facing view of node registrations — distinct from the machine-to-machine HMAC endpoints (/sync/push, /sync/pull, /sync/status, /sync/objects*).
      responses:
        "200":
          description: All sync nodes registered for the tenant.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    enum:
                      - true
                  data:
                    type: object
                    properties:
                      nodes:
                        type: array
                        items:
                          type: object
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
  /api/v1/sync/nodes/{id}:
    patch:
      operationId: syncUpdateNode
      tags:
        - Sync Storage
      summary: Activate/deactivate or rename a sync node (audited).
      description: "Deactivating a node takes effect immediately: every HMAC sync endpoint already rejects a non-active node with 403."
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                status:
                  type: string
                  enum:
                    - active
                    - inactive
                nodeName:
                  type: string
                  minLength: 1
      responses:
        "200":
          description: Sync node updated.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    enum:
                      - true
                  data:
                    type: object
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "413":
          $ref: "#/components/responses/BadRequest"
  /api/v1/sync/object-queue:
    get:
      operationId: syncListObjectQueue
      tags:
        - Sync Storage
      summary: List object sync queue entries tenant-wide (bearer session, not HMAC).
      description: Admin-facing, all-nodes view — distinct from the node-scoped HMAC GET /sync/objects/status.
      parameters:
        - name: status
          in: query
          required: false
          schema:
            type: string
            enum:
              - pending
              - sent
              - failed
        - name: cursor
          in: query
          required: false
          schema:
            type: string
      responses:
        "200":
          description: Object sync queue entries tenant-wide (limit 200), newest first.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    enum:
                      - true
                  data:
                    type: object
                    properties:
                      objects:
                        type: array
                        items:
                          type: object
                      nextCursor:
                        type: string
                        nullable: true
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
  /api/v1/sync/object-queue/{id}/retry:
    post:
      operationId: syncRetryObjectQueueEntry
      tags:
        - Sync Storage
      summary: Manually retry a failed object sync queue entry (audited).
      description: Human override of the automatic exponential-backoff schedule. Only `failed` entries are eligible; `pending`/`sent` are rejected with 409.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Entry reset to pending.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    enum:
                      - true
                  data:
                    type: object
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: Only failed entries can be retried.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /api/v1/sync/objects:
    post:
      operationId: syncEnqueueObjects
      tags:
        - Sync Storage
      summary: Enqueue local objects for object-storage sync (upsert by objectKey, HMAC-authenticated).
      security:
        - syncHmac: []
          tenantHeader: []
      parameters:
        - $ref: "#/components/parameters/SyncNodeId"
        - $ref: "#/components/parameters/SyncTimestamp"
        - $ref: "#/components/parameters/SyncSignature"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - objects
              properties:
                objects:
                  type: array
                  items:
                    type: object
                    required:
                      - objectKey
                      - localPath
                      - checksumSha256
                      - byteSize
                    properties:
                      objectKey:
                        type: string
                      localPath:
                        type: string
                      checksumSha256:
                        type: string
                        pattern: ^[a-f0-9]{64}$
                      byteSize:
                        type: integer
                        minimum: 0
      responses:
        "200":
          description: Objects queued (re-enqueuing an existing objectKey upserts it back to pending).
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    enum:
                      - true
                  data:
                    type: object
                    properties:
                      queued:
                        type: integer
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "413":
          $ref: "#/components/responses/BadRequest"
  /api/v1/sync/objects/status:
    get:
      operationId: syncGetObjectsStatus
      tags:
        - Sync Storage
      summary: List this node's pending/failed object sync queue entries (HMAC-authenticated).
      security:
        - syncHmac: []
          tenantHeader: []
      parameters:
        - $ref: "#/components/parameters/SyncNodeId"
        - $ref: "#/components/parameters/SyncTimestamp"
        - $ref: "#/components/parameters/SyncSignature"
      responses:
        "200":
          description: Non-sent object sync queue entries for this node (limit 100), oldest first.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    enum:
                      - true
                  data:
                    type: object
                    properties:
                      objects:
                        type: array
                        items:
                          type: object
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
  /api/v1/sync/pull:
    post:
      operationId: syncPull
