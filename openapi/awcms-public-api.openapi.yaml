                properties:
                  success:
                    type: boolean
                    enum:
                      - true
                  data:
                    type: object
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
  /api/v1/setup/initialize:
    post:
      operationId: postSetupInitialize
      tags:
        - Tenant Admin
      summary: Bootstrap the first tenant, owner, office, role, and access assignment. Rejected once already locked.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - tenantCode
                - tenantName
                - officeCode
                - officeName
                - ownerLoginIdentifier
                - ownerPassword
                - ownerDisplayName
              properties:
                tenantCode:
                  type: string
                tenantName:
                  type: string
                officeCode:
                  type: string
                officeName:
                  type: string
                ownerLoginIdentifier:
                  type: string
                ownerPassword:
                  type: string
                  minLength: 8
                ownerDisplayName:
                  type: string
                turnstileToken:
                  type: string
                  description: "Cloudflare Turnstile response token (Issue #186). Required only on a full-online deployment where Turnstile is enabled; absent and ignored on every LAN/offline deployment. Verified server-side before the tenant/owner bootstrap."
      responses:
        "200":
          description: Tenant bootstrapped.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    enum:
                      - true
                  data:
                    type: object
                    properties:
                      tenantId:
                        type: string
                        format: uuid
                      officeId:
                        type: string
                        format: uuid
                      ownerProfileId:
                        type: string
                        format: uuid
                      ownerIdentityId:
                        type: string
                        format: uuid
                      ownerTenantUserId:
                        type: string
                        format: uuid
                      ownerRoleId:
                        type: string
                        format: uuid
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          description: Setup already completed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /api/v1/setup/status:
    get:
      operationId: getSetupStatus
      tags:
        - Tenant Admin
      summary: Whether the one-time setup wizard has already run.
      security: []
      responses:
        "200":
          description: Setup lock state.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    enum:
                      - true
                  data:
                    type: object
                    properties:
                      locked:
                        type: boolean
                      tenantId:
                        type: string
                        format: uuid
                      lockedAt:
                        type: string
                        format: date-time
  /api/v1/site-search/index/failures:
    get:
      operationId: siteSearchIndexFailures
      tags:
        - Site Search
      summary: Read the search index failed-item diagnostics
      description: Gated by `site_search.diagnostics.read`. Returns up to 100 unresolved failed items (aggregated per source/resource/locale) with a SANITIZED error class and detail — never a raw stack trace. Each reconcile clears its own source's prior failures, so this reflects the latest run.
      parameters:
        - $ref: "#/components/parameters/CorrelationId"
      responses:
        "200":
          description: Failed-item diagnostics.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    enum:
                      - true
                  data:
                    type: object
                    properties:
                      items:
                        type: array
                        items:
                          $ref: "#/components/schemas/SiteSearchIndexFailure"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
  /api/v1/site-search/index/rebuild:
    post:
      operationId: siteSearchIndexRebuild
      tags:
        - Site Search
      summary: Force a full search index rebuild
      description: "Gated by `site_search.index.rebuild` — a HIGH-RISK action: it deletes every one of the tenant's index documents for the registered sources and re-extracts them. Idempotent (the end state is identical regardless of prior state), Idempotency-Key'd, and audited."
      parameters:
        - name: Idempotency-Key
          in: header
          required: true
          schema:
            type: string
        - $ref: "#/components/parameters/CorrelationId"
      responses:
        "200":
          description: Rebuild run summary.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    enum:
                      - true
                  data:
                    $ref: "#/components/schemas/SiteSearchIndexRunResult"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          description: Idempotency-Key was already used with a different request.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /api/v1/site-search/index/reconcile:
    post:
      operationId: siteSearchIndexReconcile
      tags:
        - Site Search
      summary: Run an idempotent search index reconciliation
      description: Gated by `site_search.index.reconcile`. Upserts the tenant's currently public documents (skipping any whose checksum already matches) and deletes index documents whose source row is gone or no longer public, so an archive/delete/unpublish never leaves a stale public result. Running it while already in sync is a no-op. Deliberately NOT classified high-risk (a fully regenerable projection sync), but still Idempotency-Key'd and audited.
      parameters:
        - name: Idempotency-Key
          in: header
          required: true
          schema:
            type: string
        - $ref: "#/components/parameters/CorrelationId"
      responses:
        "200":
          description: Reconcile run summary.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    enum:
                      - true
                  data:
                    $ref: "#/components/schemas/SiteSearchIndexRunResult"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          description: Idempotency-Key was already used with a different request.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /api/v1/site-search/index/status:
    get:
      operationId: siteSearchIndexStatus
      tags:
        - Site Search
      summary: Read this tenant's search index status, freshness, and recent runs
      description: "Gated by `site_search.index.read`. Bounded: document counts by resource type, the most recent index run, the open failed-item count, and the 10 most recent runs."
      parameters:
        - $ref: "#/components/parameters/CorrelationId"
      responses:
        "200":
          description: Index status and recent runs.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    enum:
                      - true
                  data:
                    type: object
                    properties:
                      status:
                        $ref: "#/components/schemas/SiteSearchIndexStatus"
                      recentRuns:
                        type: array
                        items:
                          $ref: "#/components/schemas/SiteSearchIndexRun"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
  /api/v1/site-search/query:
    get:
      operationId: siteSearchQuery
      tags:
        - Site Search
      security: []
      summary: Public full-text search over this site's published content (anonymous)
      description: PUBLIC, unauthenticated cross-content search. The tenant is resolved from the request host (never a session or a tenant header); results come from the tenant's search index, which contains PUBLISHED PUBLIC content only and is never an authorization source. The query text is always a bound parameter into `websearch_to_tsquery`, snippets are HTML-escaped before the `<mark>` highlights are inserted, and the endpoint is per-IP rate-limited, query-length-bounded (max 128 characters) and result-capped. An unresolved host, a disabled module, a search-disabled tenant, and a too-short query all return the SAME neutral empty payload — never a distinguishing error.
      parameters:
        - name: q
          in: query
          required: false
          description: Raw search text. Trimmed, whitespace-collapsed, and bounded before use.
          schema:
            type: string
            maxLength: 128
        - name: type
          in: query
          required: false
          description: Restrict results to one resource type. Honored only when the tenant's `enabledResourceTypes` admits it; otherwise silently ignored.
          schema:
            type: string
        - name: locale
          in: query
          required: false
          description: BCP-47-ish content locale. Malformed values fall back to the tenant default.
          schema:
            type: string
        - name: cursor
          in: query
          required: false
          description: Opaque keyset cursor from a previous response's `nextCursor`.
          schema:
            type: string
      responses:
        "200":
          description: Search results (possibly empty).
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    enum:
                      - true
                  data:
                    $ref: "#/components/schemas/SiteSearchQueryResult"
        "429":
          description: Too many search requests from this source.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /api/v1/site-search/settings:
    get:
      operationId: siteSearchSettingsRead
      tags:
        - Site Search
      summary: Read this tenant's search configuration
      description: Gated by `site_search.settings.read`. Returns the module defaults when the tenant has never written a config row. Tenant-scoped (withTenant + RLS FORCE).
      parameters:
        - $ref: "#/components/parameters/CorrelationId"
      responses:
        "200":
          description: Tenant search configuration.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    enum:
                      - true
                  data:
                    $ref: "#/components/schemas/SiteSearchSettings"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
    put:
      operationId: siteSearchSettingsUpdate
      tags:
        - Site Search
      summary: Replace this tenant's search configuration
      description: "Gated by `site_search.settings.update`. Changes what the PUBLIC search surface returns (including the tenant-wide search on/off switch and the opt-in query-analytics switch), so it requires an Idempotency-Key and is audited. Merge semantics: omitted fields keep their current value; unknown keys are ignored."
      parameters:
        - name: Idempotency-Key
          in: header
          required: true
          schema:
            type: string
        - $ref: "#/components/parameters/CorrelationId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SiteSearchSettingsUpdateRequest"
      responses:
        "200":
          description: Saved tenant search configuration.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    enum:
                      - true
                  data:
                    $ref: "#/components/schemas/SiteSearchSettings"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          description: Idempotency-Key was already used with a different request.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "413":
          description: Request body exceeded the endpoint's size ceiling.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /api/v1/site-search/suggest:
    get:
      operationId: siteSearchSuggest
      tags:
        - Site Search
      security: []
      summary: Public bounded title typeahead (anonymous)
      description: PUBLIC, unauthenticated trigram typeahead over indexed titles, tenant and locale scoped. Same host-based tenant resolution, per-IP rate limit, query bounds and neutral empty payload as the search endpoint. Returns at most the tenant's configured `suggestionLimit`; returns an empty list when the tenant has suggestions turned off.
      parameters:
        - name: q
          in: query
          required: false
          schema:
            type: string
            maxLength: 128
        - name: locale
          in: query
          required: false
          schema:
            type: string
      responses:
        "200":
          description: Title suggestions (possibly empty).
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    enum:
                      - true
                  data:
                    $ref: "#/components/schemas/SiteSearchSuggestResult"
        "429":
          description: Too many suggestion requests from this source.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /api/v1/sync/conflicts:
    get:
      operationId: syncListConflicts
      tags:
        - Sync Storage
