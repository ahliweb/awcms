                          $ref: "#/components/schemas/FormDraft"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
    post:
      operationId: createFormDraft
      tags:
        - Form Drafts
      summary: Create a form draft.
      description: "Deliberately NOT idempotency-keyed: the worst case for a retry is one extra low-value scratch row the caller can delete, not a domain side effect. Submitting is the operation that needs a key."
