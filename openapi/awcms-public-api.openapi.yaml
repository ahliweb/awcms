  /api/v1/comments:
    get:
      operationId: listPublicComments
      tags:
        - Comments
      summary: List approved comments for a published commentable resource.
      description: PUBLIC and anonymous. The tenant is resolved from the request host. Only `approved`, non-deleted comments are returned, and never any moderation metadata (reason codes, actor ids, email/ip hashes). An unresolved host, a disabled module, an unpublished resource, and a resource with no comments all return the SAME empty payload — the endpoint is not an existence oracle for unpublished content.
      security: []
      parameters:
        - name: resourceType
          in: query
          required: true
          schema:
            type: string
          description: The commentable resource type, e.g. `blog_post`.
        - name: resourceId
          in: query
          required: true
          schema:
            type: string
            format: uuid
        - name: locale
          in: query
          required: false
          schema:
            type: string
          description: Defaults to the resolved tenant's default locale.
        - name: cursor
          in: query
          required: false
          schema:
            type: string
          description: Full-precision `created_at` from a previous page's `nextCursor`. Must be sent together with `cursorId`; a timestamp alone cannot disambiguate two comments written in the same microsecond.
        - name: cursorId
          in: query
          required: false
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Approved comments, newest first.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    enum:
                      - true
                  data:
                    $ref: "#/components/schemas/PublicCommentPage"
        "429":
          description: Per-IP rate limit exceeded.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
    post:
      operationId: submitPublicComment
      tags:
        - Comments
      summary: Submit a comment against a published commentable resource.
      description: |-
        PUBLIC and anonymous, host-resolved, `Idempotency-Key` required. Anti-abuse gated (honeypot field, submit-timing floor, blocked terms, duplicate fingerprint, per-IP rate limit).
        RESPONSES ARE DELIBERATELY UNIFORM. An unresolved resource, a disabled module, an anti-abuse block, and an accepted-but-held-for-moderation comment ALL return `{"status":"received"}`. Only a comment that is immediately publicly visible returns its id and status. A caller therefore cannot use this endpoint to enumerate blocked terms, probe the timing floor, or discover unpublished resources.
      security: []
      parameters:
        - name: Idempotency-Key
          in: header
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SubmitCommentRequest"
      responses:
        "200":
          description: Accepted. Either the neutral `{"status":"received"}` acknowledgement or, when the comment is immediately public, its id and status.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    enum:
                      - true
                  data:
                    $ref: "#/components/schemas/SubmitCommentResult"
        "400":
          $ref: "#/components/responses/BadRequest"
        "409":
          description: The Idempotency-Key was reused with a different request.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "413":
          description: Request body exceeded the endpoint's size ceiling.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "429":
          description: Per-IP rate limit exceeded.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /api/v1/comments/{id}:
    patch:
      operationId: editPublicComment
      tags:
        - Comments
      summary: Edit your own comment within its edit window.
      description: "PUBLIC, author-bound: a registered author is matched by session user id, an anonymous author by the stored IP hash. Editing someone else's comment returns 404, identical to a comment that does not exist."
      security: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - body
              properties:
                body:
                  type: string
      responses:
        "200":
          description: The re-rendered, escaped comment HTML.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    enum:
                      - true
                  data:
                    type: object
                    properties:
                      bodyHtml:
                        type: string
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: The edit window for this comment has passed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "422":
          description: The edited body failed normalization or the link/length bounds.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /api/v1/comments/{id}/delete-request:
    post:
      operationId: requestPublicCommentDeletion
      tags:
        - Comments
      summary: Ask for your own comment to be removed.
      description: PUBLIC, author-bound. Within the edit window this soft-deletes the comment immediately. Past the window it files a report for a moderator instead, so thread structure and moderation history stay coherent.
