        code:
          type: string
          description: Dotted Kemendagri code, e.g. `11.01.01.2001`.
        codeCompact:
          type: string
          description: The same code without separators.
        parentCode:
          type: string
          nullable: true
        level:
          type: integer
          minimum: 1
          maximum: 4
        regionType:
          type: string
          enum:
            - province
            - regency
            - district
            - village
        localTerm:
          type: string
          nullable: true
          description: Indonesian term this row carries (Provinsi/Kabupaten/Kota/Desa/Kelurahan/Desa Adat). Null where upstream states none — districts ship bare names, and filling in "Kecamatan" would be wrong for the provinces that call the tier "Distrik".
        name:
          type: string
          description: Official name exactly as upstream spells it, prefix included.
        shortName:
          type: string
          nullable: true
          description: Name with the tier term stripped ("Aceh Selatan" for "Kabupaten Aceh Selatan").
        fullPathName:
          type: string
          nullable: true
          description: Ancestor path in breadcrumb order, e.g. "Aceh, Kabupaten Aceh Selatan, Bakongan, Keude Bakongan".
    IdnRegionSourceProvenance:
      type: object
      description: Static, code-level facts about WHICH upstream project this data is vendored from — true of every import, unlike the per-import fields on IdnRegionDataset.
      properties:
        repository:
          type: string
        sourcePath:
          type: string
        license:
          type: string
        dumpPath:
          type: string
        manifestPath:
          type: string
        upstreamStatement:
          type: string
        decreeReference:
          type: string
        officialReferenceCaveat:
          type: string
          description: Must be surfaced wherever this dataset is shown to an operator — this is a community packaging of the decree, not an official Kemendagri API or export.
    IssueMachineCredentialRequest:
      type: object
      required:
        - name
        - tenantUserId
        - allowedPermissionKeys
        - expiresAt
      properties:
        name:
          type: string
          maxLength: 120
          description: Operator-facing label, e.g. "awcms-astro build feed".
        tenantUserId:
          type: string
          format: uuid
          description: An existing tenant user in THIS tenant (the service account).
        allowedPermissionKeys:
          type: array
          minItems: 1
          maxItems: 50
          description: Permission keys (`module.activity.action`) this credential may use. Required and non-empty — an empty list means "can do nothing", never "unrestricted".
          items:
            type: string
        expiresAt:
          type: string
          format: date-time
          description: Required, in the future, at most 365 days away. There is no perpetual credential.
    IssueSessionHandoffRequest:
      type: object
      required:
        - clientKey
        - redirectUri
      properties:
        clientKey:
          type: string
          description: The registered BFF client's public key. Not a secret, and never treated as one — the secret authenticates at redeem time.
        redirectUri:
          type: string
          format: uri
          description: Must appear EXACTLY in the client's registered allow-list. https only, no query, no fragment.
    MachineCredential:
      type: object
      description: A read-only machine credential (ADR-0049). Never carries the token or its hash — an operator tracing a leak needs to know which credential is alive and whether anything still uses it, and none of that requires secret material.
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        tenantUserId:
          type: string
          format: uuid
          description: The service account this credential authenticates AS. Its roles, narrowed by allowedPermissionKeys, are the whole of what the credential may do.
        allowedPermissionKeys:
          type: array
          description: NARROWING filter — effective permissions are the intersection with what the service account holds. It can never widen them.
          items:
            type: string
        expiresAt:
          type: string
          format: date-time
        lastUsedAt:
          type: string
          format: date-time
          nullable: true
          description: Refreshed at most hourly, so an idle or leaked credential is visible without a write on every request.
        revokedAt:
          type: string
          format: date-time
          nullable: true
        createdByTenantUserId:
          type: string
          format: uuid
        createdAt:
          type: string
          format: date-time
        status:
          type: string
          description: Derived from the clock and revokedAt, not stored.
          enum:
            - active
            - expired
            - revoked
    MediaEnforcementEnabled:
      type: object
      required:
        - enforced
        - enforcedAt
        - alreadyEnforced
      additionalProperties: false
      properties:
        enforced:
          type: boolean
          enum:
            - true
          description: Always true — a non-enforcing outcome is reported as a 409, never as a 200 whose `enforced` is false.
        enforcedAt:
          type: string
          format: date-time
          description: When this activation was confirmed. Refreshed on re-activation so it always reflects the most recent confirmed-ready enable.
        alreadyEnforced:
          type: boolean
          description: True when the tenant was already enforcing before this call — an idempotent no-change, still audited.
    MediaEnforcementState:
      type: object
      required:
        - enforced
        - ready
        - reasons
        - detail
      additionalProperties: false
      properties:
        enforced:
          type: boolean
          description: Whether this tenant's content media references must resolve to verified registry objects. Once true it stays true — enforcement is one-way by design.
        ready:
          type: boolean
          description: Whether this DEPLOYMENT's media storage is configured well enough for enforcement to be enabled. Independent of `enforced` — both must hold for validation to actually run.
        reasons:
          type: array
          description: Machine-readable readiness failures; empty when `ready` is true.
          items:
            type: string
            enum:
              - news_media_r2_disabled
              - news_media_r2_config_incomplete
              - news_media_r2_shares_sync_storage_bucket_or_credentials
        detail:
          type: array
          description: Human-readable evidence, one entry per failing check. Names environment variables, never their values.
          items:
            type: string
