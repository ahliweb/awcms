    SeoRedirect:
      type: object
      description: A tenant-scoped exact-path redirect rule (awcms_seo_redirects).
      required:
        - id
        - sourcePath
        - normalizedSourcePath
        - localeScope
        - domainScopeHost
        - targetType
        - target
        - statusCode
        - state
        - effectiveFrom
        - effectiveUntil
        - preserveQuery
        - reason
        - origin
        - hitCount
        - lastHitAt
        - createdAt
        - updatedAt
        - deletedAt
      properties:
        id:
          type: string
          format: uuid
        sourcePath:
          type: string
          description: The source path as entered (display form).
        normalizedSourcePath:
          type: string
          description: The canonical, match-safe source path (dot-segments resolved, duplicate slashes collapsed, CRLF/traversal/Unicode-confusion rejected).
        localeScope:
          type: string
          nullable: true
          description: Optional locale narrowing; null = all locales.
        domainScopeHost:
          type: string
          nullable: true
          description: Optional server-derived host narrowing (a verified normalized_hostname); null = all of this tenant's hosts.
        targetType:
          type: string
          enum:
            - relative_same_tenant
            - verified_external
        target:
          type: string
          description: The (normalized) redirect target — a relative same-origin path or an absolute URL to one of this tenant's verified hosts. Validated through the frozen open-redirect guard.
        statusCode:
          type: integer
          enum:
            - 301
            - 302
            - 307
            - 308
        state:
          type: string
          enum:
            - active
            - inactive
            - archived
        effectiveFrom:
          type: string
          format: date-time
          nullable: true
        effectiveUntil:
          type: string
          format: date-time
          nullable: true
        preserveQuery:
          type: boolean
        reason:
          type: string
          nullable: true
        origin:
          type: string
          enum:
            - manual
            - slug_change
            - domain_change
            - locale_change
            - import
            - legacy_blog
        hitCount:
          type: integer
        lastHitAt:
          type: string
          format: date-time
          nullable: true
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        deletedAt:
          type: string
          format: date-time
          nullable: true
    SeoRedirectCreateRequest:
      type: object
