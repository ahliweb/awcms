                    enum:
                      - true
        "400":
          $ref: "#/components/responses/BadRequest"
  /api/v1/comments/admin/{id}/archive:
    post:
      operationId: archiveComment
      tags:
        - Comments
      summary: Withdraw an approved comment from public view.
      description: Requires `comments.moderation.archive`. Only an APPROVED comment can be archived. The row is retained with a reserved `archived` reason code so the queue distinguishes it from a plain rejection, and `published_at` is preserved. Idempotency-keyed and audited.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: Idempotency-Key
          in: header
          required: true
          schema:
            type: string
      responses:
        "200":
          description: The comment was archived.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    enum:
                      - true
                  data:
                    $ref: "#/components/schemas/ModerationResult"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: Idempotency-Key conflict, or the comment is not approved and therefore cannot be archived.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /api/v1/comments/admin/{id}/delete:
    post:
      operationId: deleteCommentAsModerator
      tags:
        - Comments
      summary: Soft delete a comment as a moderator.
      description: |-
        Requires `comments.moderation.delete` (ADR-0058 §B). Legal from every non-terminal status. Non-destructive — the row, its body text and its append-only moderation history are all retained; what is withdrawn is visibility. Open reports on the comment are resolved, since a deleted comment cannot be acted on again.

        This is the only moderator transition with no way back through the API: `deleted` is terminal, and recovering a deleted comment is an operator/database action. Use `reject` for a reversible decision, or `archive` to withdraw an approved comment while keeping it restorable. Idempotency-keyed and audited at `warning` severity.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: Idempotency-Key
          in: header
          required: true
          schema:
            type: string
      responses:
        "200":
          description: The comment was soft-deleted.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    enum:
                      - true
                  data:
                    $ref: "#/components/schemas/ModerationResult"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: Idempotency-Key conflict, or the comment is already deleted.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /api/v1/comments/admin/{id}/moderate:
    post:
      operationId: moderateComment
      tags:
        - Comments
      summary: Approve, reject, or mark a comment as spam.
      description: "`approve` requires `comments.moderation.approve`; `reject` and `spam` both require `comments.moderation.reject` — marking spam is a rejection subtype with the same blast radius, distinguished by its audited reason code rather than by a separate permission. A reason code is mandatory for `reject` and `spam`. Idempotency-keyed and audited."
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: Idempotency-Key
          in: header
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - decision
              properties:
                decision:
                  type: string
                  enum:
                    - approve
                    - reject
                    - spam
                reasonCode:
                  type: string
                  nullable: true
                  maxLength: 64
                note:
                  type: string
                  nullable: true
                  maxLength: 2000
      responses:
        "200":
          description: The decision was applied.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    enum:
                      - true
                  data:
                    $ref: "#/components/schemas/ModerationResult"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: Either the Idempotency-Key was reused with a different request, or the action is not legal from the comment's current status.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /api/v1/comments/admin/{id}/restore:
    post:
      operationId: restoreComment
      tags:
        - Comments
      summary: Return a rejected, spam, or archived comment to review.
      description: Requires `comments.moderation.restore`. Moves the comment back to `pending` for a fresh decision. A soft-deleted comment is terminal and cannot be restored in-band. Idempotency-keyed and audited.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: Idempotency-Key
          in: header
          required: true
          schema:
            type: string
      responses:
        "200":
          description: The comment was returned to pending.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    enum:
                      - true
                  data:
                    $ref: "#/components/schemas/ModerationResult"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: Idempotency-Key conflict, or the comment's current status cannot transition back to pending.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /api/v1/comments/admin/bulk-moderate:
    post:
      operationId: bulkModerateComments
      tags:
        - Comments
      summary: Apply one moderation action to many comments.
      description: "Guarded by the same permission the single-comment action requires. Each comment is evaluated independently: the response reports which ids were applied and which were skipped, with the reason. A partial result is a 200, not an error — the applied decisions are real and must not be implied to have rolled back."
