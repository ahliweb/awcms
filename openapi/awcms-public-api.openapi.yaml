    PushDeliveryAttempt:
      type: object
      description: 'One row per ATTEMPT. Successes are included as well as failures: a provider that started answering slowly, or one that changed which endpoints it accepts, is a pattern across both. A failures-only view answers "what broke" and never "since when".'
      properties:
        id:
          type: string
          format: uuid
        messageId:
          type: string
          format: uuid
        attemptNo:
          type: integer
        outcome:
          type: string
          enum:
            - success
            - failure
        providerName:
          type: string
        providerResponseSnippet:
          type: string
          nullable: true
          description: Truncated provider reply. Never the payload, never the endpoint.
        errorMessage:
          type: string
          nullable: true
        createdAt:
          type: string
          format: date-time
    PushDeploymentConfig:
      type: object
      description: "Deployment-level facts, not tenant configuration: both credentials authenticate the SERVER (an FCM service account belongs to one Firebase project; a VAPID key pair identifies one application server), so there is no per-tenant override and there is not meant to be one."
      properties:
        enabled:
          type: boolean
        provider:
          type: string
          nullable: true
          enum:
            - log
            - fcm
            - web_push
    PushMessage:
      type: object
      description: "One row per (notification, device). `body` is deliberately not projected: an operator diagnosing delivery needs the category, the status and the error, and the notification text is the one field here that carries user-facing content."
      properties:
        id:
          type: string
          format: uuid
        category:
          type: string
        status:
          $ref: "#/components/schemas/PushMessageStatus"
        priority:
          type: string
          enum:
            - low
            - normal
            - high
        title:
          type: string
        targetPath:
          type: string
          nullable: true
          description: Same-origin path only — never an absolute URL.
        retryCount:
          type: integer
        lastError:
          type: string
          nullable: true
        providerName:
          type: string
          nullable: true
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        sentAt:
          type: string
          format: date-time
          nullable: true
        nextAttemptAt:
          type: string
          format: date-time
          nullable: true
        tenantUserId:
          type: string
          format: uuid
        endpointMasked:
          type: string
        transport:
          $ref: "#/components/schemas/PushTransport"
    PushMessageStatus:
      type: string
      enum:
        - queued
        - retry_wait
        - sending
        - sent
        - failed
        - cancelled
    PushQueueSummary:
      type: object
      properties:
        countsByStatus:
          type: object
          description: Every status, including the ones with zero rows. A summary that omitted empty buckets would make "no failures" and "failures nobody asked about" render identically.
          additionalProperties:
            type: integer
        oldestPendingAt:
          type: string
          format: date-time
          nullable: true
        nextAttemptAt:
          type: string
          format: date-time
          nullable: true
        activeSubscriptions:
          type: integer
        disabledSubscriptions:
          type: integer
    PushSubscription:
      type: object
      properties:
        id:
          type: string
          format: uuid
        tenantUserId:
          type: string
          format: uuid
        transport:
          $ref: "#/components/schemas/PushTransport"
        endpointMasked:
          type: string
          description: Origin plus a short tail for a Web Push URL, or a short head/tail pair for an opaque FCM token. Never the authenticating middle.
        status:
          type: string
          enum:
            - active
            - disabled
        disabledReason:
          type: string
          nullable: true
          description: Why the device stopped receiving — `revoked_by_user`, or what the push service reported (404/410, FCM `UNREGISTERED`). Disabled rather than deleted, because a deleted row and one that never existed are indistinguishable, and the difference is exactly what "why did this user stop getting notifications" needs.
        lastSuccessAt:
          type: string
          format: date-time
          nullable: true
        createdAt:
          type: string
          format: date-time
    PushSubscriptionRegistration:
      type: object
      required:
        - transport
        - endpoint
      properties:
        transport:
          $ref: "#/components/schemas/PushTransport"
        endpoint:
          type: string
          maxLength: 2048
          description: "The push service URL (web_push, https: only, never a literal private address) or the FCM registration token. Bounded because it is an opaque credential-shaped string written by an authenticated caller; real values are ~200 characters."
        keys:
          type: object
          description: REQUIRED for web_push, and rejected for fcm — a client sending both has confused its two registration paths, and silently dropping half of what it sent would store a row that cannot deliver while reporting success.
          properties:
            p256dh:
              type: string
              description: base64url, decoding to 65 bytes (uncompressed P-256 point, RFC 8291 §3.1).
            auth:
              type: string
              description: base64url, decoding to 16 bytes (RFC 8291 §3.2).
    PushTransport:
      type: string
      enum:
        - web_push
        - fcm
      description: "`web_push` is RFC 8030/8291/8292 to a browser; `fcm` is FCM HTTP v1 to a native Android/iOS client. The choice is the CLIENT's — a deployment can serve both, and the dispatcher's configured provider must match the transport of the row it claims."
