  /api/v1/tenant/modules/matrix:
    get:
      operationId: getTenantModuleMatrix
      tags:
        - Module Management
      summary: Every module by what matters for this tenant, in two queries.
      description: 'Single-tenant scope, never cross-tenant. Adds two lifecycle warnings by re-running the real enable/disable validation for each module''s actual current state: `dependencyWarning` only for a DISABLED module ("would enabling succeed now?") and `reverseDependencyWarning` only for an ENABLED one ("would disabling be blocked?"). No health column — this base has no batched health reader, and a per-row one would be an N+1.'
      responses:
        "200":
          description: Module matrix for the caller's tenant.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    enum:
                      - true
                  data:
                    type: object
                    properties:
                      modules:
                        type: array
                        items:
                          type: object
                          properties:
                            moduleKey:
                              type: string
                            name:
                              type: string
                            version:
                              type: string
                            status:
                              type: string
                            isCore:
                              type: boolean
                            isProtected:
                              type: boolean
                            tenantEnabled:
                              type: boolean
                            disableReason:
                              type: string
                              nullable: true
                            dependencies:
                              type: array
                              items:
                                type: string
                            dependencyWarning:
                              nullable: true
                              type: object
                              properties:
                                code:
                                  type: string
                                message:
                                  type: string
                            reverseDependencyWarning:
                              nullable: true
                              type: object
                              properties:
                                code:
                                  type: string
                                message:
                                  type: string
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
  /api/v1/tenant/modules/presets:
    get:
      operationId: listTenantModulePresets
      tags:
        - Module Management
      summary: Named module profiles, and optionally a dry-run plan for one.
      description: "Applying a preset DISABLES every enabled, unlisted, unprotected module, so `?preset=<name>` returns the plan without writing anything — an operator switching a live tenant's profile sees the disable list before it happens. An unknown name returns the catalog with `plan: null`."
      parameters:
        - name: preset
