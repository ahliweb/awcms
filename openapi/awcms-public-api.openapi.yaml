    NotFound:
      description: Resource not found.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiError"
  schemas:
    AbacDslPolicy:
      type: object
      description: One stored dynamic ABAC (DSL) policy (Issue
      properties:
        id:
          type: string
          format: uuid
        policyCode:
          type: string
        effect:
          type: string
          enum:
            - allow
            - deny
        description:
          type: string
          nullable: true
        moduleKey:
          type: string
          nullable: true
        activityCode:
          type: string
          nullable: true
        action:
          type: string
          nullable: true
        resourceType:
          type: string
          nullable: true
        dslVersion:
          type: integer
        priority:
          type: integer
        conditions:
          $ref: "#/components/schemas/AbacDslPolicyConditions"
        isActive:
          type: boolean
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    AbacDslPolicyConditions:
      type: object
      description: "A bounded, deterministic condition AST (Issue #179). A node is either a composition — exactly one of `allOf` (array; empty = true), `anyOf` (array; empty = false), or `not` (a single node) — or a leaf `{ attr, op, value | valueAttr }` over the server-side attribute allow-list (`subject.*`, `resource.*`, `action`, `env.*`) with the bounded operator set (eq, ne, in, nin, lt, lte, gt, gte, exists). No regex, functions, or arbitrary expressions. Depth ≤ 32, ≤ 512 nodes."
      additionalProperties: true
    AbacDslPolicyWriteRequest:
      type: object
      required:
        - policyCode
        - effect
        - conditions
      properties:
        policyCode:
          type: string
          description: 3-100 chars, alphanumerics plus . _ - (not at the edges).
        effect:
          type: string
          enum:
            - allow
            - deny
        description:
          type: string
          nullable: true
        moduleKey:
          type: string
          nullable: true
          description: Applicability filter — null is a wildcard.
        activityCode:
          type: string
          nullable: true
        action:
          type: string
          nullable: true
        resourceType:
          type: string
          nullable: true
        dslVersion:
          type: integer
          description: Defaults to the current DSL version (1). A value newer than supported is rejected.
        priority:
          type: integer
          description: Lower evaluates first (deterministic). Defaults to 100.
        conditions:
          $ref: "#/components/schemas/AbacDslPolicyConditions"
        isActive:
          type: boolean
          description: On create only — author enabled immediately. Defaults to false (author, then enable).
    AbacPolicy:
      type: object
      properties:
        id:
          type: string
          format: uuid
        policyCode:
          type: string
        effect:
          type: string
          enum:
            - allow
            - deny
