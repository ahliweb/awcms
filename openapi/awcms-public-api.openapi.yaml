                    - approve
                    - reject
                    - spam
                reasonCode:
                  type: string
                  nullable: true
                note:
                  type: string
                  nullable: true
      responses:
        "200":
          description: Per-comment outcomes.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    enum:
                      - true
                  data:
                    $ref: "#/components/schemas/BulkModerationResult"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          description: The Idempotency-Key was reused with a different request.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /api/v1/comments/admin/queue:
    get:
      operationId: listCommentModerationQueue
      tags:
        - Comments
