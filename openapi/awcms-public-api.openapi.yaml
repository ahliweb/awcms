          $ref: "#/components/responses/NotFound"
    patch:
      operationId: updateFormDraft
      tags:
        - Form Drafts
      summary: Update a draft's step, payload, or expiry.
      description: Only a draft still in `draft` status can be updated; a submitted, abandoned, or expired draft returns 404 rather than distinguishing "wrong state" from "does not exist".
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FormDraftUpdateRequest"
      responses:
        "200":
          description: Updated form draft.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    enum:
                      - true
                  data:
                    $ref: "#/components/schemas/FormDraft"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "413":
          description: Request body exceeded the endpoint's size ceiling.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
    delete:
      operationId: deleteFormDraft
      tags:
        - Form Drafts
      summary: Soft-delete (abandon) a form draft.
      description: Idempotent by construction — the `deleted_at IS NULL` guard makes a second call a safe no-op, so no Idempotency-Key is required.
