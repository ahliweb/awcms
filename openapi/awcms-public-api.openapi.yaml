              properties:
                mfaChallengeToken:
                  type: string
                code:
                  type: string
                recoveryCode:
                  type: string
      responses:
        "200":
          description: MFA verified; aal2 session issued.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    enum:
                      - true
                  data:
                    type: object
                    properties:
                      token:
                        type: string
                      expiresAt:
                        type: string
                        format: date-time
                      assuranceLevel:
                        type: string
                        enum:
                          - aal2
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "429":
          description: Too many verification attempts from this source.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "500":
          description: MFA misconfigured.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /api/v1/auth/password/change:
    post:
      operationId: changeOwnAuthPassword
      tags:
        - Identity & Access
      summary: Change your own password while signed in (self-service, no permission).
      description: |-
        The counterpart to /api/v1/auth/password/reset: that endpoint serves someone who CANNOT sign in and proves control of a mailbox, this one serves someone who is signed in and proves control of the credential. Self-service by construction — the subject is the session bearer and the route accepts no parameter naming anybody else.
        A fresh second factor is required ONLY from callers who have one enrolled. Requiring aal2 unconditionally would permanently prevent every user without MFA from changing their password, and the users most likely to need to are the ones who just learned it leaked. The current password is the re-authentication for everyone; the second factor is additional for those who can supply it.
        On success the password is replaced, the lockout counters are cleared (whoever supplied the current password proved control of the credential), and every OTHER session of that identity is revoked — the calling one survives, because a password change that signs you out of the tab you changed it in reads as a failure and the security property is unaffected.
        Rate limited on the SOURCE despite being authenticated: `currentPassword` is a guessable secret, so this is a credential-guessing surface whenever a session is used by someone who does not know the password behind it. An identifier-keyed bucket would instead let anyone reaching the endpoint hold one person's own password change hostage.
        Audited on both the success and the failure, with the device shape and IP pseudonym, and with no password-shaped attribute — not even a length.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - currentPassword
                - newPassword
              properties:
                currentPassword:
                  type: string
                newPassword:
                  type: string
                  minLength: 8
                  description: Must differ from currentPassword — an unchanged password is refused as a validation error, never answered as a no-op success.
      parameters:
        - $ref: "#/components/parameters/CorrelationId"
      responses:
        "200":
          description: Password changed; the other sessions were revoked.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    enum:
                      - true
                  data:
                    type: object
                    properties:
                      changed:
                        type: boolean
                        enum:
                          - true
                      revokedSessionCount:
                        type: integer
                        minimum: 0
        "400":
          description: Validation failed, or currentPassword did not match (INVALID_CREDENTIALS).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: MFA is enrolled and this session is not currently stepped up (STEP_UP_REQUIRED).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "409":
          description: The tenant policy signs this identity in through SSO; there is no password to change (PASSWORD_LOGIN_DISABLED).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "429":
          description: Too many password change attempts from this source.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /api/v1/auth/password/forgot:
    post:
      operationId: postAuthPasswordForgot
      tags:
        - Identity & Access
      summary: Request a password reset link (account-enumeration-safe).
      description: Always returns the same 200 body regardless of whether the identifier matched an eligible account. An unknown identifier, an inactive identity or tenant-user, an identity the tenant has taken off password login, and a successfully queued email are indistinguishable to the caller by response body, status code, or error code. Rate limited per client IP and tenant.
      security: []
      parameters:
        - name: X-AWCMS-Tenant-ID
          in: header
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - loginIdentifier
              properties:
                loginIdentifier:
                  type: string
                turnstileToken:
                  type: string
                  description: "Cloudflare Turnstile response token (Issue #186), solved for the `password_reset` action. Required only on a full-online deployment where Turnstile is enabled; absent and ignored on every LAN/offline deployment."
      responses:
        "200":
          description: Request accepted. Says nothing about whether an account exists.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    enum:
                      - true
                  data:
                    type: object
                    properties:
                      requested:
                        type: boolean
                      message:
                        type: string
        "400":
          $ref: "#/components/responses/BadRequest"
        "429":
          description: Too many password reset requests from this source.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /api/v1/auth/password/reset:
    post:
      operationId: postAuthPasswordReset
      tags:
        - Identity & Access
      summary: Complete a password reset with a single-use token.
      description: On success the password is replaced, the lockout counters are cleared, the token is burned, and every session belonging to that identity is revoked. Every rejection — unknown token, expired, already used, the identity deactivated since issue, or password login disabled for it — returns the same `PASSWORD_RESET_INVALID` error, so the endpoint cannot be used to fingerprint the state of a token.
      security: []
      parameters:
        - name: X-AWCMS-Tenant-ID
          in: header
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - token
                - newPassword
              properties:
                token:
                  type: string
                  description: The raw single-use token from the emailed link.
                newPassword:
                  type: string
                  minLength: 8
                turnstileToken:
                  type: string
                  description: "Cloudflare Turnstile response token (Issue #186), solved for the `password_reset` action. Required only on a full-online deployment where Turnstile is enabled."
      responses:
        "200":
          description: Password changed and all sessions revoked.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    enum:
                      - true
                  data:
                    type: object
                    properties:
                      reset:
                        type: boolean
        "400":
          $ref: "#/components/responses/BadRequest"
        "429":
          description: Too many password reset attempts from this source.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /api/v1/auth/register:
    post:
      operationId: postAuthRegister
      tags:
        - Identity & Access
      summary: Submit a self-registration request for admin review.
      description: Records a request; it NEVER creates an account. Accepts no password and no privilege field — approval creates the account with an unusable credential and emails a password-reset link. Returns `404` when `AUTH_SELF_REGISTRATION_ENABLED` is not `true`, indistinguishable from a route that does not exist. When enabled, an address that already has an account, an address with a request already pending, and a freshly recorded request all return the identical 200.
      security: []
      parameters:
        - name: X-AWCMS-Tenant-ID
          in: header
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - displayName
                - loginIdentifier
              properties:
                displayName:
                  type: string
                  maxLength: 120
                loginIdentifier:
                  type: string
                  maxLength: 320
                  description: Must be an email address — the approval link is sent to it.
                turnstileToken:
                  type: string
                  description: "Cloudflare Turnstile response token (Issue #186), solved for the `register` action. Required only on a full-online deployment where Turnstile is enabled."
      responses:
        "200":
          description: Request accepted. Says nothing about whether the address is already registered or already pending.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    enum:
                      - true
                  data:
                    type: object
                    properties:
                      requested:
                        type: boolean
                      message:
                        type: string
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          description: Self-registration is not enabled for this deployment.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "429":
          description: Too many registration attempts from this source.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /api/v1/auth/session:
    get:
      operationId: introspectAuthSession
      tags:
        - Identity & Access
      summary: Introspect the calling session — safe claims only (for a cross-origin BFF).
      description: |
        Cross-origin session introspection (ADR-0045 §3, ADR-0049 §7). Intended for `awcms-astro`'s BFF, which holds the session token server-side; a browser never calls it directly.

        Self-service: authorized by holding the session, not by a permission. Returns ONLY claims a portal header needs — never a token, token hash, password state, MFA secret/recovery code, or a raw email/phone identifier.

        Anti-oracle: a missing bearer, an unknown/expired/revoked session, a deactivated identity, and a machine credential presented here all produce the SAME 401. Rate-limited per source; `Cache-Control: private, no-store` on every path.
      responses:
        "200":
          description: Safe claims for the live session.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    enum:
                      - true
                  data:
                    $ref: "#/components/schemas/SessionIntrospection"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "429":
          description: Too many introspection requests from this source (RATE_LIMITED); `Retry-After` carries the window.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /api/v1/auth/session-handoff/issue:
    post:
      operationId: issueSessionHandoffCode
      tags:
        - Identity & Access
      summary: Mint a one-time code letting a registered BFF obtain a session as the caller.
      description: |
        ADR-0050. The authenticated human asks for a short-lived (≤60 second), single-use code; a registered BFF then spends it server-to-server at `/api/v1/auth/session-handoff/redeem` and receives a session token for that person.

        **Self-service, not permission-gated.** The identity and assurance level come from the presented session, never from the body, so the caller can only ever mint a code for themselves. There is no permission that answers "may I hand my own session to a client I am already logged into", and inventing one would deny everyone including the tenant owner. Same reasoning as `GET /api/v1/auth/session`.

        What constrains it is the CLIENT registry: a code is only issued for a registered, enabled client, bound to a `redirectUri` on that client's **exact-match** allow-list. Prefix and origin matches are refused — `https://app.example.com` prefix-matches `https://app.example.com.evil.test`, and an attacker who can choose the path on a permitted origin can forward the code onward.

        Every rejection — unknown client, non-allow-listed URI, a URI carrying a query or fragment, a non-https URI — answers the same `400 HANDOFF_NOT_ALLOWED`. Distinguishing them turns this into a probe for which clients are registered and which URIs they accept.

        **No `Idempotency-Key`**, deliberately: each call mints a fresh single-use credential, and replaying one would mean two live codes for one request.
      parameters:
        - $ref: "#/components/parameters/CorrelationId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/IssueSessionHandoffRequest"
      responses:
        "200":
          description: A one-time code, and the redirect_uri it is bound to.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    enum:
                      - true
                  data:
                    $ref: "#/components/schemas/SessionHandoffCodeIssued"
        "400":
          description: The client and redirect_uri combination cannot be used (`HANDOFF_NOT_ALLOWED`), or the body is missing a field.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /api/v1/auth/session-handoff/redeem:
    post:
      operationId: redeemSessionHandoffCode
      tags:
        - Identity & Access
      summary: Spend a one-time handoff code and receive a session token (server-to-server).
      description: |
        ADR-0050. The only endpoint here authenticated by a **client secret** rather than a session: this is the request that obtains a session, so there is none to present yet. Not a machine credential either — those are read-only by construction (ADR-0049), and a read-only principal minting a human session would be an escalation path.

        Call it from the BFF's SERVER. The token must never reach a browser: the BFF stores it server-side and gives the browser its own portal cookie.

        The code is spent exactly once, claimed with a guarded `UPDATE … WHERE redeemed_at IS NULL` so two concurrent redemptions cannot both succeed. The spent row is kept rather than deleted, so a replay is answered from evidence instead of from the absence of it.

        **Every failure is one answer.** Unknown code, expired code, already-spent code, wrong client, wrong `redirectUri`, bad secret — all `401 HANDOFF_REJECTED`, including a malformed body. The distinctions are recorded in the audit trail; handing them to the caller tells whoever holds a stolen code whether it was ever valid.

        The minted session inherits the assurance level the original login REACHED and never more: an `aal1` login cannot be laundered into an `aal2` session.

        **No `Idempotency-Key`**: the code IS the idempotency key, with the opposite contract — the second attempt must fail rather than replay the first response.
      parameters:
        - $ref: "#/components/parameters/CorrelationId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RedeemSessionHandoffRequest"
      responses:
        "200":
          description: A session token for the human who authenticated.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    enum:
                      - true
                  data:
                    $ref: "#/components/schemas/SessionHandoffRedeemed"
        "401":
          description: The handoff could not be completed (`HANDOFF_REJECTED`) — one answer for every cause, deliberately.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /api/v1/auth/sessions:
    get:
      operationId: listOwnAuthSessions
      tags:
        - Identity & Access
      summary: List the caller's own live sessions (self-service, no permission).
      description: 'Where am I signed in? Self-service by construction — the subject is the session bearer and the route accepts no tenantUserId, so there is nobody else it could be pointed at. Deliberately UNPERMISSIONED, like GET /api/v1/auth/session: inventing a permission for "see your own sessions" would wall off the feature and install a latent-authz trap (an action nothing seeds denies everyone, including the tenant owner). Returns no token, no raw IP and no raw User-Agent. clientIpHash is a keyed pseudonym and is null on a deployment without AUTH_IP_HASH_SECRET, because the fallback key is per-process and a stored hash would stop being comparable after a restart.'
      parameters:
        - $ref: "#/components/parameters/CorrelationId"
      responses:
        "200":
          description: The caller's live sessions, newest first.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    enum:
                      - true
                  data:
                    type: object
                    properties:
                      sessions:
                        type: array
                        items:
                          $ref: "#/components/schemas/OwnSessionSummary"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "429":
          description: Too many session requests from this source.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /api/v1/auth/sessions/{id}:
    delete:
      operationId: revokeOwnAuthSession
      tags:
        - Identity & Access
      summary: End one of the caller's own sessions (self-service, no permission).
      description: "Ownership is enforced in the UPDATE's WHERE clause, never by a preceding read. Unknown id, another person's session, another tenant's session and one already revoked or expired all answer 404 — distinguishing them would make this an existence oracle for session ids, and the caller could do nothing differently with the distinction. Revoking the CURRENT session answers 409: that is POST /api/v1/auth/logout's job, which also clears the cookies."
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - $ref: "#/components/parameters/CorrelationId"
      responses:
        "200":
          description: The session was revoked.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    enum:
                      - true
                  data:
                    type: object
                    properties:
                      revoked:
                        type: boolean
                        enum:
                          - true
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: The id names the session making this request (SESSION_IS_CURRENT) — use POST /api/v1/auth/logout.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "429":
          description: Too many revocation requests from this source.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /api/v1/auth/sessions/revoke-all:
    post:
      operationId: revokeOtherOwnAuthSessions
      tags:
        - Identity & Access
      summary: Sign the caller out of every OTHER session (self-service, no permission).
      description: |-
        Ends every live session of the caller's identity except the one making the request. Self-service by construction — the subject is the session bearer and the route accepts no parameter with which to name anybody else — and unpermissioned for the same reason as the two endpoints beside it: this is what a person reaches for after "I think my password leaked", which is exactly when a permission wall is most expensive.
        There is deliberately no `exceptCurrent` flag. The only other value would also end the requesting session, which is `POST /api/v1/auth/logout` — that endpoint additionally clears the cookies this one cannot see, so the flag would ship a second, worse logout whose distinguishing feature is leaving the caller holding a dead cookie.
        It changes no credential and clears no lockout counter: ending stray sessions proves nothing new about the password, and folding the two together would make session hygiene a lockout-reset oracle. Not audited — `awcms_audit_events` records what administrators do to OTHER people; the paired admin endpoint under /api/v1/users/{id}/sessions/revoke-all writes that entry.
      parameters:
        - $ref: "#/components/parameters/CorrelationId"
      responses:
        "200":
          description: How many other sessions were ended. Zero means there were none.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    enum:
                      - true
                  data:
                    type: object
                    properties:
                      revokedCount:
                        type: integer
                        minimum: 0
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "429":
          description: Too many revocation requests from this source.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
