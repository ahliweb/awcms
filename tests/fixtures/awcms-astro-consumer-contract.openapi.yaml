# FROZEN — the slice of this API that `ahliweb/awcms-astro` calls (ADR-0065).
#
# Generated by `bun run api:consumer-contract:generate`. Do NOT hand-edit.
#
# Regenerating is a DELIBERATE act: it means "this contract changed and the
# consumer must change with it". If you regenerate, the `awcms-astro` side has to
# be updated in the same breath — that repo's build is the thing this file exists
# to stop breaking silently.
#
# Additive changes (a new optional field, a new enum value) do NOT require
# regeneration: the check is a subset assertion, so they already pass.
paths:
  /api/v1/access/machine-credentials:
    get:
      operationId: accessListMachineCredentials
      tags:
        - Identity & Access
      summary: List this tenant's machine credentials (never their secrets).
      description: Gated on `identity_access.machine_credentials.read`. Returns derived `active`/`expired`/`revoked` status plus `lastUsedAt`, so a leak can be traced without any secret material leaving the server.
      responses:
        "200":
          description: The tenant's machine credentials, newest first (limit 200).
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    enum:
                      - true
                  data:
                    type: object
                    properties:
                      items:
                        type: array
                        items:
                          $ref: "#/components/schemas/MachineCredential"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
    post:
      operationId: accessIssueMachineCredential
      tags:
        - Identity & Access
      summary: Issue a machine credential (high-risk; audit-logged).
      description: |
        Mints a bearer for a non-human caller, bound to an existing tenant user (a service account), and returns the plaintext token EXACTLY ONCE — no endpoint can return it again.

        The credential AUTHENTICATES only: every request it makes still passes module-enabled, RBAC, ABAC (default-deny) and SoD. `allowedPermissionKeys` NARROWS — effective permissions are the intersection with what the service account holds, so granting that account another role never widens an already-issued credential.

        TWO CLASSES, TWO PERMISSIONS. Omit `allowedWriteActions` and this is the read-only credential of ADR-0049 §3, gated on `identity_access.machine_credentials.create`; requests it makes are refused unless the action is `read`. Name write actions and it is the ADR-0092 write class, gated on `identity_access.machine_credentials_write.create` INSTEAD — a separate key so that opening this class does not hand write-minting authority to every role that already holds `create`.

        The write class is narrower in every other direction: only actions in the code ceiling (`create`, `update` — never a high-risk one), at least one `allowedIpCidrs` entry, at most 30 days, and a request whose caller IP is unknown is refused rather than exempted.

        Not idempotency-keyed, deliberately: replaying the response would mean persisting the plaintext token.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/IssueMachineCredentialRequest"
      responses:
        "201":
          description: The credential, plus its plaintext token (shown once).
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    enum:
                      - true
                  data:
                    type: object
                    properties:
                      credential:
                        $ref: "#/components/schemas/MachineCredential"
                      token:
                        type: string
                        description: The plaintext bearer. Shown once; only its hash is stored.
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "413":
          description: Request body exceeded the endpoint's size ceiling.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "422":
          description: The issuance request failed validation (VALIDATION_FAILED); `error.details` lists every offending field.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /api/v1/auth/session:
    get:
      operationId: introspectAuthSession
      tags:
        - Identity & Access
      summary: Introspect the calling session — safe claims only (for a cross-origin BFF).
      description: |
        Cross-origin session introspection (ADR-0045 §3, ADR-0049 §7). Intended for `awcms-astro`'s BFF, which holds the session token server-side; a browser never calls it directly.

        Self-service: authorized by holding the session, not by a permission. Returns ONLY claims a portal header needs — never a token, token hash, password state, MFA secret/recovery code, or a raw email/phone identifier.

        Anti-oracle: a missing bearer, an unknown/expired/revoked session, a deactivated identity, and a machine credential presented here all produce the SAME 401. Rate-limited per source; `Cache-Control: private, no-store` on every path.
      responses:
        "200":
          description: Safe claims for the live session.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    enum:
                      - true
                  data:
                    $ref: "#/components/schemas/SessionIntrospection"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "429":
          description: Too many introspection requests from this source (RATE_LIMITED); `Retry-After` carries the window.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /api/v1/blog/menus:
    get:
      tags:
        - Blog Content
      operationId: blogListMenus
      summary: List this tenant's navigation menus (with items)
      description: |
        Gated by blog_content.menus.read. Bounded at 100 menus, name ascending — a site has a handful, and unlike the tag vocabulary this one does not grow with the archive.

        Each menu carries its own `items`, already sorted by `sortOrder`. That costs one query per menu rather than one for all of them, and the route says why in a comment: the queries run on one transaction, so they cannot be issued concurrently.
      parameters:
        - $ref: "#/components/parameters/CorrelationId"
      responses:
        "200":
          description: Matching menus.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    enum:
                      - true
                  data:
                    type: object
                    properties:
                      menus:
                        type: array
                        items:
                          $ref: "#/components/schemas/BlogMenu"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
    post:
      tags:
        - Blog Content
      operationId: blogCreateMenu
      summary: Create a navigation menu
      description: Gated by blog_content.menus.configure. Optionally seeds its initial items tree (one level of nesting; link_type post|page|url gates target_id/url).
      parameters:
        - $ref: "#/components/parameters/CorrelationId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - key
                - name
              properties:
                key:
                  type: string
                name:
                  type: string
                items:
                  type: array
                  items:
                    $ref: "#/components/schemas/BlogMenuItem"
      responses:
        "200":
          description: Menu created.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    enum:
                      - true
                  data:
                    type: object
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          description: A menu already exists for this key.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /api/v1/blog/posts:
    get:
      tags:
        - Blog Content
      operationId: blogListPosts
      summary: List this tenant's non-deleted blog posts
      description: |
        Gated by blog_content.posts.read. Optional ?status= and ?locale= filters, ?limit= bounded (default 20, max 100 — max 50 with `view=full`, whose rows carry `contentJson`).

        Ordering defaults to `updated_at DESC` — right for an admin table, and unsound as a keyset key because editing a post moves it, so a row can cross a page boundary between requests and be skipped or repeated. A caller that needs EVERY post (a build feed) passes `?order=created_at`, which is immutable, and follows `nextCursor` until it is null. `?cursor=` without `?order=created_at` is refused with 400 rather than quietly honoured.

        **The default response is `BlogPostSummary`, not `BlogPost`.** It carries no `contentJson`, `excerpt`, `metaDescription`, `canonicalUrl`, or `translationGroupId`. This document used to say otherwise, and a client that believed it built an entire static site with every article body empty — nothing failed, because a missing field reads as `undefined`. A caller that needs the body asks for `?view=full` (which requires `order=created_at`) and receives `BlogPost`.
      parameters:
        - name: status
          in: query
          schema:
            type: string
            enum:
              - draft
              - review
              - scheduled
              - published
              - archived
        - name: locale
          in: query
          description: Exact match on the post's stored locale. Absent means every locale, which is the right default for an admin table but wasteful for a single-language build feed — that is what this parameter exists for. Not shape-validated beyond non-empty and a 35-character bound, because the write path accepts any non-empty string and a stricter read filter would make a stored locale unreachable. An empty value is a 400, never treated as absent.
          schema:
            type: string
            minLength: 1
            maxLength: 35
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
        - name: order
          in: query
          description: Sort key. `created_at` selects the STABLE, cursor-capable traversal; `updated_at` (default) is the admin ordering and rejects `cursor`.
          schema:
            type: string
            enum:
              - created_at
              - updated_at
        - name: cursor
          in: query
          description: Opaque keyset cursor from a previous response's `nextCursor`. Requires `order=created_at`. A malformed value is a 400, never treated as "no cursor".
          schema:
            type: string
        - name: view
          in: query
          description: |
            Response projection. `summary` (default) returns `BlogPostSummary`; `full` returns `BlogPost` — every column the detail endpoint returns, `termIds` and `institutionIds` included.

            Those two were originally left out because fetching them per post would have been one extra query each. A page fetches them for the whole page in one query instead, so the cost is three round trips per page rather than one per post — and without them no consumer could build a category or tag archive at all, which is the state Issue #597 item 1 describes.

            `full` requires `order=created_at`: a full traversal is only sound over the immutable ordering, and the ordering is demanded rather than silently substituted. An unrecognised value is a 400, never a silent fallback to `summary`.
          schema:
            type: string
            enum:
              - summary
              - full
        - $ref: "#/components/parameters/CorrelationId"
      responses:
        "200":
          description: Matching posts.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    enum:
                      - true
                  data:
                    type: object
                    properties:
                      posts:
                        type: array
                        description: "`BlogPostSummary` by default; `BlogPost` when `view=full`."
                        items:
                          oneOf:
                            - $ref: "#/components/schemas/BlogPostSummary"
                            - $ref: "#/components/schemas/BlogPost"
                      nextCursor:
                        type: string
                        nullable: true
                        description: Present only with `order=created_at`. Null means the traversal is complete.
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
    post:
      tags:
        - Blog Content
      operationId: blogCreatePost
      summary: Create a draft blog post
      description: Gated by blog_content.posts.create. Not idempotency-keyed (a retry duplicating a create is caught by the (tenant_id, locale, slug) partial unique index).
      parameters:
        - $ref: "#/components/parameters/CorrelationId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BlogPostWriteInput"
      responses:
        "200":
          description: Post created.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    enum:
                      - true
                  data:
                    $ref: "#/components/schemas/BlogPost"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          description: A post already exists for this slug/locale, or the referenced media is not R2-verified in full-online R2-only mode (422 for the latter).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "422":
          description: One or more image/video-thumbnail references are not valid R2 media objects in full-online R2-only mode.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /api/v1/blog/terms:
    get:
      tags:
        - Blog Content
      operationId: blogListTerms
      summary: List this tenant's categories/tags
      description: |
        Gated by blog_content.taxonomies.read. Optional ?taxonomyType= filter, ?limit= bounded (default 100, max 200).

        Ordering defaults to `name ASC` — right for the admin taxonomy screen, and unsound as a keyset key because renaming a term moves it, so a row can cross a page boundary between requests and be skipped or repeated. A caller that needs EVERY term passes `?order=created_at`, which is immutable, and follows `nextCursor` until it is null. `?cursor=` without `?order=created_at` is refused with 400 rather than quietly honoured.

        **The default list is bounded and says nothing about what it left out.** For `category` or `channel` that is harmless — a newsroom has a dozen of each. For `tag` it is not: a vocabulary grown over tens of thousands of articles runs to thousands of entries, and a caller that generated one archive page per tag from the default list would build a hundred pages, `200 OK`, with every article filed under a later tag pointing at a page nobody generated. That is what `order=created_at` exists for.
      parameters:
        - name: taxonomyType
          in: query
          schema:
            type: string
            enum:
              - category
              - tag
              - channel
              - topic
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 200
        - name: order
          in: query
          description: Sort key. `created_at` selects the STABLE, cursor-capable traversal; `name` (default) is the admin ordering and rejects `cursor`.
          schema:
            type: string
            enum:
              - created_at
              - name
        - name: cursor
          in: query
          description: Opaque keyset cursor from a previous response's `nextCursor`. Requires `order=created_at`. A malformed value is a 400, never treated as "no cursor".
          schema:
            type: string
        - $ref: "#/components/parameters/CorrelationId"
      responses:
        "200":
          description: Matching terms.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    enum:
                      - true
                  data:
                    type: object
                    properties:
                      terms:
                        type: array
                        items:
                          $ref: "#/components/schemas/BlogTerm"
                      nextCursor:
                        type: string
                        nullable: true
                        description: Present only with `order=created_at`. Null once the traversal is complete.
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
    post:
      tags:
        - Blog Content
      operationId: blogCreateTerm
      summary: Create a category or tag
      description: Gated by blog_content.taxonomies.configure. A tag must never carry a parentId.
      parameters:
        - $ref: "#/components/parameters/CorrelationId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BlogTermWriteInput"
      responses:
        "200":
          description: Term created.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    enum:
                      - true
                  data:
                    $ref: "#/components/schemas/BlogTerm"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          description: A term already exists for this taxonomyType/slug.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /api/v1/blog/widgets:
    get:
      tags:
        - Blog Content
      operationId: blogListWidgets
      summary: List this tenant's widgets
      description: |
        Gated by blog_content.widgets.read. Optional `?position=` filter. Bounded at 100, ordered by `position` then `sortOrder`.

        **Inactive widgets are returned too.** There is no `?activeOnly=` parameter: `isActive` is on every row, and a consumer that wants only the live ones filters on it. An endpoint that hid them would make "this widget is switched off" and "this widget was deleted" the same answer.
      parameters:
        - name: position
          in: query
          schema:
            type: string
            enum:
              - header
              - sidebar
              - footer
              - content_before
              - content_after
        - $ref: "#/components/parameters/CorrelationId"
      responses:
        "200":
          description: Matching widgets.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    enum:
                      - true
                  data:
                    type: object
                    properties:
                      widgets:
                        type: array
                        items:
                          $ref: "#/components/schemas/BlogWidget"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
    post:
      tags:
        - Blog Content
      operationId: blogCreateWidget
      summary: Create a widget
      description: Gated by blog_content.widgets.configure. bodyText is plain text, escaped at render time (no raw-HTML field).
      parameters:
        - $ref: "#/components/parameters/CorrelationId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - position
                - title
              properties:
                position:
                  type: string
                  enum:
                    - header
                    - sidebar
                    - footer
                    - content_before
                    - content_after
                title:
                  type: string
                bodyText:
                  type: string
                isActive:
                  type: boolean
                sortOrder:
                  type: integer
      responses:
        "200":
          description: Widget created.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    enum:
                      - true
                  data:
                    type: object
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
  /api/v1/media/objects:
    get:
      operationId: mediaResolveObjects
      tags:
        - News Media
      summary: Batch-resolve media object ids to their public reference.
      description: |
        Resolves up to 100 media object ids at once to `{publicUrl, altText, mimeType, width, height, sizeBytes}`. Gated on `media_library.media.read`; read-only, so a machine credential (ADR-0049) may hold it.

        An object resolves ONLY when it is `verified` or `attached`, belongs to the calling tenant, and is not soft-deleted. Everything else — unknown, cross-tenant, unverified, deleted — is returned in `unresolved` rather than dropped, so a caller can tell "this resource has no image" from "this resource's image reference is broken". A malformed (non-uuid) id is a 400 instead: "you sent junk" and "that object is not referenceable" are different facts.

        Batch rather than one-per-id because a build feed resolves every image on a page at once, and the underlying query is already a single `id = ANY(...)`.
      parameters:
        - name: ids
          in: query
          required: true
          description: Comma-separated media object uuids, at most 100.
          schema:
            type: string
        - $ref: "#/components/parameters/CorrelationId"
      responses:
        "200":
          description: Resolved references, plus the ids that did not resolve.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    enum:
                      - true
                  data:
                    type: object
                    properties:
                      items:
                        type: array
                        items:
                          $ref: "#/components/schemas/ResolvedMediaReference"
                      unresolved:
                        type: array
                        description: Ids that are unknown, cross-tenant, unverified, or soft-deleted — one bucket on purpose, so the response is not an oracle over which.
                        items:
                          type: string
                          format: uuid
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
  /api/v1/media/public-origin:
    get:
      operationId: mediaPublicOrigin
      tags:
        - News Media
      summary: The origin media public URLs are served from.
      description: |-
        Requires `media_library.media.read`. Deployment config, not tenant data: every tenant on a deployment is served from the same bucket.

        Exists for build clients such as `awcms-astro`, whose Content-Security-Policy must name the media host in `img-src` BEFORE it fetches any object — an image resolved correctly still renders as nothing when the policy blocks the host it lives on. The alternative is copying `NEWS_MEDIA_R2_PUBLIC_BASE_URL` into the consumer by hand, which is two copies of one value that agree until one is edited.

        `origin` is scheme + host + port, for the host-wide CSP form; `baseUrl` includes the path, for the tighter prefix form. Both are reported because neither choice is this API's to make.

        A deployment that serves no public media (LAN/offline profiles) answers `200` with `configured: false` rather than an error, so a build can omit the `img-src` entry instead of failing. A value that is set but unparseable, or on a scheme that cannot serve media, is reported the same way and never echoed back.
      responses:
        "200":
          description: The configured media origin, or an explicit "not configured".
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    enum:
                      - true
                  data:
                    type: object
                    required:
                      - configured
                      - origin
                      - baseUrl
                    properties:
                      configured:
                        type: boolean
                      origin:
                        type: string
                        nullable: true
                        example: https://media.example.com
                      baseUrl:
                        type: string
                        nullable: true
                        example: https://media.example.com/news
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
  /api/v1/site-profile/composed:
    get:
      operationId: siteProfileComposedRead
      tags:
        - Site Profile
      summary: Site identity for a build client, both halves in one answer
      description: "Gated by `site_profile.profile.read`. ADR-0102 splits OWNERSHIP — `awcms_seo_tenant_settings` keeps what crawlers see (og:site_name, the JSON-LD Organization node, the default og:image) and `awcms_site_profile` owns what people read. That boundary is right for ownership and wrong for consumers, so the composition happens here, once, rather than in every build template that would otherwise have to call two endpoints and merge them — and drift when one of them forgot. `logoMediaId`/`faviconMediaId` are media object IDS, not URLs: a consumer resolves them through media_library exactly as it resolves an article image, which is what keeps managed-media enforcement meaningful."
      parameters:
        - $ref: "#/components/parameters/CorrelationId"
      responses:
        "200":
          description: Composed site identity.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    enum:
                      - true
                  data:
                    $ref: "#/components/schemas/ComposedSiteIdentity"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
  /api/v1/site-search/query:
    get:
      operationId: siteSearchQuery
      tags:
        - Site Search
      security: []
      summary: Public full-text search over this site's published content (anonymous)
      description: "PUBLIC, unauthenticated cross-content search. The tenant is resolved from the request host (never a session or a tenant header); results come from the tenant's search index, which contains PUBLISHED PUBLIC content only and is never an authorization source. The query text is always a bound parameter into `websearch_to_tsquery`, snippets are HTML-escaped before the `<mark>` highlights are inserted, and the endpoint is per-IP rate-limited, query-length-bounded (max 128 characters) and result-capped. An unresolved host, a disabled module, a search-disabled tenant, and a too-short query all return the SAME neutral empty payload — never a distinguishing error. A request carrying a cross-origin `Origin` resolves its tenant from THAT ORIGIN against the tenant-domain table — never from the host, and never through the host chain's default-tenant fallback (ADR-0107). It is answered with `Access-Control-Allow-Origin` only when the origin is an `active` domain of an `active` tenant; any other origin gets the same neutral empty payload with no grant header. There is no `OPTIONS` handler: a `GET` carrying only CORS-safelisted headers is a simple request, so a consumer must not add custom headers."
      parameters:
        - name: q
          in: query
          required: false
          description: Raw search text. Trimmed, whitespace-collapsed, and bounded before use.
          schema:
            type: string
            maxLength: 128
        - name: type
          in: query
          required: false
          description: Restrict results to one resource type. Honored only when the tenant's `enabledResourceTypes` admits it; otherwise silently ignored.
          schema:
            type: string
        - name: channel
          in: query
          required: false
          description: "Term filter (Issue #633). One query parameter per facet name declared by the search-source registry — `channel`, `topic`, `institution`, `region` today. Filters are ANDed with each other and with `type`. The value is a slug or code (never a label), bounded to 200 characters. An unknown facet name is IGNORED rather than rejected, so the tracking parameters that ride along on a shared link do not turn a search into a 400."
          schema:
            type: string
            maxLength: 200
        - name: topic
          in: query
          required: false
          description: See `channel`.
          schema:
            type: string
            maxLength: 200
        - name: institution
          in: query
          required: false
          description: See `channel`.
          schema:
            type: string
            maxLength: 200
        - name: region
          in: query
          required: false
          description: See `channel`. The value is a dotted `idn_admin_regions` code (`62`, `62.71`, `62.71.01`), because that is what an article stores.
          schema:
            type: string
            maxLength: 200
        - name: locale
          in: query
          required: false
          description: BCP-47-ish content locale. Malformed values fall back to the tenant default.
          schema:
            type: string
        - name: cursor
          in: query
          required: false
          description: Opaque keyset cursor from a previous response's `nextCursor`.
          schema:
            type: string
      responses:
        "200":
          description: Search results (possibly empty).
          headers:
            Access-Control-Allow-Origin:
              description: Present ONLY for a cross-origin request whose `Origin` is an active domain of an active tenant (ADR-0107). Echoed verbatim, never `*`. Absent for a same-origin request and for a refused origin — the absence IS the refusal.
              required: false
              schema:
                type: string
            Vary:
              description: Always `Origin`. The body is identical for a granted and a refused request; the headers are not, so a cache must key on it.
              required: false
              schema:
                type: string
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    enum:
                      - true
                  data:
                    $ref: "#/components/schemas/SiteSearchQueryResult"
        "429":
          description: Too many search requests from this source.
          headers:
            Vary:
              description: Always `Origin`. The limiter answers before the origin is classified, so this response never carries a grant — but it is still one of the answers this URL gives (ADR-0107).
              required: false
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /api/v1/site-search/suggest:
    get:
      operationId: siteSearchSuggest
      tags:
        - Site Search
      security: []
      summary: Public bounded title typeahead (anonymous)
      description: "PUBLIC, unauthenticated trigram typeahead over indexed titles, tenant and locale scoped. Same host-based tenant resolution, per-IP rate limit, query bounds and neutral empty payload as the search endpoint. Returns at most the tenant's configured `suggestionLimit`; returns an empty list when the tenant has suggestions turned off. A request carrying a cross-origin `Origin` resolves its tenant from THAT ORIGIN against the tenant-domain table — never from the host, and never through the host chain's default-tenant fallback (ADR-0107). It is answered with `Access-Control-Allow-Origin` only when the origin is an `active` domain of an `active` tenant; any other origin gets the same neutral empty payload with no grant header. There is no `OPTIONS` handler: a `GET` carrying only CORS-safelisted headers is a simple request, so a consumer must not add custom headers."
      parameters:
        - name: q
          in: query
          required: false
          schema:
            type: string
            maxLength: 128
        - name: locale
          in: query
          required: false
          schema:
            type: string
      responses:
        "200":
          description: Title suggestions (possibly empty).
          headers:
            Access-Control-Allow-Origin:
              description: Present ONLY for a cross-origin request whose `Origin` is an active domain of an active tenant (ADR-0107). Echoed verbatim, never `*`. Absent for a same-origin request and for a refused origin — the absence IS the refusal.
              required: false
              schema:
                type: string
            Vary:
              description: Always `Origin`. The body is identical for a granted and a refused request; the headers are not, so a cache must key on it.
              required: false
              schema:
                type: string
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    enum:
                      - true
                  data:
                    $ref: "#/components/schemas/SiteSearchSuggestResult"
        "429":
          description: Too many suggestion requests from this source.
          headers:
            Vary:
              description: Always `Origin`. The limiter answers before the origin is classified, so this response never carries a grant — but it is still one of the answers this URL gives (ADR-0107).
              required: false
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
components:
  parameters:
    CorrelationId:
      name: X-Correlation-ID
      in: header
      required: false
      schema:
        type: string
  responses:
    BadRequest:
      description: Validation error.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiError"
    Forbidden:
      description: Access denied by RBAC/ABAC.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiError"
    NotFound:
      description: Resource not found.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiError"
    Unauthorized:
      description: Missing or invalid session.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiError"
  schemas:
    ApiError:
      type: object
      required:
        - success
        - error
      properties:
        success:
          type: boolean
          enum:
            - false
        error:
          type: object
          required:
            - code
            - message
          properties:
            code:
              type: string
            message:
              type: string
            details: {}
        meta:
          $ref: "#/components/schemas/ApiMeta"
    ApiMeta:
      type: object
      properties:
        correlationId:
          type: string
        requestId:
          type: string
    BlogContentBlock:
      description: |
        One block of `content_json`. The vocabulary is closed: a value outside
        the six variants below is not stored and not rendered.

        This schema exists because the vocabulary previously lived only in a
        TypeScript type and one prose sentence, so every consumer re-derived it
        by reading. One did, and disagreed with it in three ways at once —
        silently, because a wrong block type raises no error anywhere. It
        renders wrongly, or the section disappears.

        Held to `blog-content/domain/content-block-rendering.ts`'s
        `CONTENT_BLOCK_TYPES` by `tests/content-block-contract.test.ts`, which
        also holds that constant to the renderer's own switch.

        Note two shapes that are easy to guess wrong:
          - Ordering is a FIELD on `list` (`ordered: true`), not a separate
            `ordered_list` type.
          - `gallery` and `video_news` carry NO `text` field. A renderer that
            falls back to "render `text` as a paragraph" drops them entirely.
      oneOf:
        - type: object
          required:
            - type
            - text
          properties:
            type:
              type: string
              enum:
                - paragraph
            text:
              type: string
        - type: object
          required:
            - type
            - level
            - text
          properties:
            type:
              type: string
              enum:
                - heading
            level:
              type: integer
              minimum: 1
              maximum: 6
            text:
              type: string
        - type: object
          required:
            - type
            - items
          properties:
            type:
              type: string
              enum:
                - list
            ordered:
              description: Absent or false means an unordered list. There is no separate `ordered_list` type.
              type: boolean
            items:
              type: array
              items:
                type: string
        - type: object
          required:
            - type
            - text
          properties:
            type:
              type: string
              enum:
                - quote
            text:
              type: string
        - type: object
          required:
            - type
            - items
          properties:
            type:
              type: string
              enum:
                - gallery
            items:
              type: array
              items:
                type: object
                required:
                  - mediaType
                properties:
                  mediaType:
                    type: string
                    enum:
                      - image
                      - video
                  url:
                    description: Direct absolute URL. Legacy shape — absent when the item uses `mediaObjectId`.
                    type: string
                  mediaObjectId:
                    description: Verified media registry object id. Resolving it to a URL requires a media lookup; a consumer that cannot perform one must show a placeholder rather than dropping the item.
                    type: string
                    format: uuid
                  caption:
                    type: string
        - type: object
          required:
            - type
            - provider
            - videoId
          properties:
            type:
              type: string
              enum:
                - video_news
            provider:
              description: Allowlisted provider. Only `youtube` is recognised today; an unknown provider must not be turned into a URL by guesswork.
              type: string
            videoId:
              description: Provider video id, validated server-side against the provider's own id shape before storage.
              type: string
            title:
              type: string
            caption:
              type: string
            thumbnailMediaObjectId:
              type: string
              format: uuid
            durationSeconds:
              type: integer
            sourceLabel:
              type: string
    BlogContentJson:
      description: "Structured post/page body. `{ blocks: BlogContentBlock[] }` — never raw HTML, by construction: there is no block variant that carries markup."
      type: object
      properties:
        blocks:
          type: array
          items:
            $ref: "#/components/schemas/BlogContentBlock"
    BlogMenu:
      type: object
      description: |
        One navigation menu, as `GET /api/v1/blog/menus` returns it.

        It exists as a schema because that endpoint's response was documented as
        an array of bare `object` — which promises a consumer nothing at all.
        Any field could have been renamed or dropped and the frozen consumer
        contract would still have passed, because everything is a subset of
        "object". That is the same defect the list endpoint shipped once over
        `BlogPostSummary`, one step further along: not a wrong shape, but no
        shape.

        `key` is the stable identifier a template selects a menu by (`main`,
        `footer`); `name` is the editorial label and may be renamed at any time.
        A consumer that keys off `name` breaks the first time somebody fixes a
        typo.
      required:
        - id
        - tenantId
        - key
        - name
        - items
      properties:
        id:
          type: string
          format: uuid
        tenantId:
          type: string
          format: uuid
        key:
          type: string
          description: Stable slug. What a consumer selects a menu by.
        name:
          type: string
          description: Editorial label. NOT an identifier.
        items:
          type: array
          description: Already sorted by `sortOrder`. One level of nesting at most — an item whose parent itself has a parent is refused at write time.
          items:
            $ref: "#/components/schemas/BlogMenuItem"
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        deletedAt:
          type: string
          format: date-time
          nullable: true
          description: Always null on this list — it filters soft-deleted menus out. Present because the row carries it, and named here rather than left as a surprise field.
    BlogMenuItem:
      type: object
      required:
        - id
        - label
        - linkType
        - sortOrder
      properties:
        id:
          type: string
          format: uuid
        tenantId:
          type: string
          format: uuid
          readOnly: true
          description: Returned on a read, never accepted on a write — the tenant comes from the credential.
        menuId:
          type: string
          format: uuid
          readOnly: true
          description: Returned on a read, never accepted on a write — the item's menu is the one it was submitted with.
        parentItemId:
          type: string
          format: uuid
          nullable: true
        label:
          type: string
        linkType:
          type: string
          enum:
            - post
            - page
            - url
        targetId:
          type: string
          format: uuid
          nullable: true
          description: Required for `post`/`page`. Its existence is deliberately NOT checked against the posts/pages tables, because a menu may point at something not created yet — so a consumer must treat a target that resolves to nothing as a normal state, not an error.
        url:
          type: string
          nullable: true
          description: Required for `url`. An absolute http(s) URL, validated at write time by the same check `canonicalUrl` uses.
        sortOrder:
          type: integer
    BlogPost:
      type: object
      required:
        - id
        - tenantId
        - title
        - slug
        - status
        - visibility
        - locale
        - createdAt
        - updatedAt
        - version
      properties:
        id:
          type: string
          format: uuid
        tenantId:
          type: string
          format: uuid
        authorTenantUserId:
          type: string
          format: uuid
        title:
          type: string
        slug:
          type: string
        excerpt:
          type: string
          nullable: true
        contentJson:
          $ref: "#/components/schemas/BlogContentJson"
          description: ADR-0100 — the non-body ENVELOPE, optional on write. Its blocks key is overwritten with the derived projection; other keys (notably awcmsAstro) are preserved.
        contentText:
          type: string
          description: ADR-0100 — DERIVED from bodyPortableText. Still returned (it is what the full-text index is built from) but no longer accepted on write.
          readOnly: true
        bodyPortableText:
          $ref: "#/components/schemas/PortableTextBody"
        status:
          type: string
          enum:
            - draft
            - review
            - scheduled
            - published
            - archived
        visibility:
          type: string
          enum:
            - public
            - private
            - unlisted
        featuredMediaId:
          type: string
          format: uuid
          nullable: true
        seoImageMediaId:
          type: string
          format: uuid
          nullable: true
        seoTitle:
          type: string
          nullable: true
        metaDescription:
          type: string
          nullable: true
        canonicalUrl:
          type: string
          nullable: true
        locale:
          type: string
        translationGroupId:
          type: string
          format: uuid
          nullable: true
        autoInternalTagLinksDisabled:
          type: boolean
        publishedAt:
          type: string
          format: date-time
          nullable: true
        scheduledAt:
          type: string
          format: date-time
          nullable: true
        unpublishAt:
          type: string
          format: date-time
          nullable: true
          description: Issue
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        version:
          type: integer
        termIds:
          description: "Category/tag/channel/topic assignments. Returned by `GET /api/v1/blog/posts/{id}`, by `PATCH` on the same path, and — since Issue #597 — by the `?view=full` traversal that a static site is built from. `[]` means the post has none; the field being ABSENT means the response shape does not carry it (the lifecycle actions), which is a different fact."
          type: array
          items:
            type: string
            format: uuid
        institutionIds:
          description: "Issue #595 — the fourth classification dimension (sql/131). Institution is a TABLE rather than a taxonomy type because it carries a branch, a region code and its own landing SEO, but on this payload it is the same shape as `termIds`, and it is returned in the same places for the same reasons."
          type: array
          items:
            type: string
            format: uuid
        authorByline:
          description: |-
            ADR-0109 — the author's OPT-IN public byline, returned by the `?view=full` traversal a static site is built from.
            `null` is the normal state and means the article keeps the ORGANISATION-level attribution (ADR-0102): a consumer renders no individual name for it. It is deliberately NOT the author's internal display name — publishing an account name because somebody wrote an article is the PII surface Issue #649 refused to open — and it carries no id, URL or profile link, only the name.
          type: string
          nullable: true
          maxLength: 120
    BlogPostSummary:
      type: object
      description: |
        What the LIST endpoint returns by default — deliberately not a `BlogPost`.

        It exists as its own schema because the list used to be documented as returning `BlogPost`, and it never did: no `contentJson`, `excerpt`, `metaDescription`, `canonicalUrl`, or `translationGroupId`. A client that trusted the document read those as `undefined` and published a site with empty articles, with nothing failing. Ask for `?view=full` to get `BlogPost`.
      required:
        - id
        - tenantId
        - title
        - slug
        - status
        - visibility
        - locale
        - createdAt
        - updatedAt
      properties:
        id:
          type: string
          format: uuid
        tenantId:
          type: string
          format: uuid
        title:
          type: string
        slug:
          type: string
        status:
          type: string
          enum:
            - draft
            - review
            - scheduled
            - published
            - archived
        visibility:
          type: string
          enum:
            - public
            - private
            - unlisted
        locale:
          type: string
        publishedAt:
          type: string
          format: date-time
          nullable: true
        createdAt:
          type: string
          format: date-time
          description: Immutable — the only sort key this list can paginate over soundly.
        updatedAt:
          type: string
          format: date-time
    BlogPostWriteInput:
      type: object
      description: Shared shape for POST /api/v1/blog/posts (all fields required) and PATCH /api/v1/blog/posts/{id} (all fields optional, only present fields change).
      properties:
        title:
          type: string
        slug:
          type: string
        excerpt:
          type: string
          nullable: true
        contentJson:
          $ref: "#/components/schemas/BlogContentJson"
          description: ADR-0100 — the non-body ENVELOPE, optional on write. Its blocks key is overwritten with the derived projection; other keys (notably awcmsAstro) are preserved.
        bodyPortableText:
          $ref: "#/components/schemas/PortableTextBody"
        locale:
          type: string
        visibility:
          type: string
          enum:
            - public
            - private
            - unlisted
        featuredMediaId:
          type: string
          format: uuid
          nullable: true
        seoImageMediaId:
          type: string
          format: uuid
          nullable: true
          description: Explicit "use this image for social/SEO preview" override — takes priority over featuredMediaId.
        seoTitle:
          type: string
          nullable: true
        metaDescription:
          type: string
          nullable: true
        canonicalUrl:
          type: string
          nullable: true
        termIds:
          type: array
          items:
            type: string
            format: uuid
        institutionIds:
          description: "Issue #595 — the fourth classification dimension (sql/131). Institution is a TABLE rather than a taxonomy type because it carries a branch, a region code and its own landing SEO, but on this payload it is the same shape as `termIds`. Full-replace semantics: absent leaves the assignments alone, `[]` removes them."
          type: array
          items:
            type: string
            format: uuid
        translationGroupId:
          type: string
          format: uuid
          nullable: true
        autoInternalTagLinksDisabled:
          type: boolean
          description: Per-post opt-out of automatic internal tag linking.
    BlogTerm:
      type: object
      required:
        - id
        - tenantId
        - taxonomyType
        - name
        - slug
      properties:
        id:
          type: string
          format: uuid
        tenantId:
          type: string
          format: uuid
        taxonomyType:
          type: string
          enum:
            - category
            - tag
            - channel
            - topic
        parentId:
          type: string
          format: uuid
          nullable: true
        name:
          type: string
        slug:
          type: string
        description:
          type: string
          nullable: true
    BlogTermWriteInput:
      type: object
      properties:
        taxonomyType:
          type: string
          enum:
            - category
            - tag
            - channel
            - topic
        parentId:
          type: string
          format: uuid
          nullable: true
        name:
          type: string
        slug:
          type: string
        description:
          type: string
          nullable: true
    BlogWidget:
      type: object
      description: |
        One widget, as `GET /api/v1/blog/widgets` returns it. Its response was
        documented as an array of bare `object` too — see `BlogMenu` for why
        that is worse than a wrong shape.

        `bodyText` is PLAIN TEXT, not markup: the write path refuses unsafe HTML
        rather than sanitizing it, so a consumer must escape this before
        rendering and must not treat it as trusted HTML.
      required:
        - id
        - tenantId
        - position
        - title
        - bodyText
        - isActive
        - sortOrder
      properties:
        id:
          type: string
          format: uuid
        tenantId:
          type: string
          format: uuid
        position:
          type: string
          enum:
            - header
            - sidebar
            - footer
            - content_before
            - content_after
        title:
          type: string
        bodyText:
          type: string
          description: Plain text. Escape before rendering.
        isActive:
          type: boolean
          description: Inactive widgets ARE returned by the list — filter on this rather than expecting the endpoint to hide them.
        sortOrder:
          type: integer
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    ComposedSiteIdentity:
      description: Both halves of site identity in one answer. The four SEO-owned fields are named exactly as seo_distribution names them, so this is visibly a passthrough rather than a second definition that could drift.
      allOf:
        - $ref: "#/components/schemas/SiteProfile"
        - type: object
          properties:
            siteName:
              type: string
              nullable: true
            organizationName:
              type: string
              nullable: true
            organizationLogoMediaId:
              type: string
              format: uuid
              nullable: true
            defaultSocialMediaId:
              type: string
              format: uuid
              nullable: true
    IssueMachineCredentialRequest:
      type: object
      required:
        - name
        - tenantUserId
        - allowedPermissionKeys
        - expiresAt
      properties:
        name:
          type: string
          maxLength: 120
          description: Operator-facing label, e.g. "awcms-astro build feed".
        tenantUserId:
          type: string
          format: uuid
          description: An existing tenant user in THIS tenant (the service account).
        allowedPermissionKeys:
          type: array
          minItems: 1
          maxItems: 50
          description: Permission keys (`module.activity.action`) this credential may use. Required and non-empty — an empty list means "can do nothing", never "unrestricted".
          items:
            type: string
        allowedWriteActions:
          type: array
          maxItems: 2
          description: |
            ADR-0092. OPTIONAL — omitting it (or sending an empty array) issues the read-only credential of ADR-0049, which is what every caller written before this class got and still gets.

            Naming any action switches the guard to `identity_access.machine_credentials_write.create` and makes `allowedIpCidrs` mandatory. `read` is REJECTED here rather than accepted as a no-op: every credential may already read whatever its `allowedPermissionKeys` name, and accepting it would suggest otherwise.
          items:
            type: string
            enum:
              - create
              - update
        allowedIpCidrs:
          type: array
          maxItems: 20
          description: |
            ADR-0092. IPv4/IPv6 literals or CIDR blocks. Required and non-empty when `allowedWriteActions` is non-empty, and REJECTED when it is empty — a read-only credential is not restricted by this list, so accepting one would describe a binding that is not enforced.

            Unparseable entries are refused at issuance. At request time an unreadable entry matches nothing, so the failure would otherwise be a credential that reads as bound and can never authenticate.
          items:
            type: string
        expiresAt:
          type: string
          format: date-time
          description: Required, in the future, at most 365 days away — or at most 30 days when `allowedWriteActions` is non-empty. There is no perpetual credential.
    MachineCredential:
      type: object
      description: A machine credential (ADR-0049; write class ADR-0092). Never carries the token or its hash — an operator tracing a leak needs to know which credential is alive and whether anything still uses it, and none of that requires secret material.
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        tenantUserId:
          type: string
          format: uuid
          description: The service account this credential authenticates AS. Its roles, narrowed by allowedPermissionKeys, are the whole of what the credential may do.
        allowedPermissionKeys:
          type: array
          description: NARROWING filter — effective permissions are the intersection with what the service account holds. It can never widen them.
          items:
            type: string
        allowedWriteActions:
          type: array
          description: ADR-0092. Empty on every read-only credential, which is every credential issued before the write class existed. Effective write actions are the intersection with the CODE ceiling, so this list can only narrow it.
          items:
            type: string
        allowedIpCidrs:
          type: array
          description: ADR-0092. Non-empty if and only if allowedWriteActions is. Consulted ONLY for write actions — a read request is never restricted by it.
          items:
            type: string
        expiresAt:
          type: string
          format: date-time
        lastUsedAt:
          type: string
          format: date-time
          nullable: true
          description: Refreshed at most hourly, so an idle or leaked credential is visible without a write on every request.
        revokedAt:
          type: string
          format: date-time
          nullable: true
        createdByTenantUserId:
          type: string
          format: uuid
        createdAt:
          type: string
          format: date-time
        status:
          type: string
          description: Derived from the clock and revokedAt, not stored.
          enum:
            - active
            - expired
            - revoked
    PortableTextBody:
      type: array
      maxItems: 2000
      description: ADR-0100 — the canonical article body. contentJson.blocks is a derived, LOSSY projection of this, written only so ahliweb/awcms-astro keeps rendering until it reads this field directly.
      items:
        $ref: "#/components/schemas/PortableTextNode"
    PortableTextLinkAnnotation:
      type: object
      required:
        - _type
        - _key
        - href
      properties:
        _type:
          type: string
          enum:
            - link
        _key:
          type: string
        href:
          type: string
          maxLength: 2048
          description: "Relative, or http/https/mailto/tel. Checked by URL parsing rather than a pattern, so java\\nscript: and JaVaScRiPt: are refused too."
    PortableTextNode:
      type: object
      required:
        - _type
        - _key
      description: One node of a CLOSED Portable Text vocabulary (ADR-0100). _type is one of block, gallery, videoNews — anything else is refused at write time, which is what keeps "there is no field where arbitrary markup could live" true.
      properties:
        _type:
          type: string
          enum:
            - block
            - gallery
            - videoNews
        _key:
          type: string
        style:
          type: string
          enum:
            - normal
            - h1
            - h2
            - h3
            - h4
            - h5
            - h6
            - blockquote
        listItem:
          type: string
          enum:
            - bullet
            - number
        level:
          type: integer
          minimum: 1
          maximum: 6
        children:
          type: array
          items:
            $ref: "#/components/schemas/PortableTextSpan"
        markDefs:
          type: array
          items:
            $ref: "#/components/schemas/PortableTextLinkAnnotation"
        items:
          type: array
          description: Gallery items — present when _type is gallery.
          items:
            type: object
        provider:
          type: string
          description: Present when _type is videoNews.
        videoId:
          type: string
          description: Present when _type is videoNews.
    PortableTextSpan:
      type: object
      required:
        - _type
        - _key
        - text
      properties:
        _type:
          type: string
          enum:
            - span
        _key:
          type: string
        text:
          type: string
          description: PLAIN text — never markup.
        marks:
          type: array
          items:
            type: string
          description: Decorator names (strong, em, code) and/or the _key of an annotation declared in this block's own markDefs. A mark naming neither is refused at write time as a dangling reference.
    ResolvedMediaReference:
      type: object
      description: A media object safe to reference publicly (verified/attached, same tenant, not deleted).
      properties:
        id:
          type: string
          format: uuid
        publicUrl:
          type: string
        altText:
          type: string
          nullable: true
        mimeType:
          type: string
        width:
          type: integer
          nullable: true
        height:
          type: integer
          nullable: true
        sizeBytes:
          type: integer
          nullable: true
    SessionIntrospection:
      type: object
      description: Safe claims for a live session (ADR-0049 §7). Deliberately excludes the raw login identifier that GET /api/v1/auth/me returns.
      properties:
        identityId:
          type: string
          format: uuid
        tenantId:
          type: string
          format: uuid
        displayName:
          type: string
        roles:
          type: array
          items:
            type: string
        assuranceLevel:
          type: string
          enum:
            - aal1
            - aal2
        expiresAt:
          type: string
          format: date-time
        scopes:
          type: array
          description: Active, effective-dated business-scope references — the same evaluation the authorization layer uses.
          items:
            type: object
            properties:
              scopeType:
                type: string
              scopeId:
                type: string
                format: uuid
    SiteProfile:
      type: object
      properties:
        tagline:
          type: string
          nullable: true
          maxLength: 200
        copyrightNotice:
          type: string
          nullable: true
          maxLength: 300
        logoMediaId:
          type: string
          format: uuid
          nullable: true
        faviconMediaId:
          description: "Separate from the logo on purpose: a favicon is square, tiny and usually a different crop, and one field for both would force every tenant to accept whichever compromise the renderer picked."
          type: string
          format: uuid
          nullable: true
        editorialAddress:
          description: Free text and multi-line on purpose — Indonesian addresses do not decompose into street/city/postcode reliably, and forcing them to would produce a form nobody can fill in correctly.
          type: string
          nullable: true
          maxLength: 1000
        contactEmail:
          type: string
          nullable: true
          maxLength: 320
        contactPhone:
          type: string
          nullable: true
          maxLength: 50
        whatsappNumber:
          description: "Kept separate from contactPhone: a newsroom's WhatsApp tip line is frequently not its switchboard number."
          type: string
          nullable: true
          maxLength: 50
        socialLinks:
          type: array
          maxItems: 20
          items:
            $ref: "#/components/schemas/SocialProfileLink"
        updatedAt:
          type: string
          format: date-time
          nullable: true
    SiteSearchFacetValue:
      type: object
      properties:
        value:
          type: string
          description: A `resourceType` as stored — `blog_post`, `blog_page`, and whatever a future module contributes.
        count:
          type: integer
      required:
        - value
        - count
    SiteSearchFacets:
      type: object
      description: |
        Counts per facet value for the whole result set (Issue #607 for content type, #633 for terms), computed on every page — they describe the result set rather than the page, so omitting them after the first page would make them look like they had changed.

        A facet's OWN filter is never applied to its own count: a facet answers "what else is there", and applying it would zero every other value the moment a reader picks one, leaving no way back to results that still exist. Every OTHER filter is applied — so the `type` counts reflect the active term filters, and each term facet reflects `type` and the other term filters.

        Every remaining predicate is shared with the result query character for character, so a count can never advertise a document the reader cannot reach. Bounded to 20 values PER facet.
      properties:
        resourceTypes:
          type: array
          items:
            $ref: "#/components/schemas/SiteSearchFacetValue"
        terms:
          type: object
          description: |
            Term facets keyed by facet name — `channel`, `topic`, `institution`, `region`, and whatever a future module's search-source descriptor contributes. A facet with no matching documents is ABSENT rather than present-and-empty: the reader is being told what else is there, and an empty list is not something else.

            Filter by one with a query parameter of the same name (`?channel=politik`). Filters are ANDed. Match is on `value` (a slug or code), never `label` — a label is display text an editor may rewrite, and a filter that broke when somebody fixed a capital letter would be a filter nobody trusts.
          additionalProperties:
            type: array
            items:
              $ref: "#/components/schemas/SiteSearchTermFacetValue"
      required:
        - resourceTypes
        - terms
    SiteSearchQueryResult:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/SiteSearchResultItem"
        nextCursor:
          type: string
          nullable: true
        facets:
          $ref: "#/components/schemas/SiteSearchFacets"
        query:
          type: string
          description: The NORMALIZED query actually executed (empty when nothing ran).
        locale:
          type: string
        reason:
          type: string
          enum:
            - empty
            - too_short
            - too_long
          description: Present only when the submitted query was rejected by the input bounds.
      required:
        - items
        - nextCursor
        - facets
        - query
        - locale
    SiteSearchResultItem:
      type: object
      description: One public search hit. `url` is a server-built absolute PATH, never a source-supplied URL.
      properties:
        resourceType:
          type: string
        resourceId:
          type: string
        url:
          type: string
        title:
          type: string
        snippet:
          type: string
          description: Pre-escaped safe HTML. The whole `ts_headline` output is HTML-escaped FIRST and only then are the non-HTML sentinels replaced with `<mark>`/`</mark>`, so the only markup this can ever contain is those two tags.
        locale:
          type: string
        rank:
          type: number
      required:
        - resourceType
        - resourceId
        - url
        - title
        - snippet
        - locale
        - rank
    SiteSearchSuggestResult:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/SiteSearchSuggestionItem"
        query:
          type: string
        locale:
          type: string
      required:
        - items
        - query
        - locale
    SiteSearchSuggestionItem:
      type: object
      properties:
        resourceType:
          type: string
        resourceId:
          type: string
        url:
          type: string
        title:
          type: string
        locale:
          type: string
      required:
        - resourceType
        - resourceId
        - url
        - title
        - locale
    SiteSearchTermFacetValue:
      type: object
      properties:
        value:
          type: string
          description: The stable value a filter matches and a URL carries — a slug (`politik`) or a code (`62.71`).
        label:
          type: string
          description: Display text for `value`. Falls back to the value itself where the source stored no separate label (the `region` facet, whose human name lives in a dataset-versioned table this does not join).
        count:
          type: integer
      required:
        - value
        - label
        - count
    SocialProfileLink:
      type: object
      required:
        - platform
        - url
      properties:
        platform:
          description: A label, deliberately NOT an enumeration. Closing the set would mean a migration every time a newsroom joins a new network, and unlike a content block type nothing renders differently per value — an unknown platform degrades to a plain link.
          type: string
          maxLength: 40
        url:
          description: "Absolute http(s) only. REFUSED rather than sanitized otherwise: this is rendered as an <a href> on every public page, so a javascript:/data: value would be stored XSS with a very long reach."
          type: string
          maxLength: 500
