# AWCMS contract manifest (Issue #183, epic #177; re-anchored by ADR-0055).
#
# Machine-readable, versioned, schema-validated statement of the contracts this
# repo OWNS — the ones `ahliweb/awcms-astro` binds against, and the ones a
# future consumer would read before integrating.
#
# It began (ADR-0001/ADR-0032) as a declaration of conformance to the awcms-mini
# modular-monolith STANDARD. ADR-0055 retired that anchor: development happens in
# `ahliweb/awcms` and `ahliweb/awcms-astro` only, awcms-mini/awcms-micro are
# archives, and awcms defines its own contracts. The mechanism was never the
# problem and is unchanged — every value below is still cross-checked against a
# REAL source constant, which is what has repeatedly caught drift.
#
# Validated + enforced by `bun run family:conformance:check`
# (scripts/family-conformance-check.ts) against the REAL source-of-truth
# constants — every value below is cross-checked, none is decorative:
#   - contracts.moduleDescriptorContractVersion  → src/modules/_shared/module-contract.ts (MODULE_CONTRACT_VERSION)
#   - contracts.capabilityContractVersions       → src/modules/_shared/capability-contract-versions.ts
#   - contracts.restApiInfoVersion               → openapi/awcms-public-api.openapi.yaml (info.version)
#   - contracts.eventApiInfoVersion              → asyncapi/awcms-domain-events.asyncapi.yaml (info.version)
#   - contracts.* family-owned versions          → src/modules/_shared/family-contract.ts + pinned semantic contract tests
#   - stack.*                                     → package.json + .github/workflows/ci.yml
#
# Schema: awcms-family-compatibility.schema.json. Versioning/upgrade policy:
# docs/awcms/family-compatibility.md.

manifestSchemaVersion: "1.0.0"
familyContractVersion: "1.0.0"

family:
  # Self-anchored since ADR-0055. There is no external standard to conform to:
  # this repo IS the standard, and the only other repo in scope is
  # `ahliweb/awcms-astro` (experience layer + BFF, ADR-0045) which binds to the
  # contracts declared below.
  standard: awcms
  standardRepository: https://github.com/ahliweb/awcms
  role: system of record — online-first hybrid ERP + integrated-SaaS modular monolith owning every authorization surface, API, and admin screen (ADR-0034, ADR-0035, ADR-0051); paired with ahliweb/awcms-astro as experience layer + BFF (ADR-0045). Development is confined to these two repositories (ADR-0055)

# Pinned contract versions. Where a real source constant exists it is the
# authority (the gate reads it and fails on mismatch). Where the contract is
# "family-owned" (no standalone constant), the number is anchored to
# FAMILY_OWNED_CONTRACT_VERSIONS in src/modules/_shared/family-contract.ts and
# given teeth by a SEMANTIC contract test that goes RED if the control drifts.
contracts:
  moduleDescriptorContractVersion: "2.5.0"
  # Per-capability port SemVer for capabilities OWNED BY A BASE MODULE (matches
  # CAPABILITY_CONTRACT_VERSIONS). Only capabilities whose owning module actually
  # ships in this base belong here. `party_directory` is owned by the base
  # `profile_identity` module (forward-declared ahead of an in-repo consumer,
  # ADR-0011). `media_library` is owned by the base `media_library` module
  # (ADR-0036 media ownership inversion — the media registry extracted out of
  # news_portal); it SUPERSEDES the retired `news_media` capability. ADR-0034 Fase
  # 3 admitted the first website module (`theming`) directly into the base, but
  # `theming` provides no capability port, so it adds no entry here. Other content
  # capabilities whose owning CMS modules provide no versioned base port yet (e.g.
  # public_content/social_publishing) remain unlisted.
  capabilityContractVersions:
    party_directory: "1.0.0"
    media_library: "1.0.0"
    # seo_facts is owned (provided) by the base `blog_content` module and consumed
    # by `seo_distribution` (ADR-0038 discovery scope). Declared at 1.1.0 — the port
    # ships with the `summarizePublicResourceFacts` roll-up + `offset`/`order` list
    # options (awcms-micro's own 1.1.0 minor), so 1.0.0 would understate the shape a
    # consumer binds against.
    seo_facts: "1.1.0"
    # auth_notification is owned (provided) by the base `email` module and consumed
    # by `identity_access`'s password-reset flow (Gelombang 2 delta auth). It exists
    # because the reverse edge is impossible: `email` already depends on
    # `identity_access`, so a direct import would close a module cycle.
    auth_notification: "1.0.0"
  apiResponseEnvelopeVersion: "1.0.0"
  restApiInfoVersion: "0.1.0"
  eventApiInfoVersion: "0.1.0"
  tenantContextRlsContractVersion: "1.0.0"
  auditRedactionContractVersion: "1.0.0"
  idempotencyContractVersion: "1.0.0"
  migrationChecksum:
    algorithm: sha256
    version: "1.0.0"

# Validated stack versions — declared value MUST equal the real toolchain value
# the `source` points at (the compatibility-matrix assertion). The gate asserts
# CI's distinct Bun versions are EXACTLY {ci (current), ciMinimum (floor)} — so
# the dedicated minimum-supported CI cell (Bun 1.3.0, == engines floor) can
# never silently drop out. See docs/awcms/family-compatibility.md §4.
stack:
  bun:
    packageManager:
      declared: "1.3.14"
      source: package.json packageManager
    engines:
      declared: ">=1.3.0"
      source: package.json engines.bun
    ci:
      declared: "1.3.14"
      source: .github/workflows/ci.yml setup-bun bun-version (current pin)
    ciMinimum:
      declared: "1.3.0"
      source: .github/workflows/ci.yml minimum-supported job setup-bun (== engines floor)
  astro:
    declared: "^7.1.6"
    source: package.json dependencies.astro
  astroNode:
    declared: "^11.0.3"
    source: package.json dependencies["@astrojs/node"]
  typescript:
    declared: "^7.0.2"
    source: package.json devDependencies.typescript
  postgres:
    declared: "18.4"
    source: .github/workflows/ci.yml services.postgres image

# Intentional divergences from the awcms-mini standard. NOT a backlog of
# unfinished ports — each entry is a decision AWCMS deliberately made and must
# keep justified: reason + accountable owner + review date + backing ADR. The
# gate fails once a reviewDate is in the past (an unreviewed divergence cannot
# live forever) or its ADR file is missing.
intentionalDivergences: []
# EMPTIED by ADR-0055, not lost. The ten entries that lived here recorded how
# this repo deliberately differed from the awcms-mini standard, each with an
# owner and a `reviewDate` that turned CI red on expiry.
#
# With awcms-mini archived, that review is work whose answer cannot change: it
# asks whether a difference from a repo nobody develops is still justified. The
# entries are preserved verbatim as a historical record in
# `docs/awcms/family-compatibility.md` §Historical divergences, where their ADR
# links are still verified to exist — by `check:docs`, which fails on a link to
# a missing file.
#
# The key stays (the schema requires it) and an empty list is valid. A future
# contract this repo must diverge from — awcms-astro's, say — would refill it.
