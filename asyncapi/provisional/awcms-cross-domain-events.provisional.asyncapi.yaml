  schemas:
    DomainEventEnvelope:
      type: object
      required:
        [
          eventId,
          eventType,
          eventVersion,
          tenantId,
          aggregateType,
          aggregateId,
          occurredAt,
          payload,
          metadata
        ]
      properties:
        eventId: { type: string, format: uuid }
        eventType: { type: string }
        eventVersion: { type: string }
        tenantId: { type: string, format: uuid }
        nodeId: { type: string, format: uuid }
        aggregateType: { type: string }
        aggregateId: { type: string }
        occurredAt: { type: string, format: date-time }
        actor:
          type: object
          properties:
            tenantUserId: { type: string, format: uuid }
            profileId: { type: string, format: uuid }
        correlationId: { type: string }
        causationId: { type: string }
        payload: {}
        metadata:
          type: object
          required: [sourceModule, schemaVersion]
          properties:
            sourceModule: { type: string }
            schemaVersion: { type: string }
    BookingReservationPayload:
      type: object
      additionalProperties: false
      required:
        [
          reservationId,
          reservationNo,
          lineageId,
          status,
          previousStatus,
          startsAt,
          endsAt,
          resourceIds,
          offeringIds,
          partySize,
          occurredAt
        ]
      description: >-
        Never a customer name, contact, note or reason text, and no payment
        state. externalRefType/externalRef are the adapter's own opaque pair.
        lateCancellation is carried by cancelled; supersededById by rescheduled;
        rescheduledFromId by the created event of the replacement.
      properties:
        reservationId: { type: string, format: uuid }
        reservationNo: { type: string }
        lineageId: { type: string, format: uuid }
        status:
          {
            type: string,
            enum:
              [
                held,
                confirmed,
                rescheduled,
                cancelled,
                checked_in,
                completed,
                no_show,
                expired
              ]
          }
        previousStatus:
          { type: [string, "null"], enum: [held, confirmed, checked_in, null] }
        startsAt: { type: string, format: date-time }
        endsAt: { type: string, format: date-time }
        resourceIds: { type: array, items: { type: string, format: uuid } }
        offeringIds: { type: array, items: { type: string, format: uuid } }
        partySize: { type: integer, minimum: 1 }
        externalRefType: { type: [string, "null"] }
        externalRef: { type: [string, "null"] }
        lateCancellation: { type: boolean }
        supersededById: { type: string, format: uuid }
        rescheduledFromId: { type: string, format: uuid }
        occurredAt: { type: string, format: date-time }
        correlationId: { type: string }
    HrAttendanceRecordedPayload:
      type: object
      additionalProperties: false
      required: [eventId, employmentId, kind, occurredAt, source]
      description: eventId here is the attendance event's id, not the envelope's.
      properties:
        eventId: { type: string, format: uuid }
        employmentId: { type: string, format: uuid }
        kind: { type: string }
        occurredAt: { type: string, format: date-time }
        source: { type: string }
        officeId: { type: [string, "null"], format: uuid }
    HrShiftAssignedPayload:
      type: object
      additionalProperties: false
      required: [assignmentId, employmentId, kind, startsAt, endsAt, cancelled]
      properties:
        assignmentId: { type: string, format: uuid }
        employmentId: { type: string, format: uuid }
        kind: { type: string, enum: [work, time_off] }
        startsAt: { type: string, format: date-time }
        endsAt: { type: string, format: date-time }
        cancelled: { type: boolean }
    HrCommissionAccruedPayload:
      type: object
      additionalProperties: false
      required:
        [accrualId, employmentId, sourceType, ruleKey, ruleVersion, operation]
      description: No amount, by pack rule; totals are read through an authorized read.
      properties:
        accrualId: { type: string, format: uuid }
        employmentId: { type: string, format: uuid }
        sourceType: { type: string }
        ruleKey: { type: string }
        ruleVersion: { type: integer, minimum: 1 }
        operation: { type: string }
    HrCommissionApprovedPayload:
      type: object
      additionalProperties: false
      required: [accrualId, employmentId]
      properties:
        accrualId: { type: string, format: uuid }
        employmentId: { type: string, format: uuid }
    HrPayrollFinalizedPayload:
      type: object
      additionalProperties: false
      required: [runId, periodKey, kind, employeeCount, currencyCode]
      description: No amount, by pack rule; currencyCode is an ISO 4217 code, not a value.
      properties:
        runId: { type: string, format: uuid }
        periodKey: { type: string }
        kind: { type: string }
        employeeCount: { type: integer, minimum: 0 }
        currencyCode: { type: string, pattern: "^[A-Z]{3}$" }
    HrPayrollReversedPayload:
      type: object
      additionalProperties: false
      required: [runId, reversalRunId, periodKey, employeeCount]
      properties:
        runId: { type: string, format: uuid }
        reversalRunId: { type: string, format: uuid }
        periodKey: { type: string }
        employeeCount: { type: integer, minimum: 0 }
    WhatsappMessagePayload:
      type: object
      additionalProperties: false
      required: [messageId, templateKey, purpose, recipientMasked, status]
      description: >-
        Never a phone number, message body or template variable. The caller's
        record is joined through the envelope correlationId.
      properties:
        messageId: { type: string, format: uuid }
        templateKey: { type: string }
        purpose: { type: string, enum: [transactional, security, marketing] }
        recipientMasked: { type: string }
        status: { type: string, enum: [queued, sent, failed, expired] }
        failureCode: { type: string }
    WhatsappConsentPayload:
      type: object
      additionalProperties: false
      required: [consentId, purpose, recipientMasked]
      properties:
        consentId: { type: string, format: uuid }
        purpose: { type: string, enum: [transactional, security, marketing] }
        recipientMasked: { type: string }
    WhatsappDispatchFailedPayload:
      type: object
      additionalProperties: false
      required: [failureCode, occurredAt]
      properties:
        failureCode: { type: string }
        batchSize: { type: integer, minimum: 0 }
        occurredAt: { type: string, format: date-time }
