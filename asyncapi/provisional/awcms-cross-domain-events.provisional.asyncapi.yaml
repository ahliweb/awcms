      WhatsappDispatchFailed:
        $ref: "#/components/messages/WhatsappDispatchFailed"
    description: >-
      PROVISIONAL. A dispatcher pass failed as a whole (job level, not one message). Owner: whatsapp_delivery (ADR-0133 section 8).
      Becomes live with: whatsapp_delivery implementation.
