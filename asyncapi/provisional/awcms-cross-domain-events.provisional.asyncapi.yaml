asyncapi: 3.0.0
info:
  title: AWCMS Cross-Domain Events (PROVISIONAL)
  version: 0.1.0
  x-awcms-status: provisional
  x-awcms-emitted-by-code: false
  description: |-
    PROVISIONAL. NOT part of the live event contract and NOT emitted by any
    code today. This document holds the event schemas that the booking,
    hr_payroll and whatsapp_delivery design packs settled on, validated by
    `bun run asyncapi:provisional:check`, so that the names and payloads are
    reviewed as data before any module exists.

    An event lives in exactly ONE of two places: this file, or
    `asyncapi/awcms-domain-events.asyncapi.yaml` plus
    `DOMAIN_EVENT_TYPE_REGISTRY`. The implementation PR of each module moves
    its events out of this file into the live pair, and the check fails if an
    event is in both (or is in the live pair and still here).

    Same AsyncAPI version and the same `DomainEventEnvelope` as the live
    file; the check compares the envelope byte-for-byte as data. Payloads carry
    identifiers, enums, counts and UTC instants only: no personal data, no
    amount, no payment state, no phone number.

    See docs/awcms/cross-domain-contracts.md for the capability ports,
    consumer idempotency and the provisional-to-live migration.
channels:
  awcms.booking.reservation.created:
    address: awcms.booking.reservation.created
    x-awcms-status: provisional
    messages:
      BookingReservationCreated:
        $ref: "#/components/messages/BookingReservationCreated"
    description: >-
      PROVISIONAL. A reservation exists (held, or confirmed when the offering confirms immediately). Owner: booking (ADR-0131 / docs/awcms/booking.md section 7.4).
      Becomes live with: booking phase 1.
  awcms.booking.reservation.held:
    address: awcms.booking.reservation.held
    x-awcms-status: provisional
    messages:
      BookingReservationHeld:
        $ref: "#/components/messages/BookingReservationHeld"
    description: >-
      PROVISIONAL. A hold was placed; not emitted when the offering confirms immediately. Owner: booking (ADR-0131 / docs/awcms/booking.md section 7.4).
      Becomes live with: booking phase 1.
  awcms.booking.reservation.confirmed:
    address: awcms.booking.reservation.confirmed
    x-awcms-status: provisional
    messages:
      BookingReservationConfirmed:
        $ref: "#/components/messages/BookingReservationConfirmed"
    description: >-
      PROVISIONAL. A hold became confirmed, or a reservation was created already confirmed. Owner: booking (ADR-0131 / docs/awcms/booking.md section 7.4).
      Becomes live with: booking phase 1.
  awcms.booking.reservation.rescheduled:
    address: awcms.booking.reservation.rescheduled
    x-awcms-status: provisional
    messages:
      BookingReservationRescheduled:
        $ref: "#/components/messages/BookingReservationRescheduled"
    description: >-
      PROVISIONAL. The old reservation was superseded by a new one; carries supersededById (old reservation) and the new reservation's rescheduledFromId is on its created event. Owner: booking (ADR-0131 / docs/awcms/booking.md section 7.4).
      Becomes live with: booking phase 1.
  awcms.booking.reservation.cancelled:
    address: awcms.booking.reservation.cancelled
    x-awcms-status: provisional
    messages:
      BookingReservationCancelled:
        $ref: "#/components/messages/BookingReservationCancelled"
    description: >-
      PROVISIONAL. A held or confirmed reservation was cancelled; carries lateCancellation. Owner: booking (ADR-0131 / docs/awcms/booking.md section 7.4).
      Becomes live with: booking phase 1.
  awcms.booking.reservation.checked_in:
    address: awcms.booking.reservation.checked_in
    x-awcms-status: provisional
    messages:
      BookingReservationCheckedIn:
        $ref: "#/components/messages/BookingReservationCheckedIn"
    description: >-
      PROVISIONAL. A confirmed reservation was checked in. Owner: booking (ADR-0131 / docs/awcms/booking.md section 7.4).
      Becomes live with: booking phase 1.
  awcms.booking.reservation.completed:
    address: awcms.booking.reservation.completed
    x-awcms-status: provisional
    messages:
      BookingReservationCompleted:
        $ref: "#/components/messages/BookingReservationCompleted"
    description: >-
      PROVISIONAL. A checked-in reservation was completed. Owner: booking (ADR-0131 / docs/awcms/booking.md section 7.4).
      Becomes live with: booking phase 1.
  awcms.booking.reservation.no_show:
    address: awcms.booking.reservation.no_show
    x-awcms-status: provisional
    messages:
      BookingReservationNoShow:
        $ref: "#/components/messages/BookingReservationNoShow"
    description: >-
      PROVISIONAL. A confirmed reservation was marked no-show by a person. Owner: booking (ADR-0131 / docs/awcms/booking.md section 7.4).
      Becomes live with: booking phase 1.
  awcms.booking.reservation.expired:
    address: awcms.booking.reservation.expired
    x-awcms-status: provisional
    messages:
      BookingReservationExpired:
        $ref: "#/components/messages/BookingReservationExpired"
    description: >-
      PROVISIONAL. A hold expired (by the sweep job or by lazy reclaim). Owner: booking (ADR-0131 / docs/awcms/booking.md section 7.4).
      Becomes live with: booking phase 1.
  awcms.hr.attendance.recorded:
    address: awcms.hr.attendance.recorded
    x-awcms-status: provisional
    messages:
      HrAttendanceRecorded:
        $ref: "#/components/messages/HrAttendanceRecorded"
    description: >-
      PROVISIONAL. A new, non-replayed attendance event was stored. Owner: hr_payroll (ADR-0132 / docs/awcms/hr-payroll.md section 10).
      Becomes live with: hr_workforce phase 1.
  awcms.hr.shift.assigned:
    address: awcms.hr.shift.assigned
    x-awcms-status: provisional
    messages:
      HrShiftAssigned:
        $ref: "#/components/messages/HrShiftAssigned"
    description: >-
      PROVISIONAL. A shift assignment became published, or was cancelled (cancelled: true). Owner: hr_payroll (ADR-0132 / docs/awcms/hr-payroll.md section 10).
      Becomes live with: hr_workforce phase 1.
  awcms.hr.commission.accrued:
    address: awcms.hr.commission.accrued
    x-awcms-status: provisional
    messages:
      HrCommissionAccrued:
        $ref: "#/components/messages/HrCommissionAccrued"
    description: >-
      PROVISIONAL. A new commission accrual was posted; a replay publishes nothing. Owner: hr_payroll (ADR-0132 / docs/awcms/hr-payroll.md section 10).
      Becomes live with: hr phase 2.
  awcms.hr.commission.approved:
    address: awcms.hr.commission.approved
    x-awcms-status: provisional
    messages:
      HrCommissionApproved:
        $ref: "#/components/messages/HrCommissionApproved"
    description: >-
      PROVISIONAL. A commission accrual was approved. Owner: hr_payroll (ADR-0132 / docs/awcms/hr-payroll.md section 10).
      Becomes live with: hr phase 2.
  awcms.hr.payroll.finalized:
    address: awcms.hr.payroll.finalized
    x-awcms-status: provisional
    messages:
      HrPayrollFinalized:
        $ref: "#/components/messages/HrPayrollFinalized"
    description: >-
      PROVISIONAL. A payroll run was finalized. Owner: hr_payroll (ADR-0132 / docs/awcms/hr-payroll.md section 10).
      Becomes live with: hr phase 3.
  awcms.hr.payroll.reversed:
    address: awcms.hr.payroll.reversed
    x-awcms-status: provisional
    messages:
      HrPayrollReversed:
        $ref: "#/components/messages/HrPayrollReversed"
    description: >-
      PROVISIONAL. A payroll run was reversed by a reversal run. Owner: hr_payroll (ADR-0132 / docs/awcms/hr-payroll.md section 10).
      Becomes live with: hr phase 3.
  awcms.whatsapp.message.queued:
    address: awcms.whatsapp.message.queued
    x-awcms-status: provisional
    messages:
      WhatsappMessageQueued:
        $ref: "#/components/messages/WhatsappMessageQueued"
    description: >-
      PROVISIONAL. A message was accepted into the WhatsApp outbox. Owner: whatsapp_delivery (ADR-0133 section 8).
      Becomes live with: whatsapp_delivery implementation.
  awcms.whatsapp.message.sent:
    address: awcms.whatsapp.message.sent
    x-awcms-status: provisional
    messages:
      WhatsappMessageSent:
        $ref: "#/components/messages/WhatsappMessageSent"
    description: >-
      PROVISIONAL. The provider accepted the message. Owner: whatsapp_delivery (ADR-0133 section 8).
      Becomes live with: whatsapp_delivery implementation.
  awcms.whatsapp.message.failed:
    address: awcms.whatsapp.message.failed
    x-awcms-status: provisional
    messages:
      WhatsappMessageFailed:
        $ref: "#/components/messages/WhatsappMessageFailed"
    description: >-
      PROVISIONAL. The message reached a terminal failure; carries a coarse failureCode. Owner: whatsapp_delivery (ADR-0133 section 8).
      Becomes live with: whatsapp_delivery implementation.
  awcms.whatsapp.message.expired:
    address: awcms.whatsapp.message.expired
    x-awcms-status: provisional
    messages:
      WhatsappMessageExpired:
        $ref: "#/components/messages/WhatsappMessageExpired"
    description: >-
      PROVISIONAL. The message passed its expiry before it was sent. Owner: whatsapp_delivery (ADR-0133 section 8).
      Becomes live with: whatsapp_delivery implementation.
  awcms.whatsapp.consent.granted:
    address: awcms.whatsapp.consent.granted
    x-awcms-status: provisional
    messages:
      WhatsappConsentGranted:
        $ref: "#/components/messages/WhatsappConsentGranted"
    description: >-
      PROVISIONAL. A recipient's consent for a purpose was recorded. Owner: whatsapp_delivery (ADR-0133 section 8).
      Becomes live with: whatsapp_delivery implementation.
  awcms.whatsapp.consent.withdrawn:
    address: awcms.whatsapp.consent.withdrawn
    x-awcms-status: provisional
    messages:
