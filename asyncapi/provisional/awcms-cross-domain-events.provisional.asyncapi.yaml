        $ref: "#/components/messages/WhatsappConsentWithdrawn"
    description: >-
      PROVISIONAL. A recipient's consent for a purpose was withdrawn. Owner: whatsapp_delivery (ADR-0133 section 8).
      Becomes live with: whatsapp_delivery implementation.
  awcms.whatsapp.dispatch.failed:
    address: awcms.whatsapp.dispatch.failed
    x-awcms-status: provisional
